<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninth Bell</title>
<style>
  :root{--bg:#0B0617;--panel:#170C2B;--panel2:#22113f;--ink:#F3EEFF;--dim:#A99BC9;--a:#B66BFF;--b:#3EE6FF;
    --hot:#FF3D7F;--gold:#FFD23F;--good:#52f2a0;--line:#ffffff1f}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(120% 80% at 50% 0%,#2A1150 0%,var(--bg) 60%) fixed;color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:760px;margin:0 auto;padding:16px}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;cursor:pointer;text-align:left;transition:transform .08s,border-color .15s,background .15s}
  button:hover:not(:disabled){border-color:var(--b);background:#2c1752}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.big{display:block;width:100%;margin:6px 0;font-weight:700}
  button.hot{background:linear-gradient(90deg,var(--hot),var(--a));border:none;color:#fff;font-weight:900;letter-spacing:.5px}
  .slant{display:inline-block;transform:skew(-12deg);background:linear-gradient(90deg,var(--a),var(--b));color:#0B0617;
    padding:4px 14px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  .slant>span{display:inline-block;transform:skew(12deg)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .dim{color:var(--dim)} .small{font-size:12px}
  .title{text-align:center;padding-top:12vh}
  .logo{font-size:56px;font-weight:900;letter-spacing:4px;margin:0;font-style:italic;
    background:linear-gradient(90deg,var(--hot),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .date{font-size:34px;font-weight:900;font-style:italic;line-height:1}
  .date small{font-size:15px;color:var(--b);margin-left:6px}
  .moon{color:var(--gold);font-weight:700}
  .bar{height:6px;background:#ffffff14;border-radius:4px;overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%;background:var(--good)}
  .bar.sp>i{background:var(--b)} .bar.en>i{background:var(--hot)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
  .card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px #ffd23f33}
  .card.ko{opacity:.35}
  .card.pick{cursor:pointer;border-color:var(--hot)}
  .card.pick:hover{background:#3a1636}
  .badge{position:absolute;top:-8px;right:8px;background:var(--hot);color:#fff;font-size:11px;font-weight:900;padding:1px 7px;border-radius:6px;transform:skew(-12deg)}
  .aff{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
  .aff span{font-size:10px;padding:1px 5px;border-radius:4px;background:#ffffff10;color:var(--dim)}
  .aff .w{background:var(--hot);color:#fff}.aff .r{background:#3b5bdb;color:#fff}.aff .n{background:#555;color:#fff}
  .log{min-height:84px;font-size:14px}
  .log div{padding:2px 0;border-bottom:1px dashed #ffffff10}
  .log div:last-child{color:var(--gold);font-weight:600}
  .portrait{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:900;color:#0B0617;flex:none}
  .dlg{display:flex;gap:14px;align-items:flex-start}
  .speech{font-size:17px;min-height:60px}
  .flash{animation:fl .5s}
  @keyframes fl{0%{background:#ffd23f44}100%{background:var(--panel)}}
  .toast{text-align:center;font-size:22px;font-weight:900;color:var(--gold);font-style:italic;margin:10px 0}
  .stat{display:flex;justify-content:space-between}
  .pips{letter-spacing:2px;color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script>

// days: 0=Mon … 6=Sun
const LINKS = {
  rin: {name:'Rin Asakura', arcana:'Chariot', color:'#FF3D7F', days:[0,2,4,6], req:null, unlock:{3:'valkyr',5:'brunhild'},

      {lines:['Real talk... my hands shook the whole time last night.','Don\'t tell Rin, okay? She already thinks I\'m a joke.'],

const ENEMIES = [
  {name:'Gloom Slime',   hp:45, str:3, mag:3, weak:['fire'],  res:['phys'], nul:[],      xp:8,  yen:40, f:[1,4],
    skills:[['Ooze','phys',12,'one'],['Chill','ice',14,'one']]},
  {name:'Wailing Mask',  hp:40, str:2, mag:5, weak:['elec'],  res:['wind'], nul:[],      xp:9,  yen:45, f:[1,5],

    skills:[['Maul','phys',16,'one'],['Ember','fire',12,'one']]},

  {name:'Choir Knight',  hp:75, str:8, mag:4, weak:['elec'],  res:['phys','fire'], nul:[], xp:18, yen:90, f:[6,10],
    skills:[['Cleave','phys',20,'one'],['Blaze','fire',12,'all']]},
  {name:'Hollow Moth',   hp:58, str:4, mag:8, weak:['fire','phys'], res:['wind'], nul:[], xp:16, yen:80, f:[7,10],
    skills:[['Gale','wind',13,'all'],['Frost','ice',18,'one']]},
];
const BOSSES = {
  5:  {name:'Gatekeeper', hp:460, str:9, mag:9, weak:['wind'], res:['phys','fire'], nul:[], xp:120, yen:1500, acts:2, boss:true,
       skills:[['Crush','phys',22,'one'],['Pyre','fire',14,'all'],['Shock','elec',22,'one']]},
  10: {name:'Pale Monarch', hp:1300, str:15, mag:15, weak:['fire'], res:['ice','elec'], nul:[], xp:0, yen:0, acts:2, boss:true, final:true,
       skills:[['Dread Blade','phys',30,'one'],['Frozen Requiem','ice',18,'all'],['Storm Crown','elec',18,'all'],['Annihilate','wind',40,'one']]},
};

const ITEMS = {
  medicine:{name:'Medicine',     desc:'Restore 60 HP to one ally', price:200, use:(m)=>m.hp>0&&m.hp<m.max, fx:(m)=>{m.hp=Math.min(m.max,m.hp+60)}},
  soul:    {name:'Soul Drop',    desc:'Restore 25 SP to one ally', price:400, use:(m)=>m.hp>0&&m.sp<m.maxsp, fx:(m)=>{m.sp=Math.min(m.maxsp,m.sp+25)}},
  bead:    {name:'Revival Bead', desc:'Revive a fallen ally at half HP', price:800, use:(m)=>m.hp<=0, fx:(m)=>{m.hp=Math.ceil(m.max/2)}},
};

const SOCIAL = {courage:'Courage', knowledge:'Knowledge', charm:'Charm'};
const SOCIAL_NEXT = [0,3,4,5,6];            // points needed to go from rank r to r+1
const LAST_DAY = 30;
const SAVE_KEY = 'ninth-bell-save';
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PARTY = ['mc','rin','kaito'];

// ───────────────────────── STATE ─────────────────────────
let S = null;   // persistent game state
let B = null;   // battle
let D = null;   // dungeon run

function newGame(){
  const s = {day:1, time:'day', lv:1, xp:0, yen:1000,
    stats:{courage:1,knowledge:1,charm:1}, statPts:{courage:0,knowledge:0,charm:0},
    links:{}, personas:['lantern','mistral'], active:'lantern',
    items:{medicine:3, soul:1, bead:0}, hp:{}, sp:{}, known:{}, bossesBeaten:0, cleared:false};
  for(const k in LINKS) s.links[k] = {rank:0, pts:0};
  S = s; restoreParty();
  return s;
}
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

function maxHP(id){ return 80 + S.lv*10 + (ALLIES[id]?.hpBonus||0); }
function maxSP(id){ return 30 + S.lv*5 + (id==='mc' ? S.stats.knowledge*6 : 0); }
function restoreParty(){ for(const id of PARTY){ S.hp[id]=maxHP(id); S.sp[id]=maxSP(id); } }
function weekday(){ return (S.day-1)%7; }
function dateLabel(){
  const d = new Date(2026,3,6+S.day-1);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function linkRank(id){ return S.links[id].rank; }
function memberName(id){ return id==='mc' ? 'You' : ALLIES[id].name; }

function memberStats(id){
  if(id==='mc'){ const p=PERSONAS[S.active]; return {str:p.str+S.lv, mag:p.mag+S.lv, weak:p.weak, res:p.res, skills:p.skills}; }
  const a=ALLIES[id], r=linkRank(id);
  return {str:a.str+S.lv+(a.str>a.mag?r:0), mag:a.mag+S.lv+(a.mag>a.str?r:0), weak:a.weak, res:a.res,
    skills:a.learn.filter(([,lv])=>lv<=S.lv).map(([k])=>k)};
}

function gainSocial(k, n){
  S.statPts[k]+=n; const msgs=[];
  while(S.stats[k]<5 && S.statPts[k]>=SOCIAL_NEXT[S.stats[k]]){
    S.statPts[k]-=SOCIAL_NEXT[S.stats[k]]; S.stats[k]++;
    msgs.push(`${SOCIAL[k]} rose to rank ${S.stats[k]}!`);
  }
  return msgs;
}

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); return true; }catch(e){ return false; } }
function loadSave(){ try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

// ───────────────────────── DOM HELPERS ─────────────────────────
const $app = document.getElementById('app');
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const show = (...n)=>{ $app.replaceChildren(...n); window.scrollTo(0,0); };
const btn = (label, fn, opts={}) => h('button', {class:'big '+(opts.cls||''), onclick:fn, disabled:opts.disabled}, label);
const slant = (t)=>h('div',{class:'slant'},h('span',null,t));
const bar = (v,m,cls='')=>h('div',{class:'bar '+cls},h('i',{style:`width:${Math.max(0,Math.min(100,v/m*100))}%`}));

function header(){
  const left = LAST_DAY - S.day;
  return h('div',{class:'panel hdr'},
    h('div',null,
      h('div',{class:'date'}, dateLabel(), h('small',null, WEEKDAYS[weekday()]+' · '+(S.time==='day'?'After School':'Evening'))),
      h('div',{class:'moon small'}, left>0 ? `🌕 Full moon in ${left} day${left>1?'s':''}` : '🌕 The moon is full tonight')),
    h('div',{class:'small dim', style:'text-align:right'},
      `Lv ${S.lv} · ¥${S.yen.toLocaleString()}`, h('br'),
      Object.keys(SOCIAL).map(k=>`${SOCIAL[k][0]}${S.stats[k]}`).join(' · ')));
}

// ───────────────────────── TITLE ─────────────────────────
function titleScreen(){
  const existing = loadSave();
  show(h('div',{class:'title'},
    h('h1',{class:'logo'},'NINTH BELL'),
    h('p',{class:'dim'},'When the bell tolls nine at midnight, the Tower rises.'),
    h('div',{style:'max-width:320px;margin:28px auto'},
      existing && btn('Continue', ()=>{ S=existing; hub(); }, {cls:'hot'}),
      btn('New Game', ()=>{ newGame(); intro(); }, {cls: existing?'':'hot'}),
      btn('How to play', howTo)),
    h('p',{class:'small dim'},'A prototype. Placeholder art; all systems playable.')));
}
function howTo(){
  show(h('div',{class:'panel'}, slant('How to play'),
    h('ul',null,
      h('li',null,'You have 30 days. On the 30th night the Pale Monarch awakens at the top of the Tower (floor 10).'),
      h('li',null,'After school: spend time with friends (Social Links) or raise Courage, Knowledge and Charm.'),
      h('li',null,'Evening: climb the Tower to fight and level up. Floor 5 has a guardian.'),
      h('li',null,'Hit an enemy\'s WEAKNESS or land a CRITICAL to knock it down and earn ONE MORE action.'),
      h('li',null,'Knock down every enemy to launch an ALL-OUT ATTACK.'),
      h('li',null,'Ranking up Social Links unlocks new Personas. Switch Personas in battle to exploit weaknesses.'),
      h('li',null,'If you fall, it\'s game over — your party can\'t go on without you.')),
    btn('Back', titleScreen)));
}
function intro(){
  dialogue({name:'???', color:'#B66BFF', initial:'?'},
    ['Welcome, newcomer. You arrive at Kurogane High on a quiet April day.',
     'At midnight a bell tolls nine times — and a Tower climbs out of the school grounds.',
     'Inside, a mask forms on your face. A voice answers: "I am Lantern. I am thou."',
     'Rin and Kaito saw it too. In thirty days the moon will be full, and something will wake at the top.'],
    ()=>{ save(); hub(); });
}

// ───────────────────────── DIALOGUE ─────────────────────────
function portrait(color, initial){ return h('div',{class:'portrait',style:`background:${color}`}, initial); }
function dialogue(who, lines, done, choices){
  let i=0;
  const render=()=>{
    const last = i===lines.length-1;
    show(h('div',{class:'panel'},
      h('div',{class:'dlg'}, portrait(who.color, who.initial||who.name[0]),
        h('div',{style:'flex:1'}, h('b',{style:`color:${who.color}`}, who.name),
          h('div',{class:'speech'}, lines[i]))),
      h('div',{style:'margin-top:12px'},
        last && choices

function explore(){
  D.steps++;

  if(!D.stairs && (D.steps>=4 || (D.steps>=2 && r<0.2))){ D.stairs=true; D.log.push('You found the stairs up!'); return tower(); }
  if(r<0.62) return startBattle(makeEncounter(D.floor), ()=>tower());
  if(r<0.85){
    if(Math.random()<0.5){ const y=Math.round(rand(80,180)*D.floor); S.yen+=y; D.log.push(`Found a chest: ¥${y}.`); }
    else { const k=pick(['medicine','medicine','soul','bead']); S.items[k]++; D.log.push(`Found a chest: ${ITEMS[k].name}!`); }
  } else D.log.push('Silence. The corridor twists on.');

function climb(){
  const next=D.floor+1;
  const bossFloor = (next===5 && S.bossesBeaten<1) || next===10;
  if(next===10){
    if(S.day<LAST_DAY){ D.log.push('A sealed door. Something sleeps beyond it — it will wake on the full moon.'); D.stairs=false; return tower(); }
  }
  D.floor=next; D.steps=0; D.stairs=false;
  if(bossFloor){
    D.log.push(`A colossal presence fills floor ${next}…`);
    return startBattle([spawn(BOSSES[next],next)], ()=>{
      if(next===5){ S.bossesBeaten=1; D.log.push('The Gatekeeper crumbles. A shortcut opens to floor 6.'); D.stairs=true; }
      tower();
    });
  }
  D.log.push(`You climb to floor ${next}.`);
  tower();
}
function spawn(def, floor){
  const sc = def.boss?1:1+0.3*(floor-1);
  const hp=Math.round(def.hp*sc);
  return {...def, hp, max:hp, str:def.str+(def.boss?0:floor*1.2), mag:def.mag+(def.boss?0:floor*1.2),
    xp:Math.round(def.xp*sc), yen:Math.round(def.yen*sc), down:false};
}
function makeEncounter(floor){
  const pool=ENEMIES.filter(e=>floor>=e.f[0] && floor<=e.f[1]);
  const n = floor<3 ? (Math.random()<0.5?1:2) : 1+Math.floor(Math.random()*3);
  const out=[]; for(let i=0;i<n;i++) out.push(spawn(pick(pool),floor));
  // number duplicate names A/B/C
  const counts={}; out.forEach(e=>{counts[e.name]=(counts[e.name]||0)+1;});
  const seen={}; out.forEach(e=>{ if(counts[e.name]>1){ seen[e.name]=(seen[e.name]||0)+1; e.name+=' '+'ABC'[seen[e.name]-1]; e.base=e.name.slice(0,-2);} });
  return out;
}

// ───────────────────────── BATTLE ─────────────────────────
function startBattle(enemies, onWin){
  enemies.forEach(e=>{ e.key=e.base||e.name; if(!S.known[e.key]) S.known[e.key]={}; });
  const p={};
  for(const id of PARTY) p[id]={id, hp:S.hp[id], max:maxHP(id), sp:S.sp[id], maxsp:maxSP(id), down:false, guard:false};
  B={enemies, p, turn:0, phase:'cmd', log:[enemies.some(e=>e.boss)?`${enemies[0].name} blocks the way!`:`Shadows appear: ${enemies.map(e=>e.name).join(', ')}!`],
     pending:null, switched:false, onWin, busy:false};
  B.turn = -1; nextActor();
}
const actorId = ()=>PARTY[B.turn];
const aliveEnemies = ()=>B.enemies.filter(e=>e.hp>0);
const aliveParty = ()=>PARTY.filter(id=>B.p[id].hp>0);
function blog(t){ B.log.push(t); }

function fighterStats(id){ return memberStats(id); }
function hit(srcStat, target, el, pow, isParty, critBonus=0){
  // target: enemy object or party member object
  const aff = isParty ? fighterStats(target.id) : target;
  const weak=aff.weak.includes(el), nul=(aff.nul||[]).includes(el), res=aff.res.includes(el);
  if(!isParty && S.known[target.key]) S.known[target.key][el] = weak?'w':nul?'n':res?'r':'-';
  if(nul) return {dmg:0, tag:'NULL', knock:false};
  let mult=1, tag='';
  if(weak){ mult=1.5; tag='WEAK!'; }
  else if(res){ mult=0.5; tag='resist'; }
  else if(el==='phys' && Math.random()<0.08+critBonus){ mult=1.6; tag='CRITICAL!'; }
  if(target.guard){ mult*=0.5; if(tag!=='resist') tag=tag?'guarded':''; }
  const dmg=Math.max(1, Math.round(pow*(1+srcStat/15)*rand(0.9,1.1)*mult));
  target.hp-=dmg;
  const knock = (tag==='WEAK!'||tag==='CRITICAL!') && !target.down && target.hp>0;
  if(knock) target.down=true;
  return {dmg, tag, knock};
}

function nextActor(){
  if(checkEnd()) return;
  B.switched=false;
  while(true){
    B.turn++;
    if(B.turn>=PARTY.length){ return enemyPhase(); }
    const m=B.p[actorId()];
    if(m.hp<=0) continue;
    m.guard=false;
    if(m.down){ m.down=false; blog(`${memberName(m.id)} gets back up.`); continue; }
    break;
  }
  B.phase='cmd'; renderBattle();
}

function useSkill(id, key, target){
  const sk=SKILLS[key], m=B.p[id], st=fighterStats(id);
  if(sk.hp) m.hp-=sk.hp; if(sk.sp) m.sp-=sk.sp;
  if(sk.heal){
    const amt=Math.round(sk.heal*(1+st.mag/30));
    const tgts = sk.target==='allies' ? aliveParty() : [target];
    tgts.forEach(t=>{ B.p[t].hp=Math.min(B.p[t].max, B.p[t].hp+amt); });
    blog(`${memberName(id)} casts ${sk.name}: +${amt} HP${tgts.length>1?' to all':' to '+memberName(target)}.`);
    return false;
  }
  const stat = sk.el==='phys'?st.str:st.mag;
  const tgts = sk.target==='all' ? aliveEnemies() : [target];
  let more=false; const parts=[];
  for(const e of tgts){
    const r=hit(stat, e, sk.el, sk.pow, false, id==='mc'?S.stats.courage*0.03:0);
    parts.push(`${e.name} ${r.tag==='NULL'?'nullifies it':'−'+r.dmg}${r.tag&&r.tag!=='NULL'?' '+r.tag:''}${r.knock?' ⬇DOWN':''}${e.hp<=0?' ✖':''}`);
    if(r.knock) more=true;
  }
  blog(`${memberName(id)} uses ${sk.name}! ${parts.join(' · ')}`);
  return more;
}
function attack(id, target){
  const st=fighterStats(id);
  const r=hit(st.str, target, 'phys', 15, false, id==='mc'?S.stats.courage*0.03:0);
  blog(`${memberName(id)} attacks ${target.name}: −${r.dmg}${r.tag?' '+r.tag:''}${r.knock?' ⬇DOWN':''}${target.hp<=0?' ✖':''}`);
  return r.knock;
}

function afterPartyAction(oneMore){
  if(checkEnd()) return;
  const alive=aliveEnemies();
  if(alive.length && alive.every(e=>e.down)){ B.phase='allout'; return renderBattle(); }
  if(oneMore){ blog(`★ ONE MORE! ${memberName(actorId())} acts again.`); B.phase='cmd'; B.switched=false; return renderBattle(); }
  nextActor();
}
function allOut(){
  const power = PARTY.filter(id=>B.p[id].hp>0).reduce((a,id)=>a+fighterStats(id).str+fighterStats(id).mag, 0);
  const parts=[];
  for(const e of aliveEnemies()){
    const dmg=Math.round((40+power*2.2)*rand(0.9,1.1)); e.hp-=dmg; e.down=false;
    parts.push(`${e.name} −${dmg}${e.hp<=0?' ✖':''}`);
  }
  blog(`💥 ALL-OUT ATTACK! ${parts.join(' · ')}`);
  nextActor();
}

async function enemyPhase(){
  B.phase='busy'; B.busy=true; renderBattle();
  for(const e of B.enemies){
    if(e.hp<=0) continue;
    if(e.down){ e.down=false; blog(`${e.name} gets back up.`); renderBattle(); await sleep(450); continue; }
    for(let a=0;a<(e.acts||1);a++){
      const targets=aliveParty(); if(!targets.length) break;
      const [name,el,pow,tt]=pick(e.skills);
      const tgts = tt==='all'?targets:[pick(targets)];
      const parts=tgts.map(id=>{
        const m=B.p[id]; const r=hit(el==='phys'?e.str:e.mag, m, el, pow, true);
        return `${memberName(id)} ${r.tag==='NULL'?'nullifies':'−'+r.dmg}${r.tag&&r.tag!=='NULL'?' '+r.tag:''}${r.knock?' ⬇DOWN':''}${m.hp<=0?' ✖ KO':''}`;
      });
      blog(`${e.name} uses ${name}! ${parts.join(' · ')}`);
      renderBattle(); await sleep(550);
      if(B.p.mc.hp<=0) break;
    }
    if(B.p.mc.hp<=0) break;
  }
  B.busy=false;
  if(checkEnd()) return;
  B.turn=-1; nextActor();
}

function checkEnd(){
  if(B.p.mc.hp<=0){ B.phase='over'; gameOver(); return true; }
  if(!aliveEnemies().length){ B.phase='over'; victory(); return true; }
  return false;
}
function writeBack(){ for(const id of PARTY){ S.hp[id]=Math.max(0,B.p[id].hp); S.sp[id]=B.p[id].sp; } }
function victory(){
  writeBack();
  const xp=B.enemies.reduce((a,e)=>a+e.xp,0), yen=B.enemies.reduce((a,e)=>a+e.yen,0);
  S.xp+=xp; S.yen+=yen;
  const notes=[`+${xp} XP · +¥${yen}`];
  while(S.xp>=S.lv*25){
    S.xp-=S.lv*25; S.lv++;
    for(const id of PARTY){ S.hp[id]=Math.min(maxHP(id), S.hp[id]+10); }
    notes.push(`⬆ LEVEL UP! Party reached level ${S.lv}.`);
    for(const id in ALLIES) for(const [k,lv] of ALLIES[id].learn) if(lv===S.lv) notes.push(`${ALLIES[id].name} learned ${SKILLS[k].name}!`);
  }
  if(Math.random()<0.15){ const k=pick(['medicine','soul']); S.items[k]++; notes.push(`Dropped: ${ITEMS[k].name}.`); }
  const onWin=B.onWin, final=B.enemies.some(e=>e.final);
  B=null;
  if(final) return onWin();
  show(h('div',{class:'panel'}, h('div',{class:'toast'},'VICTORY'), notes.map(n=>h('div',null,n)),
    btn('Continue', ()=>{ D && D.log.push('The shadows dissolve.'); onWin(); }, {cls:'hot'})));
}
function gameOver(){
  B=null; D=null;
  show(h('div',{class:'title'}, h('h1',{class:'logo',style:'font-size:44px'},'GAME OVER'),
    h('p',{class:'dim'},'Your light goes out. Without you, the others cannot go on.'),
    h('div',{style:'max-width:320px;margin:24px auto'},
      btn('Load last save', ()=>{ const s=loadSave(); if(s){ S=s; hub('You wake with a start. Was it a dream?'); } else titleScreen(); }, {cls:'hot'}),
      btn('Title', titleScreen))));
}

// ── battle input ──
function cmd(type){
  const id=actorId();
  if(type==='attack'){ B.pending={type:'attack'}; B.phase='target'; }
  else if(type==='skill'){ B.phase='skills'; }
  else if(type==='persona'){ B.phase='persona'; }
  else if(type==='item'){ B.phase='items'; }
  else if(type==='guard'){ B.p[id].guard=true; blog(`${memberName(id)} braces for impact.`); return nextActor(); }
  renderBattle();
}
function chooseSkill(key){
  const sk=SKILLS[key];
  B.pending={type:'skill', key};
  if(sk.target==='all' || sk.target==='allies') return resolve(null);
  B.phase = sk.target==='ally' ? 'allyTarget' : 'target';
  renderBattle();
}
function chooseItem(k){ B.pending={type:'item', key:k}; B.phase='allyTarget'; renderBattle(); }
function resolve(target){
  const id=actorId(), P=B.pending; let more=false;
  if(P.type==='attack') more=attack(id, target);
  else if(P.type==='skill') more=useSkill(id, P.key, target);
  else if(P.type==='item'){
    const m=B.p[target];
    if(!ITEMS[P.key].use(m)){ blog('It would have no effect.'); B.phase='cmd'; return renderBattle(); }
    ITEMS[P.key].fx(m); S.items[P.key]--; blog(`${memberName(id)} uses ${ITEMS[P.key].name} on ${memberName(target)}.`);
  }
  B.pending=null;
  afterPartyAction(more);
}

function renderBattle(){
  if(!B) return;
  const id=actorId(), phase=B.phase;
  const enemyPick = phase==='target';
  const enemies=h('div',{class:'grid'}, B.enemies.map(e=>{
    const k=S.known[e.key]||{};
    const dead=e.hp<=0;
    return h('div',{class:'card'+(dead?' ko':'')+(enemyPick&&!dead?' pick':''), onclick: enemyPick&&!dead?()=>resolve(e):null},
      e.down && !dead && h('span',{class:'badge'},'DOWN'),
      h('b',null,e.name), h('div',{class:'small'},`HP ${Math.max(0,e.hp)}/${e.max}`), bar(e.hp,e.max,'en'),
      h('div',{class:'aff'}, ELEMENTS.map(el=>{
        const v=k[el]; const cls=v==='w'?'w':v==='r'?'r':v==='n'?'n':'';
        return h('span',{class:cls}, `${EL_NAME[el]} ${v==='w'?'Wk':v==='r'?'Res':v==='n'?'Nul':v==='-'?'–':'?'}`);
      })));
  }));
  const log=h('div',{class:'panel log'}, B.log.slice(-4).map(l=>h('div',null,l)));
  const m=B.p[id]; const st=id?fighterStats(id):null;
  let panel;
  const back=btn('↩ Back', ()=>{ B.phase='cmd'; B.pending=null; renderBattle(); });
  if(phase==='busy') panel=h('div',{class:'panel dim'},'Enemy turn…');
  else if(phase==='allout') panel=h('div',{class:'panel'},
    h('div',{class:'toast'},'All enemies are down!'),
    btn('💥 ALL-OUT ATTACK!', allOut, {cls:'hot'}),
    btn('Hold back', ()=>nextActor()));
  else if(phase==='cmd') panel=h('div',{class:'panel'},
    h('div',{style:'margin-bottom:6px'}, slant(`${memberName(id)}'s turn`)),
    h('div',{class:'grid'},
      h('button',{onclick:()=>cmd('attack')},'⚔️ Attack'),
      h('button',{onclick:()=>cmd('skill')},'✨ Skill'),
      id==='mc' && h('button',{onclick:()=>cmd('persona'), disabled:B.switched||S.personas.length<2},'🎭 Persona'),
      h('button',{onclick:()=>cmd('item'), disabled:!Object.values(S.items).some(n=>n>0)},'🎒 Item'),
      h('button',{onclick:()=>cmd('guard')},'🛡️ Guard')));
  else if(phase==='skills') panel=h('div',{class:'panel'}, slant('Skills'),
    h('div',{class:'grid',style:'margin-top:8px'}, st.skills.map(k=>{
      const sk=SKILLS[k];
      const cost=sk.hp?`${sk.hp} HP`:`${sk.sp} SP`;
      const can=sk.hp? m.hp>sk.hp : m.sp>=sk.sp;
      return h('button',{onclick:()=>chooseSkill(k), disabled:!can}, h('b',null,sk.name), h('br'),
        h('span',{class:'small dim'}, `${sk.heal?'Heal':EL_NAME[sk.el]} · ${sk.target==='all'?'all foes':sk.target==='allies'?'party':sk.target==='ally'?'one ally':'one foe'} · ${cost}`));
    })), back);
  else if(phase==='persona') panel=h('div',{class:'panel'}, slant('Change Persona'),
    h('div',{class:'grid',style:'margin-top:8px'}, S.personas.map(k=>{
      const p=PERSONAS[k];
      return h('button',{class:k===S.active?'card active':'card', disabled:k===S.active,
        onclick:()=>{ S.active=k; B.switched=true; blog(`You summon ${p.name}!`); B.phase='cmd'; renderBattle(); }},
        h('b',null,p.name), h('div',{class:'small dim'}, p.skills.map(s=>SKILLS[s].name).join(', ')), affRow(p.weak,p.res));
    })), back);
  else if(phase==='items') panel=h('div',{class:'panel'}, slant('Items'),
    Object.keys(ITEMS).filter(k=>S.items[k]>0).map(k=>btn(`${ITEMS[k].name} ×${S.items[k]} — ${ITEMS[k].desc}`, ()=>chooseItem(k))), back);
  else if(phase==='target') panel=h('div',{class:'panel'}, slant('Choose a target'),
    h('div',{class:'grid',style:'margin-top:8px'}, aliveEnemies().map(e=>h('button',{onclick:()=>resolve(e)}, e.name))), back);
  else if(phase==='allyTarget') panel=h('div',{class:'panel'}, slant('Choose an ally'),
    h('div',{class:'grid',style:'margin-top:8px'}, PARTY.map(pid=>h('button',{onclick:()=>resolve(pid),
      disabled: B.pending.type==='skill' && B.p[pid].hp<=0}, memberName(pid)))), back);
  else panel=h('div');
  show(enemies, log, partyPanel(phase==='busy'?null:id), panel);
}

titleScreen();
</script>
</body>
</html>
