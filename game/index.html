<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninth Bell</title>
<meta name="description" content="A Persona-style RPG in your browser. 30 days until the full moon.">
<style>
  :root{color-scheme:dark;--bg:#0B0617;--panel:#170C2Bdd;--panel2:#22113fcc;--ink:#F3EEFF;--dim:#A99BC9;--a:#B66BFF;--b:#3EE6FF;
    --hot:#FF3D7F;--gold:#FFD23F;--good:#52f2a0;--line:#ffffff24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui>*{pointer-events:none}
  [hidden]{display:none!important}
  button,.button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;cursor:pointer;text-align:left;transition:transform .08s,border-color .15s,background .15s;pointer-events:auto;text-decoration:none}
  button:hover:not(:disabled){border-color:var(--b);background:#2c1752}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .big{display:block;width:100%;margin:6px 0;font-weight:700}
  .hot{background:linear-gradient(90deg,var(--hot),var(--a))!important;border:none!important;color:#fff;font-weight:900;letter-spacing:.5px}
  .slant{display:inline-block;transform:skew(-12deg);background:linear-gradient(90deg,var(--a),var(--b));color:#0B0617;
    padding:3px 14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .slant>span{display:inline-block;transform:skew(12deg)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .dim{color:var(--dim)} .small{font-size:12px}
  .bar{height:6px;background:#ffffff1c;border-radius:4px;overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%;background:var(--good);transition:width .4s}
  .bar.sp>i{background:var(--b)} .bar.en>i{background:var(--hot)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
  .card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .aff{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
  .aff span{font-size:10px;padding:1px 5px;border-radius:4px;background:#ffffff14;color:var(--dim)}
  .aff .w{background:var(--hot);color:#fff}.aff .r{background:#3b5bdb;color:#fff}.aff .n{background:#555;color:#fff}
  .pips{letter-spacing:2px;color:var(--gold)} .stat{display:flex;justify-content:space-between}
  .toast{text-align:center;font-size:22px;font-weight:900;color:var(--gold);font-style:italic;margin:6px 0}
  .flash{animation:fl .6s}
  @keyframes fl{0%{background:#ffd23f55}}

  /* menus */
  #screen{position:absolute;inset:0;overflow-y:auto;pointer-events:auto;-webkit-overflow-scrolling:touch}
  .sheet{max-width:480px;padding:16px;margin-left:max(16px,4vw)}
  @media (max-width:700px){ .sheet{margin:0 auto;padding-top:46vh;background:linear-gradient(transparent 44vh,#0b0617ee 52vh,var(--bg) 70vh)} .title{padding-top:0} }
  .hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .date{font-size:34px;font-weight:900;font-style:italic;line-height:1}
  .date small{font-size:15px;color:var(--b);margin-left:6px}
  .moon{color:var(--gold);font-weight:700}
  .title{text-align:center;padding-top:8vh}
  .logo{font-size:52px;font-weight:900;letter-spacing:4px;margin:0;font-style:italic;line-height:1.05;
    background:linear-gradient(90deg,var(--hot),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px #b66bff66)}
  .menu{max-width:320px;margin:24px auto} .menu a{display:block;margin-top:14px}
  .shoprow{align-items:center;justify-content:space-between;margin:6px 0}
  ul{padding-left:20px} li{margin:6px 0}

  /* dialogue */
  .dialogue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,calc(100% - 32px));
    background:#0b0617ee;border:2px solid #fff;border-radius:4px 22px 4px 22px;padding:22px 18px 14px;pointer-events:auto;box-shadow:0 10px 40px #000a}
  .namebox{position:absolute;top:-18px;left:16px;background:var(--c);color:#0B0617;font-weight:900;padding:4px 18px;transform:skew(-12deg);font-size:17px}
  .speech{font-size:18px;min-height:56px}
  .choices .big{margin:6px 0 0}

  /* modal */
  #modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;pointer-events:auto;padding:16px}
  .modalbox{width:min(420px,100%);max-height:80vh;overflow:auto}
  #modal.low{align-items:flex-end;background:linear-gradient(transparent 50%,#0008)}

  /* tower hud */
  #hud{position:absolute;inset:0}
  #floorlabel{position:absolute;top:14px;left:16px;background:#0b0617cc;padding:8px 14px;border-left:4px solid var(--b);transform:skew(-8deg)}
  #floorlabel b{font-size:18px;font-style:italic;letter-spacing:1px}
  #minimap{position:absolute;top:12px;right:12px;width:140px;height:140px;border-radius:12px;border:1px solid var(--line)}
  #hudparty{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;width:170px}
  .mini{background:#0b0617cc;padding:6px 10px;border-radius:8px;font-size:12px}.mini.ko{opacity:.4}
  #hudbtns{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;align-items:flex-end}
  #btnStrike{width:74px;height:74px;border-radius:50%;font-size:30px;text-align:center;padding:0;background:var(--hot);border:3px solid #fff}
  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--dim);background:#0b0617aa;padding:4px 10px;border-radius:8px;white-space:nowrap}
  @media (pointer:coarse){ #hint{display:none} #hudparty{bottom:auto;top:80px;width:140px} }
  #towermsg{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;font-style:italic;
    text-shadow:0 2px 12px #000;opacity:0;white-space:nowrap;letter-spacing:1px}
  #towermsg.show{animation:tm 2.6s}
  @keyframes tm{0%{opacity:0;transform:translate(-50%,10px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
  #joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff10;display:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#ffffffaa;transform:translate(-50%,-50%)}

  /* battle hud */
  #bhud{position:absolute;inset:0}
  #blog{position:absolute;top:14px;left:50%;transform:translateX(-50%) skew(-8deg);background:#0b0617dd;border-left:4px solid var(--hot);
    padding:8px 16px;max-width:min(680px,calc(100% - 24px));font-weight:600;font-size:14px;text-align:center}
  #blog.pulse{animation:pl .35s}
  @keyframes pl{0%{background:#ff3d7f88}}
  #cmd{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;width:min(250px,48vw);max-height:62vh;overflow-y:auto;pointer-events:auto}
  .cbtn{transform:skew(-10deg);background:#0b0617e6;border:2px solid #fff;border-radius:2px;font-weight:800;font-size:15px;padding:9px 14px;width:100%}
  .cbtn:hover:not(:disabled){background:var(--hot);border-color:#fff}
  .cbtn .sub{display:block;font-size:11px;font-weight:500;color:var(--dim)}
  .cbtn:hover .sub{color:#fff}
  .cbtn.allout{background:linear-gradient(90deg,var(--hot),var(--gold));color:#0B0617;font-size:18px}
  .turn{font-weight:900;font-style:italic;font-size:18px;color:var(--c,var(--gold));text-shadow:0 2px 8px #000;margin-bottom:2px}
  .hotturn{color:var(--gold)}
  #bparty{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;width:min(230px,46vw)}
  .pcard{background:#0b0617dd;border-left:5px solid var(--c);padding:6px 10px;transform:skew(-8deg);transition:transform .2s}
  .pcard.active{transform:skew(-8deg) translateX(-14px);background:#22113fee;box-shadow:0 0 0 2px var(--gold)}
  .pcard.ko{opacity:.45}
  .pname{font-weight:900}
  .nums{display:flex;justify-content:space-between;font-size:12px}.nums .sp{color:var(--b)}
  i.down{font-style:normal;background:var(--hot);color:#fff;font-size:10px;padding:1px 5px;margin-left:5px;border-radius:3px}
  i.grd{font-style:normal;background:#3b5bdb;color:#fff;font-size:10px;padding:1px 5px;margin-left:5px;border-radius:3px}
  @media (max-width:560px), (max-height:460px){ #bparty{width:200px} .pcard{font-size:12px;padding:3px 8px} #cmd{width:210px} .cbtn{font-size:13px;padding:6px 10px} #cmd{gap:4px} }
  @media (max-aspect-ratio:1/1){
    #blog{top:8px;font-size:12px;padding:6px 12px}
    #bparty{top:auto;bottom:calc(10px + var(--cmdh,0px));left:8px;right:8px;width:auto;flex-direction:row;gap:4px}
    .pcard{flex:1;transform:none;padding:4px 6px;font-size:11px;min-width:0}
    .pcard.active{transform:translateY(-6px)}
    .pname .small{display:none}
    #cmd{left:8px;right:8px;bottom:8px;width:auto;display:grid;grid-template-columns:1fr 1fr;max-height:40vh;gap:5px}
    #cmd .turn{grid-column:1/-1;font-size:15px}
    .cbtn{transform:none;font-size:13px;padding:8px 10px}
    .elabel{font-size:11px;min-width:80px}
  }

  /* enemy labels */
  #labels{position:absolute;inset:0}
  .elabel{position:absolute;transform:translate(-50%,-100%);background:#0b0617cc;padding:3px 8px;border-radius:6px;font-size:12px;min-width:96px;text-align:center;white-space:nowrap}
  #labels.picking .elabel{pointer-events:auto;cursor:pointer;border:2px solid var(--hot);animation:bob 1s infinite}
  @keyframes bob{50%{transform:translate(-50%,-110%)}}

  /* effects */
  #fx{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:26px;color:#fff;font-style:italic;
    text-shadow:0 0 6px #000,2px 2px 0 #000;animation:pop 1.2s forwards}
  .pop.weak{color:var(--hot);font-size:30px}.pop.crit{color:var(--gold);font-size:30px}.pop.res{color:#8fb0ff;font-size:18px}
  .pop.null{color:#bbb}.pop.heal{color:var(--good)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-130%);opacity:0}}
  .cutin{position:absolute;left:0;right:0;top:34%;height:120px}
  .cutin .stripe{position:absolute;inset:0;background:repeating-linear-gradient(-60deg,#0b0617 0 18px,var(--c) 18px 22px);transform:skewY(-6deg);animation:sl 1.1s}
  .cutin .who{position:absolute;left:8%;top:18px;font-size:48px;font-weight:900;font-style:italic;color:#fff;text-shadow:4px 4px 0 var(--c),0 0 20px #000;animation:sw 1.1s}
  .cutin .sub{position:absolute;right:8%;bottom:16px;font-size:30px;font-weight:900;font-style:italic;color:var(--gold);text-shadow:3px 3px 0 #000;animation:sw2 1.1s}
  @keyframes sl{0%{transform:skewY(-6deg) scaleX(0);transform-origin:left}15%{transform:skewY(-6deg) scaleX(1)}85%{opacity:1}100%{opacity:0}}
  @keyframes sw{0%{transform:translateX(-120%)}20%{transform:none}85%{opacity:1}100%{transform:translateX(30%);opacity:0}}
  @keyframes sw2{0%{transform:translateX(120%)}25%{transform:none}85%{opacity:1}100%{opacity:0}}
  .banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .banner span{font-size:clamp(34px,8vw,80px);font-weight:900;font-style:italic;color:#fff;transform:skew(-10deg);
    text-shadow:5px 5px 0 var(--hot),0 0 30px #000;animation:bn .9s both}
  .banner.adv span{text-shadow:5px 5px 0 var(--b),0 0 30px #000}
  .banner.eadv span{color:var(--hot);text-shadow:5px 5px 0 #000}
  .banner.persona span{font-size:clamp(28px,6vw,60px);text-shadow:4px 4px 0 var(--a),0 0 30px #000}
  .banner.win span{color:var(--gold);text-shadow:5px 5px 0 var(--a),0 0 30px #000}
  @keyframes bn{0%{transform:skew(-10deg) scale(2.5);opacity:0}20%{transform:skew(-10deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
  body.transition #fx{animation:tr .6s}
  @keyframes tr{0%{background:#fff}30%{background:#ff3d7fcc}100%{background:transparent}}

  /* loading */
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);pointer-events:auto;padding:16px;text-align:center}
  #loadbar{width:min(320px,80vw);height:6px;background:#ffffff1c;border-radius:4px;overflow:hidden;margin:18px 0 8px}
  #loadfill{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--b));transition:width .3s}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <div id="screen" hidden></div>
  <div id="hud" hidden>
    <div id="floorlabel"></div>
    <canvas id="minimap" width="140" height="140"></canvas>
    <div id="towermsg"></div>
    <div id="hudparty"></div>
    <div id="hint">WASD / arrows move · Shift walk · Space strike · Q/E or drag to turn</div>
    <div id="hudbtns">
      <button id="btnItems">🎒</button>
      <button id="btnLeave">🚪</button>
      <button id="btnStrike" aria-label="Strike">⚔</button>
    </div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="labels"></div>
  <div id="bhud" hidden>
    <div id="blog"></div>
    <div id="cmd"></div>
    <div id="bparty"></div>
  </div>
  <div id="fx"></div>
  <div id="modal" hidden></div>
  <div id="loading">
    <h1 class="logo">NINTH BELL</h1>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadlabel" class="small dim">Loading…</div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
