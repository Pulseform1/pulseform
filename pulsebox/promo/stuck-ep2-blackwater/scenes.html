<script>
/* STUCK IN PULSEBOX · EP 2: BLACKWATER DRIFT */
const A = i => VO[i - 1], E_ = i => TIMELINE.lines[i - 1].at + TIMELINE.lines[i - 1].dur, W_ = (l, re) => wordT(l, re);
const pair = (t, y, k, mo = {}, jo = {}) => kidFront(330, y, k, who(MILO, Object.assign({ t }, mo))) + kidFront(760, y, k, who(JAY, Object.assign({ t: t + 1 }, jo)));
function hookRope(x0, y0, x1, y1, k) {   // rope from the raft to the hook, k = 0..1 how far it has flown
  const x = lerp(x0, x1, k), y = lerp(y0, y1, k) - Math.sin(k * Math.PI) * 160;
  return P(`M${x0} ${y0} Q${(x0 + x) / 2} ${Math.min(y0, y) - 120} ${x} ${y}`, 'none', 0, `stroke="#e8d9b0" stroke-width="6" stroke-dasharray="14 8"`) + G(`translate(${x} ${y})`, P('M0 0 L0 30 Q0 50 -20 46 M0 30 Q0 50 20 46', 'none', 0, `stroke="#c8ccd8" stroke-width="9" stroke-linecap="round"`));
}
function shark(x, y, k, open, dir = 1) {   // side-view shark head out of the water
  return G(`translate(${x} ${y}) scale(${k * dir} ${k})`, P('M-260 60 Q-150 -120 160 -60 L220 -20 L160 ' + (10 + open * 60) + ' Q-60 120 -260 60Z', '#5d6876', 8) + P('M-260 60 Q-100 40 160 ' + (20 + open * 50), '#e8ecf2', 0) +
    C(90, -40, 12, INK, 0) + Array.from({ length: 6 }, (_, i) => P(`M${40 + i * 22} ${-10 + open * 4} l10 18 l10 -18Z`, '#fff', 3)).join('') + Array.from({ length: 6 }, (_, i) => P(`M${40 + i * 22} ${10 + open * 56} l10 -18 l10 18Z`, '#fff', 3)).join('') + P('M-40 -70 L0 -170 Q20 -110 40 -70Z', '#5d6876', 7));
}
const SC = [
  [0, (t, lt) => {                         // HOOK: four planks, endless sea, a fin circling closer
    const z = lerp(2.2, 1, eIO(prog(lt, 0, 3.0))), r = lerp(560, 260, prog(lt, 0, 5.8)), a = lt * 1.4;
    let s = seaTop(t) + raftTop(t, 540, 960, 1, 0) + kidTop(500, 920, 1, 30, who(MILO, { t })) + kidTop(590, 1010, 1, 210, who(JAY, { t }));
    s += fin(540 + Math.cos(a) * r, 960 + Math.sin(a) * r * 1.2, 1.3, Math.sin(a) > 0 ? -1 : 1, t);
    return G(`translate(540 960) scale(${z}) translate(-540 -960)`, s) + seriesBadge(2);
  }, 1500],
  [A(2) - .1, (t, lt) => sideSea(t) + raftSide(540, 1500, 1.6, Math.sin(t * 1.6) * 3) + G('translate(0 0)', kidFront(540, 1260, 1.4, who(JAY, { t, mouth: 'o', talk: Math.abs(Math.sin(t * 13)), brow: 'up', wet: true, lookX: -.5 }))), 300],
  [A(3) - .1, (t, lt) => {
    let s = sideSea(t) + raftSide(540, 1500, 1.6, Math.sin(t * 1.6) * 3) + kidFront(540, 1260, 1.4, who(MILO, { t, mouth: lt > 1.0 ? 'grin' : 'o', brow: 'up', wet: true }));
    return s + G(`translate(540 520) rotate(-3) scale(${pop(lt, .05, .35)})`, TS(0, 0, 'BLACKWATER', 140, '#1d4f73', 14) + TS(0, 130, 'DRIFT', 140, '#fff', 14));
  }, 300],
  [A(4) - .1, (t, lt) => {                 // the hook
    const tThrow = W_(4, /^Throw/), tReel = W_(4, /^Reel/), fly = eOut(prog(t, tThrow + .2, tThrow + 1.0)), reel = eIO(prog(t, tReel, tReel + 1.2));
    const bx = lerp(880, 690, reel), by = lerp(500, 820, reel);
    let s = seaTop(t) + barrelTop(bx, by, 1.2) + plank(200, 1500, 220, 70, 30) + raftTop(t, 540, 960, 1, 0);
    s += kidTop(500, 920, 1, -60, who(MILO, { t })) + kidTop(600, 1010, 1, 150, who(JAY, { t }));
    s += hookRope(520, 900, reel > 0 ? bx : 880, reel > 0 ? by : 500, reel > 0 ? 1 : fly);
    return s;
  }, 1550],
  [A(5) - .1, (t, lt) => {                 // the raft grows, word by word
    const steps = [/Barrels/, /Planks/, /Rope/, /grew/, /Walls/, /sail/, /fire/];
    let st = 0; steps.forEach((re, i) => { if (t >= W_(5, re) - .1) st = i + 1; });
    const z = lerp(1.15, .8, prog(lt, 0, 5.5));
    let s = seaTop(t) + G(`translate(540 960) scale(${z}) translate(-540 -960)`, raftTop(t, 540, 960, 1, st) + kidTop(460 + Math.sin(t) * 40, 900, 1, t * 40, who(MILO, { t, walk: true })) + kidTop(620, 1040 + Math.cos(t) * 40, 1, 200 - t * 30, who(JAY, { t, walk: true })) +
      (st >= 7 ? G(`translate(740 840)`, fish(0, 0, 1, ORANGE, 1, t)) : ''));
    const lab = ['', 'BARRELS', 'PLANKS', 'ROPE', 'BIGGER', 'WALLS', 'SAIL', 'FIRE'][st];
    if (st) s += G(`translate(540 1700) rotate(-3) scale(${pop(t, W_(5, steps[st - 1]) - .1, .25)})`, R(-200, -60, 400, 100, 20, '#ffd84d', 8) + T(0, 18, '+ ' + lab, 60, INK, 'middle', 'Luckiest'));
    return s;
  }, 300],
  [A(6) - .1, (t, lt) => {                 // the shark came back
    const k = eIn(prog(lt, 0, 2.0));
    let s = seaTop(t) + raftTop(t, 540, 960, .8, 7) + kidTop(470, 930, .8, 0, who(MILO, { t })) + kidTop(610, 990, .8, 180, who(JAY, { t }));
    return s + fin(lerp(1200, 820, k), lerp(1500, 1180, k), 1.6, -1, t) + P(`M${lerp(1300, 900, k)} ${lerp(1560, 1230, k)} l200 120`, 'none', 0, 'stroke="#fff" stroke-width="10" opacity=".5"');
  }, 300],
  [A(7) - .1, (t, lt) => {                 // it's eating the raft!
    const bite = Math.abs(Math.sin(lt * 7));
    let s = sideSea(t) + raftSide(420, 1500, 1.5, -6, { sail: true }) + kidFront(300, 1170, 1.0, who(JAY, { t, mouth: 'o', talk: 1, brow: 'up', armsUp: true }));
    s += shark(900, 1520, 1.4, bite, -1) + plank(760, 1470 - bite * 40, 160, 50, -30 + bite * 20);
    return G(`translate(${Math.sin(t * 60) * 8} 0)`, s);
  }, 300],
  [A(8) - .1, (t, lt) => {                 // the iron spear
    const jab = t > W_(8, /spear/) && t < W_(8, /spear/) + .5, off = eIn(prog(t, W_(8, /swam/), E_(8) + .3));
    let s = sideSea(t) + raftSide(420, 1500, 1.5, -2, { sail: true });
    s += G(`translate(0 0)`, kidFront(380, 1170, 1.0, who(JAY, { t, mouth: 'grin', brow: 'mad' }))) + L(470, 1250, jab ? 900 : 760, jab ? 1460 : 1380, 14, '#9aa3b8') + P(`M${jab ? 900 : 760} ${jab ? 1460 : 1380} l-10 -40 l50 30Z`, '#cfd6e6', 5);
    s += off < 1 ? fin(lerp(900, 1400, off), 1520, 1.6, 1, t) : '';
    if (jab) s += burst(900, 1460, 40, 90, 10, '#fff', t * 8, 5);
    return s;
  }, 300],
  [A(9) - .1, (t, lt) => {                 // a wave, taller than a house
    const h = lerp(0, 900, eOut(prog(t, W_(9, /wave/) - .3, W_(9, /house/) + .4)));
    let s = sideSea(t) + raftSide(300, 1500, .8, Math.sin(t * 2) * 4, { sail: true, kids: { milo: { t, lookX: 1, mouth: 'o' }, jay: { t } } });
    if (h > 20) s += bigWave(820, 1560, h, t);
    if (t > W_(9, /house/) - .2) s += G(`translate(260 900) scale(${pop(t, W_(9, /house/) - .2, .3)})`, P('M-80 0 L-80 -110 L0 -180 L80 -110 L80 0Z', '#e8e0c8', 7) + R(-20, -70, 40, 70, 4, '#7a4e2a', 5) + T(0, 70, 'house', 40, '#fff', 'middle', 'Luckiest'));
    return s;
  }, 300],
  [A(10) - .1, (t, lt) => {                // brace!
    let s = R(-20, -20, 1120, 1960, 0, '#1f6a96', 0) + bigWave(540, 2200, 2400, t);
    s += L(540, 600, 540, 1900, 30, '#5c3820') + pair(t, 1250, 1.15, { mouth: 'o', brow: 'mad', armsUp: true, wet: true }, { mouth: 'o', brow: 'up', armsUp: true, wet: true });
    for (let i = 0; i < 30; i++) s += C((i * 137 + t * 400) % 1100, (i * 211 + t * 900) % 1900, 8 + (i % 3) * 4, '#e8f6ff', 0, 'opacity=".8"');
    return G(`translate(${Math.sin(t * 50) * 10} ${Math.cos(t * 43) * 10})`, s);
  }, 300],
  [A(11) - .1, (t, lt) => {                // climbed the wave... and held
    const k = prog(lt, 0, 2.2), tilt = k < .6 ? lerp(0, -55, eOut(k / .6)) : lerp(-55, 6, eIO((k - .6) / .4));
    let s = sideSea(t) + bigWave(540 + k * 200, 1700, lerp(1000, 300, k), t) + raftSide(lerp(300, 620, k), lerp(1400, k < .6 ? 800 : 1500, k < .6 ? eOut(k / .6) : eIO((k - .6) / .4)), .9, tilt, { sail: true, kids: { milo: { t, mouth: 'o' }, jay: { t, mouth: 'o' } } });
    if (t > W_(11, /held/)) s += G(`translate(540 600) scale(${pop(t, W_(11, /held/), .3)})`, TS(0, 0, 'IT HELD!', 150, LIME, 14));
    return s;
  }, 300],
  [A(12) - .1, (t, lt) => {                // something huge rose... looked... sank
    const rise = eOut(prog(t, W_(12, /rose/) - .3, W_(12, /raft/))), look = t > W_(12, /Looked/) - .1, sink = eIn(prog(t, W_(12, /sank/), E_(12) + .5));
    const open = look ? (Math.abs(Math.sin((t - W_(12, /Looked/)) * 3)) > .1 ? 1 : .05) * (1 - sink) : .05;
    let s = sideSea(t, { night: true }) + raftSide(260, 1450, .8, Math.sin(t) * 2, { sail: true, lantern: true, kids: { milo: { t, mouth: 'o', lookX: 1 }, jay: { t, mouth: 'o', lookX: 1 } } });
    s += C(260, 1380, 260, '#ffb547', 0, 'opacity=".18" filter="url(#blur30)"');
    if (rise > 0) s += giantEye(720, lerp(1700, 1180, rise) + sink * 500, open, 1, t);
    s += R(-20, 1500, 1120, 460, 0, '#071226', 0, 'opacity=".55"');
    return s;
  }, 300],
  [A(13) - .1, (t, lt) => sideSea(t, { night: true }) + C(540, 1200, 400, '#ffb547', 0, 'opacity=".2" filter="url(#blur30)"') + kidFront(540, 1300, 1.6, who(JAY, { t, mouth: 'o', brow: 'up', lookX: .8, wet: true })), 300],
  [A(14) - .1, (t, lt) => {
    let s = sideSea(t, { night: true }) + C(540, 1200, 400, '#ffb547', 0, 'opacity=".2" filter="url(#blur30)"');
    s += G(`translate(540 1300) scale(${1.5 + lt * .06}) translate(-540 -1300)`, kidFront(540, 1300, 1, who(MILO, { t, mouth: 'flat', lookX: lerp(.8, 0, prog(lt, .5, 1.5)), brow: 'up' })));
    if (lt > 1.2) s += E(900, 1500, 120, Math.abs(Math.sin(lt * 2)) * 30 + 4, '#c6ff3d', 0, 'opacity=".5" filter="url(#blur8)"');
    return s;
  }, 300],
  [A(15) - .1, (t, lt) => {                // the whirlpool: Milo paddles straight in
    const tin = W_(15, /straight/) - .3, k = eIn(prog(t, tin, E_(15) + .6));
    let s = seaTop(t, 1) + whirlpool(540, 960, t, 1.2);
    const a = k * 10, r = lerp(520, 0, k);
    s += G(`translate(${540 + Math.cos(a) * r} ${960 + Math.sin(a) * r}) rotate(${a * 57}) scale(${lerp(.7, .1, k)})`, raftTop(t, 0, 0, 1, 7) + kidTop(-40, -30, 1, 0, who(MILO, { t })) + kidTop(60, 40, 1, 180, who(JAY, { t })));
    if (t < tin) s += T(540, 1650, 'players paddle away...', 54, '#fff', 'middle', 'Luckiest', `stroke="${INK}" stroke-width="8" paint-order="stroke" opacity=".0"`);
    return s;
  }, 300],
  [A(16) - .1, (t, lt) => {                // splash: back in the bedroom, soaked, holding a fish
    const k = eOut(prog(lt, 0, .5));
    let s = bedroomFloor(t, { dawn: true, clock: '6:00' }) + E(540, 1700, 520, 140, '#5fa8d8', 6, 'opacity=".7"') + R(400, 1660, 320, 200, 24, '#191c2c', 8);
    s += pair(t, 1250, 1.05, { mouth: 'o', wet: true }, { mouth: 'o', wet: true, armsUp: true }) + (t > W_(16, /fish/) - .2 ? G(`translate(760 ${1000 + Math.sin(t * 20) * 14}) rotate(${Math.sin(t * 14) * 25})`, fish(0, 0, 2.2, ORANGE, 1, t)) : '');
    return s + R(-20, -20, 1120, 1960, 0, '#bfe9ff', 0, `opacity="${1 - k}"`);
  }, 300],
  [A(17) - .1, (t, lt) => bedroomFloor(t, { dawn: true, clock: '6:00' }) + E(540, 1700, 520, 140, '#5fa8d8', 6, 'opacity=".7"') + pair(t, 1250, 1.05, { mouth: 'grin', wet: true, brow: 'up' }, { mouth: 'grin', wet: true }) +
     G(`translate(760 1180) rotate(-20)`, fish(0, 0, 2.2, ORANGE, 1, t)) + G(`translate(840 900) scale(${pop(lt, .3, .3)})`, P('M0 30 C-40 -10 -40 -40 0 -20 C40 -40 40 -10 0 30Z', '#ff4f6e', 5)), 300],
  [A(18) - .1, (t, lt) => {                // it's real
    let s = R(-20, -20, 1120, 1960, 0, '#0b0d14', 0) + rays(540, 1000, 24, 1600, '#4fa3ff', .08, t * .2);
    s += phone(540, 1080, 680, 1240, realGameCard(t, 'blackwater', 'Blackwater Drift', 'Survival · co-op for 1 to 4', G(`translate(340 900) scale(${pop(t, W_(18, /^4/), .3)})`, R(-170, -45, 340, 90, 20, '#fff', 5) + T(0, 18, '1-4 PLAYERS', 44, INK, 'middle', 'Luckiest'))), lerp(8, -2, eOut(prog(lt, 0, .4))));
    return s + pulseboxLogo(540, 250, pop(lt, .1, .3) * .85);
  }, 1720],
  [A(19) - .1, (t, lt) => {                // tease, then the end card
    if (lt < 2.8) return bedroomFloor(t, { dawn: true, clock: '6:01' }) + pair(t, 1150, 1, { mouth: 'o', lookY: 1, wet: true }, { mouth: 'o', lookY: 1, brow: 'up', wet: true }) + laptopFront(220, 1440, 640, 400, mansionNight(t, 640, 400) + (Math.sin(t * 30) > .6 ? staticFill(640, 400, 9, t) : ''));
    return endCard(t, lt - 2.8, 'NEXT: EP 3 · HEIST CREW') + seriesBadge(2, 330, 1700);
  }, 300],
];
const CUES = { bpm: 88, key: 'dreamy',
  music: [[0, A(5) - .1, 'tense'], [A(5) - .1, A(6) - .1, 'calm'], [A(6) - .1, A(12) - .1, 'hard'], [A(12) - .1, A(15) - .1, 'tense'], [A(15) - .1, A(18) - .1, 'calm'], [A(18) - .1, TIMELINE.end, 'hard']],
  fx: [[W_(1, /fin/), 'sting', .7], [W_(4, /^Throw/) + .2, 'whoosh', .7], [W_(4, /^Reel/), 'splash', .5], ...[/Barrels/, /Planks/, /Rope/, /grew/, /Walls/, /sail/, /fire/].map(re => [W_(5, re) - .1, 'pop', .5]),
       [A(6) + .2, 'sting', .6], [A(7), 'thud', .8], [A(7) + .6, 'splash', .5], [W_(8, /spear/), 'thud', .8], [W_(9, /house/), 'riser', .6, 1.4], [A(10), 'splash', .9], [A(11) + 1.3, 'splash', .9], [W_(11, /held/), 'cheer', .5],
       [W_(12, /rose/), 'riser', .5, 1.5], [W_(12, /Looked/), 'sting', .8], [W_(15, /straight/), 'riser', .6, 1.5], [A(16), 'splash', 1], [A(18), 'pop', .5], [A(19) + 2.8, 'pop', .5]] };
startVideo(SC, CUES);
</script>
