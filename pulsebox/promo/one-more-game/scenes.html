<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/stage.css"></head>
<body>
<script src="timeline.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/more.js"></script>
<script>
/* "One More Game": POV, it's 6 AM and you said one more game at 10 PM. */
const A = i => VO[i - 1];                       // when voice line i starts
const wt = (line, re) => wordT(line, re);

function windowSky(x, y, w, h, t, mode) {      // mode: 'night' | 'dawn'
  let sky = mode === 'dawn'
    ? `<defs><linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7fe0"/><stop offset=".55" stop-color="#ff9ab0"/><stop offset="1" stop-color="#ffcf5a"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#dawn)"/>` +
      C(w * .6, h * .95, w * .25, '#fff1a8', 6) + rays(w * .6, h * .95, 14, w, '#fff7cf', .25, t * .2)
    : `<rect width="${w}" height="${h}" fill="url(#night)"/>` + stars(w, h, 24, 5, t) + C(w * .7, h * .25, 44, '#f4f1d6', 6);
  if (mode === 'dawn') for (let i = 0; i < 3; i++) { const bx = ((t * 60 + i * 120) % (w + 100)) - 50, by = h * (.25 + i * .12) + Math.sin(t * 6 + i) * 8;
    sky += P(`M${bx - 22} ${by} Q${bx - 11} ${by - 14 - Math.sin(t * 16 + i) * 8} ${bx} ${by} Q${bx + 11} ${by - 14 - Math.sin(t * 16 + i) * 8} ${bx + 22} ${by}`, 'none', 6); }
  return R(x - 16, y - 16, w + 32, h + 32, 16, '#2a2f55') + nest(x, y, w, h, sky) + R(x, y, w, h, 8, 'none') + L(x + w / 2, y, x + w / 2, y + h, 8) + L(x, y + h / 2, x + w, y + h / 2, 8);
}
function bedFace(t, o = {}) {                    // the kid in bed, lit by the phone, we are the phone
  let s = R(-20, -20, 1120, 1960, 0, o.dawn ? '#3b3f7a' : '#1a1f4a', 0);
  s += windowSky(560, 170, 420, 460, t, o.dawn ? 'dawn' : 'night');
  if (o.dawn) s += P('M560 640 L980 640 L1080 1500 L300 1500Z', '#ffcf5a', 0, 'opacity=".12"');
  s += R(-60, 820, 1200, 300, 60, '#e6e9ff');                                   // pillow
  s += kidFront(540, 1180, 1.9, { t, tired: o.tired, mouth: o.mouth || 'smile', talk: o.talk, lookY: .6, blink: !o.tired, brow: o.brow, tilt: o.tilt || 0 });
  s += P('M-60 1350 Q540 1250 1140 1350 L1140 1960 L-60 1960Z', o.dawn ? '#6a52d9' : '#4a3bb0');   // blanket
  for (let i = 0; i < 6; i++) s += C(80 + i * 190, 1500 + (i % 2) * 120, 26, '#ffffff', 0, 'opacity=".12"');
  // the phone's back at the bottom, glowing at the kid
  s += `<ellipse cx="540" cy="1050" rx="520" ry="420" fill="url(#limeGlow)" opacity=".35"/>`;
  s += R(330, 1560, 420, 520, 60, '#191c2c') + C(420, 1650, 30, '#2b2f45', 5) + logoMark(505, 1720, 3);
  s += E(310, 1700, 70, 90, SKIN) + E(770, 1700, 70, 90, SKIN);
  return s;
}
function clockBadge(x, y, txt, k = 1, rot = 5) {
  return G(`translate(${x} ${y}) rotate(${rot}) scale(${k})`, R(-190, -70, 380, 140, 26, '#0c0f24', 8) + T(0, 36, txt, 96, '#ff4f6e', 'middle', 'DejaVu Sans Mono', 'font-weight="bold"'));
}
function phoneGame(id, t, lt, clock, title, col, extra = '') {   // a real Pulsebox game on the phone, held in bed
  let s = R(-20, -20, 1120, 1960, 0, '#141838', 0) + rays(540, 1000, 20, 1500, LIME, .05, t * .2);
  s += `<ellipse cx="540" cy="1000" rx="620" ry="760" fill="url(#limeGlow)" opacity=".35"/>`;
  const W = 720, H = 1250, k = lerp(.85, 1, eOut(prog(lt, 0, .25)));
  const inner = G('translate(0 92)', GAMES[id][1](t, W, H - 92)) + R(0, 0, W, 92, 0, '#1b1f33', 0) + R(24, 18, W - 48, 58, 29, '#2a2f4a', 0) + T(W / 2, 58, '🔒 box.pulseform.org', 30, '#fff', 'middle', 'Inter', 'font-weight="700"');
  s += G(`translate(540 1030) scale(${k}) translate(-540 -1030)`, phone(540, 1030, W, H, inner, Math.sin(t * 1.3) * 1.5) + E(150, 1450, 80, 110, SKIN) + E(930, 1450, 80, 110, SKIN) + extra);
  s += clockBadge(800, 1610, clock, .85 * pop(lt, .05, .3), 5);
  s += tag(540, 1800, title, col, pop(lt, .15, .3), -3);
  return s;
}
const SC = [
  [0, (t, lt) => {                              // HOOK: 6 AM zombie, phone light
    const z = lerp(1.3, 1, eOut(prog(lt, 0, .3)));
    return G(`translate(540 1000) scale(${z}) translate(-540 -1000)`, bedFace(t, { dawn: true, tired: .75, mouth: 'flat' }));
  }, 1480],
  [A(2) - .1, (t, lt) => {                      // 8 HOURS AGO: the clock slams in, then rewinds
    let s = bedFace(t, { dawn: true, tired: .8, mouth: 'o', talk: .3 });
    s += clockBadge(540, 470, '6:02 AM', lerp(2.2, 1.6, eOut(prog(lt, 0, .2))), -4);
    const rw = prog(t, A(3) - .55, A(3));
    if (rw > 0) s = `<g filter="url(#gray)">${s}</g>` + R(0, 0, 1080, 1920, 0, '#3a2a8c', 0, `opacity="${.35 * rw}"`) +
      [300, 760, 1240].map((y, i) => L(0, y + Math.sin(t * 40 + i) * 30, 1080, y + 10 + Math.sin(t * 40 + i) * 30, 6, '#fff', 'opacity=".5"')).join('') + TS(540, 1150, '◀◀ REWIND', 120, '#fff', 12, 'Chakra');
    return s;
  }, 1480],
  [A(3) - .05, (t, lt) => {                     // 10 PM, fresh and happy, one quick race
    if (lt < 1.05) return bedFace(t, { mouth: 'grin' }) + clockBadge(780, 440, '10:02 PM', pop(lt, .05, .3), 5);
    return phoneGame('turbo-laps', t, lt - 1.05, '10:02 PM', 'TURBO LAPS', LIME);
  }, 180],
  [A(4) - .1, (t, lt) => phoneGame('turbo-laps', t + 3, lt, '10:41 PM', 'BEAT THE BOTS', '#ffd84d',
      lt > 1.2 ? G(`translate(540 600) scale(${pop(lt, 1.2, .25)})`, burst(0, 0, 90, 170, 12, '#ffd84d', 0, 8) + TS(0, 40, '1ST!', 110, '#fff', 12)) : ''), 180],
  [A(5) - .1, (t, lt) => {                      // ghost hunt with the lights off
    let s = phoneGame('dead-air', t, lt, '11:58 PM', 'DEAD AIR', PINK);
    if (lt > 1.3) { const k = pop(lt, 1.3, .2); s += R(0, 0, 1080, 1920, 0, INK, 0, 'opacity=".35"') + G(`translate(540 960) scale(${k * 5})`, ghost(0, 0, 1)) + TS(540, 1450, 'BOO!', 200 * k, '#fff', 16); }
    return s;
  }, 180],
  [A(6) - .1, (t, lt) => phoneGame('space-colony', t, lt, '1:37 AM', 'SPACE COLONY', ORANGE), 180],
  [A(7) - .1, (t, lt) => phoneGame('sky-stack', t, lt, '3:12 AM', 'SKY STACK', '#4fe3ff'), 180],
  [A(8) - .1, (t, lt) => phoneGame('tiny-aquarium', t, lt, '4:46 AM', 'TINY AQUARIUM', '#8fd3ff'), 180],
  [A(9) - .1, (t, lt) => {                      // the birds are singing
    let s = bedFace(t, { dawn: true, tired: .85, mouth: 'flat', tilt: Math.sin(t * 2) * 3 });
    s += clockBadge(330, 430, '6:02 AM', pop(lt, .05, .3), -5);
    for (let i = 0; i < 3; i++) s += T(700 + i * 90, 300 - ((lt * 120 + i * 60) % 200), '♪', 70, '#fff', 'middle', 'DejaVu Sans', `opacity="${.9 - ((lt * 120 + i * 60) % 200) / 220}"`);
    return s;
  }, 1500],
  [A(10) - .1, (t, lt) => {                     // still saying one more game
    const z = 1 + eIn(prog(lt, .2, 2.2)) * .5, twitch = (lt % .7) < .08 ? 6 : 0;
    return G(`translate(540 980) scale(${z}) translate(${-540 + twitch} -980)`, bedFace(t, { dawn: true, tired: .5, mouth: 'grin', brow: 'up' }));
  }, 1500],
  [A(11) - .1, (t, lt) => {                     // reveal: it's called Pulsebox
    let s = R(-20, -20, 1120, 1960, 0, '#101330', 0) + rays(540, 1000, 24, 1600, LIME, .12, t * .3);
    s += phone(540, 1110, 640, 1140, siteScreen(t, 640, 1140, eIO(prog(lt, .8, 3.8)) * 900), lerp(10, -3, eOut(prog(lt, 0, .35))));
    s += pulseboxLogo(540, 260, pop(lt, .1, .35));
    const tf = wt(11, /^77/); if (t >= tf) s += G(`translate(540 445) rotate(-4) scale(${lerp(2.2, 1, eOut(prog(t, tf, tf + .18)))})`, R(-330, -66, 660, 104, 18, '#ffd84d', 9) + T(0, 10, '77 FREE GAMES', 72, INK, 'middle', 'Luckiest'));
    return s;
  }, 1720],
  [A(12) - .1, (t, lt) => endCard(t, lt, "you've been warned"), 1560],
];
const CUES = { bpm: 96, key: 'dreamy',
  music: [[0, A(3) - .55, 'calm'], [A(3) - .55, A(3), 'tapestop'], [A(3), A(9) - .1, 'hard'], [A(9) - .1, A(11) - .1, 'calm'], [A(11) - .1, TIMELINE.end, 'hard']],
  fx: [[A(2) - .05, 'thud', .9], [A(3) - .55, 'scratch', .8], [A(4) + 1.1, 'ding', .6], [A(5) + 1.2, 'sting', .9], [A(5) + 1.25, 'thud', .8],
       [A(9) + .1, 'bird', .7], [A(9) + .5, 'bird', .6], [A(9) + 1.0, 'bird', .7], [A(9) + 1.4, 'bird', .5], [A(10) + .2, 'bird', .4],
       [wordT(11, /^77/), 'thud', .7], [A(11) - .1, 'thud', .9], [A(12), 'pop', .5], [A(12) + .35, 'pop', .5]] };
startVideo(SC, CUES);
</script>
</body></html>
