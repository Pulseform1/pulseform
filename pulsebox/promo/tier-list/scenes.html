<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/stage.css"></head>
<body>
<script src="timeline.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/more.js"></script>
<script>
/* "Tier list": ranking real Pulsebox games, comment bait at the end. */
const A = i => VO[i - 1];
const tierT = (line, re) => wordT(line, re);
const ROWS = [['S', '#ff4f6e'], ['A', '#ffb547'], ['B', '#ffd84d'], ['C', '#3ddc84'], ['D', '#4fa3ff']];
// game, voice line, tier row, when it lands (the moment the tier is said)
const PICKS = [
  ['neon-serpent', 2, 2, tierT(2, /^B$/)], ['safecracker', 3, 1, tierT(3, /^A$/)], ['flop-hoops', 4, 1, tierT(4, /^A$/)],
  ['axe-spin', 5, 0, tierT(5, /^S$/)], ['hyperlane', 6, 0, tierT(6, /^S$/)], ['bumper-brawl', 7, 0, tierT(7, /^S$/)], ['lantern-keep', 9, 0, tierT(9, /^S\+/)]];
const BY = 1170, RH = 140, CW = 150, CH = 112;
function slot(i) {   // where pick i sits on the board; Lantern Keep takes the first S slot and pushes the rest along
  const [id, , row] = PICKS[i]; let n = 0;
  for (let j = 0; j < i; j++) if (PICKS[j][2] === row) n++;
  if (id !== 'lantern-keep' && row === 0 && PICKS[6][3] <= window.__t) n++;
  if (id === 'lantern-keep') n = 0;
  return [150 + n * (CW + 14), BY + row * RH + (RH - CH) / 2];
}
function thumb(id, t, x, y, k = 1, crown = false) {
  return G(`translate(${x} ${y}) scale(${k})`, R(0, 0, CW, CH, 12, '#171a2b', 5) + nest(5, 5, CW - 10, CH - 10, GAMES[id][1](t, CW - 10, CH - 10)) + R(5, 5, CW - 10, CH - 10, 8, 'none', 4) +
    (crown ? P('M30 -6 L45 -40 L65 -14 L75 -48 L85 -14 L105 -40 L120 -6Z', '#ffd84d', 6) : ''));
}
function board(t, hide = -1) {
  let s = R(0, BY - 20, 1080, 5 * RH + 40, 0, '#0f1126', 0);
  ROWS.forEach(([l, c], r) => { s += R(14, BY + r * RH + 6, 120, RH - 12, 14, c, 6) + T(74, BY + r * RH + RH / 2 + 30, l, 84, INK, 'middle', 'Luckiest') + R(144, BY + r * RH + 6, 922, RH - 12, 14, '#1b1f3a', 4); });
  PICKS.forEach(([id, line, row, tl], i) => {
    if (i === hide || t < tl) return;
    const [x, y] = slot(i), k = prog(t, tl, tl + .35);
    const sx = lerp(465, x, eOut(k)), sy = lerp(700, y, eOut(k)), sc = lerp(2.4, 1, eOut(k));
    s += thumb(id, t, sx, sy, sc, id === 'lantern-keep');
  });
  return s;
}
function preview(id, t, lt, line, tierLetter, tierCol, tl) {   // big look at the game above the board
  let s = R(-20, -20, 1120, 1960, 0, '#0b0d1a', 0) + board(t);
  const k = eOut(prog(lt, 0, .25)), out = prog(t, tl, tl + .3);
  if (out < 1) {
    const W = 960, H = 900;
    s += G(`translate(540 600) scale(${lerp(.6, 1, k) * (1 - out * .7)}) translate(-540 -600)`, R(60 - 14, 150 - 14, W + 28, H + 28, 34, '#262b45', 8) + nest(60, 150, W, H, GAMES[id][1](t, W, H)) + R(60, 150, W, H, 22, 'none', 6) +
      tag(540, 160, GAMES[id][0].toUpperCase(), LIME, pop(lt, .05, .25), -3), `opacity="${1 - out}"`);
  }
  if (t >= tl - .05) { const sk = lerp(3, 1, eOut(prog(t, tl - .05, tl + .12))), fade = 1 - prog(t, tl + .55, tl + .8);
    if (fade > 0) s += G(`translate(540 640) rotate(-8) scale(${sk})`, C(0, 0, 150, tierCol, 12) + T(0, 62, tierLetter, 190, INK, 'middle', 'Luckiest'), `opacity="${fade}"`); }
  return s;
}
const SC = [
  [0, (t, lt) => {                                       // HOOK: empty board, mystery #1 shaking in S
    let s = R(-20, -20, 1120, 1960, 0, '#0b0d1a', 0) + rays(540, 520, 20, 1400, LIME, .06, t * .3) + board(t);
    s += kidFront(540, 700, 1.25, { t, mouth: 'o', talk: Math.abs(Math.sin(t * 14)), brow: 'up', armsUp: lt > 1.6 });
    s += C(225, BY + 70, 150, 'url(#warmGlow)', 0) + G(`translate(${150 + Math.sin(t * 50) * 6} ${BY - 10}) rotate(${Math.sin(t * 30) * 4}) scale(1.35)`, R(0, 0, CW, CH, 12, '#ffd84d', 6) + T(CW / 2, 80, '#1 ?', 56, INK, 'middle', 'Luckiest'));
    s += G(`translate(540 1060) scale(${pop(lt, .1, .3)})`, TS(0, 0, 'TIER LIST', 120, '#fff', 14));
    return G(`translate(540 960) scale(${lerp(1.25, 1, eOut(prog(lt, 0, .3)))}) translate(-540 -960)`, s);
  }, 90],
  ...PICKS.slice(0, 6).map(([id, line, row, tl]) => [A(line) - .1, (t, lt) => preview(id, t, lt, line, ROWS[row][0], ROWS[row][1], tl), 880]),
  [A(8) - .15, (t, lt) => {                              // AND NUMBER ONE? drumroll
    let s = R(-20, -20, 1120, 1960, 0, '#0b0d1a', 0) + board(t) + rays(540, 600, 24, 1400, '#ffd84d', .1, t * .8);
    const sh = Math.sin(t * 60) * 8 * prog(lt, 0, 2);
    s += G(`translate(${540 + sh} 600) scale(${1.4 + lt * .15})`, R(-210, -170, 420, 340, 30, '#262b45', 9) + T(0, 70, '?', 260, '#ffd84d', 'middle', 'Luckiest'));
    return s;
  }, 960],
  [A(9) - .1, (t, lt) => {                               // LANTERN KEEP crowned
    let s = preview('lantern-keep', t, lt, 9, 'S+', '#ff4f6e', PICKS[6][3]);
    if (t > PICKS[6][3]) { const r = rng(9); for (let i = 0; i < 40; i++) { const x = r() * 1080, sp = 300 + r() * 500, y = -50 + (t - PICKS[6][3]) * sp - r() * 300;
      s += R(x + Math.sin(t * 5 + i) * 30, y, 18, 30, 4, [LIME, PINK, '#ffd84d', '#4fa3ff'][i % 4], 0, `transform="rotate(${(t * 200 + i * 40) % 360} ${x} ${y})"`); } }
    return s;
  }, 880],
  [A(10) - .1, (t, lt) => {                              // all free, on Pulsebox
    let s = R(-20, -20, 1120, 1960, 0, '#0b0d14', 0) + `<ellipse cx="540" cy="620" rx="800" ry="600" fill="url(#limeGlow)" opacity=".4"/>` + rays(540, 620, 24, 1500, LIME, .07, t * .2);
    s += G(`translate(0 ${lerp(0, 120, eOut(prog(lt, 0, .4)))})`, board(t));
    s += pulseboxLogo(540, 470, pop(t, wordT(10, /PULSEBOX/), .35)) + urlPill(540, 760, pop(t, wordT(10, /box\.pulse/), .35) * .9);
    return s;
  }, 210],
  [A(11) - .1, (t, lt) => {                              // which one did I get wrong?
    let s = R(-20, -20, 1120, 1960, 0, '#0b0d1a', 0) + board(t);
    s += kidFront(540, 700, 1.25, { t, mouth: 'grin', brow: 'mad', lookX: .5 });
    const ar = Math.abs(Math.sin(t * 5)) * 26;
    s += G(`translate(540 ${1000 + ar})`, P('M-40 0 L40 0 L40 50 L80 50 L0 130 L-80 50 L-40 50Z', LIME, 8));
    s += G(`translate(870 300) rotate(8) scale(${pop(lt, .4, .3)})`, R(-170, -60, 340, 110, 24, '#ffd84d', 8) + T(0, 20, 'COMMENT', 60, INK, 'middle', 'Luckiest'));
    return s;
  }, 90],
];
const CUES = { bpm: 108, key: 'bright',
  music: [[0, A(8) - .15, 'hard'], [A(8) - .15, PICKS[6][3], 'tense'], [PICKS[6][3], TIMELINE.end, 'hard']],
  fx: [...PICKS.map(p => [p[3], 'thud', .8]), [A(8) - .1, 'ticks', .5, PICKS[6][3] - A(8) + .05, .07], [PICKS[6][3], 'cheer', .9], [PICKS[6][3] + .05, 'ding', .6],
       [wordT(10, /PULSEBOX/), 'pop', .6], [A(11) + .4, 'pop', .5]] };
window.__t = 0;
startVideo(SC, CUES);
const r0 = window.render; window.render = t => { window.__t = t; r0(t); };
</script>
</body></html>
