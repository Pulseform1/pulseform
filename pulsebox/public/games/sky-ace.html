<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { color-scheme: dark; --accent: #c6ff3d; --accent2: #29e0ff; --bg: #0a0c12; --text: #f3f5ff; --muted: #a3a9c4; --panel: rgba(10,12,22,.86); --edge: rgba(255,255,255,.14); --display: 'Lilita One', 'Arial Black', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hud-score { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vh, 56px); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); letter-spacing: .02em; }
.hud-score.bump { animation: bump .18s ease-out; }
@keyframes bump { 40% { transform: translateX(-50%) scale(1.18); } }
.hud-coins { position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 3.2vh, 24px); background: rgba(0,0,0,.35); padding: 4px 12px 4px 8px; border-radius: 999px; }
.coin-i { width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcf2e 45%, #c98a00); box-shadow: 0 0 8px rgba(255,207,46,.6); display: inline-block; flex: none; }
.hud-pause { position: absolute; top: 10px; left: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,.35); pointer-events: auto; display: grid; place-items: center; }
.hud-pause::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

/* screens */
.scr { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.65)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vh, 28px) 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.title { font-family: var(--display); font-size: clamp(36px, 9vh, 64px); line-height: .95; margin: 0 0 6px; color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .01em; }
.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 15px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.07); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.stat small { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.big { display: block; width: 100%; font-family: var(--display); font-size: clamp(22px, 5vh, 30px); padding: 12px 18px; border-radius: 18px; background: var(--accent); color: #0b0d14; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.big:hover { transform: translateY(-2px); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.row button { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
.row button:hover { background: rgba(255,255,255,.14); }
.how { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
.score-big { font-family: var(--display); font-size: clamp(54px, 14vh, 96px); line-height: 1; margin: 4px 0; }
.newbest { display: inline-block; font-family: var(--display); background: var(--accent2); color: #0b0d14; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* skins */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 6px 0 14px; }
.skin { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.skin.on { border-color: var(--accent); background: rgba(255,255,255,.12); }
.skin.locked { opacity: .9; }
.skin canvas { width: 56px; height: 56px; }
.skin .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffe07a; }
.skin.cant .price { color: #ff8a8a; }

.mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid var(--edge); font-size: 18px; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vh, 38px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 20px var(--accent); pointer-events: none; animation: toast 1.4s ease-out forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
body.demo .hud-pause, body.demo .mute { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const W = 1280, H = 720;  // the game world; the kit scales it to fit the screen
/* Sky Ace: a side-scrolling shoot-'em-up across four stages (coast, canyon, storm, stratosphere). Your plane fires on
   its own; dodge bullets, grab power-ups, chain kills for a score multiplier, and take down the boss at the end of
   each stage: the Sky Fortress, the Rotor Gunship and the Storm Dreadnought. */
const GAME = {
  id: 'sky-ace', title: 'Sky Ace', tagline: 'Fly, fire, dodge. Beat the bosses. Chase the high score.',
  font: 'Racing Sans One', accent: '#4fd8ff', accent2: '#ffb23f', bg: '#2a6ab0', scoreLabel: 'Score',
  how: ['Drag anywhere to fly (the plane follows your finger), or use WASD / arrow keys.', 'You shoot by yourself. P = more guns, M = homing missiles, S = shield, B = bomb (Space or B to use).', 'Chain kills quickly for a score multiplier. Each stage ends with a boss.'],
  skins: [
    { name: 'Falcon', price: 0, c: ['#e6eef6', '#d23a3a'] }, { name: 'Viper', price: 60, c: ['#7dffb0', '#1a6a3a'] }, { name: 'Raven', price: 150, c: ['#3a3a4a', '#ff3d8b'] },
    { name: 'Sunbird', price: 250, c: ['#ffd23f', '#ff6a2a'] }, { name: 'Ghost', price: 400, c: ['#c8f0ff', '#6a7aff'] }, { name: 'Royal', price: 700, c: ['#b07cff', '#ffe36e'] },
  ],
};
(() => {
  const STAGES = [
    { n: 'Coastline', sky: ['#4a9ae8', '#bfe6ff'], far: '#6a9ac8', ground: 'sea', gc: ['#1f7ab8', '#0f4a80'], sun: '#fff6c0', cloud: '#ffffff' },
    { n: 'Red Canyon', sky: ['#e86a3a', '#ffd08a'], far: '#a8503a', ground: 'desert', gc: ['#d88a4a', '#9a5a2a'], sun: '#ffe0a0', cloud: '#ffe8d8' },
    { n: 'Storm Front', sky: ['#141a2e', '#3a4a6a'], far: '#22283e', ground: 'sea', gc: ['#1a2a3a', '#0a1420'], sun: null, cloud: '#6a7590', rain: 1 },
    { n: 'Stratosphere', sky: ['#04061a', '#1a3a8a'], far: '#2a4aa0', ground: 'earth', gc: ['#3a7ad8', '#0a2a6a'], sun: '#ffffff', cloud: '#c8d8ff', stars: 1 },
  ];
  let me, foes, bul, ebul, drops, fx, lives, power, missiles, shield, bombs, inv, t, waveT, boss, keys, drag, fireT, misT, dead, stage, stageT, chain, chainT, best, clouds, far, ground, bolt, bossCD, shake2;
  const SKY = () => STAGES[stage % STAGES.length];
  GAME.reset = () => {
    me = { x: 220, y: H / 2, tx: 220, ty: H / 2, tilt: 0 }; foes = []; bul = []; ebul = []; drops = []; fx = []; lives = 3; power = 1; missiles = 0; shield = 0; bombs = 2; inv = 2; t = 0; waveT = 1.2; boss = null; keys = {}; drag = null; fireT = 0; misT = 0; dead = false;
    stage = 0; stageT = 2.6; chain = 0; chainT = 0; best = 0; bolt = 0; bossCD = 70; shake2 = 0;
    clouds = Array.from({ length: 16 }, (_, i) => ({ x: Math.random() * 1500, y: K.rand(40, H - 200), s: K.rand(.4, 1.4), front: i < 2 }));
    far = Array.from({ length: 9 }, (_, i) => ({ x: i * 220, h: K.rand(60, 160), w: K.rand(140, 260) }));
    ground = Array.from({ length: 14 }, (_, i) => ({ x: i * 120, k: K.irand(0, 3) }));
  };
  /* ---------- drawing the aircraft ---------- */
  function rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  function shade(h, k) { const n = parseInt(h.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
  // a fighter facing right, about 110 px long at sc = 1
  function jet(gr, c0, c1, x, y, tilt, sc, flash, burner = 1) {
    gr.save(); gr.translate(x, y); gr.rotate(tilt * .22); gr.scale(sc, sc);
    if (burner) { const f = .7 + Math.random() * .5; const g = gr.createLinearGradient(-50, 0, -50 - 40 * f, 0); g.addColorStop(0, 'rgba(255,255,220,.95)'); g.addColorStop(.4, 'rgba(255,170,60,.8)'); g.addColorStop(1, 'rgba(255,80,30,0)'); gr.fillStyle = g; gr.beginPath(); gr.moveTo(-48, -6); gr.lineTo(-50 - 46 * f, 0); gr.lineTo(-48, 6); gr.fill(); }
    const body = flash ? '#ffffff' : c0, acc = flash ? '#ffffff' : c1;
    gr.fillStyle = flash ? '#fff' : shade(acc, -.25); gr.beginPath(); gr.moveTo(-6, 4); gr.lineTo(-30, 30); gr.lineTo(-16, 30); gr.lineTo(16, 6); gr.fill();   // far wing
    const g = gr.createLinearGradient(0, -12, 0, 12); g.addColorStop(0, flash ? '#fff' : shade(body, .25)); g.addColorStop(.6, body); g.addColorStop(1, flash ? '#fff' : shade(body, -.35));
    gr.fillStyle = g; gr.beginPath(); gr.moveTo(56, 2); gr.quadraticCurveTo(44, -10, 10, -11); gr.lineTo(-40, -8); gr.lineTo(-50, -4); gr.lineTo(-50, 6); gr.lineTo(-30, 9); gr.quadraticCurveTo(30, 12, 56, 2); gr.fill();
    gr.strokeStyle = 'rgba(0,0,0,.25)'; gr.lineWidth = 1.2; gr.beginPath(); gr.moveTo(-20, -6); gr.lineTo(-20, 8); gr.moveTo(8, -9); gr.lineTo(8, 10); gr.stroke();
    gr.fillStyle = acc; gr.beginPath(); gr.moveTo(-26, -7); gr.lineTo(-48, -32); gr.lineTo(-36, -32); gr.lineTo(-14, -8); gr.fill();   // tail fin
    gr.beginPath(); gr.moveTo(-4, 0); gr.lineTo(-34, -20 * 0); gr.lineTo(-38, 22); gr.lineTo(-22, 22); gr.lineTo(18, 2); gr.fill();     // near wing
    gr.fillStyle = flash ? '#fff' : shade(acc, .3); gr.fillRect(-24, 16, 16, 3);
    const cg = gr.createLinearGradient(18, -16, 18, -4); cg.addColorStop(0, '#d8f6ff'); cg.addColorStop(1, '#2a6ab0'); gr.fillStyle = cg; gr.beginPath(); gr.ellipse(20, -9, 15, 7, -.08, Math.PI, 0); gr.fill();
    gr.fillStyle = 'rgba(255,255,255,.7)'; gr.beginPath(); gr.ellipse(16, -12, 6, 2, -.2, 0, 7); gr.fill();
    gr.fillStyle = acc; gr.fillRect(-46, -2, 6, 6);
    gr.restore();
  }
  GAME.drawSkin = (gr, s) => jet(gr, s.c[0], s.c[1], 6, 0, 0, .8, false);
  function bomber(gr, f, x, y, sc) {
    gr.save(); gr.translate(x, y); gr.scale(-sc, sc); const fl = f.flash > 0;
    for (const ex of [-10, 30]) { gr.fillStyle = fl ? '#fff' : '#3a3e46'; gr.beginPath(); gr.roundRect(ex - 14, 14, 40, 14, 6); gr.fill(); gr.fillStyle = 'rgba(200,220,255,.3)'; gr.beginPath(); gr.ellipse(ex + 26, 21, 3, 12 * Math.abs(Math.sin(K.t * 40 + ex)), 0, 0, 7); gr.fill(); }
    const g = gr.createLinearGradient(0, -20, 0, 20); g.addColorStop(0, fl ? '#fff' : '#9aa0aa'); g.addColorStop(1, fl ? '#fff' : '#4a4e58'); gr.fillStyle = g;
    gr.beginPath(); gr.moveTo(80, 0); gr.quadraticCurveTo(70, -20, 30, -20); gr.lineTo(-70, -12); gr.lineTo(-80, 0); gr.lineTo(-70, 12); gr.lineTo(30, 18); gr.quadraticCurveTo(70, 18, 80, 0); gr.fill();
    gr.fillStyle = fl ? '#fff' : '#5a2a2a'; gr.beginPath(); gr.moveTo(-50, -10); gr.lineTo(-80, -50); gr.lineTo(-62, -50); gr.lineTo(-30, -12); gr.fill();
    gr.fillStyle = fl ? '#fff' : '#6a6e78'; gr.beginPath(); gr.moveTo(10, 2); gr.lineTo(-30, 44); gr.lineTo(-10, 44); gr.lineTo(40, 4); gr.fill();
    gr.fillStyle = '#a8d8ff'; gr.beginPath(); gr.ellipse(58, -8, 12, 7, 0, 0, 7); gr.fill();
    gr.fillStyle = '#c8302a'; gr.beginPath(); gr.arc(-6, -2, 7, 0, 7); gr.fill(); gr.fillStyle = '#fff'; gr.beginPath(); gr.arc(-6, -2, 3, 0, 7); gr.fill();
    gr.restore();
  }
  function heli(gr, f, x, y, sc) {
    gr.save(); gr.translate(x, y); gr.scale(-sc, sc); const fl = f.flash > 0;
    gr.strokeStyle = fl ? '#fff' : '#2a3a2a'; gr.lineWidth = 6; gr.beginPath(); gr.moveTo(-20, -4); gr.lineTo(-80, -10); gr.stroke();
    gr.fillStyle = 'rgba(30,40,30,.35)'; gr.beginPath(); gr.ellipse(-82, -10, 6, 18 * Math.abs(Math.sin(K.t * 30)), 0, 0, 7); gr.fill();
    const g = gr.createLinearGradient(0, -24, 0, 22); g.addColorStop(0, fl ? '#fff' : '#7a9a5a'); g.addColorStop(1, fl ? '#fff' : '#2a3a1a'); gr.fillStyle = g;
    gr.beginPath(); gr.ellipse(4, 0, 40, 22, 0, 0, 7); gr.fill();
    gr.fillStyle = '#9ad8ff'; gr.beginPath(); gr.ellipse(28, -4, 14, 12, 0, -1.4, 1.2); gr.fill();
    gr.fillStyle = '#222'; gr.fillRect(-2, -30, 8, 10); gr.fillStyle = 'rgba(40,40,40,.4)'; gr.beginPath(); gr.ellipse(2, -32, 70, 5, 0, 0, 7); gr.fill();
    gr.fillStyle = fl ? '#fff' : '#3a3a3a'; gr.fillRect(-10, 22, 46, 4); gr.fillRect(36, 10, 18, 6);
    gr.restore();
  }
  function drone(gr, f, x, y, sc) {
    gr.save(); gr.translate(x, y); gr.scale(sc, sc); gr.rotate(K.t * 4);
    gr.fillStyle = f.flash > 0 ? '#fff' : '#3a2a4a'; for (let i = 0; i < 6; i++) { gr.rotate(Math.PI / 3); gr.beginPath(); gr.moveTo(10, -6); gr.lineTo(26, 0); gr.lineTo(10, 6); gr.fill(); }
    gr.beginPath(); gr.arc(0, 0, 15, 0, 7); gr.fill(); gr.rotate(-K.t * 4);
    const eg = gr.createRadialGradient(0, 0, 1, 0, 0, 10); eg.addColorStop(0, '#fff'); eg.addColorStop(.4, '#ff3a5a'); eg.addColorStop(1, '#6a0a1a'); gr.fillStyle = eg; gr.beginPath(); gr.arc(0, 0, 9, 0, 7); gr.fill();
    gr.restore();
  }
  function ship(gr, f, x, y) {
    gr.save(); gr.translate(x, y + Math.sin(K.t * 2 + x * .01) * 3); const fl = f.flash > 0;
    gr.fillStyle = fl ? '#fff' : '#4a5260'; gr.beginPath(); gr.moveTo(-90, -10); gr.lineTo(90, -10); gr.lineTo(70, 16); gr.lineTo(-76, 16); gr.fill();
    gr.fillStyle = fl ? '#fff' : '#6a7280'; gr.fillRect(-40, -34, 50, 24); gr.fillRect(-24, -52, 14, 18);
    const a = Math.atan2(me.y - (y - 20), me.x - (x + 40)); gr.save(); gr.translate(40, -16); gr.rotate(a); gr.fillStyle = '#2a2e36'; gr.fillRect(0, -4, 34, 8); gr.restore(); gr.fillStyle = '#3a3e48'; gr.beginPath(); gr.arc(40, -16, 12, Math.PI, 0); gr.fill();
    gr.fillStyle = 'rgba(255,255,255,.5)'; gr.fillRect(-96, 14, 200, 3);
    gr.restore();
  }
  /* ---------- waves ---------- */
  function shootAt(x, y, sp = 300, spread = 0, big = false) { const a = Math.atan2(me.y - y, me.x - x) + spread; ebul.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, big }); }
  const hpScale = () => 1 + stage * .6 + t / 200;
  function wave() {
    const lv = Math.min(5, 1 + Math.floor(t / 25)), k = K.irand(0, lv), y0 = K.rand(120, H - 220), hp = 2 * hpScale(), st = SKY();
    const add = o => foes.push(Object.assign({ hp, max: hp, r: 24, pts: 100, t: 0, flash: 0 }, o));
    if (k === 0) for (let i = 0; i < 5; i++) add({ k: 'sine', x: W + 60 + i * 80, y: y0, y0, ph: i * .55 });
    if (k === 1) for (let i = 0; i < 5; i++) add({ k: 'line', x: W + 60 + Math.abs(i - 2) * 70, y: y0 + (i - 2) * 64 });
    if (k === 2) for (let i = 0; i < 4; i++) add({ k: 'loop', x: W + 60 + i * 90, y: y0, y0, ph: 0, fire: K.rand(1, 2.5) });
    if (k === 3) add({ k: 'bomber', x: W + 120, y: K.rand(130, H - 260), hp: hp * 14, max: hp * 14, r: 60, pts: 800, fire: 1.2 });
    if (k === 4) for (let i = 0; i < 2; i++) add({ k: 'heli', x: W + 80 + i * 160, y: 150 + i * 220, hp: hp * 6, max: hp * 6, r: 38, pts: 400, fire: K.rand(.8, 1.6) });
    if (k === 5) for (let i = 0; i < 6; i++) add({ k: 'drone', x: W + 40 + i * 50, y: K.rand(80, H - 220), r: 20, pts: 150, hp: hp * .8, max: hp * .8 });
    if (st.ground === 'sea' && Math.random() < .35) add({ k: 'ship', x: W + 120, y: H - 64, hp: hp * 8, max: hp * 8, r: 60, pts: 600, fire: 1.4 });
  }
  const BOSSES = [
    { n: 'SKY FORTRESS', hp: 900, parts: [[-120, -40], [-20, -60], [80, -40]] },
    { n: 'ROTOR GUNSHIP', hp: 1100, parts: [[-90, 20], [60, 20]] },
    { n: 'STORM DREADNOUGHT', hp: 1400, parts: [[-140, 30], [-40, 46], [60, 46], [160, 30]] },
  ];
  function spawnBoss() {
    const d = BOSSES[stage % 3], hp = d.hp * (1 + stage * .5);
    boss = { boss: true, kind: stage % 3, n: d.n, x: W + 300, y: H / 2 - 40, hp, max: hp, r: 110, pts: 20000, ph: 0, fire: 1.5, flash: 0, parts: d.parts.map(([px, py]) => ({ px, py, hp: hp * .12, max: hp * .12, fire: K.rand(.5, 1.5) })) };
    K.toast('WARNING: ' + d.n); K.sfx(90, 1.5, 'sawtooth', .12, 40); shake2 = 1.2;
  }
  /* ---------- input ---------- */
  GAME.down = (x, y) => { drag = { x, y, mx: me.tx, my: me.ty }; };
  GAME.move = (x, y) => { if (drag) { me.tx = K.clamp(drag.mx + (x - drag.x) * 1.3, 50, W - 50); me.ty = K.clamp(drag.my + (y - drag.y) * 1.3, 50, H - 50); } };
  GAME.up = () => { drag = null; };
  GAME.key = (c, d) => { keys[c] = d; if (d && (c === 'KeyB' || c === 'Space')) bomb(); };
  function bomb() {
    if (bombs <= 0 || dead) return; bombs--; K.flash('#fff', .9); K.shake(24); K.noise(.9, .4, 70); K.sfx(60, 1, 'sawtooth', .12, -30);
    fx.push({ k: 'wave', x: me.x, y: me.y, t: 0, life: .9, r: 1400 }); for (const b of ebul) fx.push({ k: 'spark', x: b.x, y: b.y, t: 0, life: .3 }); ebul = [];
    for (const f of foes) hit(f, 40 * hpScale()); if (boss) hit(boss, 60 * hpScale());
  }
  // the bot scores spots it could reach soon: far from where bullets and planes will be, lined up with a target
  GAME.bot = () => {
    const tgt = boss ? { x: boss.x, y: boss.y + (boss.parts.find(p => p.hp > 0) || { py: 0 }).py } : foes.filter(f => f.k !== 'ship').reduce((b, f) => !b || f.x < b.x ? f : b, null) || foes[0];
    const drop = drops.filter(d => d.x > me.x - 30 && d.x < 900).sort((a, b) => a.x - b.x)[0];
    let bestS = -1e9, bx = me.x, by = me.y;

/* Pulsebox game kit: canvas scaling, input, menus, skins shop, coins, best score, sound and effects.
   A game defines GAME before this runs: { id, title, tagline, how:[], bg, skins:[{name,price,c:[]}],

const parts = [], pops = [];

      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(i); save.skin = i; K.chime(660); }
      else { K.sfx(160, .15, 'sawtooth', .08); return; }
      persist(); refresh(); buildSkins();
    };
    grid.appendChild(b);
  });
}

/* ---------- flow ---------- */
let overAt = 0, botOverAt = 0;
function start() {
  audio(); K.bot = false; K.score = 0; K.runCoins = 0; hud(); parts.length = 0; pops.length = 0;
  GAME.reset(); K.state = 'play'; showScr(null); $('hud').hidden = false; save.plays++; persist();
}
function attract() { K.bot = true; K.demoSkin = DEMO ? 0 : K.irand(0, GAME.skins.length - 1); K.score = 0; K.runCoins = 0; hud(); GAME.reset(); if (POSE) GAME.pose(); K.state = 'title'; $('hud').hidden = !DEMO; }
K.over = (o = {}) => {
  if (K.bot) { if (!botOverAt) botOverAt = K.t + 1.2; return; }
  if (K.state !== 'play') return;
  K.state = 'over'; overAt = performance.now();
  const best = K.score > save.best; if (best) save.best = K.score;
  save.coins += K.runCoins; persist(); refresh();
  $('oTitle').hidden = !o.title; $('oTitle').textContent = o.title || ''; $('oText').hidden = !o.text; $('oText').textContent = o.text || ''; $('oLabel').textContent = GAME.scoreLabel || 'Score';
  $('oScore').textContent = K.score; $('oBest').textContent = save.best; $('oCoins').textContent = K.runCoins; $('oNew').hidden = !best || K.score === 0;
  const next = GAME.skins.map((s, i) => [s, i]).find(([s, i]) => !save.owned.includes(i));
  $('oHint').textContent = next ? (save.coins >= next[0].price ? `You can unlock ${next[0].name} now!` : `${next[0].price - save.coins} more coins to unlock ${next[0].name}`) : 'You own every skin. Legend!';
  if (GAME.noSkins) $('oHint').textContent = '';
  setTimeout(() => { if (K.state === 'over') { showScr('sOver'); $('hud').hidden = true; } }, o.delay ?? 650);
  if (best && K.score > 0) setTimeout(() => K.chime(523, [0, 4, 7, 12, 16]), 700);
};
function pause() { if (K.state !== 'play') return; K.state = 'paused'; showScr('sPause'); }
function resume() { K.state = 'play'; showScr(null); last = performance.now(); }
function toMenu() { refresh(); attract(); showScr('sTitle'); }

$('bPlay').onclick = start; $('bAgain').onclick = start; $('bResume').onclick = resume;
$('bMenu').onclick = toMenu; $('bQuit').onclick = toMenu;
$('bSkins').onclick = () => { skinsFrom = 'sTitle'; buildSkins(); refresh(); showScr('sSkins'); };
$('bSkins2').onclick = () => { skinsFrom = 'sOver'; buildSkins(); refresh(); showScr('sSkins'); };
$('bBack').onclick = () => { if (skinsFrom === 'sOver') toMenu(); else showScr('sTitle'); };
$('hPause').onclick = pause;
$('bMute').onclick = () => { save.mute = !save.mute; persist(); refresh(); audio(); };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
const toW = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener('pointerdown', e => { audio(); if (K.state === 'play' && GAME.down) { const [x, y] = toW(e); GAME.down(x, y, e); } });
addEventListener('pointermove', e => { if (K.state === 'play' && GAME.move) { const [x, y] = toW(e); GAME.move(x, y, e); } });
addEventListener('pointerup', e => { if (K.state === 'play' && GAME.up) { const [x, y] = toW(e); GAME.up(x, y, e); } });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat && K.state !== 'play') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (K.state === 'play') pause(); else if (K.state === 'paused') resume(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && K.state !== 'play') {
    if (K.state === 'title' && !$('sTitle').hidden) start();
    else if (K.state === 'over' && performance.now() - overAt > 900) start();
    else if (K.state === 'paused') resume();
    return;
  }
  if (K.state === 'play' && GAME.key) GAME.key(e.code, true);
});
addEventListener('keyup', e => { if (K.state === 'play' && GAME.key) GAME.key(e.code, false); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const run = K.state === 'play' || K.state === 'title' || K.state === 'over';
  if (run && !POSE) {
    K.t += dt;
    if (K.bot && K.state === 'title') { if (botOverAt && K.t > botOverAt) { botOverAt = 0; attract(); } else if (!botOverAt && GAME.bot) GAME.bot(dt); }
    GAME.update(dt); fx(dt);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = GAME.bg || '#000'; g.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx * sc), dpr * (oy + sy * sc));
  GAME.draw(g); drawFx();
  if (flashA > 0) { g.globalAlpha = flashA; g.fillStyle = flashC; g.fillRect(K.view.x0, K.view.y0, K.view.x1 - K.view.x0, K.view.y1 - K.view.y0); g.globalAlpha = 1; }
  masterSync();
  requestAnimationFrame(frame);
}
if (GAME.noSkins) { $('bSkins').parentNode.hidden = true; $('bSkins2').hidden = true; }
if (GAME.noHud) { $('hScore').hidden = true; document.querySelector('.hud-coins').hidden = true; }
refresh(); attract(); showScr('sTitle');
requestAnimationFrame(frame);
</script>
</body>
