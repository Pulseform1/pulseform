<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shellsmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { color-scheme: dark; --accent: #c6ff3d; --accent2: #29e0ff; --bg: #0a0c12; --text: #f3f5ff; --muted: #a3a9c4; --panel: rgba(10,12,22,.86); --edge: rgba(255,255,255,.14); --display: 'Lilita One', 'Arial Black', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hud-score { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vh, 56px); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); letter-spacing: .02em; }
.hud-score.bump { animation: bump .18s ease-out; }
@keyframes bump { 40% { transform: translateX(-50%) scale(1.18); } }
.hud-coins { position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 3.2vh, 24px); background: rgba(0,0,0,.35); padding: 4px 12px 4px 8px; border-radius: 999px; }
.coin-i { width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcf2e 45%, #c98a00); box-shadow: 0 0 8px rgba(255,207,46,.6); display: inline-block; flex: none; }
.hud-pause { position: absolute; top: 10px; left: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,.35); pointer-events: auto; display: grid; place-items: center; }
.hud-pause::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

/* screens */
.scr { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.65)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vh, 28px) 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.title { font-family: var(--display); font-size: clamp(36px, 9vh, 64px); line-height: .95; margin: 0 0 6px; color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .01em; }
.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 15px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.07); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.stat small { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.big { display: block; width: 100%; font-family: var(--display); font-size: clamp(22px, 5vh, 30px); padding: 12px 18px; border-radius: 18px; background: var(--accent); color: #0b0d14; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.big:hover { transform: translateY(-2px); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.row button { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
.row button:hover { background: rgba(255,255,255,.14); }
.how { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
.score-big { font-family: var(--display); font-size: clamp(54px, 14vh, 96px); line-height: 1; margin: 4px 0; }
.newbest { display: inline-block; font-family: var(--display); background: var(--accent2); color: #0b0d14; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* skins */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 6px 0 14px; }
.skin { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.skin.on { border-color: var(--accent); background: rgba(255,255,255,.12); }
.skin.locked { opacity: .9; }
.skin canvas { width: 56px; height: 56px; }
.skin .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffe07a; }
.skin.cant .price { color: #ff8a8a; }

.mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid var(--edge); font-size: 18px; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vh, 38px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 20px var(--accent); pointer-events: none; animation: toast 1.4s ease-out forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
body.demo .hud-pause, body.demo .mute { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const W = 1280, H = 720;  // the game world; the kit scales it to fit the screen
/* Shellsmith: a pixel-physics artillery range. Every building is made of real pixels (brick, concrete, steel, wood,
   glass, stone, lead) that crack, fall, crumble into rubble and melt. Somewhere inside sits a glowing core: break or
   melt it before you run out of shells. Between shots you design your own ammunition in the workshop (casing, nose,
   explosive fill, shaped-charge liner and fuse) and spend your winnings on better parts and a better gun. */
const GAME = {
  id: 'shellsmith', title: 'Shellsmith', tagline: 'Design the shell. Melt the core.',
  font: 'Russo One', accent: '#ff7a2a', accent2: '#5ad8ff', bg: '#1a1420', noHud: true, noSkins: true, scoreLabel: 'Coins earned',
  how: [
    'Drag from anywhere to aim (direction and distance set the angle and power), let go to fire. Keyboard: arrows aim, Space fires, 1 2 3 pick a shell.',
    'Each building hides a glowing core. Break or melt 90% of it to clear the level. Fewer shells means more stars and coins.',
    'In the Workshop, build up to three shells: a heavy casing and a hard nose punch through armour, a delay fuse goes off inside, thermite melts, a copper liner fires a jet through steel.',
    'Unsupported floors fall, and a falling building crushes what is below it. Knock out the base and let gravity do the work.',
  ],
  skins: [{ name: 'Range', price: 0 }],
};
(() => {
  'use strict';
  const TAU = Math.PI * 2, cl = (v, a, b) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, R = Math.random, rint = (a, b) => Math.floor(a + R() * (b - a + 1)), pick = a => a[Math.floor(R() * a.length)];
  /* ---------- the pixel world ---------- */
  const CS = 4, GW = 320, GH = 180, N = GW * GH, G = 55;
  const mat = new Uint8Array(N), hp = new Float32Array(N), heat = new Float32Array(N), col = new Uint32Array(N), stamp = new Uint32Array(N);
  const E = 0, BED = 1, DIRT = 2, BRICK = 3, CONC = 4, STEEL = 5, WOOD = 6, GLASS = 7, CORE = 8, RUB = 9, MOLT = 10, SLAG = 11, CMOLT = 12, STONE = 13, LEAD = 14;
  const rgb = (r, g, b, a = 255) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
  const unpack = c => [c & 255, (c >> 8) & 255, (c >> 16) & 255];
  const M = [];
  M[E] = { n: 'air' };
  M[BED] = { n: 'bedrock', c: [44, 36, 40], hp: 1e9, melt: 1e9, brit: 0 };
  M[DIRT] = { n: 'dirt', c: [112, 78, 48], hp: 3.2, melt: 1100, brit: .3 };
  M[BRICK] = { n: 'brick', c: [168, 82, 58], hp: 4, melt: 760, brit: .55 };
  M[CONC] = { n: 'concrete', c: [150, 150, 144], hp: 7, melt: 860, brit: .45 };
  M[STEEL] = { n: 'steel', c: [92, 108, 122], hp: 18, melt: 520, brit: .04 };
  M[WOOD] = { n: 'wood', c: [156, 108, 60], hp: 2, melt: 270, brit: .25, burns: 1 };
  M[GLASS] = { n: 'glass', c: [170, 224, 240], hp: .5, melt: 420, brit: 1, a: 170 };
  M[CORE] = { n: 'core', c: [255, 48, 80], hp: 6, melt: 330, brit: .2 };
  M[RUB] = { n: 'rubble', c: [120, 110, 100], hp: 1.5, melt: 700, brit: 1, loose: 1 };
  M[MOLT] = { n: 'molten', c: [255, 140, 40], hp: 1, melt: 1e9, brit: 1, loose: 2 };
  M[SLAG] = { n: 'slag', c: [64, 56, 54], hp: 6, melt: 700, brit: .3 };
  M[CMOLT] = { n: 'molten core', c: [255, 60, 90], hp: 1, melt: 1e9, brit: 1, loose: 2 };
  M[STONE] = { n: 'stone', c: [126, 118, 104], hp: 9, melt: 950, brit: .4 };
  M[LEAD] = { n: 'lead', c: [74, 78, 92], hp: 32, melt: 480, brit: .02 };
  const isStatic = m => m && !M[m].loose, isLiquid = m => m === MOLT || m === CMOLT;
  function tone(m, x, y, k = 1) {   // a little texture per material
    const b = M[m].c; let v = 1 + (R() - .5) * .1;
    if (m === BRICK) { const row = Math.floor(y / 3), mortar = y % 3 === 2 || (x + (row % 2) * 3) % 6 === 5; if (mortar) return rgb(196, 184, 170); v *= 1 + ((x * 7 + row * 13) % 5 - 2) * .03; }
    if (m === STEEL || m === LEAD) { if (y % 6 === 0 || x % 10 === 0) v *= .82; if (x % 10 === 2 && y % 6 === 3) v *= 1.25; }
    if (m === WOOD) { v *= x % 3 === 0 ? .82 : 1; if ((x * 31 + y * 7) % 23 === 0) v *= .7; }
    if (m === STONE) { const bx = Math.floor((x + (Math.floor(y / 5) % 2) * 4) / 8); if (y % 5 === 0 || (x + (Math.floor(y / 5) % 2) * 4) % 8 === 0) v *= .72; else v *= 1 + ((bx * 13 + Math.floor(y / 5) * 7) % 5 - 2) * .04; }
    if (m === CONC) { if (y % 8 === 0) v *= .9; }
    if (m === GLASS) { if ((x + y) % 7 < 2) v *= 1.12; }
    if (m === DIRT) { v *= 1 + (R() - .5) * .14; if (y < 2) return rgb(cl(70 * v, 0, 255), cl(128 * v, 0, 255), cl(56 * v, 0, 255)); }
    if (m === CORE) v *= 1 + (R() - .5) * .2;
    v *= k; return rgb(cl(b[0] * v, 0, 255) | 0, cl(b[1] * v, 0, 255) | 0, cl(b[2] * v, 0, 255) | 0, M[m].a || 255);
  }
  const idx = (x, y) => y * GW + x, inb = (x, y) => x >= 0 && x < GW && y >= 0 && y < GH;
  function set(x, y, m, c) { if (!inb(x, y)) return; const i = idx(x, y); mat[i] = m; hp[i] = m ? M[m].hp : 0; heat[i] = 0; col[i] = m ? (c ?? tone(m, x, y)) : 0; }
  let dirty = true, coreN = 1, coreLeft = 1;
  /* ---------- particles, shells, falling chunks ---------- */
  const parts = [], fx = [], shells = [], bodies = [], blasts = [];
  const MAXP = 4200;
  function debris(x, y, vx, vy, c, k = 0, h = 0) { if (parts.length >= MAXP) return false; parts.push({ x, y, vx, vy, c, k, h, t: 0 }); return true; }
  function smoke(x, y, n, sz = 1, c = 'rgba(70,64,60,') { for (let i = 0; i < n && fx.length < 420; i++) fx.push({ k: 's', x: x + (R() - .5) * 6 * sz, y: y + (R() - .5) * 4 * sz, vx: (R() - .5) * 8, vy: -4 - R() * 8, r: (3 + R() * 4) * sz, t: 0, l: 1.6 + R() * 1.6, c }); }
  function spark(x, y, n, sp = 60, c = '#ffd890') { for (let i = 0; i < n && fx.length < 700; i++) { const a = R() * TAU, s = R() * sp; fx.push({ k: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - sp * .3, t: 0, l: .25 + R() * .45, c }); } }
  function destroy(i, vx, vy, toRubble = false) {
    const m = mat[i]; if (!m || m === BED) return;
    const x = i % GW, y = (i / GW) | 0, c = col[i];
    mat[i] = E; hp[i] = 0; heat[i] = 0; col[i] = 0; dirty = true;
    if (m === WOOD && R() < .3) fx.push({ k: 'f', x: x + .5, y: y + .5, vx: vx * .05, vy: -6, t: 0, l: .6 + R() * .6 });
    if (m === GLASS) { if (R() < .6) debris(x + .5, y + .5, vx + (R() - .5) * 30, vy + (R() - .5) * 30, c, 2); return; }
    if (isLiquid(m)) { debris(x + .5, y + .5, vx * .6, vy * .6, c, m === CMOLT ? 3 : 1, 900); return; }
    if (toRubble || !debris(x + .5, y + .5, vx, vy, m === CORE ? rgb(255, 90, 110) : c, m === CORE ? 3 : 0, m === CORE ? 700 : 0)) { /* over the particle cap: it just crumbles away */ }
  }
  function hurt(i, d) { const m = mat[i]; if (!m || m === BED) return false; hp[i] -= d; if (hp[i] <= 0) return true; const [r, g, b] = unpack(col[i]), k = .9; col[i] = rgb(r * k | 0, g * k | 0, b * k | 0, M[m].a || 255); return false; }
  /* ---------- explosions ---------- */
  function blast(cx, cy, r, P, o = {}) {
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(GW - 1, Math.ceil(cx + r)), y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(GH - 1, Math.ceil(cy + r)), list = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const d = Math.hypot(x + .5 - cx, y + .5 - cy); if (d <= r && mat[idx(x, y)]) list.push([d, x, y]); }
    list.sort((a, b) => a[0] - b[0]);
    for (const [d, x, y] of list) {
      const i = idx(x, y), m = mat[i]; if (!m || m === BED) continue;
      // walls in between soak up the blast
      let block = 0; const steps = Math.floor(d); for (let s = 1; s < steps; s++) { const k = s / d, j = idx(Math.floor(cx + (x + .5 - cx) * k), Math.floor(cy + (y + .5 - cy) * k)); if (mat[j] && !isLiquid(mat[j])) block += Math.min(hp[j], 40); if (block > P * 2) break; }
      const eff = P * Math.pow(1 - d / r, .75) * 2.1 - block * .55;
      if (eff <= 0) continue;
      if (M[m].burns) heat[i] += eff * 60;
      if (o.heat) heat[i] += o.heat * (1 - d / r);
      if (eff >= hp[i] || (m === GLASS && eff > .1)) { const a = Math.atan2(y + .5 - cy, x + .5 - cx), s = 18 + eff * 7 + R() * 20; destroy(i, Math.cos(a) * s, Math.sin(a) * s - 10); }
      else hurt(i, eff * .6);
    }
    blasts.push({ x: cx, y: cy, P, r, t: 0 });
    for (const b of bodies) { const dx = b.x + b.w / 2 - cx, dy = b.y + b.h / 2 - cy, d = Math.hypot(dx, dy); if (d < r * 3) { b.vx += dx / (d + 1) * P * 4 / Math.sqrt(b.n * .02 + 1); b.vy += dy / (d + 1) * P * 3 / Math.sqrt(b.n * .02 + 1) - 4; } }
    fx.push({ k: 'x', x: cx, y: cy, r: r * 1.3, t: 0, l: .35 });
    smoke(cx, cy, Math.min(10, 3 + r * .5), .8 + r * .05, 'rgba(120,112,108,'); spark(cx, cy, 18 + r * 2, 40 + r * 8);
    K.shake(Math.min(24, 4 + r * 1.3)); K.noise(.35 + r * .02, Math.min(.45, .18 + r * .02), 220 + R() * 200); K.sfx(70, .3, 'sawtooth', .08, -30);
    dirty = true;
  }
  function jet(x, y, dx, dy, len, budget) {   // a shaped-charge jet: a narrow, very hot stream that drills straight on
    const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L; const px = -dy, py = dx; let last = -1, gone = 0;
    for (let s = 0; s < len && budget > 0; s += .5) {
      const cx = x + dx * s, cy = y + dy * s, i = idx(Math.floor(cx), Math.floor(cy)); if (!inb(Math.floor(cx), Math.floor(cy))) break;
      if (i !== last) { last = i; const m = mat[i]; if (m && m !== BED) { const c = Math.pow(Math.min(hp[i], 60), .72) * .55; if (budget < c) { hurt(i, budget * 1.8); heat[i] += 400; break; } budget -= c; destroy(i, dx * 90, dy * 90); gone++; for (const sd of [-1, 1]) { const j = idx(Math.floor(cx + px * sd), Math.floor(cy + py * sd)); if (inb(Math.floor(cx + px * sd), Math.floor(cy + py * sd)) && mat[j] && mat[j] !== BED) { heat[j] += 380; if (R() < .45 && budget > 1) { budget -= .4; destroy(j, dx * 60 + px * sd * 20, dy * 60 + py * sd * 20); } } } if (R() < .4) debris(cx, cy, dx * 50 + (R() - .5) * 30, dy * 50 + (R() - .5) * 30, rgb(255, 170, 80), 1, 800); } }

    }
    fx.push({ k: 'j', x, y, x2: x + dx * Math.min(len, 40 + gone), y2: y + dy * Math.min(len, 40 + gone), t: 0, l: .22 });
    K.sfx(1800, .25, 'sawtooth', .05, -1500); dirty = true;
  }
  function frag(x, y, n, budget, len) {
    for (let k = 0; k < n; k++) { const a = R() * TAU, dx = Math.cos(a), dy = Math.sin(a); let b = budget * (.6 + R() * .8); for (let s = 1; s < len && b > 0; s += .7) { const cx = Math.floor(x + dx * s), cy = Math.floor(y + dy * s); if (!inb(cx, cy)) break; const i = idx(cx, cy), m = mat[i]; if (m && m !== BED) { if (b >= hp[i]) { b -= hp[i] * .8; destroy(i, dx * 60, dy * 60); } else { hurt(i, b); b = 0; } } }
      if (fx.length < 700) fx.push({ k: 'r', x, y, x2: x + dx * len * .6, y2: y + dy * len * .6, t: 0, l: .12 }); }
  }
  /* ---------- shells ---------- */
  const PARTS = {
    casing: [
      { k: 'steel', n: 'Steel', cost: 0, mass: 1, pen: 1, spd: 1, d: 'Balanced. Does a bit of everything.' },
      { k: 'alu', n: 'Aluminium', cost: 300, mass: .65, pen: .75, spd: 1.13, d: 'Light and fast: longer range, weaker punch.' },
      { k: 'tung', n: 'Tungsten', cost: 2200, mass: 1.7, pen: 2, spd: .9, d: 'Dense and brutal. Slower, shorter range.' },
    ],
    nose: [
      { k: 'round', n: 'Round', cost: 0, pen: 1, splash: 1.15, d: 'Wide blast on the surface.' },
      { k: 'point', n: 'Pointed', cost: 200, pen: 1.6, splash: 1, d: 'Pierces brick and concrete.' },
      { k: 'ap', n: 'AP cap', cost: 1600, pen: 2.5, splash: .95, d: 'Hardened cap: goes through armour.' },
    ],
    fill: [
      { k: 'he', n: 'High explosive', cost: 0, blast: 1, d: 'A big blast. Great on brick and wood.' },
      { k: 'frag', n: 'Fragmentation', cost: 450, blast: .6, frag: 1, d: 'Smaller blast, hails shrapnel everywhere.' },
      { k: 'therm', n: 'Thermite', cost: 900, blast: .28, heat: 1, d: 'Sprays molten metal that melts what it touches.' },
      { k: 'cluster', n: 'Cluster', cost: 1500, blast: .35, cluster: 1, d: 'Splits into six bomblets on impact.' },
      { k: 'none', n: 'Inert slug', cost: 0, blast: 0, d: 'No explosive: pure kinetic punch.' },
    ],
    liner: [
      { k: 'none', n: 'No liner', cost: 0, jet: 0, d: 'Nothing in front of the charge.' },
      { k: 'cu', n: 'Copper cone', cost: 800, jet: 1, d: 'Shaped charge: a jet that drills through steel.' },
      { k: 'ta', n: 'Tantalum cone', cost: 2800, jet: 1.8, d: 'A longer, hotter jet.' },
    ],
    fuse: [
      { k: 'impact', n: 'Impact', cost: 0, delay: 0, d: 'Goes off the moment it hits something solid.' },
      { k: 'short', n: 'Short delay', cost: 250, delay: 5, d: 'Punches in a little, then goes off.' },
      { k: 'long', n: 'Long delay', cost: 700, delay: 14, d: 'Buries itself deep before it goes off.' },
      { k: 'air', n: 'Proximity', cost: 600, air: 1, d: 'Goes off just before it touches anything.' },
    ],
  };
  const PK = ['casing', 'nose', 'fill', 'liner', 'fuse'], PNAME = { casing: 'CASING', nose: 'NOSE', fill: 'EXPLOSIVE FILL', liner: 'LINER', fuse: 'FUSE' };
  const part = (cat, k) => PARTS[cat].find(p => p.k === k) || PARTS[cat][0];

/* Pulsebox game kit: canvas scaling, input, menus, skins shop, coins, best score, sound and effects.
   A game defines GAME before this runs: { id, title, tagline, how:[], bg, skins:[{name,price,c:[]}],
   reset(), update(dt), draw(g), down(x,y), move(x,y), up(x,y), key(code,isDown), bot(dt), drawSkin(g,skin,size) }.
   Everything is in a 1280x720 world; K.view is the visible part of it (it can be wider or taller on odd screens).
   ?demo plays the bot forever with no menus (used to record trailers). */
'use strict';
const $ = id => document.getElementById(id);
const DEMO = /[?&]demo/.test(location.search), POSE = /[?&]pose/.test(location.search) && GAME.pose;  // ?demo&pose freezes a staged scene for cover art
const cv = $('cv'), g = cv.getContext('2d');
const K = {
  W, H, t: 0, state: 'title', score: 0, runCoins: 0, bot: true, view: { x0: 0, y0: 0, x1: W, y1: H },
  rand: (a, b) => a + Math.random() * (b - a),
  irand: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
};
document.documentElement.style.setProperty('--accent', GAME.accent || '#c6ff3d');
document.documentElement.style.setProperty('--accent2', GAME.accent2 || '#29e0ff');
document.documentElement.style.setProperty('--bg', GAME.bg || '#0a0c12');
if (GAME.font) document.documentElement.style.setProperty('--display', `'${GAME.font}', 'Arial Black', system-ui, sans-serif`);
if (DEMO) document.body.classList.add('demo');

/* ---------- save ---------- */
const SKEY = 'pbx-' + GAME.id;
const save = { best: 0, coins: 0, owned: [0], skin: 0, plays: 0, mute: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} };
K.save = save; K.persist = persist;
Object.defineProperty(K, 'skin', { get: () => GAME.skins[DEMO || K.bot ? (K.demoSkin || 0) : save.skin] || GAME.skins[0] });

/* ---------- screen ---------- */
let sc = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  sc = Math.min(innerWidth / W, innerHeight / H); ox = (innerWidth - W * sc) / 2; oy = (innerHeight - H * sc) / 2;
  K.view = { x0: -ox / sc, y0: -oy / sc, x1: W + ox / sc, y1: H + oy / sc };
}
addEventListener('resize', resize); resize();

/* ---------- sound ---------- */
let ac = null;
// every sound goes through K.master, which is silent on menus, while paused and when muted, so games can run looping sounds
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); K.ac = ac; K.master = ac.createGain(); K.master.gain.value = 0; K.master.connect(ac.destination); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume(); return ac;
}
K.audio = audio;
let masterOn = false;
function masterSync() {
  const on = !!ac && !save.mute && (K.state === 'play' || K.state === 'over') && !K.bot;
  if (ac && on !== masterOn) { masterOn = on; K.master.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, .05); }
}
K.sfx = (f = 440, d = .1, type = 'square', v = .12, slide = 0, delay = 0) => {
  if (save.mute || K.bot || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), a = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(a).connect(K.master); o.start(t); o.stop(t + d + .02);
};
K.noise = (d = .15, v = .15, hp = 800) => {
  if (save.mute || K.bot || !ac) return;
  const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), a = ac.createGain();
  f.type = 'highpass'; f.frequency.value = hp; a.gain.value = v; s.buffer = b; s.connect(f).connect(a).connect(K.master); s.start();
};
K.chime = (base = 523, steps = [0, 4, 7, 12]) => steps.forEach((s, i) => K.sfx(base * Math.pow(2, s / 12), .16, 'triangle', .1, 0, i * .07));

/* ---------- effects ---------- */
const parts = [], pops = [];
let shake = 0, flashA = 0, flashC = '#fff';
K.burst = (x, y, c, n = 14, sp = 320, o = {}) => {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * s + (o.vx || 0), vy: Math.sin(a) * s + (o.vy || 0), life: 0, max: (o.life || .6) * (.6 + Math.random() * .6), c: Array.isArray(c) ? K.pick(c) : c, s: (o.size || 7) * (.5 + Math.random()), gr: o.gravity ?? 600, sq: o.square });
  }
};
K.pop = (x, y, text, c = '#fff', size = 34) => pops.push({ x, y, text, c, size, life: 0 });
K.shake = a => { shake = Math.max(shake, a); };
K.flash = (c = '#fff', a = .5) => { flashC = c; flashA = a; };
K.toast = text => { if (K.bot) return; const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); };
function fx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; } p.vy += p.gr * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.life += dt; p.y -= 60 * dt; if (p.life > .9) pops.splice(i, 1); }
  shake = Math.max(0, shake - 60 * dt); flashA = Math.max(0, flashA - 2.5 * dt);
}
function drawFx() {
  for (const p of parts) { g.globalAlpha = 1 - p.life / p.max; g.fillStyle = p.c; if (p.sq) g.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); else { g.beginPath(); g.arc(p.x, p.y, p.s / 2, 0, 7); g.fill(); } }
  g.globalAlpha = 1; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.life < .12 ? p.life / .12 : 1; g.globalAlpha = p.life > .6 ? 1 - (p.life - .6) / .3 : 1;
    g.font = `${Math.round(p.size * (0.6 + .4 * k))}px ${getComputedStyle(document.documentElement).getPropertyValue('--display')}`;
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.45)'; g.strokeText(p.text, p.x, p.y); g.fillStyle = p.c; g.fillText(p.text, p.x, p.y);
  }
  g.globalAlpha = 1;
}

  <h2 class="title" id="oTitle" style="font-size:40px" hidden></h2><p class="sub" id="oText" hidden></p><p class="sub" style="margin:0" id="oLabel">Score</p><div class="score-big" id="oScore">0</div><div id="oNew" class="newbest" hidden>New best!</div>
  <div class="stats"><span class="stat"><small>Best</small><b id="oBest">0</b></span><span class="stat">+${coinHTML}<b id="oCoins">0</b></span></div>
  <button class="big" id="bAgain">Play again</button>
  <div class="row"><button id="bMenu">Menu</button><button id="bSkins2">Skins</button></div>
  <p class="hint" id="oHint"></p>
</div></div>
<div class="scr" id="sSkins" hidden><div class="card">
  <h2 class="title" style="font-size:40px">Skins</h2>
  <div class="stats"><span class="stat">${coinHTML}<b id="kCoins">0</b></span></div>
  <div class="skins" id="kGrid"></div>
  <button class="big" id="bBack">Back</button>
</div></div>
<div class="scr" id="sPause" hidden><div class="card">
  <h2 class="title" style="font-size:44px">Paused</h2>
  <button class="big" id="bResume">Resume</button>
  <div class="row"><button id="bQuit">Menu</button></div>
</div></div>
<button class="mute" id="bMute" aria-label="Sound on or off"></button>`);

const screens = ['sTitle', 'sOver', 'sSkins', 'sPause'];
let skinsFrom = 'sTitle';
function showScr(id) { screens.forEach(s => $(s).hidden = s !== id || DEMO); }
function refresh() {
  $('tBest').textContent = save.best; $('tCoins').textContent = save.coins; $('kCoins').textContent = save.coins;
  $('bMute').textContent = save.mute ? '🔇' : '🔊';
}
function hud() { $('hScore').textContent = K.score; $('hCoins').textContent = K.runCoins; }
K.add = (n = 1, x, y, c) => {
  K.score += n; hud();
  if (!K.bot) { const s = $('hScore'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  if (x !== undefined) K.pop(x, y, '+' + n, c || '#fff');
};
K.coin = (n = 1, x, y) => {
  K.runCoins += n; hud();
  if (x !== undefined) K.burst(x, y, ['#ffcf2e', '#fff3a8'], 6, 200, { life: .4, size: 6, gravity: 300 });
  K.sfx(1320, .07, 'square', .05); K.sfx(1760, .08, 'square', .05, 0, .05);
};

function buildSkins() {
  const grid = $('kGrid'); grid.innerHTML = '';
  GAME.skins.forEach((s, i) => {
    const own = save.owned.includes(i), b = document.createElement('button');
    b.className = 'skin' + (save.skin === i ? ' on' : '') + (own ? '' : ' locked') + (!own && save.coins < s.price ? ' cant' : '');
    const c = document.createElement('canvas'); c.width = c.height = 112; const cg = c.getContext('2d'); cg.translate(56, 56);
    if (GAME.drawSkin) GAME.drawSkin(cg, s, 40); else { cg.fillStyle = s.c[0]; cg.beginPath(); cg.arc(0, 0, 40, 0, 7); cg.fill(); }
    if (!own) { cg.fillStyle = 'rgba(0,0,0,.45)'; cg.fillRect(-56, -56, 112, 112); }
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${s.name}</span>${own ? (save.skin === i ? '<span class="price">Equipped</span>' : '<span class="price" style="color:#cfd5ef">Equip</span>') : `<span class="price">${coinHTML}${s.price}</span>`}`);
    b.onclick = () => {
      audio();
      if (own) { save.skin = i; K.sfx(660, .08, 'triangle'); }
      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(i); save.skin = i; K.chime(660); }
      else { K.sfx(160, .15, 'sawtooth', .08); return; }
      persist(); refresh(); buildSkins();
    };
    grid.appendChild(b);
  });
}

/* ---------- flow ---------- */
let overAt = 0, botOverAt = 0;
function start() {
  audio(); K.bot = false; K.score = 0; K.runCoins = 0; hud(); parts.length = 0; pops.length = 0;
  GAME.reset(); K.state = 'play'; showScr(null); $('hud').hidden = false; save.plays++; persist();
}
function attract() { K.bot = true; K.demoSkin = DEMO ? 0 : K.irand(0, GAME.skins.length - 1); K.score = 0; K.runCoins = 0; hud(); GAME.reset(); if (POSE) GAME.pose(); K.state = 'title'; $('hud').hidden = !DEMO; }
K.over = (o = {}) => {
  if (K.bot) { if (!botOverAt) botOverAt = K.t + 1.2; return; }
  if (K.state !== 'play') return;
  K.state = 'over'; overAt = performance.now();
  const best = K.score > save.best; if (best) save.best = K.score;
  save.coins += K.runCoins; persist(); refresh();
  $('oTitle').hidden = !o.title; $('oTitle').textContent = o.title || ''; $('oText').hidden = !o.text; $('oText').textContent = o.text || ''; $('oLabel').textContent = GAME.scoreLabel || 'Score';
  $('oScore').textContent = K.score; $('oBest').textContent = save.best; $('oCoins').textContent = K.runCoins; $('oNew').hidden = !best || K.score === 0;
  const next = GAME.skins.map((s, i) => [s, i]).find(([s, i]) => !save.owned.includes(i));
  $('oHint').textContent = next ? (save.coins >= next[0].price ? `You can unlock ${next[0].name} now!` : `${next[0].price - save.coins} more coins to unlock ${next[0].name}`) : 'You own every skin. Legend!';
  if (GAME.noSkins) $('oHint').textContent = '';
  setTimeout(() => { if (K.state === 'over') { showScr('sOver'); $('hud').hidden = true; } }, o.delay ?? 650);
  if (best && K.score > 0) setTimeout(() => K.chime(523, [0, 4, 7, 12, 16]), 700);
  // tell the Pulsebox hub (when it hosts this game) about the score: profiles, leaderboards and the daily challenge
  try { if (K.score > 0 && window.parent !== window) window.parent.postMessage({ pbx: 'score', score: Math.floor(K.score) }, location.origin); } catch (e) {}
};
function pause() { if (K.state !== 'play') return; K.state = 'paused'; showScr('sPause'); }
function resume() { K.state = 'play'; showScr(null); last = performance.now(); }
function toMenu() { refresh(); attract(); showScr('sTitle'); }

$('bPlay').onclick = start; $('bAgain').onclick = start; $('bResume').onclick = resume;
$('bMenu').onclick = toMenu; $('bQuit').onclick = toMenu;
$('bSkins').onclick = () => { skinsFrom = 'sTitle'; buildSkins(); refresh(); showScr('sSkins'); };
$('bSkins2').onclick = () => { skinsFrom = 'sOver'; buildSkins(); refresh(); showScr('sSkins'); };
$('bBack').onclick = () => { if (skinsFrom === 'sOver') toMenu(); else showScr('sTitle'); };
$('hPause').onclick = pause;
$('bMute').onclick = () => { save.mute = !save.mute; persist(); refresh(); audio(); };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
const toW = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener('pointerdown', e => { audio(); if (K.state === 'play' && GAME.down) { const [x, y] = toW(e); GAME.down(x, y, e); } });
addEventListener('pointermove', e => { if (K.state === 'play' && GAME.move) { const [x, y] = toW(e); GAME.move(x, y, e); } });
addEventListener('pointerup', e => { if (K.state === 'play' && GAME.up) { const [x, y] = toW(e); GAME.up(x, y, e); } });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat && K.state !== 'play') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (K.state === 'play') pause(); else if (K.state === 'paused') resume(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && K.state !== 'play') {
    if (K.state === 'title' && !$('sTitle').hidden) start();
    else if (K.state === 'over' && performance.now() - overAt > 900) start();
    else if (K.state === 'paused') resume();
    return;
  }
  if (K.state === 'play' && GAME.key) GAME.key(e.code, true);
});
addEventListener('keyup', e => { if (K.state === 'play' && GAME.key) GAME.key(e.code, false); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const run = K.state === 'play' || K.state === 'title' || K.state === 'over';
  if (run && !POSE) {
    K.t += dt;
    if (K.bot && K.state === 'title') { if (botOverAt && K.t > botOverAt) { botOverAt = 0; attract(); } else if (!botOverAt && GAME.bot) GAME.bot(dt); }
    GAME.update(dt); fx(dt);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = GAME.bg || '#000'; g.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx * sc), dpr * (oy + sy * sc));
  GAME.draw(g); drawFx();
  if (flashA > 0) { g.globalAlpha = flashA; g.fillStyle = flashC; g.fillRect(K.view.x0, K.view.y0, K.view.x1 - K.view.x0, K.view.y1 - K.view.y0); g.globalAlpha = 1; }
  masterSync();
  requestAnimationFrame(frame);
}
if (GAME.noSkins) { $('bSkins').parentNode.hidden = true; $('bSkins2').hidden = true; }
if (GAME.noHud) { $('hScore').hidden = true; document.querySelector('.hud-coins').hidden = true; }
refresh(); attract(); showScr('sTitle');
requestAnimationFrame(frame);
</script>
</body>
</html>
