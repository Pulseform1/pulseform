<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Bowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { color-scheme: dark; --accent: #c6ff3d; --accent2: #29e0ff; --bg: #0a0c12; --text: #f3f5ff; --muted: #a3a9c4; --panel: rgba(10,12,22,.86); --edge: rgba(255,255,255,.14); --display: 'Lilita One', 'Arial Black', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hud-score { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vh, 56px); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); letter-spacing: .02em; }
.hud-score.bump { animation: bump .18s ease-out; }
@keyframes bump { 40% { transform: translateX(-50%) scale(1.18); } }
.hud-coins { position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 3.2vh, 24px); background: rgba(0,0,0,.35); padding: 4px 12px 4px 8px; border-radius: 999px; }
.coin-i { width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcf2e 45%, #c98a00); box-shadow: 0 0 8px rgba(255,207,46,.6); display: inline-block; flex: none; }
.hud-pause { position: absolute; top: 10px; left: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,.35); pointer-events: auto; display: grid; place-items: center; }
.hud-pause::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

/* screens */
.scr { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.65)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vh, 28px) 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.title { font-family: var(--display); font-size: clamp(36px, 9vh, 64px); line-height: .95; margin: 0 0 6px; color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .01em; }
.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 15px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.07); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.stat small { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.big { display: block; width: 100%; font-family: var(--display); font-size: clamp(22px, 5vh, 30px); padding: 12px 18px; border-radius: 18px; background: var(--accent); color: #0b0d14; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.big:hover { transform: translateY(-2px); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.row button { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
.row button:hover { background: rgba(255,255,255,.14); }
.how { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
.score-big { font-family: var(--display); font-size: clamp(54px, 14vh, 96px); line-height: 1; margin: 4px 0; }
.newbest { display: inline-block; font-family: var(--display); background: var(--accent2); color: #0b0d14; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* skins */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 6px 0 14px; }
.skin { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.skin.on { border-color: var(--accent); background: rgba(255,255,255,.12); }
.skin.locked { opacity: .9; }
.skin canvas { width: 56px; height: 56px; }
.skin .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffe07a; }
.skin.cant .price { color: #ff8a8a; }

.mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid var(--edge); font-size: 18px; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vh, 38px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 20px var(--accent); pointer-events: none; animation: toast 1.4s ease-out forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
body.demo .hud-pause, body.demo .mute { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const W = 1280, H = 720;  // the game world; the kit scales it to fit the screen
/* Pocket Bowl: retro arcade football with a team to run between games. On the field you only play offense: call PASS or
   RUN, then drag back to aim a throw (or just tap a receiver), steer whoever has the ball and tap to juke. The other
   team's drives are simulated against your defense. Between games, spend coaching credits on your roster. Ten-game
   season, then the top four play off for the Pocket Bowl. The team and roster carry over from season to season. */
const GAME = {
  id: 'pocket-bowl', title: 'Pocket Bowl', tagline: 'Retro football. Run the team, win the Bowl.',
  font: 'Press Start 2P', accent: '#ffd23f', accent2: '#3ddc84', bg: '#0b2a16', noSkins: true, noHud: true, scoreLabel: 'Season score',
  how: ['PASS: drag back from anywhere and release to throw, or tap a receiver. Keys 1, 2, 3 throw to WR1, WR2 and the running back.', 'With the ball: steer with your finger, mouse or the up/down arrows. Tap or press Space to juke.', 'Between games, spend coaching credits to upgrade players. Win your division and take the Pocket Bowl.'],
  skins: [{ name: 'Classic', price: 0 }],
};
(() => {
  const PX = '"Press Start 2P", monospace', BODY = '800 17px Nunito, system-ui, sans-serif';
  const TEAMS = [
    ['Pixel City', 'Pilots', '#ff6a1a', '#1a1a2a'], ['Neon Bay', 'Sharks', '#29e0ff', '#0a1a2a'], ['Route 9', 'Rattlers', '#9cff3a', '#14240a'], ['Starlite', 'Comets', '#ffd23f', '#2a1a0a'],
    ['Pinewood', 'Owls', '#a56bff', '#1a0a2a'], ['Harbor', 'Hammers', '#e8e8e8', '#2a2a30'], ['Desert', 'Dusters', '#e0a060', '#2a160a'], ['Midnight', 'Moose', '#4a7aff', '#0a0e24'],
  ].map(([city, nick, c, c2], i) => ({ i, city, nick, c, c2, ab: (city[0] + nick[0] + nick[1]).toUpperCase() }));
  const POS = [['QB', 'Arm & accuracy'], ['RB', 'Speed & power'], ['WR1', 'Speed & hands'], ['WR2', 'Speed & hands'], ['OL', 'Time to throw'], ['DEF', 'Stops their drives'], ['K', 'Kicking']];
  const FN = ['Ace', 'Buck', 'Cash', 'Dex', 'Eli', 'Flash', 'Gus', 'Hank', 'Ike', 'Jett', 'Kip', 'Lou', 'Max', 'Nate', 'Odie', 'Pete', 'Quinn', 'Rex', 'Sam', 'Tex', 'Vic', 'Wes', 'Zeke', 'Bo', 'Cy', 'Duke'];
  const LN = ['Blaze', 'Stone', 'Rivers', 'Hart', 'Cobb', 'Dash', 'Fox', 'Gale', 'Hawk', 'Irons', 'Jackson', 'King', 'Lane', 'Moon', 'Nash', 'Orr', 'Pike', 'Rush', 'Steel', 'Tate', 'Vance', 'Wolfe', 'York', 'Booker'];
  const NEWS = ['Fans line up at dawn for tickets.', 'Local diner names a burger after your QB.', 'Rival coach calls your offense "cute". Prove him wrong.', 'Your kicker has been practicing in the parking lot.', 'The marching band learned a new song. It is the same song, louder.', 'Sports radio: "This team is for real."', 'Your running back ate eleven pancakes. Coach approves.'];
  // field: x is yards from your own goal line (0) to theirs (100), y is yards across (0..53)
  const YX = 24, YY = 8.6, FY = 132, FW = 53.3;
  const sx = x => (x - cam) * YX, sy = y => FY + y * YY;
  const ROUTES = {
    go: [[30, 0]], slant: [[4, 0], [18, -9]], out: [[9, 0], [9, 9]], curl: [[12, 0], [9, 0]], post: [[11, 0], [26, -11]], corner: [[11, 0], [24, 11]], drag: [[3, 0], [5, -22]],
  };
  const RBR = { flat: [[1, 6], [9, 12]], swing: [[-2, 5], [6, 12]], wheel: [[1, 6], [7, 9], [26, 10]] };
  let S, cam = 0, P, mode, ptr = null, keys = {}, msg = null, kick = null, anim = 0, hover = null, botT = 0, posed = false, oppAnim = null, endCard = null;
  const R = Math.random, rnd = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)], clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const pname = () => pick(FN) + ' ' + pick(LN);

  /* ---------- the franchise: saved between sessions ---------- */
  function newRoster() { return POS.map(([p], i) => ({ p, name: pname(), st: i === 0 || i === 5 ? 2 : 1 + (R() < .4 ? 1 : 0), num: [12, 28, 81, 17, 66, 54, 3][i] })); }
  function newSeason(F) {
    F.week = 0; F.season = (F.season || 0) + 1; F.games = []; F.playoff = 0;
    F.rec = TEAMS.map(() => ({ w: 0, l: 0 }));
    F.opp = TEAMS.map((t, i) => i === F.team ? 0 : clamp(1.6 + ((i * 7 + F.season * 3) % 8) * .38 + F.season * .15, 1.5, 5));
    const others = TEAMS.map(t => t.i).filter(i => i !== F.team); F.sched = [];
    for (let w = 0; w < 10; w++) F.sched.push(others[(w + F.season) % others.length]);
    F.news = pick(NEWS);
  }
  // the demo behind the title screen and the cover pose play with a throwaway team, never the player's saved one
  function tempF() { const F = { team: 0, roster: newRoster(), credits: 3, season: 0, picked: true, titles: 0 }; newSeason(F); return F; }
  function franchise() {
    let F = K.save.pb;
    if (!F || !F.roster) { F = K.save.pb = { team: 0, roster: newRoster(), credits: 3, season: 0, picked: false, titles: 0 }; newSeason(F); }
    return F;
  }
  const star = p => S.F.roster.find(r => r.p === p).st;
  const oppTeam = () => TEAMS[S.oppI];
  const myTeam = () => TEAMS[S.F.team];

  /* ---------- sound ---------- */
  const whistle = () => { K.sfx(2400, .18, 'sine', .07, 120); K.sfx(2600, .12, 'sine', .05, 0, .2); };
  const thud = () => { K.sfx(90, .18, 'triangle', .2, -40); K.sfx(160, .06, 'square', .05); };
  const crowd = (d = 1.6, v = .08) => { if (!K.ac || K.bot || K.save.mute) return; const ac = K.ac, n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (R() * 2 - 1) * Math.sin(Math.PI * i / n); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .6; g.gain.value = v; s.buffer = b; s.connect(f).connect(g).connect(K.master); s.start(); };

  /* ---------- a game ---------- */
  function startGame() {
    const F = S.F; S.oppI = F.playoff ? S.oppI : F.sched[F.week];
    S.g = { us: 0, them: 0, poss: 0, maxPoss: 8, ot: false, stats: { pass: 0, rush: 0, td: 0, int: 0 } };
    mode = 'field'; msg = null; kick = null; oppAnim = null; endCard = null;
    driveStart(25); crowd(1.2, .05);
  }
  function driveStart(at) { S.d = { ball: at, down: 1, togo: 10, first: Math.min(100, at + 10) }; presnap(); }
  function quarter() { const g = S.g; return g.ot ? 'OT' : 'Q' + Math.min(4, 1 + Math.floor(g.poss / 2)); }
  function mk(team, role, x, y, o = {}) { return { team, role, x, y, vx: 0, vy: 0, ...o }; }
  function presnap() {
    mode = 'field'; const d = S.d, L = d.ball, mid = FW / 2;
    const combos = [['go', 'slant'], ['post', 'curl'], ['out', 'go'], ['slant', 'corner'], ['curl', 'drag'], ['corner', 'post'], ['drag', 'go']], cmb = pick(combos);
    const ws1 = 6.3 + star('WR1') * .45, ws2 = 6.2 + star('WR2') * .45, def = S.F.opp[S.oppI] || 2;
    P = {
      phase: 'call', t: 0, L, ball: null, carrier: null, thrown: false, play: null, gain: 0, result: null,
      off: [mk('o', 'QB', L - 1.5, mid), mk('o', 'WR1', L - .5, mid - 19, { route: ROUTES[cmb[0]], rname: cmb[0], sp: ws1, side: -1 }), mk('o', 'WR2', L - .5, mid + 19, { route: ROUTES[cmb[1]], rname: cmb[1], sp: ws2, side: 1 }),
        mk('o', 'RB', L - 6, mid + 1.5, { route: RBR[pick(Object.keys(RBR))], sp: 5.6 + star('RB') * .45, side: 1 }), mk('o', 'OL', L - .4, mid - 2.4), mk('o', 'OL', L - .4, mid), mk('o', 'OL', L - .4, mid + 2.4)],
      def: [mk('d', 'CB', L + 6, mid - 19, { cover: 1 }), mk('d', 'CB', L + 6, mid + 19, { cover: 2 }), mk('d', 'S', L + 15, mid, {}), mk('d', 'LB', L + 5, mid + 3, { cover: 3 }),
        mk('d', 'DL', L + .6, mid - 1.6), mk('d', 'DL', L + .6, mid + 1.6)],
      hold: 2.3 + star('OL') * .5 - def * .2, dsp: 5.1 + def * .33, react: .7 - def * .06,
    };
    P.def.forEach(p => p.sp = P.dsp * (p.role === 'DL' ? .78 : p.role === 'S' ? 1.02 : 1));
    P.off.forEach(p => { p.x0 = p.x; p.y0 = p.y; p.wi = 0; });
    cam = L - 14;
  }
  const qb = () => P.off[0];
  function snap(kind) {
    if (!P || P.phase !== 'call') return;
    P.play = kind; P.phase = 'live'; P.t = 0; whistle();
    if (kind === 'run') { P.off[3].route = [[3, -1.5], [30, -1.5]]; }
  }
  // a throw: target point, flight time from distance, a little error from the QB's accuracy
  function throwAt(tx, ty) {
    if (!P || P.phase !== 'live' || P.play !== 'pass' || P.thrown || P.carrier) return;
    const q = qb(), arm = 22 + star('QB') * 6, dx = tx - q.x, dy = ty - q.y, d = Math.hypot(dx, dy);
    if (d < 3) return;
    const k = Math.min(1, arm / d); tx = q.x + dx * k; ty = q.y + dy * k;
    const err = (1.25 - star('QB') * .17) * Math.min(d, arm) * .045;
    tx += rnd(-err, err); ty = clamp(ty + rnd(-err, err), .5, FW - .5);
    const dist = Math.hypot(tx - q.x, ty - q.y);
    P.ball = { x0: q.x, y0: q.y, tx, ty, t: 0, T: .32 + dist / (20 + star('QB') * 2.2) }; P.thrown = true; P.throwFrom = q.x;
    K.sfx(500, .08, 'square', .06, 300);
  }
  // tap a receiver: lead them by where they will be when the ball arrives
  function throwTo(p) {
    const q = qb(), d = Math.hypot(p.x - q.x, p.y - q.y), T = .32 + d / (20 + star('QB') * 2.2);
    throwAt(p.x + p.vx * T * 1.05, p.y + p.vy * T * 1.05);
  }
  const near = (list, x, y) => list.reduce((b, p) => { const d = Math.hypot(p.x - x, p.y - y); return d < b.d ? { p, d } : b; }, { p: null, d: 1e9 });
  function land() {
    const b = P.ball, rec = near(P.off.slice(1, 4), b.tx, b.ty), df = near(P.def, b.tx, b.ty), hands = rec.p ? star(rec.p.role === 'RB' ? 'RB' : rec.p.role) : 1;
    P.ball = null;
    if (df.d < 1 && (!rec.p || df.d < rec.d - .3) && R() < .4) { S.g.stats.int++; return endPlay('INTERCEPTED!', 'int'); }
    if (rec.p && rec.d < 1.6 + hands * .16) {
      if (df.d < .9 && R() < .26 - hands * .04) return endPlay('BROKEN UP', 'inc');
      rec.p.x = b.tx; rec.p.y = b.ty; P.carrier = rec.p; P.caught = true; K.sfx(880, .07, 'square', .06); K.sfx(1320, .07, 'square', .05, 0, .07);
      say(pick(['CAUGHT!', 'GOT IT!', 'NICE GRAB!']), 1); return;
    }
    endPlay('INCOMPLETE', 'inc');
  }
  function say(t, d = 1.4, c = '#fff') { msg = { t, d, k: 0, c }; }
  function endPlay(text, kind) {
    if (P.phase === 'over') return;
    P.phase = 'over'; P.t = 0; P.result = { text, kind };
    const d = S.d, spot = P.carrier ? P.carrier.x : kind === 'sack' ? qb().x : d.ball;
    if (kind === 'td') { S.g.stats.td++; K.add(70, 640, 300, '#ffd23f'); K.coin(2); K.chime(523, [0, 4, 7, 12, 16]); crowd(2.4, .1); K.shake(10); K.burst(sx(100), sy(FW / 2), ['#ffd23f', '#fff', myTeam().c], 40, 520); }
    else if (kind === 'int') { K.sfx(140, .5, 'sawtooth', .08, -60); K.shake(6); }
    else if (kind === 'tackle' || kind === 'sack' || kind === 'out') { const g = Math.round(spot - d.ball); P.gain = g; if (P.caught || P.play === 'run') S.g.stats[P.play === 'run' && !P.caught ? 'rush' : 'pass'] += g; thud(); }
    if (kind === 'tackle' || kind === 'out' || kind === 'sack') {
      d.ball = clamp(spot, 1, 99); d.togo = d.first - d.ball;
      if (d.ball >= d.first) { P.result.text += '  ·  FIRST DOWN!'; P.result.first = true; }
    }
  }
  // after the result card: next down, a kick, or the end of the drive
  function afterPlay() {
    const d = S.d, r = P.result;
    if (r.kind === 'td') return startKick('xp', 2);
    if (r.kind === 'int') return driveOver('int', d.ball);
    if (r.first) { d.down = 1; d.first = Math.min(100, d.ball + 10); d.togo = d.first - d.ball; return presnap(); }
    if (r.kind === 'inc') d.togo = d.first - d.ball;
    if (d.down >= 4) return driveOver('downs', d.ball);
    d.down++; presnap();
  }
  function fgRange() { return 100 - S.d.ball + 17 <= 54; }
  function fourth(choice) {
    if (choice === 'punt') return driveOver('punt', S.d.ball);
    if (choice === 'fg') return startKick('fg', 100 - S.d.ball + 17);
  }
  // kicking: a needle sweeps across the bar; stop it in the green
  function startKick(kind, yards) {
    const ks = star('K'), w = kind === 'xp' ? .3 + ks * .03 : clamp(.32 - (yards - 20) * .006 + ks * .035, .07, .34);
    mode = 'kick'; kick = { kind, yards, w, c: rnd(.35, .65), n: 0, dir: 1, sp: .9 + yards * .012, done: false, t: 0 };
  }
  function kickNow() {
    if (!kick || kick.done) return;
    kick.done = true; kick.t = 0; kick.good = Math.abs(kick.n - kick.c) <= kick.w / 2;
    K.sfx(180, .1, 'square', .12); if (kick.good) { K.chime(659, [0, 7, 12]); crowd(1.4, .07); } else K.sfx(220, .4, 'triangle', .08, -120);
  }
  function kickDone() {
    const k = kick; kick = null;
    if (k.kind === 'xp') { S.g.us += 6 + (k.good ? 1 : 0); return driveOver('score', 0); }
    if (k.good) { S.g.us += 3; K.add(30); return driveOver('score', 0); }
    driveOver('fgmiss', S.d.ball);
  }
  // their drive, simulated against your defense; where it starts depends on how yours ended
  function driveOver(how, spot) {
    const g = S.g; g.poss++;
    const def = star('DEF'), opp = S.F.opp[S.oppI] || 2, give = how === 'int' || how === 'downs' ? clamp((100 - spot) / 100, .1, .9) : how === 'punt' ? .15 : how === 'fgmiss' ? .3 : 0;
    const pTD = clamp(.24 + (opp - def) * .07 + give * .3, .05, .8), pFG = .2;
    const r = R(), res = r < pTD ? 'td' : r < pTD + pFG ? 'fg' : R() < .7 ? 'punt' : 'turnover';
    const pts = res === 'td' ? 7 : res === 'fg' ? 3 : 0, start = how === 'int' || how === 'downs' ? 100 - spot : res === 'turnover' ? rnd(40, 60) : res === 'punt' ? rnd(18, 34) : 25;
    g.poss++;
    oppAnim = { res, pts, t: 0, from: how, start: Math.round(clamp(start, 5, 60)), after: Math.round(clamp(start, 5, 60)) };
    mode = 'opp';
  }
  function oppDone() {
    const a = oppAnim; oppAnim = null; S.g.them += a.pts;

  if (save.mute || K.bot || !ac) return;
  const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), a = ac.createGain();
  f.type = 'highpass'; f.frequency.value = hp; a.gain.value = v; s.buffer = b; s.connect(f).connect(a).connect(K.master); s.start();
};
K.chime = (base = 523, steps = [0, 4, 7, 12]) => steps.forEach((s, i) => K.sfx(base * Math.pow(2, s / 12), .16, 'triangle', .1, 0, i * .07));

/* ---------- effects ---------- */
const parts = [], pops = [];
let shake = 0, flashA = 0, flashC = '#fff';
K.burst = (x, y, c, n = 14, sp = 320, o = {}) => {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * s + (o.vx || 0), vy: Math.sin(a) * s + (o.vy || 0), life: 0, max: (o.life || .6) * (.6 + Math.random() * .6), c: Array.isArray(c) ? K.pick(c) : c, s: (o.size || 7) * (.5 + Math.random()), gr: o.gravity ?? 600, sq: o.square });
  }
};
K.pop = (x, y, text, c = '#fff', size = 34) => pops.push({ x, y, text, c, size, life: 0 });
K.shake = a => { shake = Math.max(shake, a); };
K.flash = (c = '#fff', a = .5) => { flashC = c; flashA = a; };
K.toast = text => { if (K.bot) return; const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); };
function fx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; } p.vy += p.gr * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.life += dt; p.y -= 60 * dt; if (p.life > .9) pops.splice(i, 1); }
  shake = Math.max(0, shake - 60 * dt); flashA = Math.max(0, flashA - 2.5 * dt);
}
function drawFx() {
  for (const p of parts) { g.globalAlpha = 1 - p.life / p.max; g.fillStyle = p.c; if (p.sq) g.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); else { g.beginPath(); g.arc(p.x, p.y, p.s / 2, 0, 7); g.fill(); } }
  g.globalAlpha = 1; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.life < .12 ? p.life / .12 : 1; g.globalAlpha = p.life > .6 ? 1 - (p.life - .6) / .3 : 1;
    g.font = `${Math.round(p.size * (0.6 + .4 * k))}px ${getComputedStyle(document.documentElement).getPropertyValue('--display')}`;
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.45)'; g.strokeText(p.text, p.x, p.y); g.fillStyle = p.c; g.fillText(p.text, p.x, p.y);
  }
  g.globalAlpha = 1;
}

/* ---------- UI ---------- */
const coinHTML = '<i class="coin-i"></i>';
document.body.insertAdjacentHTML('beforeend', `
<div class="hud" id="hud" hidden><div class="hud-score" id="hScore">0</div><div class="hud-coins">${coinHTML}<span id="hCoins">0</span></div><button class="hud-pause" id="hPause" aria-label="Pause"></button></div>
<div class="scr" id="sTitle" ${DEMO ? 'hidden' : ''}><div class="card">
  <h1 class="title">${GAME.title}</h1><p class="sub">${GAME.tagline}</p>
  <div class="stats"><span class="stat"><small>Best</small><b id="tBest">0</b></span><span class="stat">${coinHTML}<b id="tCoins">0</b></span></div>
  <button class="big" id="bPlay">Play</button>
  <div class="row"><button id="bSkins">Skins</button></div>
  <ul class="how">${GAME.how.map(h => `<li>${h}</li>`).join('')}</ul>
</div></div>
<div class="scr" id="sOver" hidden><div class="card">
  <h2 class="title" id="oTitle" style="font-size:40px" hidden></h2><p class="sub" id="oText" hidden></p><p class="sub" style="margin:0" id="oLabel">Score</p><div class="score-big" id="oScore">0</div><div id="oNew" class="newbest" hidden>New best!</div>
  <div class="stats"><span class="stat"><small>Best</small><b id="oBest">0</b></span><span class="stat">+${coinHTML}<b id="oCoins">0</b></span></div>
  <button class="big" id="bAgain">Play again</button>
  <div class="row"><button id="bMenu">Menu</button><button id="bSkins2">Skins</button></div>
  <p class="hint" id="oHint"></p>
</div></div>
<div class="scr" id="sSkins" hidden><div class="card">
  <h2 class="title" style="font-size:40px">Skins</h2>
  <div class="stats"><span class="stat">${coinHTML}<b id="kCoins">0</b></span></div>
  <div class="skins" id="kGrid"></div>
  <button class="big" id="bBack">Back</button>
</div></div>
<div class="scr" id="sPause" hidden><div class="card">
  <h2 class="title" style="font-size:44px">Paused</h2>
  <button class="big" id="bResume">Resume</button>
  <div class="row"><button id="bQuit">Menu</button></div>
</div></div>
<button class="mute" id="bMute" aria-label="Sound on or off"></button>`);

const screens = ['sTitle', 'sOver', 'sSkins', 'sPause'];
let skinsFrom = 'sTitle';
function showScr(id) { screens.forEach(s => $(s).hidden = s !== id || DEMO); }
function refresh() {
  $('tBest').textContent = save.best; $('tCoins').textContent = save.coins; $('kCoins').textContent = save.coins;
  $('bMute').textContent = save.mute ? '🔇' : '🔊';
}
function hud() { $('hScore').textContent = K.score; $('hCoins').textContent = K.runCoins; }
K.add = (n = 1, x, y, c) => {
  K.score += n; hud();
  if (!K.bot) { const s = $('hScore'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  if (x !== undefined) K.pop(x, y, '+' + n, c || '#fff');
};
K.coin = (n = 1, x, y) => {
  K.runCoins += n; hud();
  if (x !== undefined) K.burst(x, y, ['#ffcf2e', '#fff3a8'], 6, 200, { life: .4, size: 6, gravity: 300 });
  K.sfx(1320, .07, 'square', .05); K.sfx(1760, .08, 'square', .05, 0, .05);
};

function buildSkins() {
  const grid = $('kGrid'); grid.innerHTML = '';
  GAME.skins.forEach((s, i) => {
    const own = save.owned.includes(i), b = document.createElement('button');
    b.className = 'skin' + (save.skin === i ? ' on' : '') + (own ? '' : ' locked') + (!own && save.coins < s.price ? ' cant' : '');
    const c = document.createElement('canvas'); c.width = c.height = 112; const cg = c.getContext('2d'); cg.translate(56, 56);
    if (GAME.drawSkin) GAME.drawSkin(cg, s, 40); else { cg.fillStyle = s.c[0]; cg.beginPath(); cg.arc(0, 0, 40, 0, 7); cg.fill(); }
    if (!own) { cg.fillStyle = 'rgba(0,0,0,.45)'; cg.fillRect(-56, -56, 112, 112); }
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${s.name}</span>${own ? (save.skin === i ? '<span class="price">Equipped</span>' : '<span class="price" style="color:#cfd5ef">Equip</span>') : `<span class="price">${coinHTML}${s.price}</span>`}`);
    b.onclick = () => {
      audio();
      if (own) { save.skin = i; K.sfx(660, .08, 'triangle'); }
      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(i); save.skin = i; K.chime(660); }
      else { K.sfx(160, .15, 'sawtooth', .08); return; }
      persist(); refresh(); buildSkins();
    };
    grid.appendChild(b);
  });
}

/* ---------- flow ---------- */
let overAt = 0, botOverAt = 0;
function start() {
  audio(); K.bot = false; K.score = 0; K.runCoins = 0; hud(); parts.length = 0; pops.length = 0;
  GAME.reset(); K.state = 'play'; showScr(null); $('hud').hidden = false; save.plays++; persist();
}
function attract() { K.bot = true; K.demoSkin = DEMO ? 0 : K.irand(0, GAME.skins.length - 1); K.score = 0; K.runCoins = 0; hud(); GAME.reset(); if (POSE) GAME.pose(); K.state = 'title'; $('hud').hidden = !DEMO; }
K.over = (o = {}) => {
  if (K.bot) { if (!botOverAt) botOverAt = K.t + 1.2; return; }
  if (K.state !== 'play') return;
  K.state = 'over'; overAt = performance.now();
  const best = K.score > save.best; if (best) save.best = K.score;
  save.coins += K.runCoins; persist(); refresh();
  $('oTitle').hidden = !o.title; $('oTitle').textContent = o.title || ''; $('oText').hidden = !o.text; $('oText').textContent = o.text || ''; $('oLabel').textContent = GAME.scoreLabel || 'Score';
  $('oScore').textContent = K.score; $('oBest').textContent = save.best; $('oCoins').textContent = K.runCoins; $('oNew').hidden = !best || K.score === 0;
  const next = GAME.skins.map((s, i) => [s, i]).find(([s, i]) => !save.owned.includes(i));
  $('oHint').textContent = next ? (save.coins >= next[0].price ? `You can unlock ${next[0].name} now!` : `${next[0].price - save.coins} more coins to unlock ${next[0].name}`) : 'You own every skin. Legend!';
  if (GAME.noSkins) $('oHint').textContent = '';
  setTimeout(() => { if (K.state === 'over') { showScr('sOver'); $('hud').hidden = true; } }, o.delay ?? 650);
  if (best && K.score > 0) setTimeout(() => K.chime(523, [0, 4, 7, 12, 16]), 700);
};
function pause() { if (K.state !== 'play') return; K.state = 'paused'; showScr('sPause'); }
function resume() { K.state = 'play'; showScr(null); last = performance.now(); }
function toMenu() { refresh(); attract(); showScr('sTitle'); }

$('bPlay').onclick = start; $('bAgain').onclick = start; $('bResume').onclick = resume;
$('bMenu').onclick = toMenu; $('bQuit').onclick = toMenu;
$('bSkins').onclick = () => { skinsFrom = 'sTitle'; buildSkins(); refresh(); showScr('sSkins'); };
$('bSkins2').onclick = () => { skinsFrom = 'sOver'; buildSkins(); refresh(); showScr('sSkins'); };
$('bBack').onclick = () => { if (skinsFrom === 'sOver') toMenu(); else showScr('sTitle'); };
$('hPause').onclick = pause;
$('bMute').onclick = () => { save.mute = !save.mute; persist(); refresh(); audio(); };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
const toW = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener('pointerdown', e => { audio(); if (K.state === 'play' && GAME.down) { const [x, y] = toW(e); GAME.down(x, y, e); } });
addEventListener('pointermove', e => { if (K.state === 'play' && GAME.move) { const [x, y] = toW(e); GAME.move(x, y, e); } });
addEventListener('pointerup', e => { if (K.state === 'play' && GAME.up) { const [x, y] = toW(e); GAME.up(x, y, e); } });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat && K.state !== 'play') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (K.state === 'play') pause(); else if (K.state === 'paused') resume(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && K.state !== 'play') {
    if (K.state === 'title' && !$('sTitle').hidden) start();
    else if (K.state === 'over' && performance.now() - overAt > 900) start();
    else if (K.state === 'paused') resume();
    return;
  }
  if (K.state === 'play' && GAME.key) GAME.key(e.code, true);
});
addEventListener('keyup', e => { if (K.state === 'play' && GAME.key) GAME.key(e.code, false); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const run = K.state === 'play' || K.state === 'title' || K.state === 'over';
  if (run && !POSE) {
    K.t += dt;
    if (K.bot && K.state === 'title') { if (botOverAt && K.t > botOverAt) { botOverAt = 0; attract(); } else if (!botOverAt && GAME.bot) GAME.bot(dt); }
    GAME.update(dt); fx(dt);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = GAME.bg || '#000'; g.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx * sc), dpr * (oy + sy * sc));
  GAME.draw(g); drawFx();
  if (flashA > 0) { g.globalAlpha = flashA; g.fillStyle = flashC; g.fillRect(K.view.x0, K.view.y0, K.view.x1 - K.view.x0, K.view.y1 - K.view.y0); g.globalAlpha = 1; }
  masterSync();
  requestAnimationFrame(frame);
}
if (GAME.noSkins) { $('bSkins').parentNode.hidden = true; $('bSkins2').hidden = true; }
if (GAME.noHud) { $('hScore').hidden = true; document.querySelector('.hud-coins').hidden = true; }
refresh(); attract(); showScr('sTitle');
requestAnimationFrame(frame);
</script>
</body>
</html>
