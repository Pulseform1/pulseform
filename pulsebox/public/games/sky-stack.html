<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { color-scheme: dark; --accent: #c6ff3d; --accent2: #29e0ff; --bg: #0a0c12; --text: #f3f5ff; --muted: #a3a9c4; --panel: rgba(10,12,22,.86); --edge: rgba(255,255,255,.14); --display: 'Lilita One', 'Arial Black', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hud-score { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vh, 56px); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); letter-spacing: .02em; }
.hud-score.bump { animation: bump .18s ease-out; }
@keyframes bump { 40% { transform: translateX(-50%) scale(1.18); } }
.hud-coins { position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 3.2vh, 24px); background: rgba(0,0,0,.35); padding: 4px 12px 4px 8px; border-radius: 999px; }
.coin-i { width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcf2e 45%, #c98a00); box-shadow: 0 0 8px rgba(255,207,46,.6); display: inline-block; flex: none; }
.hud-pause { position: absolute; top: 10px; left: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,.35); pointer-events: auto; display: grid; place-items: center; }
.hud-pause::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

/* screens */
.scr { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.65)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vh, 28px) 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.title { font-family: var(--display); font-size: clamp(36px, 9vh, 64px); line-height: .95; margin: 0 0 6px; color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .01em; }
.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 15px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.07); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.stat small { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.big { display: block; width: 100%; font-family: var(--display); font-size: clamp(22px, 5vh, 30px); padding: 12px 18px; border-radius: 18px; background: var(--accent); color: #0b0d14; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.big:hover { transform: translateY(-2px); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.row button { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
.row button:hover { background: rgba(255,255,255,.14); }
.how { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
.score-big { font-family: var(--display); font-size: clamp(54px, 14vh, 96px); line-height: 1; margin: 4px 0; }
.newbest { display: inline-block; font-family: var(--display); background: var(--accent2); color: #0b0d14; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* skins */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 6px 0 14px; }
.skin { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.skin.on { border-color: var(--accent); background: rgba(255,255,255,.12); }
.skin.locked { opacity: .9; }
.skin canvas { width: 56px; height: 56px; }
.skin .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffe07a; }
.skin.cant .price { color: #ff8a8a; }

.mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid var(--edge); font-size: 18px; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vh, 38px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 20px var(--accent); pointer-events: none; animation: toast 1.4s ease-out forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
body.demo .hud-pause, body.demo .mute { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const W = 1280, H = 720;  // the game world; the kit scales it to fit the screen
/* Sky Stack: drop the sliding block on the tower. Overhang is chopped off; perfect drops build a combo that widens the block.
   Climb from the city through the clouds and the stratosphere into space. Power blocks, gold rushes, unlockable worlds,
   missions, a daily challenge, trophies and a coin-paid second chance. */
const GAME = {
  id: 'sky-stack', title: 'Sky Stack', tagline: 'Tap to drop. Stack it perfectly. Build all the way to space!',
  font: 'Lilita One', accent: '#ffd23f', accent2: '#ff6fae', bg: '#1b1446',
  how: ['Tap, click or press Space to drop the sliding block.', 'Anything hanging over the edge gets chopped off.', '3 perfect drops in a row grow your block. Land glowing power blocks for boosts!'],
  skins: [
    { name: 'Candy', price: 0, h: [330, 30] }, { name: 'Ocean', price: 60, h: [170, 230] }, { name: 'Lava', price: 150, h: [0, 35], lava: true },
    { name: 'Forest', price: 250, h: [85, 150] }, { name: 'Neon', price: 400, h: [280, 190], neon: true }, { name: 'Gold', price: 700, h: [38, 52], gold: true },
  ],
};
// ==== onetap meta v1: missions, daily challenge, trophies, worlds, second chance, music loop, fx. Shared by Sky Stack, Orbit Hop, Hue Hop, Axe Spin ====
const OT = (() => {
  const gid = GAME.id, TAU = Math.PI * 2, FONT = `"${GAME.font}", "Arial Black", sans-serif`, CI = '<i class="coin-i"></i>';
  let C = { mis: [], daily: [], ach: [] }, run = {}, live = false, conts = 0, pr = null, notes = [], bans = [], ts = 1, slowT = 0, slowS = 1, fresh = [];
  const S = () => K.save, E = id => document.getElementById(gid + '-' + id), Q = s => document.querySelector(s);
  const st = () => (S().st && typeof S().st === 'object') ? S().st : (S().st = {});
  const day = (o = 0) => { const d = new Date(Date.now() - o * 864e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0; return h; };
  const say = (d, n) => typeof d.t === 'function' ? d.t(n) : d.t.replace('{n}', n);
  /* ---- missions, daily challenge, trophies ---- */
  function mlist() {
    const s = S(); if (!Array.isArray(s.mis)) s.mis = []; if (!s.mlv || typeof s.mlv !== 'object') s.mlv = {};
    s.mis = s.mis.filter(m => m && C.mis[m.i]);
    for (;;) {
      if (s.mis.length >= 3) break;
      const pool = C.mis.map((_, i) => i).filter(i => !s.mis.some(m => m.i === i) && !(C.mis[i].cap && (s.mlv[i] || 0) >= C.mis[i].n.length));
      if (!pool.length) break;
      const i = pool[Math.floor(Math.random() * pool.length)]; s.mis.push({ i, lv: s.mlv[i] || 0, p: 0 });
    }
    return s.mis;
  }
  function mget(m) {
    const d = C.mis[m.i], L = d.n.length, n = m.lv < L ? d.n[m.lv] : Math.round(d.n[L - 1] * (1 + (m.lv - L + 1) * .5));
    return { k: d.k, run: d.run, n, r: Math.min(90, (d.r || 15) + m.lv * 8), text: say(d, n) };
  }
  function dget() {
    const s = S(), d = day();
    if (!s.dly || s.dly.d !== d) s.dly = { d, p: 0, done: 0, sk: s.dly && s.dly.ld === day(1) ? s.dly.sk || 0 : 0, ld: s.dly ? s.dly.ld || '' : '' };
    const t = C.daily[hsh(d + gid) % C.daily.length];
    return { k: t.k, run: t.run, n: t.n, r: 40 + 10 * Math.min(s.dly.sk, 5), text: say(t, t.n) };
  }
  function tidy() { const s = S(), ms = mlist(); ms.forEach(m => { if (m.done) s.mlv[m.i] = m.lv + 1; }); s.mis = ms.filter(m => !m.done); mlist(); }
  function pay(r) { if (r) { S().coins += r; K.persist(); } }
  function award(a) { const s = S(); if (s.ach.includes(a.id)) return; s.ach.push(a.id); fresh.push(a); pay(a.r || 25); note('Trophy unlocked!', a.n, a.r || 25); }
  function prog(k, rv, dv) {
    const s = S();
    for (const m of mlist()) { const d = mget(m); if (d.k !== k || m.done) continue; m.p = d.run ? Math.max(m.p, rv) : m.p + dv; if (m.p >= d.n) { m.done = 1; pay(d.r); note('Mission complete!', d.text, d.r); } }
    const dd = dget(); if (dd.k === k && !s.dly.done) { s.dly.p = dd.run ? Math.max(s.dly.p, rv) : s.dly.p + dv; if (s.dly.p >= dd.n) { s.dly.done = 1; s.dly.sk++; s.dly.ld = s.dly.d; pay(dd.r); note('Daily challenge done!', dd.text, dd.r); } }
    if (!Array.isArray(s.ach)) s.ach = [];
    for (const a of C.ach) if (a.k === k && !s.ach.includes(a.id) && (a.run ? rv : st()[k] || 0) >= a.v) award(a);
    const wl = C.worlds;
    if (wl) { if (!Array.isArray(s.wun)) s.wun = []; wl.list.forEach((w, i) => { if (w.k === k && w.v && !s.wun.includes(i) && (st()[k] || 0) >= w.v) { s.wun.push(i); note(wl.label + ' unlocked!', w.n, 0); } }); }
  }
  function add(k, n = 1) { if (!live) return; run[k] = (run[k] || 0) + n; st()[k] = (st()[k] || 0) + n; prog(k, run[k], n); }
  function top(k, v) { if (!live || v <= (run[k] || 0)) return; run[k] = v; if (v > (st()[k] || 0)) st()[k] = v; prog(k, v, 0); }
  function note(a, b, r) { notes.push({ a, b, r, l: 0 }); }
  function banner(a, b, c = '#fff', d = 2.2) { if (bans.length > 2) bans.shift(); bans.push({ a, b, c, l: 0, d }); }
  /* ---- second chance ---- */
  function die(revive, o = {}) {
    if (K.bot) { K.over(o); return; }
    const cost = (C.cost || 30) * (conts + 1), have = S().coins + K.runCoins;
    if (revive && conts < (C.conts || 2) && have >= cost && E('cont')) {
      pr = { t: 0, cost, revive, o }; E('cont').hidden = false; E('cbuy').innerHTML = `Continue &nbsp;${CI} ${cost}`; E('chave').textContent = `You have ${have} coins`;
      K.sfx(392, .18, 'triangle', .1); K.sfx(294, .3, 'triangle', .1, 0, .16);
    } else end(o);
  }
  function buy() {
    if (!pr || pr.t < .6) return;
    const s = S(); let c = pr.cost; const a = Math.min(s.coins, c); s.coins -= a; c -= a; K.runCoins = Math.max(0, K.runCoins - c);
    const hc = document.getElementById('hCoins'); if (hc) hc.textContent = K.runCoins;
    conts++; K.persist(); const f = pr.revive; pr = null; E('cont').hidden = true; add('cont'); K.chime(523, [0, 7, 12, 19]); f();
  }
  function no() { if (!pr || pr.t < .3) return; const o = pr.o; pr = null; E('cont').hidden = true; end(Object.assign({ delay: 200 }, o)); }
  function end(o) { const p = E('over'); if (p) p.innerHTML = mhtml(1); live = false; tidy(); fresh = []; mfade(); K.over(o); }
  function key(c) { if (!pr) return false; if (c === 'Space' || c === 'Enter') buy(); else if (c === 'KeyN' || c === 'Backspace' || c === 'ArrowDown') no(); return true; }
  /* ---- music: a small step sequencer on K.master ---- */
  let mg = null, mf = null, nb = null, nt = 0, stp = 0, mOn = false;
  const mtf = m => 440 * Math.pow(2, (m - 69) / 12);
  function mInit() {
    const ac = K.ac; if (!ac || !K.master) return false; if (mg) return true;
    mg = ac.createGain(); mg.gain.value = 0; mf = ac.createBiquadFilter(); mf.type = 'lowpass'; mf.frequency.value = 16000; mf.Q.value = 1.5; mg.connect(mf); mf.connect(K.master);
    if (C.song.echo) { const dl = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain(); dl.delayTime.value = C.song.echo; fb.gain.value = .33; wet.gain.value = .3; mf.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(K.master); }
    nb = ac.createBuffer(1, ac.sampleRate * .5 | 0, ac.sampleRate); const ch = nb.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    return true;
  }
  function tone(f, t, d, type, v, att = .006) {
    const ac = K.ac, o = ac.createOscillator(), a = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(v, t + att); a.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(a); a.connect(mg); o.start(t); o.stop(t + d + .05);
  }
  function hiss(t, d, v, f, type = 'highpass') {
    const ac = K.ac, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), a = ac.createGain(); s.buffer = nb; fl.type = type; fl.frequency.value = f;
    a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(fl); fl.connect(a); a.connect(mg); s.start(t, Math.random() * .3); s.stop(t + d + .02);
  }
  function kick(t, v) { const ac = K.ac, o = ac.createOscillator(), a = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .14); a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.0001, t + .24); o.connect(a); a.connect(mg); o.start(t); o.stop(t + .26); }
  function beat(i, t, lv, spb) {
    const sg = C.song, j = i % 16, bar = i >> 4, ch = sg.prog[bar % sg.prog.length], r = sg.key + ch[0];
    const tn = ch[1] === 'm' ? [0, 3, 7, 10, 12, 15, 19] : [0, 4, 7, 11, 12, 16, 19];
    if (j === 0) [0, 1, 2].forEach(k => tone(mtf(r + 12 + tn[k]), t, spb * 16, sg.pad || 'triangle', sg.padv || .016, .25));
    const a = sg.arp[i % sg.arp.length]; if (a !== '.') tone(mtf(r + 24 + tn[+a]), t, spb * 1.8, sg.lead || 'square', sg.arpv || .018);
    if (lv >= 1) { const b = sg.bass[j]; if (b !== '.') tone(mtf(r + (b === 'o' ? 12 : 0)), t, spb * 2.2, sg.bassw || 'triangle', .08); if (sg.hat[j] === 'x') hiss(t, .035, .03, 8000); }
    if (lv >= 2) { if (sg.kick[j] === 'x') kick(t, .15); if (sg.snare[j] === 'x') hiss(t, .13, .06, 1800, 'bandpass'); }
    if (lv >= 3 && sg.top) { const c = sg.top[i % sg.top.length]; if (c !== '.') tone(mtf(r + 36 + tn[+c]), t, spb * 3, 'sine', .02); }
  }
  function music(lv) {
    if (K.bot || !live || S().mute || !mInit()) return;
    const ac = K.ac, spb = 60 / C.song.bpm / 4, now = ac.currentTime;
    if (!mOn) { mOn = true; mg.gain.cancelScheduledValues(now); mg.gain.setTargetAtTime(C.song.vol || 1, now, .3); }
    mf.frequency.setTargetAtTime(slowT > 0 || pr ? 900 : 16000, now, .08);
    if (nt < now) nt = now + .05;
    while (nt < now + .18) { beat(stp++, nt, lv, spb); nt += spb; }
  }
  function mfade() { if (mg && mOn) { mOn = false; mg.gain.cancelScheduledValues(K.ac.currentTime); mg.gain.setTargetAtTime(0, K.ac.currentTime, .35); } }
  /* ---- fx: world-space particles, rings and pop text ---- */
  const P = [], T = [];
  function burst(x, y, n, col, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.dir !== undefined ? o.dir + (Math.random() - .5) * (o.spread ?? 1) : Math.random() * TAU, sp = (o.sp ?? 300) * (.25 + Math.random() * .75);
      P.push({ x: x + (o.w ? (Math.random() - .5) * o.w : 0), y: y + (o.h ? (Math.random() - .5) * o.h : 0), vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0), l: 0, m: (o.life ?? .7) * (.5 + Math.random() * .7), c: Array.isArray(col) ? col[Math.random() * col.length | 0] : col, s: (o.size ?? 6) * (.5 + Math.random() * .8), g: o.g ?? 500, dr: o.drag ?? 1.5, sh: o.shape || 0, r: Math.random() * 6, vr: (Math.random() - .5) * 12, add: o.add });
    }
  }
  function ring(x, y, c, r0, r1, life = .5, w = 6, sy = 1) { P.push({ ring: 1, x, y, c, r0, r1, l: 0, m: life, w, sy, add: 1 }); }
  function text(x, y, s, c = '#fff', z = 34, o = {}) { T.push({ x, y, s, c, z, l: o.l0 || 0, vy: o.vy ?? -60, m: o.life ?? 1 }); }
  function fxUpd(dt) {
    for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.l += dt; if (p.l >= p.m) { P.splice(i, 1); continue; } if (!p.ring) { const k = Math.exp(-p.dr * dt); p.vx *= k; p.vy = p.vy * k + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; } }
    for (let i = T.length - 1; i >= 0; i--) { const p = T[i]; p.l += dt; p.y += p.vy * dt; if (p.l > p.m) T.splice(i, 1); }
  }
  function star(g, x, y, R, r, rot = 0, n = 5) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot - Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } g.closePath(); }
  function fxDraw(g) {
    for (const pass of [0, 1]) {
      g.globalCompositeOperation = pass ? 'lighter' : 'source-over';
      for (const p of P) {
        if (!!p.add !== !!pass) continue; const k = p.l / p.m; g.globalAlpha = 1 - k * k;
        if (p.ring) { const e = 1 - Math.pow(1 - k, 3), r = p.r0 + (p.r1 - p.r0) * e; g.strokeStyle = p.c; g.lineWidth = Math.max(.5, p.w * (1 - k)); g.beginPath(); g.ellipse(p.x, p.y, r, r * p.sy, 0, 0, TAU); g.stroke(); continue; }
        const s = p.s * (1 - k * .5); g.fillStyle = p.c;
        if (p.sh === 1) { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-s / 2, -s / 2, s, s * .7); g.restore(); }
        else if (p.sh === 2) { g.strokeStyle = p.c; g.lineWidth = s * .45; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .045, p.y - p.vy * .045); g.stroke(); }
        else if (p.sh === 3) { star(g, p.x, p.y, s, s * .45, p.r); g.fill(); }
        else { g.beginPath(); g.arc(p.x, p.y, s / 2, 0, TAU); g.fill(); }
      }
    }
    g.globalCompositeOperation = 'source-over';
    for (const p of T) { const k = p.l / p.m, l = p.l, sc = l < .1 ? .3 + l / .1 * .95 : l < .2 ? 1.25 - (l - .1) / .1 * .25 : 1; g.globalAlpha = k > .65 ? Math.max(0, 1 - (k - .65) / .35) : 1; label(g, p.s, p.x, p.y, p.z * sc, p.c); }
    g.globalAlpha = 1;
  }

  K.runCoins += n; hud();
  if (x !== undefined) K.burst(x, y, ['#ffcf2e', '#fff3a8'], 6, 200, { life: .4, size: 6, gravity: 300 });
  K.sfx(1320, .07, 'square', .05); K.sfx(1760, .08, 'square', .05, 0, .05);
};

function buildSkins() {
  const grid = $('kGrid'); grid.innerHTML = '';
  GAME.skins.forEach((s, i) => {
    const own = save.owned.includes(i), b = document.createElement('button');
    b.className = 'skin' + (save.skin === i ? ' on' : '') + (own ? '' : ' locked') + (!own && save.coins < s.price ? ' cant' : '');
    const c = document.createElement('canvas'); c.width = c.height = 112; const cg = c.getContext('2d'); cg.translate(56, 56);
    if (GAME.drawSkin) GAME.drawSkin(cg, s, 40); else { cg.fillStyle = s.c[0]; cg.beginPath(); cg.arc(0, 0, 40, 0, 7); cg.fill(); }
    if (!own) { cg.fillStyle = 'rgba(0,0,0,.45)'; cg.fillRect(-56, -56, 112, 112); }
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${s.name}</span>${own ? (save.skin === i ? '<span class="price">Equipped</span>' : '<span class="price" style="color:#cfd5ef">Equip</span>') : `<span class="price">${coinHTML}${s.price}</span>`}`);
    b.onclick = () => {
      audio();
      if (own) { save.skin = i; K.sfx(660, .08, 'triangle'); }
      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(i); save.skin = i; K.chime(660); }
      else { K.sfx(160, .15, 'sawtooth', .08); return; }
      persist(); refresh(); buildSkins();
    };
    grid.appendChild(b);
  });
}

/* ---------- flow ---------- */
let overAt = 0, botOverAt = 0;
function start() {
  audio(); K.bot = false; K.score = 0; K.runCoins = 0; hud(); parts.length = 0; pops.length = 0;
  GAME.reset(); K.state = 'play'; showScr(null); $('hud').hidden = false; save.plays++; persist();
}
function attract() { K.bot = true; K.demoSkin = DEMO ? 0 : K.irand(0, GAME.skins.length - 1); K.score = 0; K.runCoins = 0; hud(); GAME.reset(); if (POSE) GAME.pose(); K.state = 'title'; $('hud').hidden = !DEMO; }
K.over = (o = {}) => {
  if (K.bot) { if (!botOverAt) botOverAt = K.t + 1.2; return; }
  if (K.state !== 'play') return;
  K.state = 'over'; overAt = performance.now();
  const best = K.score > save.best; if (best) save.best = K.score;
  save.coins += K.runCoins; persist(); refresh();
  $('oTitle').hidden = !o.title; $('oTitle').textContent = o.title || ''; $('oText').hidden = !o.text; $('oText').textContent = o.text || ''; $('oLabel').textContent = GAME.scoreLabel || 'Score';
  $('oScore').textContent = K.score; $('oBest').textContent = save.best; $('oCoins').textContent = K.runCoins; $('oNew').hidden = !best || K.score === 0;
  const next = GAME.skins.map((s, i) => [s, i]).find(([s, i]) => !save.owned.includes(i));
  $('oHint').textContent = next ? (save.coins >= next[0].price ? `You can unlock ${next[0].name} now!` : `${next[0].price - save.coins} more coins to unlock ${next[0].name}`) : 'You own every skin. Legend!';
  if (GAME.noSkins) $('oHint').textContent = '';
  setTimeout(() => { if (K.state === 'over') { showScr('sOver'); $('hud').hidden = true; } }, o.delay ?? 650);
  if (best && K.score > 0) setTimeout(() => K.chime(523, [0, 4, 7, 12, 16]), 700);
};
function pause() { if (K.state !== 'play') return; K.state = 'paused'; showScr('sPause'); }
function resume() { K.state = 'play'; showScr(null); last = performance.now(); }
function toMenu() { refresh(); attract(); showScr('sTitle'); }

$('bPlay').onclick = start; $('bAgain').onclick = start; $('bResume').onclick = resume;
$('bMenu').onclick = toMenu; $('bQuit').onclick = toMenu;
$('bSkins').onclick = () => { skinsFrom = 'sTitle'; buildSkins(); refresh(); showScr('sSkins'); };
$('bSkins2').onclick = () => { skinsFrom = 'sOver'; buildSkins(); refresh(); showScr('sSkins'); };
$('bBack').onclick = () => { if (skinsFrom === 'sOver') toMenu(); else showScr('sTitle'); };
$('hPause').onclick = pause;
$('bMute').onclick = () => { save.mute = !save.mute; persist(); refresh(); audio(); };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
const toW = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener('pointerdown', e => { audio(); if (K.state === 'play' && GAME.down) { const [x, y] = toW(e); GAME.down(x, y, e); } });
addEventListener('pointermove', e => { if (K.state === 'play' && GAME.move) { const [x, y] = toW(e); GAME.move(x, y, e); } });
addEventListener('pointerup', e => { if (K.state === 'play' && GAME.up) { const [x, y] = toW(e); GAME.up(x, y, e); } });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat && K.state !== 'play') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (K.state === 'play') pause(); else if (K.state === 'paused') resume(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && K.state !== 'play') {
    if (K.state === 'title' && !$('sTitle').hidden) start();
    else if (K.state === 'over' && performance.now() - overAt > 900) start();
    else if (K.state === 'paused') resume();
    return;
  }
  if (K.state === 'play' && GAME.key) GAME.key(e.code, true);
});
addEventListener('keyup', e => { if (K.state === 'play' && GAME.key) GAME.key(e.code, false); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const run = K.state === 'play' || K.state === 'title' || K.state === 'over';
  if (run && !POSE) {
    K.t += dt;
    if (K.bot && K.state === 'title') { if (botOverAt && K.t > botOverAt) { botOverAt = 0; attract(); } else if (!botOverAt && GAME.bot) GAME.bot(dt); }
    GAME.update(dt); fx(dt);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = GAME.bg || '#000'; g.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx * sc), dpr * (oy + sy * sc));
  GAME.draw(g); drawFx();
  if (flashA > 0) { g.globalAlpha = flashA; g.fillStyle = flashC; g.fillRect(K.view.x0, K.view.y0, K.view.x1 - K.view.x0, K.view.y1 - K.view.y0); g.globalAlpha = 1; }
  masterSync();
  requestAnimationFrame(frame);
}
if (GAME.noSkins) { $('bSkins').parentNode.hidden = true; $('bSkins2').hidden = true; }
if (GAME.noHud) { $('hScore').hidden = true; document.querySelector('.hud-coins').hidden = true; }
refresh(); attract(); showScr('sTitle');
requestAnimationFrame(frame);
</script>
</body>
</html>
