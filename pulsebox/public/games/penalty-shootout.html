<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Penalty Shootout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { color-scheme: dark; --accent: #c6ff3d; --accent2: #29e0ff; --bg: #0a0c12; --text: #f3f5ff; --muted: #a3a9c4; --panel: rgba(10,12,22,.86); --edge: rgba(255,255,255,.14); --display: 'Lilita One', 'Arial Black', system-ui, sans-serif; --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hud-score { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vh, 56px); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.4); letter-spacing: .02em; }
.hud-score.bump { animation: bump .18s ease-out; }
@keyframes bump { 40% { transform: translateX(-50%) scale(1.18); } }
.hud-coins { position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 3.2vh, 24px); background: rgba(0,0,0,.35); padding: 4px 12px 4px 8px; border-radius: 999px; }
.coin-i { width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcf2e 45%, #c98a00); box-shadow: 0 0 8px rgba(255,207,46,.6); display: inline-block; flex: none; }
.hud-pause { position: absolute; top: 10px; left: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,.35); pointer-events: auto; display: grid; place-items: center; }
.hud-pause::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

/* screens */
.scr { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.65)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vh, 28px) 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.title { font-family: var(--display); font-size: clamp(36px, 9vh, 64px); line-height: .95; margin: 0 0 6px; color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .01em; }
.sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 15px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.07); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.stat small { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.big { display: block; width: 100%; font-family: var(--display); font-size: clamp(22px, 5vh, 30px); padding: 12px 18px; border-radius: 18px; background: var(--accent); color: #0b0d14; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.big:hover { transform: translateY(-2px); }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.row button { flex: 1; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
.row button:hover { background: rgba(255,255,255,.14); }
.how { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
.score-big { font-family: var(--display); font-size: clamp(54px, 14vh, 96px); line-height: 1; margin: 4px 0; }
.newbest { display: inline-block; font-family: var(--display); background: var(--accent2); color: #0b0d14; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* skins */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 6px 0 14px; }
.skin { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.skin.on { border-color: var(--accent); background: rgba(255,255,255,.12); }
.skin.locked { opacity: .9; }
.skin canvas { width: 56px; height: 56px; }
.skin .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffe07a; }
.skin.cant .price { color: #ff8a8a; }

.mute { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid var(--edge); font-size: 18px; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vh, 38px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 20px var(--accent); pointer-events: none; animation: toast 1.4s ease-out forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
body.demo .hud-pause, body.demo .mute { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const W = 1280, H = 720;  // the game world; the kit scales it to fit the screen
/* Penalty Shootout: a stadium seen from behind the penalty spot. Swipe to shoot: where you let go is where it goes, a faster
   swipe hits harder (and wilder), a bent swipe curls the ball, a slow little flick chips it. When they shoot, tap where to
   dive. Modes: the World Cup (16 nations, knockout), Survival (score until you miss, the keeper gets better every goal),
   Target Practice and 2 Players on one device. Coins buy skills: power, accuracy, curve and keeper reflexes. */
const GAME = {
  id: 'penalty-shootout', title: 'Penalty Shootout', tagline: 'Swipe. Curl. Dive. Win the cup!',
  font: 'Bebas Neue', accent: '#ffd23f', accent2: '#3ddc84', bg: '#0b2a16', noHud: true, scoreLabel: 'Score',
  how: ['Shooting: swipe from the ball to the spot in the goal. Faster swipe = harder shot. Bend your swipe to curl it. A slow, short flick chips the keeper.', 'Saving: tap (or click) where you want your keeper to dive. Watch the ball, not the kicker.', 'Keyboard: arrows aim, A/D curl, hold Space to charge and let go to shoot. When saving, arrows aim the dive and Space dives.'],
  skins: [
    { name: 'Classic', price: 0, c: ['#ffffff', '#1a1a1a'] }, { name: 'Retro', price: 80, c: ['#c8874a', '#6a3a14'] }, { name: 'Neon', price: 180, c: ['#3aff5a', '#0a2a10'], glow: true },
    { name: 'Fire', price: 300, c: ['#ff9f1c', '#c0200a'], glow: true }, { name: 'Galaxy', price: 500, c: ['#7c4dff', '#140a3a'], glow: true }, { name: 'Gold', price: 800, c: ['#ffd23f', '#a06a00'], glow: true },
  ],
};
(() => {
  const TEAMS = [
    ['France', 'v', ['#1f3c9a', '#ffffff', '#e1262d']], ['Italy', 'v', ['#119a48', '#ffffff', '#d52b2b']], ['Germany', 'h', ['#111111', '#dd1f26', '#ffce00']], ['Netherlands', 'h', ['#c8102e', '#ffffff', '#1f4d9a']],
    ['Belgium', 'v', ['#111111', '#fdda24', '#ef3340']], ['Ireland', 'v', ['#169b62', '#ffffff', '#ff883e']], ['Nigeria', 'v', ['#008751', '#ffffff', '#008751']], ['Mexico', 'v', ['#006847', '#ffffff', '#ce1126']],
    ['Colombia', 'h', ['#fcd116', '#fcd116', '#003893', '#ce1126']], ['Argentina', 'h', ['#74acdf', '#ffffff', '#74acdf']], ['Japan', 'd', ['#ffffff', '#bc002d']], ['Spain', 'h', ['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']],
    ['Austria', 'h', ['#ed2939', '#ffffff', '#ed2939']], ['Peru', 'v', ['#d91023', '#ffffff', '#d91023']], ['Poland', 'h', ['#ffffff', '#dc143c']], ['Ghana', 'h', ['#ce1126', '#fcd116', '#006b3f']],
  ].map(([n, d, c], i) => ({ i, n, d, c, kit: c.find(x => x !== '#ffffff') || c[0], rate: .4 + ((i * 37) % 11) / 20 }));
  const ROUNDS = ['Round of 16', 'Quarter-final', 'Semi-final', 'Final'];
  const FD = '"Bebas Neue", Impact, sans-serif', FB = s => `800 ${s}px Nunito, system-ui, sans-serif`, fd = s => `${s}px ${FD}`;
  const SKILLS = [['power', 'Power', 'Harder shots at full swipe'], ['acc', 'Accuracy', 'Less spray on big shots'], ['curve', 'Curl', 'More bend on curled shots'], ['reflex', 'Reflexes', 'Your keeper dives faster']];
  const SKCOST = [40, 90, 170, 280, 450];
  const HW = 3.66, GH = 2.44, SPOT = 11;
  // the camera stands behind the penalty spot
  const CAM = { x: 0, y: 1.45, z: 16.5 }, FOC = 1250, HZ = 330;
  const P = (x, y, z) => { const d = Math.max(.3, CAM.z - z), k = FOC / d; return [640 + (x - CAM.x) * k, HZ - (y - CAM.y) * k, k]; };
  const unP = (sx, sy, z = 0) => { const d = CAM.z - z, k = FOC / d; return [(sx - 640) / k + CAM.x, (HZ - sy) / k + CAM.y]; };
  const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  let st = 'menu', mode = 'cup', team = 0, bracket, round, match, kick, ball, keeper, kicker, res, resT, swipe, aimK, banner, flash, shake, conf, hover, B = {}, slow, net, crowdJ, sv;
  const SV = () => K.save.ps || (K.save.ps = { sk: { power: 0, acc: 0, curve: 0, reflex: 0 }, best: { survival: 0, targets: 0 }, cups: 0 });
  const sk = k => SV().sk[k] || 0;

  /* ---------- flags and the ball ---------- */
  function flag(g, t, x, y, w, h) {
    g.save(); g.beginPath(); g.roundRect(x, y, w, h, h * .12); g.clip();
    if (t.d === 'd') { g.fillStyle = t.c[0]; g.fillRect(x, y, w, h); g.fillStyle = t.c[1]; g.beginPath(); g.arc(x + w / 2, y + h / 2, h * .3, 0, 7); g.fill(); }
    else t.c.forEach((c, i) => { g.fillStyle = c; if (t.d === 'v') g.fillRect(x + w * i / t.c.length, y, w / t.c.length + 1, h); else g.fillRect(x, y + h * i / t.c.length, w, h / t.c.length + 1); });
    g.restore(); g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2; g.beginPath(); g.roundRect(x, y, w, h, h * .12); g.stroke();
  }
  function drawBall(g, x, y, r, rot = 0, s = K.skin) {
    g.save(); g.translate(x, y); g.rotate(rot);
    if (s.glow) { g.shadowColor = s.c[0]; g.shadowBlur = r * .9; }
    g.fillStyle = s.c[0]; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.shadowBlur = 0;
    g.fillStyle = s.c[1]; g.beginPath(); for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283 - 1.57; g.lineTo(Math.cos(a) * r * .38, Math.sin(a) * r * .38); } g.fill();
    for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283 - 1.57 + .63; g.beginPath(); g.arc(Math.cos(a) * r * .92, Math.sin(a) * r * .92, r * .22, 0, 7); g.fill(); }
    const sh = g.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); sh.addColorStop(0, 'rgba(255,255,255,.35)'); sh.addColorStop(1, 'rgba(0,0,0,.3)'); g.fillStyle = sh; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
    g.restore();
  }
  GAME.drawSkin = (g, s, r) => drawBall(g, 0, 0, r * .9, .3, s);

  /* ---------- matches and modes ---------- */
  const oppRate = () => mode === 'cup' ? Math.min(.95, TEAMS[match.opp].rate + round * .1) : mode === 'survival' ? Math.min(.95, .35 + match.streak * .05) : .5;
  function startCup(t) {
    team = t; const others = TEAMS.map(x => x.i).filter(i => i !== t); for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
    const slot = K.irand(0, 7) * 2; bracket = [others.slice(0, 15)]; bracket[0].splice(slot, 0, t); round = 0; st = 'bracket'; resT = 0;
  }
  const opponent = () => { const r = bracket[round], i = r.indexOf(team); return r[i ^ 1]; };
  function startMatch(m) {
    mode = m; match = { us: [], them: [], opp: m === 'cup' ? opponent() : (team + 5) % 16, n: 0, streak: 0, pts: 0, shots: 0, p: 0 };
    st = 'match'; kick = 'us'; setup();
  }
  function setup() {
    ball = { x: 0, y: .11, z: SPOT, t: 0, fly: false, spin: 0, trail: [] }; res = null; resT = 0; swipe = null; slow = 0; net = null;
    keeper = { x: 0, tx: 0, ty: 1, p: 0, dive: false, t: 0, rate: kick === 'them' || mode === 'duo' ? 0 : oppRate() };
    kicker = { run: kick === 'them' && mode !== 'duo' ? 0 : -1, t: 0, kit: kick === 'us' ? TEAMS[team].kit : mode === 'duo' ? '#e8e8e8' : TEAMS[match.opp].kit };
    aimK = { x: 0, y: 1.2, curve: 0, charge: 0, hold: false, tgt: null };
    if (mode === 'targets') { keeper.rate = .2; match.tg = [[-3.05, 2.05, .42, 50], [3.05, 2.05, .42, 50], [-3, .4, .5, 25], [3, .4, .5, 25], [0, 2.1, .4, 10]].map(([x, y, r, v]) => ({ x, y, r, v, hit: 0 })); }
    banner = { s: mode === 'duo' ? `PLAYER ${kick === 'us' ? 1 : 2} SHOOTS` : kick === 'us' ? 'YOUR KICK' : 'SAVE IT!', t: 0 };
  }
  function decided() {
    const u = match.us.filter(Boolean).length, t = match.them.filter(Boolean).length, nu = match.us.length, nt = match.them.length;
    if (nu <= 5 && nt <= 5) { if (u + (5 - nu) < t) return 'them'; if (t + (5 - nt) < u) return 'us'; if (nu === 5 && nt === 5 && u !== t) return u > t ? 'us' : 'them'; return null; }
    if (nu === nt && u !== t) return u > t ? 'us' : 'them'; return null;
  }
  function settle(r) {
    res = r; resT = 0; const goal = r === 'GOAL!';
    if (mode === 'targets') { match.shots++; }
    else if (mode === 'survival') { if (goal) { match.streak++; K.add(10 + match.streak * 2); K.coin(1); } }
    else { (kick === 'us' ? match.us : match.them).push(goal); match.n++; if (kick === 'us' && goal && mode === 'cup') { K.add(10); K.coin(1); } if (kick === 'them' && !goal && mode === 'cup') { K.add(10); K.coin(1); } }
    const ours = kick === 'us' ? goal : !goal;
    if (ours) { flash = 1; crowdJ = 1.4; if (goal) confetti(); K.sfx(523, .1, 'square', .07); K.chime(659, [0, 4, 7, 12]); } else { K.sfx(140, .4, 'sawtooth', .06, -60); }
    if (r === 'POST!' || r === 'BAR!') { K.sfx(1800, .25, 'triangle', .1, -600); shake = 8; }
  }
  function next() {
    if (mode === 'targets') { if (match.shots >= 10) return finish(); return setup(); }
    if (mode === 'survival') { if (res !== 'GOAL!') return finish(); return setup(); }
    const d = decided();
    if (d) { match.win = d === 'us'; st = 'post'; resT = 0; if (mode === 'cup') { if (match.win) { K.add(50); K.coin(5); } } return; }
    kick = kick === 'us' ? 'them' : 'us'; setup();
  }
  function finish() {
    const s = SV();
    if (mode === 'survival') { s.best.survival = Math.max(s.best.survival, match.streak); K.persist(); K.over({ title: `${match.streak} in a row`, text: `The keeper caught up with you. Best streak: ${s.best.survival}.`, delay: 300 }); }
    if (mode === 'targets') { s.best.targets = Math.max(s.best.targets, match.pts); K.add(match.pts); K.coin(Math.floor(match.pts / 40)); K.persist(); K.over({ title: `${match.pts} points`, text: `Target practice done. Best: ${s.best.targets}.`, delay: 300 }); }
    st = 'done';
  }
  function afterMatch() {
    if (mode === 'duo') { const u = match.us.filter(Boolean).length, t = match.them.filter(Boolean).length; return K.over({ title: match.win ? 'Player 1 wins!' : 'Player 2 wins!', text: `Final score ${u} - ${t} on penalties.`, delay: 100 }); }
    if (!match.win) return K.over({ title: 'Knocked out', text: `${TEAMS[team].n} went out in the ${ROUNDS[round]}. Try again!`, delay: 100 });
    if (round === 3) { SV().cups++; K.persist(); K.coin(25); return K.over({ title: 'CHAMPIONS!', text: `${TEAMS[team].n} won the Pulsebox Cup! Cups won: ${SV().cups}.`, delay: 100 }); }
    const r = bracket[round], nx = []; for (let i = 0; i < r.length; i += 2) nx.push(r[i] === team || r[i + 1] === team ? team : (Math.random() < .5 + (TEAMS[r[i]].rate - TEAMS[r[i + 1]].rate) * .6 ? r[i] : r[i + 1]));
    bracket.push(nx); round++; st = 'bracket'; resT = 0;
  }

  /* ---------- shooting ---------- */
  function shoot(tx, ty, power, curve) {
    if (ball.fly) return;
    const pw = clamp(power, .12, 1), acc = 1 - sk('acc') * .13, err = (Math.pow(pw, 2.2) * .95 + .08) * acc, chip = pw < .3 && ty < 2.2;
    tx += (Math.random() - .5) * 2 * err; ty += (Math.random() - .5) * 1.6 * err;
    const speed = chip ? 11 + pw * 6 : 17 + pw * (14 + sk('power') * 1.6);
    Object.assign(ball, { fly: true, t: 0, T: Math.hypot(SPOT, tx) / speed, tx, ty: Math.max(.11, ty), curve: curve * (1 + sk('curve') * .25), loft: chip ? 1.6 : Math.max(0, .25 - pw * .2), chip, sp: speed });
    kicker.run = 2; K.sfx(120, .12, 'square', .1, -40); K.noise && K.noise(.08, .12, 400);
    // the keeper reads it, or guesses
    const R = keeper.rate; if (R > 0) { const read = Math.random() < R * (chip ? .4 : 1) * (1 - pw * .35); const gx = read ? tx + rnd(-.7, .7) : (Math.random() < .5 ? -1 : 1) * rnd(1.4, 3.2); keeper.plan = { x: clamp(gx, -3.4, 3.4), y: read ? clamp(ty + rnd(-.4, .4), .3, 2.2) : rnd(.4, 1.8), at: rnd(.08, .2) * (1.4 - R * .6) }; if (chip && Math.random() < .7) keeper.plan.x = (Math.random() < .5 ? -1 : 1) * rnd(1.8, 3); }
    if (mode === 'duo') keeper.plan = null;
  }
  function aiShoot() {
    const R = oppRate(), side = Math.random() < .5 ? -1 : 1, corner = Math.random() < .4 + R * .4;
    let tx = corner ? side * rnd(2.3, 3.3) : rnd(-1.6, 1.6), ty = Math.random() < .5 ? rnd(.25, .8) : rnd(1.2, 2.2), pw = rnd(.45, .7) + R * .3, cv = rnd(-.4, .4);
    if (Math.random() < .05) { tx = rnd(-.3, .3); ty = 1.6; pw = .2; }
    const save = SV().sk; SV().sk = { power: 0, acc: 0, curve: 0, reflex: save.reflex }; shoot(tx, ty, pw, cv); SV().sk = save;
  }
  function dive(tx, ty) {
    if (keeper.dive) return; keeper.dive = true; keeper.t = 0; keeper.tx = clamp(tx, -3.4, 3.4); keeper.ty = clamp(ty, .25, 2.3); keeper.dur = .42 - sk('reflex') * .035;
    K.sfx(260, .08, 'triangle', .05, -80);
  }
  const ballAt = s => { const x = ball.tx * s + ball.curve * 4 * s * (1 - s), y = .11 + (ball.ty - .11) * s + ball.loft * 4 * s * (1 - s), z = SPOT * (1 - s); return [x, y, z]; };
  // where are the keeper's hands and body
  function keeperReach(bx, by) {
    const p = keeper.dive ? clamp(keeper.t / keeper.dur, 0, 1) : 0, e = 1 - Math.pow(1 - p, 2);
    const cx = keeper.x + (keeper.tx - keeper.x) * e * .55, cy = 1 + (keeper.ty - 1) * e * .55, hx = keeper.x + (keeper.tx - keeper.x) * e, hy = 1.75 + (keeper.ty - 1.75) * e;
    const seg = (ax, ay, bx2, by2) => { const vx = bx2 - ax, vy = by2 - ay, l = vx * vx + vy * vy || 1, t = clamp(((bx - ax) * vx + (by - ay) * vy) / l, 0, 1); return Math.hypot(bx - ax - vx * t, by - ay - vy * t); };
    const feet = [keeper.x + (keeper.tx - keeper.x) * e * .2, keeper.dive ? .2 + e * .3 : 0];
    return Math.min(seg(feet[0], feet[1], cx, cy) - .32, seg(cx, cy, hx, hy) - .3, Math.hypot(bx - hx, by - hy) - .32);
  }
  function stepBall(dt) {
    if (!ball.fly || ball.done) return;
    const was = ball.t; ball.t += dt / ball.T; ball.spin += dt * ball.sp;
    // slow motion for close calls
    if (was < .85 && ball.t >= .85 && keeper.dive && Math.abs(keeperReach(...ballAt(1).slice(0, 2))) < .5) slow = .6;

    if (!own) { cg.fillStyle = 'rgba(0,0,0,.45)'; cg.fillRect(-56, -56, 112, 112); }
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${s.name}</span>${own ? (save.skin === i ? '<span class="price">Equipped</span>' : '<span class="price" style="color:#cfd5ef">Equip</span>') : `<span class="price">${coinHTML}${s.price}</span>`}`);
    b.onclick = () => {
      audio();
      if (own) { save.skin = i; K.sfx(660, .08, 'triangle'); }
      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(i); save.skin = i; K.chime(660); }
      else { K.sfx(160, .15, 'sawtooth', .08); return; }
      persist(); refresh(); buildSkins();
    };
    grid.appendChild(b);
  });
}

/* ---------- flow ---------- */
let overAt = 0, botOverAt = 0;
function start() {
  audio(); K.bot = false; K.score = 0; K.runCoins = 0; hud(); parts.length = 0; pops.length = 0;
  GAME.reset(); K.state = 'play'; showScr(null); $('hud').hidden = false; save.plays++; persist();
}
function attract() { K.bot = true; K.demoSkin = DEMO ? 0 : K.irand(0, GAME.skins.length - 1); K.score = 0; K.runCoins = 0; hud(); GAME.reset(); if (POSE) GAME.pose(); K.state = 'title'; $('hud').hidden = !DEMO; }
K.over = (o = {}) => {
  if (K.bot) { if (!botOverAt) botOverAt = K.t + 1.2; return; }
  if (K.state !== 'play') return;
  K.state = 'over'; overAt = performance.now();
  const best = K.score > save.best; if (best) save.best = K.score;
  save.coins += K.runCoins; persist(); refresh();
  $('oTitle').hidden = !o.title; $('oTitle').textContent = o.title || ''; $('oText').hidden = !o.text; $('oText').textContent = o.text || ''; $('oLabel').textContent = GAME.scoreLabel || 'Score';
  $('oScore').textContent = K.score; $('oBest').textContent = save.best; $('oCoins').textContent = K.runCoins; $('oNew').hidden = !best || K.score === 0;
  const next = GAME.skins.map((s, i) => [s, i]).find(([s, i]) => !save.owned.includes(i));
  $('oHint').textContent = next ? (save.coins >= next[0].price ? `You can unlock ${next[0].name} now!` : `${next[0].price - save.coins} more coins to unlock ${next[0].name}`) : 'You own every skin. Legend!';
  if (GAME.noSkins) $('oHint').textContent = '';
  setTimeout(() => { if (K.state === 'over') { showScr('sOver'); $('hud').hidden = true; } }, o.delay ?? 650);
  if (best && K.score > 0) setTimeout(() => K.chime(523, [0, 4, 7, 12, 16]), 700);
};
function pause() { if (K.state !== 'play') return; K.state = 'paused'; showScr('sPause'); }
function resume() { K.state = 'play'; showScr(null); last = performance.now(); }
function toMenu() { refresh(); attract(); showScr('sTitle'); }

$('bPlay').onclick = start; $('bAgain').onclick = start; $('bResume').onclick = resume;
$('bMenu').onclick = toMenu; $('bQuit').onclick = toMenu;
$('bSkins').onclick = () => { skinsFrom = 'sTitle'; buildSkins(); refresh(); showScr('sSkins'); };
$('bSkins2').onclick = () => { skinsFrom = 'sOver'; buildSkins(); refresh(); showScr('sSkins'); };
$('bBack').onclick = () => { if (skinsFrom === 'sOver') toMenu(); else showScr('sTitle'); };
$('hPause').onclick = pause;
$('bMute').onclick = () => { save.mute = !save.mute; persist(); refresh(); audio(); };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
const toW = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener('pointerdown', e => { audio(); if (K.state === 'play' && GAME.down) { const [x, y] = toW(e); GAME.down(x, y, e); } });
addEventListener('pointermove', e => { if (K.state === 'play' && GAME.move) { const [x, y] = toW(e); GAME.move(x, y, e); } });
addEventListener('pointerup', e => { if (K.state === 'play' && GAME.up) { const [x, y] = toW(e); GAME.up(x, y, e); } });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat && K.state !== 'play') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (K.state === 'play') pause(); else if (K.state === 'paused') resume(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && K.state !== 'play') {
    if (K.state === 'title' && !$('sTitle').hidden) start();
    else if (K.state === 'over' && performance.now() - overAt > 900) start();
    else if (K.state === 'paused') resume();
    return;
  }
  if (K.state === 'play' && GAME.key) GAME.key(e.code, true);
});
addEventListener('keyup', e => { if (K.state === 'play' && GAME.key) GAME.key(e.code, false); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const run = K.state === 'play' || K.state === 'title' || K.state === 'over';
  if (run && !POSE) {
    K.t += dt;
    if (K.bot && K.state === 'title') { if (botOverAt && K.t > botOverAt) { botOverAt = 0; attract(); } else if (!botOverAt && GAME.bot) GAME.bot(dt); }
    GAME.update(dt); fx(dt);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = GAME.bg || '#000'; g.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx * sc), dpr * (oy + sy * sc));
  GAME.draw(g); drawFx();
  if (flashA > 0) { g.globalAlpha = flashA; g.fillStyle = flashC; g.fillRect(K.view.x0, K.view.y0, K.view.x1 - K.view.x0, K.view.y1 - K.view.y0); g.globalAlpha = 1; }
  masterSync();
  requestAnimationFrame(frame);
}
if (GAME.noSkins) { $('bSkins').parentNode.hidden = true; $('bSkins2').hidden = true; }
if (GAME.noHud) { $('hScore').hidden = true; document.querySelector('.hud-coins').hidden = true; }
refresh(); attract(); showScr('sTitle');
requestAnimationFrame(frame);
</script>
</body>
