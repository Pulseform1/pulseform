<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mythic Armies</title>
<meta name="description" content="Rip open shimmering 3D packs, collect mythical creatures from six factions, build an army and watch it fight.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:ital,wght@0,600;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6efe2;--dim:#b8b0c9;--gold:#f2c46d;--gold2:#c08a2c;--bg:#0d0a1c;--panel:rgba(18,14,38,.86);--panel2:rgba(30,24,60,.9);--line:rgba(242,196,109,.32);--teal:#5fe0c8;--bad:#ff8a6a;--good:#7dffa8;
--fd:'Cinzel','Palatino Linotype',Georgia,serif;--fu:'Nunito','Segoe UI',system-ui,sans-serif;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--fu);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
#ui>*{pointer-events:auto}
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#top{position:absolute;top:0;left:0;right:0;height:calc(54px + var(--safe-t));padding:var(--safe-t) 12px 0;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(8,6,20,.92),rgba(8,6,20,.55) 70%,rgba(8,6,20,0));z-index:5}
.brand{display:flex;align-items:center;gap:8px;font:900 11px/1 var(--fd);letter-spacing:.14em;color:var(--gold);text-align:left}
.brand b{font-size:15px;letter-spacing:.2em;color:#fff2d0}
.brand-sigil{width:34px;height:36px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 2px 6px rgba(255,200,90,.4))}
.cur{display:flex;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:99px;background:rgba(10,8,24,.78);border:1px solid var(--line);font-weight:900;font-size:15px;min-width:74px}
.chip i{width:20px;height:20px;border-radius:50%;flex:none}
.ico-coin{background:radial-gradient(circle at 35% 30%,#fff6c0,#f2c046 45%,#a86a12 80%);box-shadow:inset 0 0 0 2px rgba(120,70,0,.5)}
.ico-ess{background:radial-gradient(circle at 35% 30%,#e8fff8,#6ff0d8 45%,#2a7aa8 85%);border-radius:30% 70% 30% 70%!important;transform:rotate(45deg) scale(.85)}
.chip.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
.tb-btns{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;background:rgba(10,8,24,.78);border:1px solid var(--line);display:grid;place-items:center}
.ib svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.off svg{stroke:#6a6280}
.screen{position:absolute;inset:0;padding:calc(58px + var(--safe-t)) 14px calc(12px + var(--safe-b));display:none;overflow:hidden}
.screen.on{display:flex;flex-direction:column}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(242,196,109,.4) transparent}
h2.title{font:900 clamp(20px,3.4vw,30px)/1.1 var(--fd);letter-spacing:.08em;color:#fff2d0;text-shadow:0 2px 12px rgba(255,190,80,.35)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:14px;font-weight:900;font-size:15px;letter-spacing:.02em;background:linear-gradient(180deg,#3a3060,#241c44);border:1px solid rgba(242,196,109,.45);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);color:#fff3dc;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a336 55%,#b47414);color:#2a1604;border-color:#fff0b8;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.teal{background:linear-gradient(180deg,#7af0d8,#2aa896);color:#06231e;border-color:#c8fff2}
.btn.small{padding:6px 12px;font-size:13px;border-radius:11px}
.btn[disabled],.btn.dis{filter:grayscale(.8) brightness(.6);pointer-events:none}
.btn .ico-coin{width:16px;height:16px;border-radius:50%;display:inline-block}
.back{width:40px;height:40px;border-radius:12px;background:rgba(10,8,24,.8);border:1px solid var(--line);font-size:22px;line-height:1;color:var(--gold);flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:99px;background:rgba(10,8,24,.75);border:1px solid rgba(255,255,255,.12);font-size:12.5px;font-weight:800;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.pill.on{border-color:var(--gold);color:#fff3dc;background:rgba(242,196,109,.16)}
.pill img{width:16px;height:16px}
/* loading */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#2a1d58,#0d0a1c 70%)}
.ld-inner{text-align:center}
.ld-sigil{width:110px;height:120px;margin:0 auto 10px;background-size:contain;background-repeat:no-repeat;animation:float 3s ease-in-out infinite}
.ld-title{font:900 28px var(--fd);letter-spacing:.2em;color:#fff2d0}
.ld-bar{width:220px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:16px auto 8px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff3c0);transition:width .2s}
.ld-msg{color:var(--dim);font-size:13px}
@keyframes float{50%{transform:translateY(-8px)}}
/* hub */
#s-hub{flex-direction:row;align-items:stretch;gap:16px}
.hub-l{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;pointer-events:none}
.hub-logo{font:900 clamp(34px,6vw,72px)/.95 var(--fd);letter-spacing:.06em;color:#fff2d0;text-shadow:0 4px 30px rgba(255,180,70,.45),0 2px 0 #7a4a10}
.hub-logo small{display:block;font-size:.32em;letter-spacing:.42em;color:var(--gold);margin-bottom:6px}
.hub-tag{margin-top:8px;color:#e8dcf8;font-size:14px;max-width:420px;text-shadow:0 1px 6px #000}
.proto{margin-top:10px;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:rgba(10,8,24,.75);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--gold);pointer-events:auto;align-self:flex-start}
.hub-r{width:min(420px,44vw);display:flex;flex-direction:column;gap:9px;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{position:relative;display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:16px;background:linear-gradient(160deg,rgba(48,38,92,.92),rgba(20,16,42,.92));border:1px solid rgba(242,196,109,.38);text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .12s,filter .15s;min-height:64px}
.tile:hover{transform:translateY(-2px);filter:brightness(1.12)}
.tile:active{transform:translateY(1px)}
.tile.big{grid-column:span 2;min-height:84px;background:linear-gradient(160deg,rgba(120,70,20,.95),rgba(60,24,70,.95));border-color:#ffd47a}
.tile .ti{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.28)}
.tile .ti svg{width:26px;height:26px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:800 15px/1.1 var(--fd);letter-spacing:.04em;color:#fff2d6}
.tile.big b{font-size:19px}
.tile span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.tile .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:linear-gradient(#ff8a5a,#e0402a);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;border:2px solid #1a1030;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tile.locked{filter:saturate(.3) brightness(.75);cursor:default}
.tile.locked:hover{transform:none}
.tile .lock{font-size:10.5px;color:#c8bce0}
/* shop */
.shop-wrap{display:flex;gap:14px;flex:1;min-height:0}
.shop-l{flex:1.2;display:flex;flex-direction:column;gap:10px;min-width:0}
.shop-r{flex:1;min-width:0}
.fams{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.fam{padding:8px 4px 7px;border-radius:12px;background:rgba(10,8,24,.75);border:1px solid rgba(255,255,255,.12);text-align:center;font-size:11px;font-weight:800;color:var(--dim)}
.fam img{width:28px;height:28px;display:block;margin:0 auto 3px}
.fam.on{border-color:var(--gold);color:#fff;background:rgba(242,196,109,.14)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{padding:10px;border-radius:14px;background:rgba(10,8,24,.75);border:1px solid rgba(255,255,255,.14);text-align:left}
.tier.on{border-color:var(--gold);background:rgba(242,196,109,.12)}
.tier b{font:800 15px var(--fd);display:block}
.tier small{font-size:11.5px;color:var(--dim);display:block;line-height:1.25}
.odds{width:100%;border-collapse:collapse;font-size:12.5px}
.odds td,.odds th{padding:4px 6px;text-align:right}
.odds th{text-align:left;font-weight:800}
.odds tr+tr td,.odds tr+tr th{border-top:1px solid rgba(255,255,255,.07)}
.buyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.buy{padding:10px 8px;border-radius:14px;background:linear-gradient(180deg,rgba(60,48,110,.9),rgba(30,24,60,.9));border:1px solid var(--line);text-align:center}
.buy b{display:block;font:800 14px var(--fd)}
.buy small{display:block;color:var(--dim);font-size:11px;margin:2px 0 6px}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dcard{text-align:center;font-size:12px}
.dcard img{width:100%;border-radius:8px;display:block;margin-bottom:5px;aspect-ratio:5/7;background:#1a1530}
.pack-prev{height:min(36vh,300px);border-radius:16px}
/* inventory of packs */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 2px 20px}
.invi{position:relative;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}
.invi img{width:100%;max-width:120px;aspect-ratio:3/4.4;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.invi b{display:block;font:800 13px var(--fd)}
.invi small{color:var(--dim);font-size:11.5px}
.invi .cnt{position:absolute;top:8px;right:8px}
/* open screen HUD */
#s-open{pointer-events:none}
#s-open>*:not(.reveal-name):not(.big-banner):not(.tear-meter):not(.open-hint){pointer-events:auto}
#s-open .open-hint{pointer-events:none}
.open-hint{position:absolute;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);padding:9px 18px;border-radius:99px;background:rgba(8,6,20,.72);border:1px solid var(--line);font-weight:800;font-size:14px;width:max-content;max-width:92vw;text-align:center;transition:opacity .3s}
.open-top{position:absolute;top:calc(60px + var(--safe-t));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.open-top>*{pointer-events:auto}
.tear-meter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--safe-b));width:200px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;pointer-events:none}
.tear-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff3c0,var(--gold))}
.reveal-name{position:absolute;left:0;right:0;bottom:calc(66px + var(--safe-b));text-align:center;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(-8px)}
.reveal-name.on{opacity:1;transform:none}
.reveal-name b{display:block;font:900 clamp(18px,3.2vw,30px)/1.1 var(--fd);text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 3px #000}
.reveal-name span{font-weight:900;letter-spacing:.2em;font-size:13px}
.newb{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:8px;background:linear-gradient(#fff36a,#ffb12a);color:#3a1a00;font-weight:900;font-size:13px;letter-spacing:.08em;animation:pop .5s}
.dupb{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:8px;background:rgba(95,224,200,.2);border:1px solid var(--teal);color:#c8fff2;font-weight:900;font-size:12px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}}
.big-banner{position:absolute;left:0;right:0;top:40%;text-align:center;font:900 clamp(34px,8vw,84px) var(--fd);letter-spacing:.1em;pointer-events:none;opacity:0}
.big-banner.go{animation:banner 2.2s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.2);filter:blur(8px)}18%{opacity:1;transform:scale(1);filter:none}75%{opacity:1}100%{opacity:0;transform:scale(.96) translateY(-30px)}}
.summary{position:absolute;inset:calc(58px + var(--safe-t)) 10px calc(10px + var(--safe-b));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(80% 70% at 50% 50%,rgba(20,14,46,.82),rgba(10,8,24,.6));border-radius:20px}
.sum-cards{display:flex;gap:min(1.6vw,14px);justify-content:center;flex-wrap:wrap;max-width:100%}
.sum-card{position:relative;width:clamp(96px,16vw,170px);animation:dealin .45s backwards}
.sum-card img{width:100%;display:block;border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.55)}
.sum-card .newb,.sum-card .dupb{position:absolute;top:-10px;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap}
@keyframes dealin{from{opacity:0;transform:translateY(30px) scale(.9)}}
/* binder */
.binder{flex:1;display:flex;gap:12px;min-height:0}
.b-side{width:250px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0}
.b-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.b-page{flex:1;min-height:0;padding:14px;border-radius:20px;background:linear-gradient(135deg,#2a1e14,#1a120c);border:2px solid #6a4a22;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.4);position:relative;display:flex;flex-direction:column}
.b-page::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(242,196,109,.18);border-radius:15px;pointer-events:none}
.b-grid{flex:1;display:grid;gap:10px;align-content:start;justify-content:center;min-height:0}
.slot{position:relative;aspect-ratio:5/7;border-radius:9px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);cursor:pointer;transition:transform .12s}
.slot:hover{transform:translateY(-3px) scale(1.02);z-index:2}
.slot img{position:absolute;inset:0;width:100%;height:100%;border-radius:9px;display:block;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.slot.missing img{opacity:.85}
.slot .holo{position:absolute;inset:0;border-radius:9px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(160,255,255,.25) 50%,rgba(255,160,240,.25) 55%,transparent 70%);background-size:250% 250%;mix-blend-mode:color-dodge;animation:sheen 4s linear infinite;opacity:.55}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-120% 0}}
.slot .cnt{position:absolute;right:4px;bottom:4px;padding:1px 6px;border-radius:7px;background:rgba(0,0,0,.75);font-weight:900;font-size:11px;color:#fff}
.slot .nb{position:absolute;left:50%;top:-7px;transform:translateX(-50%);padding:1px 6px;border-radius:6px;background:linear-gradient(#fff36a,#ffb12a);color:#3a1a00;font-weight:900;font-size:10px}
.slot .wl{position:absolute;left:5px;bottom:4px;font-size:14px;color:#ff8ac8;text-shadow:0 1px 3px #000}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.pager span{font-weight:800;color:var(--dim);font-size:13px;min-width:90px;text-align:center}
.prog{padding:8px 10px;border-radius:12px;background:rgba(10,8,24,.7);border:1px solid rgba(255,255,255,.08)}
.prog .pt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px}
.prog .pt img{width:18px;height:18px}
.prog .pt em{margin-left:auto;font-style:normal;color:var(--dim)}
.pbar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px}
.steps{display:flex;gap:4px;margin-top:6px}
.steps button{flex:1;font-size:10.5px;font-weight:900;padding:3px 0;border-radius:7px;background:rgba(255,255,255,.06);color:#8a82a0}
.steps button.ready{background:linear-gradient(#ffe08a,#d09030);color:#2a1604;animation:glowp 1.4s infinite}
.steps button.claimed{color:var(--good)}
@keyframes glowp{50%{box-shadow:0 0 10px #ffd070}}
.filters{display:flex;flex-direction:column;gap:6px}
select.sel{width:100%;padding:7px 9px;border-radius:10px;background:#1a1532;color:var(--ink);border:1px solid rgba(255,255,255,.15);font:800 13px var(--fu)}
.b-sidebox{padding:10px;flex:none}
/* viewer */
#viewer{position:fixed;inset:0;z-index:20;background:rgba(6,4,16,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b))}
.vw{display:flex;gap:22px;align-items:center;max-width:1100px;width:100%;max-height:100%}
.vw-card{perspective:1200px;flex:none;position:relative}
.vw-inner{position:relative;width:min(360px,40vw,calc((100vh - 120px)/1.4));aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vw-inner.flipped{transform:rotateY(180deg)}
.vw-face,.vw-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.vw-face canvas{width:100%;height:100%;display:block}
.vw-back{transform:rotateY(180deg);background:linear-gradient(160deg,#241a48,#120c28);border:3px solid #c8a050;padding:16px;overflow-y:auto;font-size:13px}
.foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .3s}
.vw-face.zoom{cursor:zoom-out}
.vw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 40px);overflow-y:auto}
.vw-3d{height:min(300px,38vh);border-radius:18px;border:1px solid var(--line);background:radial-gradient(70% 80% at 50% 70%,rgba(120,90,200,.35),rgba(10,8,24,.6));position:relative;touch-action:none;cursor:grab}
.vw-3d::after{content:"Drag to rotate";position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--dim)}
.vw-name{font:900 clamp(20px,3vw,30px)/1.1 var(--fd)}
.vw-actions{display:flex;gap:8px;flex-wrap:wrap}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{padding:6px 4px;border-radius:10px;background:rgba(0,0,0,.3);text-align:center;font-weight:900}
.stat img{width:18px;height:18px;display:block;margin:0 auto 2px}
.stat small{display:block;font-size:10px;color:var(--dim);font-weight:800}
.ab{padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.ab b{display:block;font-size:14px}
.ab span{font-size:13px;color:#ddd4e8}
.copies{display:flex;flex-direction:column;gap:6px}

/* ---------- save model ----------

/* light procedural music: soft pad + plucked arpeggio, two moods */
const MUSIC = {
  hub: { bpm: 84, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], arp: [0, 1, 2, 1, 2, 0, 1, 2] },
  battle: { bpm: 118, prog: [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 49, 52]], arp: [0, 2, 1, 2, 0, 2, 1, 0] }
};
function startMusic() {
  if (AU.musicTimer || !AU.ctx) return;
  AU.nextT = AU.ctx.currentTime + 0.2;
  AU.musicTimer = setInterval(musicTick, 120);
}
function setMood(m) { AU.mood = m; }
function musicTick() {
  const c = AU.ctx;
  if (!c || c.state !== 'running') return;
  const M = MUSIC[AU.mood] || MUSIC.hub, beat = 60 / M.bpm / 2;
  while (AU.nextT < c.currentTime + 0.4) {
    const t = AU.nextT, step = AU.step, bar = Math.floor(step / 8) % M.prog.length, ch = M.prog[bar];
    if (S.settings.music) {
      if (step % 8 === 0) for (const n of ch) mTone(NOTE(n), beat * 8.5, 0.05, 'triangle', t, 0.6);
      if (step % 8 === 0) mTone(NOTE(ch[0] - 12), beat * 8, 0.09, 'sine', t, 0.1);
      const n = ch[M.arp[step % 8]] + 12 + (step % 16 >= 8 ? 12 : 0);
      if ((step * 7) % 5 !== 3) mTone(NOTE(n), beat * 1.8, 0.035, 'sine', t, 0.005);
    }
    AU.step++; AU.nextT += beat;
  }
}
function mTone(f, dur, vol, type, t, attack) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.music); o.start(t); o.stop(t + dur + 0.05);
}
function vibrate(ms) { try { if (navigator.vibrate && IS_TOUCH) navigator.vibrate(ms); } catch (e) {} }

/* ---------- main renderer, scene switching, adaptive resolution, hub backdrop ---------- */

const SC = { cur: null, all: {}, t: 0, last: 0, needs: true, fpsAcc: 0, fpsN: 0, frameLog: null, overlay: null };
function initMain() {

  GFX.dpr = GFX.maxDpr;
  window.addEventListener('resize', onResize);

  requestAnimationFrame(loop);
}
function onResize() {

  GFX.r.setSize(GFX.w, GFX.h, false);

function setScene(name) {

  SC.cur = nx;
  if (nx && nx.enter) nx.enter();
  if (nx && nx.resize) nx.resize(GFX.w, GFX.h);

}
function loop(now) {

}
function frame(dt, ms) {

  if (!live) return;
  const w0 = performance.now();
  if (cur && cur.update) cur.update(dt, SC.t);
  const r = GFX.r;
  if (cur && (cur.live || SC.needs)) r.render(cur.scene, cur.camera);
  if (SC.overlay) SC.overlay.draw(dt, SC.t);

function oddsTable(t) {
  const T = TIER[t];
  let h = '<table class="odds"><tr><th></th><th>Cards 1-4</th><th>Card 5</th><th>Per pack*</th></tr>';
  for (let r = 0; r < 6; r++) {
    const a = T.base[r], b = T.last ? T.last[r] : T.base[r];
    const tot = T.base.reduce((x, y) => x + y, 0), tot2 = T.last ? T.last.reduce((x, y) => x + y, 0) : tot;
    const pA = a / tot, pB = b / tot2, per = 1 - Math.pow(1 - pA, 4) * (1 - pB);
    h += `<tr><th style="color:${RAR[r].col}">${RAR[r].name}</th><td>${a}%</td><td>${b}%</td><td>${(per * 100).toFixed(per < 0.1 ? 1 : 0)}%</td></tr>`;
  }
  return h + '</table><div class="sub" style="margin-top:4px">*Chance of at least one card of that rarity. Rarity is rolled first; you then get a character you do not own yet whenever one is left in that rarity.</div>';
}

/* ---------- the pack opening: 3D foil packs, tearing, themed particles, card reveals; and box opening ---------- */

const PW = 2.2, PH = 3.5, CRIMP = 0.085, TEAR = 0.862;
const OPEN = { scene: null, leave: null };
const TWEENS = [];
function tween(dur, fn, ease) {
  return new Promise(res => TWEENS.push({ t: 0, dur, fn, ease: ease || (k => k), res }));
}
function runTweens(dt) {
  for (let i = TWEENS.length - 1; i >= 0; i--) {
    const w = TWEENS[i];
    w.t += dt;
    const k = Math.min(1, w.t / w.dur);
    w.fn(w.ease(k));
    if (k >= 1) { TWEENS.splice(i, 1); w.res(); }
  }
}
function flash(op, ms, col) {
  const f = $('#flash');
  f.style.background = col || '#fff';
  f.style.transition = 'none'; f.style.opacity = op;
  void f.offsetWidth;
  f.style.transition = `opacity ${ms}ms ease-out`; f.style.opacity = 0;
}

/* printed pack artwork (also used for shop thumbnails) */
const FAM_STYLE = {
  dragonfire: ['#ff8a2a', '#5a0e06', '#2a0402'], wildheart: ['#8ae05a', '#0f4a22', '#03180a'], stoneforge: ['#ffc46a', '#4a3a2e', '#16100c'],
  deeptide: ['#5ff2ff', '#0a3a6a', '#020e20'], starfall: ['#d8c8ff', '#2a2a7a', '#06061e'], gloomveil: ['#7dffb8', '#3a1a58', '#0a0414']
};
function drawPackFront(x, W, H, fam, tier, flatEdges, art) {
  const F = FAMILY[fam], f = FAC[F.fac], T = TIER[tier], st = FAM_STYLE[fam], R = rng(hashStr(fam));
  const cr = H * CRIMP;
  x.clearRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, st[2]); g.addColorStop(0.45, st[1]); g.addColorStop(1, st[2]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W / 2, H * 0.47); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 28; i++) { x.rotate(Math.PI / 14); x.fillStyle = hexA(st[0], 0.05); x.beginPath(); x.moveTo(0, 0); x.lineTo(H, -H * 0.06); x.lineTo(H, H * 0.06); x.fill(); }
  x.restore();
  x.globalAlpha = 0.18;
  for (let i = 0; i < 26; i++) drawCrestSymbol(x, F.fac, R() * W, cr + R() * (H - cr * 2), 10 + R() * 18, st[0]);
  x.globalAlpha = 1;
  const ax = W * 0.12, ay = H * 0.27, aw = W * 0.76, ah = H * 0.4;
  const glow = x.createRadialGradient(W / 2, ay + ah * 0.55, 10, W / 2, ay + ah * 0.55, aw * 0.75);
  glow.addColorStop(0, hexA(st[0], 0.75)); glow.addColorStop(1, hexA(st[0], 0));
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  x.save();
  x.beginPath(); x.moveTo(ax, ay + ah); x.lineTo(ax, ay + aw * 0.5); x.arc(W / 2, ay + aw * 0.5, aw / 2, Math.PI, 0); x.lineTo(ax + aw, ay + ah); x.closePath();
  x.fillStyle = hexA(st[2], 0.6); x.fill(); x.clip();
  if (art && art.naturalWidth) { const sc = Math.max(aw / art.naturalWidth, ah / art.naturalHeight) * 1.05; x.drawImage(art, W / 2 - art.naturalWidth * sc / 2, ay + ah - art.naturalHeight * sc * 0.98, art.naturalWidth * sc, art.naturalHeight * sc); }
  else { drawCrest(x, F.fac, W / 2, ay + ah * 0.55, aw * 0.3); }
  x.restore();
  x.strokeStyle = T.col; x.lineWidth = W * 0.014;
  x.beginPath(); x.moveTo(ax, ay + ah); x.lineTo(ax, ay + aw * 0.5); x.arc(W / 2, ay + aw * 0.5, aw / 2, Math.PI, 0); x.lineTo(ax + aw, ay + ah); x.stroke();
  drawSigil(x, W / 2, cr + H * 0.075, W / 520);
  x.textAlign = 'center'; x.fillStyle = '#fff4dc'; x.shadowColor = 'rgba(0,0,0,0.7)'; x.shadowBlur = W * 0.02;
  x.font = `900 ${W * 0.085}px ${FONT_D}`; x.fillText('MYTHIC ARMIES', W / 2, cr + H * 0.165);
  x.font = `900 ${W * 0.13}px ${FONT_D}`;
  const nm = F.name.toUpperCase();
  fitFont(x, nm, W * 0.86, W * 0.13, 900, FONT_D);
  x.fillStyle = st[0]; x.fillText(nm, W / 2, ay + ah + H * 0.075);

/* ---------- army builder: six slots on a front and back row, faction synergies, 3D line-up ---------- */

const AR = { sel: -1, sort: 'power' };
function cardByUid(uid) { return S.cards.find(c => c.uid === uid); }
function cleanArmy() { S.army = S.army.map(u => (u && cardByUid(u) ? u : null)); }
function synergies(ids) {
  const cnt = {};
  for (const id of ids) { const f = CHAR[id].fac; cnt[f] = (cnt[f] || 0) + 1; }
  return FACTIONS.map(f => ({ f, n: cnt[f.id] || 0, tier: (cnt[f.id] || 0) >= 4 ? 2 : (cnt[f.id] || 0) >= 2 ? 1 : 0 })).filter(x => x.n);
}
function synText(s) { const v = s.tier === 2 ? s.f.syn.b : s.f.syn.a; return s.f.syn.k === 'regen' ? `${(v * 100).toFixed(1)}% ${s.f.syn.text}` : `+${Math.round(v * 100)}% ${s.f.syn.text}`; }
function unitPower(uid) { const inst = cardByUid(uid), u = unitOf(uid), c = CHAR[inst.charId]; return powerOf(statsFor(c, u.lvl, u.star), c); }
function armyPower() { return S.army.filter(Boolean).reduce((a, u) => a + unitPower(u), 0); }
function autoArmy() {
  const by = {};
  for (const inst of S.cards) { const p = unitPower(inst.uid); if (!by[inst.charId] || p > by[inst.charId].p) by[inst.charId] = { uid: inst.uid, p }; }
  const best = Object.values(by).sort((a, b) => b.p - a.p).slice(0, 6).map(x => x.uid);
  S.army = [null, null, null, null, null, null];
  const melee = best.filter(u => CHAR[cardByUid(u).charId].rng < 2), ranged = best.filter(u => CHAR[cardByUid(u).charId].rng >= 2);
  const front = [1, 0, 2], back = [4, 3, 5];
  for (const u of melee) { const s = front.find(i => !S.army[i]) ?? back.find(i => !S.army[i]); S.army[s] = u; }
  for (const u of ranged) { const s = back.find(i => !S.army[i]) ?? front.find(i => !S.army[i]); S.army[s] = u; }
  save();
}

    l.el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%) scale(${l.t < 0.1 ? 0.6 + l.t * 4 : 1})`;
    l.el.style.opacity = l.t > l.d * 0.6 ? 1 - (l.t - l.d * 0.6) / (l.d * 0.4) : 1;
    if (l.t > l.d) { l.el.remove(); V.labels.splice(i, 1); }
  }
  V.P.update(dt);
}
function finishBattle() {
  if (BT.done) return;
  BT.done = true;
  const B = BT.B, st = BT.stage, win = B.winner === 0;
  const mine = B.units.filter(u => u.side === 0);
  const first = win && !S.campaign.cleared[st.n];
  const rw = win ? (first ? st.reward : st.repeat) : { coins: 10, essence: 3 };
  S.stats.battles++; if (win) S.stats.wins++;
  const dmg = mine.reduce((a, u) => a + u.dmg, 0);
  S.stats.damage += dmg;
  questEvent('battle', 1); questEvent('dmg', Math.round(dmg));
  if (win) { questEvent('win', 1); const cnt = {}; for (const u of mine) cnt[u.c.fac] = (cnt[u.c.fac] || 0) + 1; if (Object.values(cnt).some(n => n >= 3)) questEvent('facwin', 1); }
  S.coins += rw.coins; S.essence += rw.essence;
  let packMsg = '';
  if (first) { S.campaign.cleared[st.n] = Date.now(); if (rw.pack) { addPack(rw.pack.family, rw.pack.tier, 'reward'); packMsg = `${FAMILY[rw.pack.family].name} ${TIER[rw.pack.tier].name} pack`; } }
  const xp = win ? 30 + st.n * 3 : 12 + st.n;
  const ups = [];
  for (const u of mine) { const before = unitOf(u.uid).lvl, n = addXp(u.uid, xp); if (n) ups.push(`${u.c.short} Lv ${before} → ${before + n}`); }
  saveNow();
  refreshCurrency();
  const mvp = mine.slice().sort((a, b) => (b.dmg + b.heal * 0.8) - (a.dmg + a.heal * 0.8))[0];
  setTimeout(() => {
    if (UI.screen !== 'battle') return;
    const V = SC.all.battle;
    BT.resultShown = true;
    for (const h of V.hp.values()) h.style.display = 'none';
    for (const l of V.labels) l.el.remove();
    V.labels = [];
    win ? SFX.win() : SFX.lose();
    const s = $('#s-battle');
    const box = el('div', 'result');
    box.innerHTML = `<div class="res-box panel"><div class="res-title ${win ? 'win' : 'lose'}">${win ? 'VICTORY' : 'DEFEAT'}</div>
      <div class="sub">Stage ${st.n} · ${esc(st.name)}${first ? ' · First clear!' : ''}</div>
      ${mvp ? `<div class="mvp"><img id="mvpImg" alt=""><div style="text-align:left"><span class="tag" style="color:var(--gold)">MVP</span><div style="font:900 18px var(--fd)">${esc(mvp.c.name)}</div><div class="sub">${fmt(mvp.dmg)} damage${mvp.heal ? ' · ' + fmt(mvp.heal) + ' healing' : ''}</div></div></div>` : ''}
      <div class="rew"><span class="chip coin"><i class="ico-coin"></i>+${fmt(rw.coins)}</span><span class="chip ess"><i class="ico-ess"></i>+${rw.essence}</span>${packMsg ? `<span class="chip" style="color:var(--gold)">+ ${packMsg}</span>` : ''}</div>
      <div class="xp-list"><span class="tag">+${xp} XP to each unit</span>${ups.map(u => `<span class="tag" style="color:var(--good)">${esc(u)}</span>`).join('')}</div>
      ${win ? '' : '<p class="sub" style="margin-top:8px">Tip: train units with Essence, open more packs, or put sturdier units in the front row.</p>'}
      <div class="bar" style="justify-content:center;margin-top:14px" id="resBtns"></div></div>`;
    s.appendChild(box);
    if (mvp) cardThumb(mvp.c.id, 'std', false).then(u => { const i = $('#mvpImg'); if (i) i.src = u; });
    const bb = box.querySelector('#resBtns');
    const nx = STAGES[st.n];
    if (win && nx) { const b = el('button', 'btn gold', 'Next stage ›'); b.onclick = () => { SFX.click(); stageModal(nx); }; bb.appendChild(b); }
    const rb = el('button', 'btn' + (win ? '' : ' gold'), win ? 'Fight again' : 'Retry'); rb.onclick = () => { SFX.click(); startBattle(st); };
    const mb = el('button', 'btn', 'Campaign'); mb.onclick = () => { SFX.click(); go('map'); };
    const ab = el('button', 'btn', 'Army'); ab.onclick = () => { SFX.click(); go('army'); };
    bb.append(rb, mb, ab);
    if (packMsg) { const pb = el('button', 'btn teal', 'Open pack'); pb.onclick = () => { SFX.click(); go('packs'); }; bb.appendChild(pb); }
    checkAchToasts();
    guideCheck();
  }, win ? 700 : 500);
}

/* ===== 12-main.js ===== */
/* ---------- boot, first-time guide, test hooks ---------- */

const GUIDE = [
  { at: ['hub'], t: 'Welcome to Mythic Armies!', d: 'A free Starter Box is waiting for you. Tap <b>Open Packs</b> to begin.', hl: '#tPacks' },
  { at: ['packs'], t: 'Your Starter Box', d: 'Tap the box to open it. It holds four packs of five cards each.', hl: '.invi' },
  { at: ['open'], t: 'Rip it open!', d: 'Drag across the shiny top seam of the pack to tear it, or press and hold. Then tap each card to flip it. Better cards glow before they flip!', hl: null },
  { at: ['hub', 'packs', 'binder'], t: 'Your collection', d: 'Open <b>Collection</b> to browse your cards, tilt the shiny ones and look at their 3D models.', hl: '#tBinder' },
  { at: ['hub', 'army'], t: 'Build an army', d: 'Go to <b>Army</b> and press <b>Auto-fill</b>, or tap cards to place up to six units. Melee units go in front.', hl: '#tArmy' },
  { at: ['hub', 'army', 'map'], t: 'To battle!', d: 'Open the <b>Campaign</b> and fight stage 1. Your units fight on their own. Wins earn coins for more packs.', hl: '#tMap' }
];
function guideCheck() {
  const g = $('#guide');
  $$('.pulse-hl').forEach(e => e.classList.remove('pulse-hl'));
  if (!S || S.guide >= GUIDE.length) { g.hidden = true; return; }
  if (S.guide === 0 && !S.items.length && S.stats.packs > 0) S.guide = 3;
  if (S.guide === 1 && !S.items.some(i => i.type === 'box')) S.guide = 2;
  if (S.guide === 2 && S.stats.packs > 0 && UI.screen !== 'open') S.guide = 3;
  if (S.guide === 3 && UI.screen === 'binder') S.guide = 4;
  if (S.guide === 4 && S.army.some(Boolean)) S.guide = 5;
  if (S.guide === 5 && S.stats.battles > 0) { S.guide = GUIDE.length; save(); g.hidden = true; toast('Guide complete! Win battles, buy packs and finish quests.', 'quest'); return; }
  const st = GUIDE[S.guide];
  const where = UI.screen;
  if (!st.at.includes(where) || (where === 'open' && SC.all.open.state !== 'idle' && S.guide === 2)) { g.hidden = true; return; }
  let hl = st.hl, txt = st.d;
  if (S.guide === 4 && where === 'army') { hl = '.bar .btn.small'; txt = 'Press <b>Auto-fill</b> to place your strongest units, or tap cards on the right.'; }
  if (S.guide === 5 && where === 'army') { hl = '#armyFight'; txt = 'Your army is ready. Press <b>Battle</b>!'; }
  if (S.guide === 5 && where === 'map') { hl = '.node.next'; txt = 'Tap stage 1, then <b>Fight!</b>'; }
  g.innerHTML = `<b>${st.t}</b>${txt}<div class="gbtns"><button class="btn small" id="gSkip">Skip guide</button></div>`;
  g.hidden = false;
  $('#gSkip').onclick = () => { S.guide = GUIDE.length; save(); guideCheck(); };
  if (hl) setTimeout(() => { const e = $(hl); if (e) e.classList.add('pulse-hl'); }, 60);
  save();
}

async function boot() {
  const bar = $('.ld-bar i'), step = p => { bar.style.width = p + '%'; };
  let fresh = false;
  try { fresh = !localStorage.getItem(SAVE_KEY); } catch (e) { fresh = true; }
  loadSave();
  if (fresh) {
    addBox('Starter Box', [{ family: 'dragonfire', tier: 'standard' }, { family: 'wildheart', tier: 'standard' }, { family: 'deeptide', tier: 'standard' }, { family: 'starfall', tier: 'greater' }], 'starter');
    saveNow();
  }
  step(10);
  $('.ld-sigil').style.backgroundImage = `url(${iconURL('sigil', 0, 60)})`;
  $('.brand-sigil').style.backgroundImage = `url(${iconURL('sigil', 0, 40)})`;
  if (typeof THREE === 'undefined') { $('.ld-msg').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }
  initMaterials();
  initMain();
  initArt();
  step(30);
  SC.all.hub = makeHubScene();
  SC.all.open = makeOpenScene();
  SC.all.army = makeArmyScene();
  SC.all.battle = makeBattleScene();
  SC.all.battle.update = battleView;
  openPointer(SC.all.open);
  onResize();
  ensureQuests(); dailyOffers();
  step(50);
  setToggles();
  $('#btnSfx').onclick = () => { setSfx(!S.settings.sfx); setToggles(); SFX.click(); };
  $('#btnMusic').onclick = () => { setMusic(!S.settings.music); setToggles(); };
  $('#btnHome').onclick = () => { if (UI.screen === 'battle' && !BT.done) return; SFX.back(); go('hub'); };
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#viewer').hidden && VW.close) VW.close();
    else if (!$('#modal').hidden) $('#modal').hidden = true;
  });
  try { await Promise.race([document.fonts ? Promise.all([document.fonts.load(`700 30px Cinzel`), document.fonts.load(`900 30px Cinzel`), document.fonts.load(`800 20px Nunito`)]) : 0, wait(2500)]); } catch (e) {}
  step(70);
  const best = S.cards.map(c => CHAR[c.charId]).sort((a, b) => b.r - a.r)[0];
  await getArt(best ? best.id : 'em27');
  step(100);
  refreshCurrency();
  go('hub');
  setTimeout(() => { $('#loading').style.transition = 'opacity .4s'; $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 450); }, 150);
}

/* hooks for automated tests: the page's own pack logic, run on a scratch inventory */
window.MA = {
  get S() { return S; }, SC, CHARS, RAR, TIERS, FAMILIES, STAGES, go, openPack, openBox, startBattle, skipBattle, rollPack, buyPacks, claimQuest, openViewer,
  frames(on) { if (on) SC.frameLog = []; else { const f = SC.frameLog || []; SC.frameLog = null; return f; } },
  simulate(n, fam, tier) {
    const owned = {}, counts = [0, 0, 0, 0, 0, 0], seen = new Set();
    let pity = 0, firstDup = 0, dupInPack = 0, cards = 0, pityHits = 0, firstDupCards = 0;
    for (let i = 0; i < n; i++) {
      const f = fam || FAMILIES[i % FAMILIES.length].id;
      const res = rollPack(f, tier || 'standard', owned, pity);
      pity = res.pity; if (res.pityHit) pityHits++;
      const ids = new Set(res.cards.map(c => c.id));
      if (ids.size !== 5) dupInPack++;
      for (const c of res.cards) {
        cards++;
        counts[c.r]++;
        if (owned[c.id] && !firstDup) { firstDup = i + 1; firstDupCards = cards; }
        owned[c.id] = (owned[c.id] || 0) + 1;
        seen.add(c.id);
      }
    }
    return { packs: n, cards, counts, pct: counts.map(x => +(x / cards * 100).toFixed(2)), dupInPack, firstDupPack: firstDup, firstDupCard: firstDupCards, distinct: seen.size, pityHits };
  },
  openHeadless(n, tier) { const out = []; for (let i = 0; i < n; i++) { const it = addPack(FAMILIES[i % 6].id, tier || 'standard', 'test'); out.push(openPackItem(it).reveal.map(r => r.c.id)); } refreshCurrency(); return out; },
  testReveal(ids, fam) { const reveal = ids.map(id => ({ c: CHAR[id], r: CHAR[id].r, isNew: true, ess: 0, variant: 'std' })); openPack({ iid: 'test', family: fam || 'starfall', tier: 'grand' }, { reveal, pityHit: false }); },
  autoArmy() { autoArmy(); },
  simBattle(n) { const B = newBattle(STAGES[n]); B.fx = null; let k = 0; while (!B.over && k++ < 9000) stepBattle(B); return { w: B.winner, t: Math.round(B.t), alive: B.units.filter(u => u.alive && u.side === 0).length }; },
  wipe() { NO_SAVE = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  manual(on) { SC.manual = !!on; },
  tick(dt) { frame(dt, dt * 1000); },
  state() { return { screen: UI.screen, open: SC.all.open && SC.all.open.state, battle: BT.B ? { over: BT.B.over, t: BT.B.t, winner: BT.B.winner } : null, dpr: GFX.dpr, frameMs: GFX.frameMs }; }
};
boot().catch(e => { console.error(e); const m = $('.ld-msg'); if (m) m.textContent = 'Something went wrong while loading: ' + e.message; });

})();
