<style>

<script>
window.CATALOG=[
{id:'baggage-panic',title:'Baggage Panic',genre:'Packing puzzle',color:'#f6b765',desc:'A suitcase, a pile of strange belongings, and absolutely no spare room.',how:['Tap a belonging, then tap a suitcase square to place it.','Rotate with R or the Rotate button. Tap a packed item to take it back out (Z undoes).','Pack all the items without overlaps. Crossed-out squares stay empty.'],goal:'Pack every suitcase as they grow bigger, and earn three stars for a perfect pack.'},
{id:'switchyard',title:'Switchyard',genre:'Train dispatch',color:'#b7df94',desc:'Three junctions. Two destinations. Keep the whole railway moving.',how:['Tap a numbered junction (or press 1 to 3) to flip its exit.','Send each train to the station that matches its color.','Wrong deliveries cost signal lives. Finish a shift to unlock the next.'],goal:'Finish the Morning, Afternoon and Night shifts, then see how long you last in Endless.'},
{id:'potion-protocol',title:'Potion Protocol',genre:'Deduction lab',color:'#c6a7ff',desc:'Decode a secret recipe, one carefully measured experiment at a time.',how:['Tap ingredients in order (or press 1 to 8), then press Test recipe.','Solid dot: right ingredient, right slot. Hollow dot: right ingredient, wrong slot.','Switch rank with the Rank button. Daily mode has one recipe for everyone.'],goal:'Crack secret recipes at Apprentice, Alchemist and Archmage rank.'},
{id:'pocket-jury',title:'Pocket Jury',genre:'Courtroom deduction',color:'#e3ad8c',desc:'Small cases. Big contradictions. Is the evidence actually convincing?',how:['Read the case brief, then open each evidence card.','Select the piece that settles the case, then return a verdict.','A correct verdict earns points; choosing the decisive evidence earns a bonus.'],goal:'Close all sixteen cases across two dockets.'},
{id:'circuit-courier',title:'Circuit Courier',genre:'Robot programming',color:'#8ce6b5',desc:'Write a tiny program. Let a very literal robot do the delivery.',how:['Add Forward, Turn left, and Turn right commands. The robot begins facing right.','Use Repeat to run the whole program 1–6 times; the delivery can finish mid-loop.','Press Run. Reach the parcel first, then the green destination. Avoid blocked tiles.'],goal:'Solve all sixteen routes with short programs for three stars.'},
];

'use strict';
/* Pulsebox Originals engine: a 960x600 canvas game in a page that fills the screen (or the hub's frame).

const C = document.getElementById('game'), ctx = C.getContext('2d'), W = 960, H = 600;

const FONT = 'Nunito, system-ui, -apple-system, "Segoe UI", sans-serif';
let state, paused = true, started = false, last = 0, totalTime = 0, keys = {}, pointer = { x: 0, y: 0, down: false }, audioCtx = null, soundOn = true, buttons = [], uiKey = '', hover = null;
try { soundOn = localStorage.getItem('pbx-pack-sound') !== '0'; } catch (e) {}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t, dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ---------- drawing helpers ---------- */
// rounded panels get depth for free: a soft top-to-bottom gradient, a thin top highlight, and a drop shadow when big
const isHex = c => typeof c === 'string' && c.length === 7 && c[0] === '#';
function rr(x, y, w, h, r, fill, stroke) {

      else if (w * h > 1500) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; ctx.fill(); ctx.restore(); }

}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
// discs and balls get a soft shine from the top left
function circle(x, y, r, c, stroke) {

function line(x, y, xx, yy, c, width = 3) { ctx.strokeStyle = c; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(xx, yy); ctx.stroke(); }

}
function wrap(s, x, y, max, size = 18, c = '#f5f0e4', lh = 27) {
  ctx.font = `600 ${size}px ${FONT}`; let row = '', yy = y;

  text(row, x, yy, size, c, 'left', 600); return yy + lh;
}
function pill(s, x, y, c = '#d4fa82') { ctx.font = `700 12px ${FONT}`; rr(x, y, ctx.measureText(s).width + 24, 28, 14, '#25303a'); text(s, x + 12, y + 14, 12, c, 'left', 700); }
// the backdrop: base color, a pool of light in the game's accent color, fine grain, and a vignette
let grain = null;
function board(bg = '#19242b') {
  rect(0, 0, W, H, bg);
  if (!grain) { const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), r = rng(3); for (let i = 0; i < 2600; i++) { g.fillStyle = r() < .5 ? `rgba(255,255,255,${r() * .05})` : `rgba(0,0,0,${r() * .09})`; g.fillRect(r() * 160, r() * 160, 1 + r() * 1.5, 1 + r() * 1.5); } grain = ctx.createPattern(c, 'repeat'); }
  const glow = ctx.createRadialGradient(W * .5, -60, 40, W * .5, 40, W * .8); glow.addColorStop(0, META.color + '2a'); glow.addColorStop(1, META.color + '00'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .42, 120, W / 2, H / 2, W * .72); g.addColorStop(0, 'rgba(255,255,255,.04)'); g.addColorStop(1, 'rgba(0,0,0,.42)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function heading(a, b, c = META.color) {
  ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = 10; circle(40, 37, 4, c); ctx.restore();
  text(a, 52, 37, 15, c, 'left', 900); text(b, 926, 37, 13, '#aeb7c5', 'right', 700);
  const g = ctx.createLinearGradient(32, 0, 928, 0); g.addColorStop(0, c + '66'); g.addColorStop(.5, '#ffffff1a'); g.addColorStop(1, '#ffffff05'); ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(32, 65); ctx.lineTo(928, 65); ctx.stroke();
}
// a button drawn on the canvas: it lifts and brightens under the pointer and dips when pressed
function btn(label, x, y, w, h, fn, color = '#303b46') {
  const on = hover && hover.x === x && hover.y === y && hover.w === w, dn = on && pointer.down, oy = dn ? 2 : on ? -1 : 0;
  rr(x, y + 4, w, h, 10, 'rgba(0,0,0,.35)');
  if (on) { ctx.save(); ctx.shadowColor = META.color; ctx.shadowBlur = 14; rr(x, y + oy, w, h, 10, color); ctx.restore(); }
  const c = isHex(color) ? color : '#303b46', g = ctx.createLinearGradient(0, y + oy, 0, y + oy + h); g.addColorStop(0, shade(c, on ? .3 : .2)); g.addColorStop(1, shade(c, -.12));

}
// the end of a game: a card with a replay button, and a celebration (once per game)
let doneFor = null;
function done(title, sub) {
  if (doneFor !== state) { doneFor = state; celebrate(!/interrupt|locked|lost|fail|over|bust|out of/i.test(title)); }
  rect(0, 0, W, H, 'rgba(8,10,16,.55)');
  ctx.save(); ctx.shadowColor = META.color; ctx.shadowBlur = 40; rr(180, 182, 600, 232, 22, '#111921'); ctx.restore();

function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => Math.round(clamp(k < 0 ? v * (1 + k) : v + (255 - v) * k, 0, 255)); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }

/* ---------- juice: particles, pop-up text, ripples, shake ---------- */
const FX = { parts: [], pops: [], rings: [], shake: 0 };
function burst(x, y, cols = [META.color, '#ffffff'], n = 16, sp = 240) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (.3 + Math.random() * .7); FX.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, life: .7 + Math.random() * .5, max: 1.2, c: cols[i % cols.length], s: 3 + Math.random() * 4, g: 520, rot: Math.random() * 6, conf: false }); } }

function celebrate(win) {
  if (win) { confetti(); chord([523, 659, 784, 1047]); shake(8); }
  else { tone(330, .25, 'triangle', .05); tone(247, .4, 'triangle', .05, .18); }
}

/* ---------- sound: small synthesized tones (on by default; the toggle remembers your choice) ---------- */
function ac() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function tone(freq, dur = .1, type = 'triangle', vol = .05, delay = 0) {
  if (!soundOn || !started) return; const a = ac(); if (!a) return;
  try { const t0 = a.currentTime + delay, o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(); o.type = type; o2.type = 'sine'; o.frequency.value = freq; o2.frequency.value = freq * 2;
    const g2 = a.createGain(); g2.gain.value = .25; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .05);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + .08); o2.stop(t0 + dur + .08); } catch (e) {}
}
const chord = (fs, gap = .07) => fs.forEach((f, i) => tone(f, .18, 'triangle', .045, i * gap));
function beep(freq = 440, duration = .08) {
  tone(freq, duration, freq < 260 ? 'sawtooth' : 'triangle', freq < 260 ? .035 : .05);
  // the games beep high when something goes right and low when it goes wrong: give each a little feedback
  if (!started) return; if (freq >= 780) { burst(pointer.x, pointer.y, [META.color, '#ffffff', '#ffd23f'], 12, 200); tone(freq * 1.5, .1, 'triangle', .03, .06); } else if (freq < 260) shake(7);
}

/* ---------- the page around the canvas ---------- */
function status(s) { const el = document.getElementById('status'); if (el.textContent === s) return; el.textContent = s; el.classList.remove('show'); void el.offsetWidth; if (s) { el.classList.add('show'); clearTimeout(status.t); status.t = setTimeout(() => el.classList.remove('show'), 3600); } }
let lastMetric = null;
function metric(s) {
  const el = document.getElementById('metric'); if (el.textContent === s) return; el.textContent = s;
  // a number going up (that isn't a percentage or money) is worth a little celebration
  const m = /^[^\d-]*(-?\d+)/.exec(s), n = m ? +m[1] : null;
  if (started && lastMetric != null && n != null && n > lastMetric && !/%|\$|test|fold/i.test(s)) { popText(clamp(pointer.x, 80, W - 80), clamp(pointer.y - 30, 90, H - 40), '+' + (n - lastMetric)); burst(pointer.x, pointer.y, [META.color, '#ffffff', '#ffd23f'], 14, 220); chord([660, 880], .06); }
  lastMetric = n; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function controls(html) { if (uiKey !== html) { document.getElementById('controls').innerHTML = html; uiKey = html; } }
function action(label, name, primary = false) { return `<button ${primary ? 'class="primary"' : ''} data-action="${name}">${label}</button>`; }
// progress that survives a reload (levels unlocked, stars, seasons): one small JSON object per game
function loadSave(def) { try { return Object.assign(def, JSON.parse(localStorage.getItem('pbx-pack-save-' + ID) || '{}')); } catch (e) { return def; } }
function storeSave(v) { try { localStorage.setItem('pbx-pack-save-' + ID, JSON.stringify(v)); } catch (e) {} }
function stars(n, x, y, size = 22, max = 3) { for (let i = 0; i < max; i++) text('★', x + (i - (max - 1) / 2) * size * 1.15, y, size, i < n ? '#ffd23f' : '#ffffff30', 'center', 900); }
function saveBest(value) {
  // tell the hub (profiles and leaderboards) about the score
  try { if (value > 0 && window.parent !== window) window.parent.postMessage({ pbx: 'score', score: Math.floor(value) }, location.origin); } catch (e) {}
  try { const key = 'pbx-pack-' + ID; const old = Number(localStorage.getItem(key) || 0); if (value > old) localStorage.setItem(key, value); document.getElementById('best').textContent = Math.max(value, old); } catch (e) {} }
function reset() {
  state = GAMES[ID].init(); doneFor = null; lastMetric = null; keys = {}; pointer.down = false; uiKey = ''; FX.parts = []; FX.pops = [];
  if (started && document.getElementById('start').hidden) setPaused(false);   // not behind the help card
  GAMES[ID].ui?.(); render();
}

/* ---------- loop, input, fitting ---------- */
let dpr = 1;
function fit() {
  const st = document.querySelector('.stage').getBoundingClientRect(); let w = st.width, h = w * H / W; if (h > st.height) { h = st.height; w = h * W / H; }
  C.style.width = Math.floor(w) + 'px'; C.style.height = Math.floor(h) + 'px';
  dpr = Math.min(2.5, (window.devicePixelRatio || 1) * w / W); const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (C.width !== bw || C.height !== bh) { C.width = bw; C.height = bh; } render();
}
function render() {
  if (!state) return; buttons = []; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save(); if (FX.shake > 0) ctx.translate((Math.random() - .5) * FX.shake, (Math.random() - .5) * FX.shake);
  GAMES[ID].draw(); ctx.restore(); drawFX();
}
function frame(t) {
  const dt = Math.min((t - last) / 1000 || 0, .04); last = t;
  if (!paused) { totalTime += dt; GAMES[ID].update?.(dt); }
  stepFX(dt); render(); requestAnimationFrame(frame);
}
function point(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
const hitBtn = p => buttons.findLast(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
C.addEventListener('pointerdown', e => {
  if (paused) return; e.preventDefault(); C.focus(); ac(); pointer = { ...point(e), down: true }; C.setPointerCapture?.(e.pointerId);
  ripple(pointer.x, pointer.y, META.color);
  const b = hitBtn(pointer); if (b) { tone(520, .05, 'triangle', .035); b.fn(); pointer.down = false; } else GAMES[ID].pointer?.('down', pointer);
  render();
});
C.addEventListener('pointermove', e => { Object.assign(pointer, point(e)); hover = hitBtn(pointer) || null; C.style.cursor = hover ? 'pointer' : ''; if (!paused) GAMES[ID].pointer?.('move', pointer); });
for (const ev of ['pointerup', 'pointercancel']) C.addEventListener(ev, e => { pointer.down = false; if (!paused) GAMES[ID].pointer?.('up', point(e)); });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (!started && (e.key === 'Enter' || e.key === ' ')) return start();
  // Enter/Space on a focused button presses that button; it must not also reach the game
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button')) return;
  if (e.key === 'Escape' || e.key.toLowerCase() === 'p') { if (started) setPaused(!paused); return; }
  keys[e.key.toLowerCase()] = true; if (!paused && !e.repeat) GAMES[ID].key?.(e.key.toLowerCase()); render();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { keys = {}; pointer.down = false; if (started && !paused) setPaused(true); });
document.getElementById('controls').addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (b && !paused) { ac(); tone(560, .05, 'triangle', .035); GAMES[ID].action?.(b.dataset.action); render(); if (e.detail) { b.blur(); C.focus({ preventScroll: true }); } } });   // after a click, keys go back to the game

/* ---------- start card, pause, sound, help ---------- */
const $ = id => document.getElementById(id);
function setPaused(p) { paused = p; keys = {}; pointer.down = false; $('pause-overlay').hidden = !p || !started || !$('start').hidden; $('pause').textContent = p ? '▶' : '❚❚'; $('pause').title = p ? 'Resume' : 'Pause'; }

function syncSound() { $('sound').textContent = soundOn ? '🔊' : '🔇'; $('sound').title = soundOn ? 'Sound on' : 'Sound off'; try { localStorage.setItem('pbx-pack-sound', soundOn ? '1' : '0'); } catch (e) {} }
$('restart').onclick = () => { reset(); tone(440, .06); };
$('pause').onclick = () => { if (started) setPaused(!paused); };
$('resume').onclick = () => setPaused(false);

$('help').onclick = () => { if (started) setPaused(true); $('pause-overlay').hidden = true; $('start').hidden = false; $('play').textContent = started ? 'Back to the game' : 'Play'; };
$('play').onclick = () => { if (started) { $('start').hidden = true; setPaused(false); } else start(); };
$('fullscreen').onclick = () => { const el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen?.(); else el.requestFullscreen?.().catch(() => status('Full screen is unavailable here.')); };
// the start card is filled from the catalog
$('s-genre').textContent = META.genre; $('s-title').textContent = META.title; $('s-desc').textContent = META.desc; $('s-goal').textContent = META.goal;
$('s-how').innerHTML = META.how.map(h => `<li>${h}</li>`).join('');
if (window.top !== window) document.body.classList.add('framed');
syncSound(); new ResizeObserver(fit).observe(document.querySelector('.stage')); window.addEventListener('resize', fit);

const GAMES = {};
// 6. Pocket Jury: authored cases with a decisive evidence choice.
const juryCases=[
{title:'The Case of the Missing Tart',brief:'Baker Bea accuses Milo of taking the last peach tart at 2:15 PM. Milo says he was returning a library book across town.',cards:[['The accusation','Bea saw someone wearing Milo’s red scarf leave through the bakery’s back door.'],['Library receipt','The library issued Milo a return receipt at 2:14 PM. It is a 25-minute walk from the bakery.'],['The scarf','Milo lent his scarf to his cousin that morning. No one has asked the cousin where they went.']],guilty:false,decisive:1,explain:'The timestamp places Milo across town one minute before the theft. A borrowed scarf cannot outweigh that alibi.'},
{title:'The Disappearing Garden Gnome',brief:'Ari is accused of stealing a garden gnome at 9 PM. Ari says they were asleep at home all evening.',cards:[['Doorbell recording','The 9:02 PM video clearly shows Ari’s face as they lift the gnome and put it in their bag.'],['A sleepy text','At 8:30 PM Ari texted a friend, “Going to bed early.”'],['Muddy shoes','Ari’s shoes have dirt on them. Ari also grows tomatoes.']],guilty:true,decisive:0,explain:'The clear video directly identifies Ari taking the gnome. A text about going to bed does not establish an alibi.'},
{title:'The Counterfeit Raffle Ticket',brief:'The fair organizer accuses Nell of altering a raffle ticket. Nell says it is exactly as the booth sold it.',cards:[['Winning number','Nell’s ticket reads 104. The winning ticket is 104.'],['Ink analysis','The final digit on Nell’s ticket uses a second ink, but every ticket at that booth was corrected from a misprinted batch.'],['Vendor log','The vendor recorded selling corrected ticket 104 to Nell at noon, before the 4 PM drawing.']],guilty:false,decisive:2,explain:'The vendor’s record confirms that Nell bought ticket 104 before the drawing. The correction was made at the booth.'},
{title:'The Midnight Trombone',brief:'Theo denies playing loud music at midnight. They claim the sound came from a radio in another apartment.',cards:[['Instrument case','Theo owns a trombone. Ownership alone does not show when it was played.'],['Hallway recording','A continuous midnight recording shows Theo playing the trombone through their open doorway.'],['The neighbor','A neighbor dislikes jazz and has complained about daytime practice before.']],guilty:true,decisive:1,explain:'The continuous recording shows the actual performance at the reported time. It directly contradicts the radio explanation.'},
{title:'The Soggy Science Project',brief:'Sam is accused of deliberately pouring water over Jo’s science project. Sam says a leaking pipe soaked it overnight.',cards:[['The ceiling','A plumber’s dated inspection finds a ruptured pipe directly above the project and water staining the ceiling.'],['The argument','Sam and Jo argued about a board game last week.'],['The empty cup','An empty paper cup sits in a bin on the opposite side of the room.']],guilty:false,decisive:0,explain:'The ruptured pipe explains the water damage. An unrelated argument and an empty cup do not establish deliberate damage.'},
{title:'The Great Coupon Caper',brief:'Rae is accused of using a copied one-use coupon twice. Rae claims the cashier scanned the same purchase twice by mistake.',cards:[['First purchase','The first receipt lists one sandwich at 11:05 AM, paid with Rae’s card.'],['The coupon rules','The printed coupon clearly says “one redemption per person.”'],['Second transaction','A second receipt and clear shop video show Rae buying a separate sandwich at 3:40 PM with the same coupon.']],guilty:true,decisive:2,explain:'The separate afternoon purchase disproves the accidental double-scan claim. Rae knowingly redeemed the coupon twice.'},
{title:'The Scratched Telescope',brief:'Kit is accused of scratching a borrowed telescope lens. Kit says the scratch was present when it was handed over.',cards:[['Return inspection','A scratch is visible when Kit returns the telescope.'],['Checkout photograph','A sharp, timestamped photograph from before checkout shows the identical curved scratch on the lens.'],['The cleaning cloth','Kit used an approved soft lens cloth during the loan.']],guilty:false,decisive:1,explain:'The checkout photograph proves the same scratch existed before Kit borrowed the telescope.'},
{title:'The Vanishing Trophy',brief:'Fin denies taking the chess-club trophy. Fin says the trophy found in their locker is a cheap replica.',cards:[['Hidden engraving','The trophy in Fin’s locker has the original’s unique serial engraving underneath its base.'],['A shiny finish','Both replicas and original trophies can have a shiny gold finish.'],['Club record','Fin lost the final match, but disappointment alone proves nothing.']],guilty:true,decisive:0,explain:'The unique serial engraving identifies the original trophy. Appearance and motive are weaker evidence.'},
{title:'The Trampled Flowerbed',brief:'Mr. Hale says Dot’s dog trampled his tulips at 3 PM. Dot says the dog was at the groomer all afternoon.',cards:[['Paw prints','The prints in the soil are about the size of a medium dog’s paw. Dot’s dog is medium-sized.'],['Groomer invoice','The groomer’s timestamped invoice shows the dog checked in at 1 PM and was collected at 5 PM.'],['A loose gate','Dot’s garden gate was found unlatched that evening.']],guilty:false,decisive:1,explain:'The groomer’s timed record places the dog elsewhere all afternoon. Paw size and an open gate cannot outweigh it.'},
{title:'The Borrowed Bicycle Bell',brief:'Pat says Lou took the red bell off Pat’s bicycle. Lou says the bell on Lou’s bike is one Lou bought.',cards:[['The engraving','The bell on Lou’s bike has “PAT” scratched underneath, exactly where Pat says they marked it.'],['Matching color','Lou’s bike bell is red, like Pat’s missing bell. Red bells are common.'],['Old receipt','Lou has a receipt for a bell, dated last year.']],guilty:true,decisive:0,explain:'The hidden marking identifies the bell as Pat’s. An old receipt shows Lou once bought a bell, not that this is it.'},
{title:'The Overdue Novel',brief:'The library fined Wren for returning a book two days late. Wren says it went into the return slot on the due date.',cards:[['Overdue notice','The library system marked the book returned two days after the due date.'],['Wren’s calendar','Wren’s calendar says “return book!” on the due date.'],['Slot camera','The return-slot camera shows Wren dropping the book in on the due date, an hour before closing.']],guilty:false,decisive:2,explain:'The camera shows the book went in on time. The late mark shows when staff scanned it, not when it was returned.'},
{title:'The Purple Fence',brief:'Ida says Max painted her fence purple without asking. Max says Ida asked for it.',cards:[['Purple paint','Max owns a half-empty can of the same purple paint.'],['Fresh drips','A trail of purple drips leads from the fence to Max’s door.'],['Signed note','A dated note in Ida’s handwriting says: “Max, please paint my fence any color you like.”']],guilty:false,decisive:2,explain:'Max did paint the fence, but Ida’s signed note gave permission. The paint and the drips only show who did it.'},
{title:'The Pie Contest Switch',brief:'The judges say Rosa entered a shop-bought pie in the homemade contest. Rosa says she baked it herself.',cards:[['Flour on the apron','Rosa’s apron is dusted with flour.'],['Bakery receipt','Rosa’s card paid for a cherry lattice pie that morning, and her entry has the bakery’s logo pressed into the crust.'],['A bakery box','A plain cardboard box sits in Rosa’s recycling bin.']],guilty:true,decisive:1,explain:'The receipt and the bakery’s logo in the crust tie the entry to the shop. Flour on an apron shows only that she baked something.'},
{title:'The Missing Garden Hose',brief:'Nan says Ben never returned the hose he borrowed. Ben says he left it on her porch on Sunday.',cards:[['Porch photo','Ben’s photo, timestamped Sunday 6 PM, shows the coiled hose on Nan’s porch.'],['An empty hook','Nan’s hose hook was empty on Monday morning.'],['A green hose','Ben’s shed contains a green hose. Nan’s was green too.']],guilty:false,decisive:0,explain:'The timestamped photo shows the hose returned on Sunday. An empty hook later and a green hose in a shed prove nothing.'},
{title:'The Dawn Leaf Blower',brief:'Gus is accused of running a leaf blower at 6 AM, against the street rules. Gus says he never gets up before 8.',cards:[['Sleepy habits','Gus’s family says he usually sleeps late on weekends.'],['A charging log','The blower’s charger shows it was unplugged at 5:58 AM. Anyone in the house could have unplugged it.'],['Neighbor video','A 6:05 AM video shows Gus, in his robe, blowing leaves off his driveway.']],guilty:true,decisive:2,explain:'The video shows Gus using the blower at 6:05 AM. Usual habits can’t outweigh a direct recording.'},
{title:'The Last Cupcake',brief:'Ivy is accused of eating the cupcake saved for the teacher. Ivy says she only ate her own.',cards:[['Pink frosting','Ivy has pink frosting on her sleeve. Every cupcake at the party was pink.'],['The count','The helper’s sheet lists 25 cupcakes for 25 people, and a photo shows the teacher holding hers.'],['An empty wrapper','An empty cupcake wrapper is under Ivy’s desk.']],guilty:false,decisive:1,explain:'The count and the photo show the teacher got her cupcake, so none was taken. Frosting and a wrapper fit Ivy eating her own.'}
];
// sixteen cases in two dockets of eight; the court remembers which docket you reached
const jurySave=loadSave({docket:0,best:[0,0]});
GAMES['pocket-jury']={init(){const d=Math.min(1,jurySave.docket);return {docket:d,case:d*8,selected:0,read:new Set([0]),evidence:null,verdict:null,score:0,resolved:false,over:false,msg:'Review the brief and all three evidence cards.'}},ui(){controls(action('Mark as decisive','mark')+action('Not responsible','clear',true)+action('Responsible','guilty')+action('Next case','next'));status(state.msg);metric(state.score+' points')},action(a){const c=juryCases[state.case];if(a==='next'){if(!state.resolved){state.msg='Return a verdict before moving to the next case.'}else if(state.case===state.docket*8+7){state.over=true;saveBest(state.score);jurySave.best[state.docket]=Math.max(jurySave.best[state.docket],state.score);if(state.docket===0)jurySave.docket=1;storeSave(jurySave)}else{state.case++;state.selected=0;state.read=new Set([0]);state.evidence=null;state.resolved=false;state.msg='Review the new case and evidence.'}this.ui();return}if(state.resolved||state.over)return;if(a==='mark'){state.evidence=state.selected;state.msg='Marked: '+c.cards[state.selected][0]+'.'}if(a==='clear'||a==='guilty'){if(state.read.size<3||state.evidence===null){state.msg='Read all three cards and mark the decisive evidence first.'}else{state.verdict=a==='guilty';const correct=state.verdict===c.guilty,bonus=state.evidence===c.decisive;state.score+=(correct?100:0)+(correct&&bonus?50:0);state.resolved=true;state.msg=(correct?'Correct verdict. ':'Verdict overturned. ')+c.explain;saveBest(state.score);beep(correct?820:200)}}this.ui()},draw(){board('#302929');const c=juryCases[state.case];heading('NEIGHBORHOOD COURT / DOCKET '+(state.docket+1)+' / CASE '+(state.case-state.docket*8+1)+' OF 8','DOCKET BESTS '+jurySave.best.join(' • '),'#e3ad8c');rr(36,90,888,116,12,'#e4d6bd');text(c.title,60,118,25,'#43352f','left',850);wrap(c.brief,60,154,832,17,'#665247',24);for(let n=0;n<3;n++){let y=232+n*87;rr(37,y,273,73,9,state.selected===n?'#765b4a':'#443a35',state.evidence===n?'#e4c48c':null);text('EXHIBIT '+String.fromCharCode(65+n)+(state.read.has(n)?'  • READ':''),54,y+19,11,'#d4b79b');text(c.cards[n][0],54,y+44,16,'#f1e0c7');buttons.push({x:37,y,w:273,h:73,fn:()=>{state.selected=n;state.read.add(n);beep(400+n*50)}})}rr(332,232,591,248,12,'#ece1cc');for(let ly=284;ly<468;ly+=33)line(346,ly+14,908,ly+14,'#c8d4dc',1);line(348,240,348,472,'#e8a0a0',1.5);ctx.strokeStyle='#9aa4ac';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(872,218,16,46,8);ctx.stroke();ctx.beginPath();ctx.roundRect(877,226,7,30,4);ctx.stroke();text('EXHIBIT '+String.fromCharCode(65+state.selected),357,262,13,'#987151');wrap(c.cards[state.selected][1],357,305,535,22,'#4d4035',33);text(state.evidence===state.selected?'★ MARKED AS DECISIVE':'Read carefully. What does this actually prove?',357,451,13,'#90734c');if(state.resolved){const ok=state.verdict===c.guilty;ctx.save();ctx.translate(800,420);ctx.rotate(-.18);ctx.globalAlpha=.85;ctx.strokeStyle=ok?'#2f8a4a':'#c23a30';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-92,-24,184,48,6);ctx.stroke();text(ok?'UPHELD':'OVERTURNED',0,1,ok?28:22,ok?'#2f8a4a':'#c23a30','center',900);ctx.restore();rr(36,507,888,64,9,'#4b5142');wrap((state.verdict===c.guilty?'VERDICT UPHELD. ':'VERDICT OVERTURNED. ')+c.explain,53,528,850,15,'#e3dfbe',22)}else{text('Read every exhibit → Mark decisive evidence → Return a verdict',480,539,16,'#c6ae97','center')}if(state.over){done(state.docket===0?'Docket 1 adjourned':'Court adjourned',state.score+' / 1200 points. '+(state.docket===0?'Docket 2 has eight new cases.':'Every case on the books is closed.'));btn(state.docket===0?'Docket 2 →':'Docket 1 again',365,352,230,46,()=>{const d=state.docket===0?1:0;state={...this.init(),docket:d,case:d*8};this.ui()},'#765b4a')}}};
