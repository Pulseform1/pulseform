<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Tiny Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #4ab0e8; --panel: #fff6e4; --card: #ffffff; --edge: #e8d2a8; --wood: #9a6a3a; --wood2: #7a4e26; --text: #4a3020; --muted: #9a7a5a;
    --green: #5cc34a; --green2: #3f9a32; --gold: #ffd23f; --red: #ef4a3a; --blue: #3fa8ef; --pink: #ff8ab8;
    --display: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Nunito', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body { font-family: var(--body); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .disp { font-family: var(--display); font-weight: 700; }
  img.ic { width: 1.2em; height: 1.2em; vertical-align: -0.28em; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left)); pointer-events: none; z-index: 3; }
  .topbar { display: flex; align-items: center; gap: 6px; }
  .lvl { pointer-events: auto; display: flex; align-items: center; min-width: 0; flex: 0 1 190px; }
  .lvlstar { position: relative; z-index: 1; width: 48px; height: 48px; flex: 0 0 auto; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: #fff; text-shadow: 0 2px 0 #1a4a8a; }
  .lvlstar::before { content: ''; position: absolute; inset: 0; background: #6ad0ff; clip-path: polygon(50% 0, 63% 32%, 98% 35%, 71% 57%, 80% 92%, 50% 73%, 20% 92%, 29% 57%, 2% 35%, 37% 32%); filter: drop-shadow(0 2px 0 #1a4a8a); z-index: -1; }
  .lvlstar::after { content: ''; position: absolute; inset: 5px; background: #3fa8ef; clip-path: polygon(50% 0, 63% 32%, 98% 35%, 71% 57%, 80% 92%, 50% 73%, 20% 92%, 29% 57%, 2% 35%, 37% 32%); z-index: -1; }
  .xpbar { position: relative; flex: 1; min-width: 70px; height: 22px; margin-left: -10px; border-radius: 0 11px 11px 0; background: rgba(40,30,20,.55); border: 2px solid #fff; overflow: hidden; }
  .xpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #8ae8ff, #3fa8ef); transition: width .4s ease; }
  .xpbar span { position: relative; display: block; text-align: center; font-weight: 900; font-size: 12px; line-height: 18px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); padding-left: 8px; white-space: nowrap; }
  .money { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .pill { pointer-events: auto; display: flex; align-items: center; gap: 3px; background: rgba(40,30,20,.55); border: 2px solid #fff; border-radius: 999px; padding: 2px 10px 2px 3px; font-family: var(--display); font-weight: 700; font-size: 17px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); min-height: 30px; }
  .pill img { width: 24px; height: 24px; }
  .bumpit { animation: bumpit .25s ease; }
  @keyframes bumpit { 40% { transform: scale(1.18); } }
  .ibtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 14px; background: #fff6e4; border: 3px solid var(--wood); box-shadow: 0 3px 0 var(--wood2); display: grid; place-items: center; flex: 0 0 auto; }
  .ibtn svg { width: 24px; height: 24px; }
  .chips { display: flex; gap: 6px; justify-content: space-between; align-items: flex-start; margin-top: 6px; }
  .chip { pointer-events: auto; background: rgba(255,248,236,.92); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 10px; font-weight: 900; font-size: 12px; white-space: nowrap; }
  .hint { pointer-events: none; max-width: min(420px, 70vw); margin: 8px auto 0; text-align: center; background: rgba(255,248,236,.95); border: 3px solid var(--gold); border-radius: 14px; padding: 6px 12px; font-weight: 900; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.2); animation: hintbob 1.6s ease-in-out infinite; }
  @keyframes hintbob { 50% { transform: translateY(3px); } }

  /* ---------- bottom bar ---------- */
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 3; padding: 6px; background: rgba(255,246,228,.94); border: 3px solid var(--wood); border-radius: 22px; box-shadow: 0 4px 0 var(--wood2), 0 8px 20px rgba(0,0,0,.25); }
  .bbtn { position: relative; width: 62px; height: 58px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--text); transition: transform .08s; }
  .bbtn:active { transform: scale(.92); }
  .bbtn:hover { background: rgba(255,210,63,.25); }
  .bbtn canvas, .bbtn img { width: 34px; height: 34px; }
  .bdg { position: absolute; top: -4px; right: -2px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--red); color: #fff; font-size: 13px; line-height: 18px; padding: 0 5px; border: 2px solid #fff; font-family: var(--display); }
  .bdg.new { background: var(--green); }
  body.title .hud, body.title .bar { display: none; }

  /* ---------- sheets ---------- */
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(640px, 100%); max-height: min(72vh, calc(100% - 70px)); display: flex; flex-direction: column; background: var(--panel); border: 4px solid var(--wood); border-bottom: 0; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3); z-index: 6; padding-bottom: env(safe-area-inset-bottom); touch-action: pan-y; animation: sheetin .22s cubic-bezier(.2,1.3,.4,1); }
  @keyframes sheetin { from { transform: translate(-50%, 40px); opacity: 0; } }
  body.wide .sheet { max-height: calc(100% - 70px); }
  .sh-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 16px; }
  .sh-head h2 { flex: 1; margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sh-head h2 img { width: 34px; height: 34px; }
  .sh-sub { font-size: 13px; font-weight: 800; color: var(--muted); padding: 0 16px 6px; }
  .xbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #fff; font-size: 26px; font-weight: 900; line-height: 40px; border: 3px solid #fff; box-shadow: 0 3px 0 #a82a1a; flex: 0 0 auto; }
  .tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
  .tab { flex: 1; min-height: 40px; border-radius: 12px; background: #f0dcb8; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--wood); color: #fff; }
  .sh-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 14px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .card { position: relative; background: var(--card); border: 3px solid var(--edge); border-radius: 16px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; transition: transform .08s, border-color .15s; }
  .card:active { transform: scale(.96); }
  .card .big { width: 56px; height: 56px; }
  .card .nm { font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.1; }
  .card .sm { font-size: 12px; font-weight: 800; color: var(--muted); }
  .card.can { border-color: var(--green); }
  .card.lock { opacity: .55; filter: grayscale(.7); }
  .card.no .cost { color: var(--red); }
  .cost { font-family: var(--display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 3px; justify-content: center; }
  .cost img { width: 18px; height: 18px; }
  .ins { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .ins span { display: flex; align-items: center; font-weight: 900; font-size: 12px; }
  .ins img { width: 22px; height: 22px; }
  .ins .bad { color: var(--red); } .ins .good { color: var(--green2); }
  .sec { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--wood); margin: 12px 2px 6px; }
  .empty { text-align: center; color: var(--muted); font-weight: 800; padding: 18px 10px; }
  .btn { min-height: 44px; padding: 8px 16px; border-radius: 14px; background: var(--green); color: #fff; font-family: var(--display); font-weight: 700; font-size: 17px; border: 3px solid #fff; box-shadow: 0 4px 0 var(--green2); text-shadow: 0 1px 1px rgba(0,0,0,.25); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green2); }
  .btn.gold { background: var(--gold); color: var(--text); box-shadow: 0 4px 0 #c89a10; text-shadow: none; }
  .btn.grey { background: #c8b8a0; box-shadow: 0 4px 0 #9a8a70; }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #a82a1a; }
  .btn.small { min-height: 38px; font-size: 14px; padding: 4px 10px; border-radius: 12px; }
  .btn[disabled] { opacity: .5; }
  .btn img { width: 20px; height: 20px; }
  .row { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--edge); border-radius: 16px; padding: 8px; margin-bottom: 8px; }
  .row .face { width: 56px; height: 56px; border-radius: 50%; background: #d8f0ff; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--edge); flex: 0 0 auto; }
  .row .mid { flex: 1; min-width: 0; }
  .row .nm { font-family: var(--display); font-weight: 700; font-size: 16px; }
  .row .sm { font-size: 13px; font-weight: 800; color: var(--muted); }
  .bar2 { height: 12px; border-radius: 6px; background: #f0dcb8; overflow: hidden; margin-top: 4px; }
  .bar2 i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #8ae05a); border-radius: 6px; }
  .order { position: relative; background: #fff; border: 3px solid var(--edge); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .order.ready { border-color: var(--green); box-shadow: 0 0 0 3px rgba(92,195,74,.25); }
  .order.quest { background: #fff8d8; border-color: var(--gold); }
  .order .who { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 13px; }
  .order .who img { width: 34px; height: 34px; border-radius: 50%; background: #d8f0ff; }
  .order .its { display: flex; gap: 4px; flex-wrap: wrap; }
  .order .it { position: relative; width: 50px; text-align: center; font-weight: 900; font-size: 12px; }
  .order .it img { width: 42px; height: 42px; display: block; margin: 0 auto; }
  .order .it.ok::after { content: '✓'; position: absolute; right: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; font-size: 12px; line-height: 18px; }
  .order .rw { display: flex; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 15px; align-items: center; }
  .order .rw img { width: 20px; height: 20px; vertical-align: -4px; }
  .order .acts { display: flex; gap: 6px; }
  .order .acts .btn { flex: 1; }
  .trash { width: 38px; height: 38px; border-radius: 12px; background: #f0dcb8; font-size: 18px; flex: 0 0 auto !important; }
  .ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .wait { display: grid; place-items: center; min-height: 120px; color: var(--muted); font-weight: 900; font-size: 14px; background: #fbf0dc; border: 3px dashed var(--edge); border-radius: 16px; text-align: center; padding: 8px; }
  .slots { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; }
  .slot { position: relative; flex: 0 0 auto; width: 70px; height: 78px; border-radius: 14px; background: #fff; border: 3px solid var(--edge); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
  .slot img { width: 40px; height: 40px; }
  .slot.done { border-color: var(--green); background: #eaffdf; animation: glowp 1s ease-in-out infinite; }
  @keyframes glowp { 50% { box-shadow: 0 0 12px rgba(92,195,74,.7); } }
  .slot.free { border-style: dashed; color: var(--muted); }
  .slot .mini { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 6px; border-radius: 3px; background: #f0dcb8; overflow: hidden; }
  .slot .mini i { display: block; height: 100%; background: var(--green); }
  .bitem { position: relative; background: #fff; border: 3px solid var(--edge); border-radius: 14px; padding: 4px; text-align: center; }
  .bitem img { width: 44px; height: 44px; }
  .bitem b { position: absolute; right: 4px; bottom: 2px; font-family: var(--display); font-size: 15px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .bitem.sel { border-color: var(--blue); background: #e8f6ff; }
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
  .sellbox { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--blue); border-radius: 16px; padding: 8px; margin-bottom: 8px; }
  .sellbox img { width: 54px; height: 54px; }

  /* ---------- small popup over the map ---------- */
  .pop { position: fixed; z-index: 4; transform: translate(-50%, -100%); background: var(--panel); border: 3px solid var(--wood); border-radius: 16px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.3); text-align: center; min-width: 150px; animation: popin .18s cubic-bezier(.2,1.4,.4,1); }
  .pop::after { content: ''; position: absolute; left: 50%; bottom: -11px; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--wood); border-bottom: 0; }
  @keyframes popin { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }
  .pop .nm { font-family: var(--display); font-weight: 700; font-size: 15px; }
  .pop .tm { font-weight: 900; font-size: 20px; font-family: var(--display); margin: 2px 0 6px; }
  .pop .btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .pop .sm { font-size: 12px; font-weight: 800; color: var(--muted); max-width: 200px; margin: 0 auto 6px; }

  /* ---------- seed tray + place bar ---------- */
  .tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(6px + env(safe-area-inset-bottom)); width: min(640px, calc(100% - 12px)); background: rgba(255,246,228,.97); border: 3px solid var(--wood); border-radius: 20px; z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,.3); padding: 6px; animation: sheetin .2s ease; }
  .tray-top { display: flex; align-items: center; gap: 8px; padding: 0 4px 4px 8px; font-weight: 900; font-size: 13px; color: var(--muted); }
  .tray-top span { flex: 1; }
  .tray .xbtn { width: 38px; height: 38px; line-height: 32px; font-size: 22px; }
  .seeds { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 4px; touch-action: pan-x; }
  .seed { flex: 0 0 auto; width: 74px; border-radius: 14px; background: #fff; border: 3px solid var(--edge); padding: 4px 2px; text-align: center; }
  .seed img { width: 42px; height: 42px; }
  .seed .nm { font-family: var(--display); font-weight: 700; font-size: 12px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seed .sm { font-size: 11px; font-weight: 900; color: var(--muted); }
  .seed[aria-pressed="true"] { border-color: var(--green); background: #eaffdf; transform: translateY(-3px); }
  .seed.lock { opacity: .5; filter: grayscale(1); }
  .placebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; display: flex; gap: 8px; align-items: center; background: rgba(255,246,228,.97); border: 3px solid var(--wood); border-radius: 20px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 16px); }
  .placebar { width: min(440px, calc(100% - 16px)); } .placebar span { flex: 1; font-weight: 900; font-size: 13px; text-align: center; }

  /* ---------- modals ---------- */
  .modal { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(30,20,10,.5); padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  .mbox { position: relative; width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 4px solid var(--wood); border-radius: 26px; padding: 18px 18px 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); animation: boxin .3s cubic-bezier(.2,1.4,.4,1); touch-action: pan-y; }
  @keyframes boxin { from { transform: scale(.6); opacity: 0; } }
  .mbox h2 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0 0 6px; }
  .mbox p { font-weight: 800; font-size: 15px; line-height: 1.4; margin: 6px 0; }
  .mbox .btn { margin-top: 10px; min-width: 150px; }
  .rewards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 10px 0; font-family: var(--display); font-weight: 700; font-size: 20px; }
  .rewards span { display: flex; align-items: center; gap: 4px; background: #fff; border: 3px solid var(--edge); border-radius: 14px; padding: 4px 10px; }
  .rewards img { width: 28px; height: 28px; }
  .unl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .unl div { width: 72px; font-size: 11px; font-weight: 900; line-height: 1.1; }
  .unl img { width: 48px; height: 48px; display: block; margin: 0 auto 2px; background: #fff; border-radius: 12px; border: 2px solid var(--edge); }
  .lvlbig { position: relative; z-index: 1; width: 110px; height: 110px; margin: 0 auto; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 54px; color: #fff; text-shadow: 0 3px 0 #1a4a8a; }
  .lvlbig::before { content: ''; position: absolute; inset: 0; background: #6ad0ff; clip-path: polygon(50% 0, 63% 32%, 98% 35%, 71% 57%, 80% 92%, 50% 73%, 20% 92%, 29% 57%, 2% 35%, 37% 32%); z-index: -1; filter: drop-shadow(0 4px 0 #1a4a8a); animation: spinin .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes spinin { from { transform: rotate(-120deg) scale(.2); } }
  .rays { position: absolute; left: 50%; top: 70px; width: 380px; height: 380px; margin: -190px 0 0 -190px; background: repeating-conic-gradient(rgba(255,230,120,.35) 0 10deg, transparent 10deg 20deg); border-radius: 50%; animation: rays 8s linear infinite; pointer-events: none; mask: radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); }
  @keyframes rays { to { transform: rotate(360deg); } }
  .talk { display: flex; gap: 12px; align-items: flex-end; text-align: left; }
  .talk img { width: 96px; height: 96px; flex: 0 0 auto; background: #d8f0ff; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px var(--edge); }
  .talk .bub { flex: 1; background: #fff; border: 3px solid var(--edge); border-radius: 18px 18px 18px 4px; padding: 10px 12px; font-weight: 800; font-size: 16px; line-height: 1.35; min-height: 70px; }
  .talk .who2 { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--wood); margin-bottom: 2px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0; }
  .days div { border-radius: 10px; background: #fff; border: 2px solid var(--edge); padding: 4px 0; font-size: 11px; font-weight: 900; }
  .days div.on { background: var(--gold); border-color: #c89a10; }
  .days div.now { transform: scale(1.12); box-shadow: 0 0 0 3px var(--green); }
  .toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .tog { min-height: 44px; padding: 6px 14px; border-radius: 14px; background: #fff; border: 3px solid var(--edge); font-weight: 900; font-size: 14px; }
  .tog[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }

  /* ---------- title ---------- */
  .title-scr { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); pointer-events: none; background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.0), rgba(20,40,60,.25)); }
  .logo { text-align: center; animation: logoin .8s cubic-bezier(.2,1.4,.4,1); }
  @keyframes logoin { from { transform: translateY(-60px) scale(.6); opacity: 0; } }
  .logo .l1, .logo .l2 { font-family: var(--display); font-weight: 700; line-height: .95; letter-spacing: 1px; -webkit-text-stroke: 3px var(--wood2); paint-order: stroke fill; }
  .logo .l1 { font-size: clamp(38px, 11vw, 64px); color: #fff; text-shadow: 0 5px 0 var(--wood2), 0 10px 20px rgba(0,0,0,.3); }
  .logo .l2 { font-size: clamp(52px, 16vw, 96px); color: var(--gold); text-shadow: 0 6px 0 var(--wood2), 0 12px 24px rgba(0,0,0,.35); transform: rotate(-3deg); }

// value and xp of crafted goods come from what goes in plus the time it takes
function valueOf(it) {
  if (it.val != null) return;
  let v = 0, x = 0; for (const [id, n] of it.ins) { valueOf(ITEMS[id]); v += ITEMS[id].val * n; x += ITEMS[id].xp * n; }
  it.val = Math.max(2, Math.round((v * 1.1 + it.time / 25) / it.out));
  it.xp = Math.max(1, Math.round((x * 0.35 + it.time / 60) / it.out));
}

// terrain of every tile (grass, water, sand, cliff ...) and spot positions, all seeded
function terrainAt(x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return 'water';
  if (y >= 32 || (y >= 30 && (x < 4 || x > 37))) return 'water';
  if (y >= 28) return 'sand';
  if (x < 12 && y < 4) return 'cliff';
  if (y < 12 && x >= 12 && x < 32) { if (y < 3 || (y < 5 && hash2(x, 7) < 0.5)) return 'cliff'; return 'rock'; }
  if (x >= 32 && y < 28) { if (x >= 42 || y < 1) return 'cliff'; return 'grass'; }
  return 'grass';
}
const NODES = []; // {id, k, x, y}
(function makeNodes() {
  const r = seeded(77), used = new Set();
  const free = (x, y) => !used.has(x + ',' + y) && !used.has((x + 1) + ',' + y) && !used.has((x - 1) + ',' + y) && !used.has(x + ',' + (y + 1)) && !used.has(x + ',' + (y - 1));
  const place = (k, n, x0, y0, x1, y1) => {
    let tries = 0;
    while (n > 0 && tries++ < 2000) {
      const x = x0 + Math.floor(r() * (x1 - x0)), y = y0 + Math.floor(r() * (y1 - y0));
      if (!free(x, y)) continue; used.add(x + ',' + y); NODES.push({ id: k + NODES.length, k, x, y }); n--;
    }
  };
  // forest (x 0..11, y 4..27); keep a path at x 10..11 near the farm
  place('hive', 2, 1, 6, 9, 26); place('appletree', 3, 1, 6, 10, 26); place('shroom', 3, 1, 6, 10, 26);
  place('bush', 5, 1, 6, 10, 26); place('tree', 16, 1, 5, 10, 27);
  // mines (x 12..31, y 5..11)
  place('crystalrock', 2, 14, 5, 30, 8); place('goldrock', 2, 13, 5, 31, 9); place('ironrock', 3, 13, 5, 31, 11);
  place('coalrock', 3, 13, 5, 31, 11); place('claypit', 3, 13, 6, 31, 11); place('rock', 8, 13, 5, 31, 11);
  // fishing at the ends of the docks
  [[9, 33], [17, 36], [28, 35], [35, 33]].forEach(([x, y]) => NODES.push({ id: 'fishspot' + NODES.length, k: 'fishspot', x, y }));
})();

/* ---------- farm grid ---------- */

}
let OCC = null;
function rebuildOcc() {
  OCC = new Map();
  for (const o of S.objs) { const [w, h] = sizeOf(o); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) OCC.set((o.x + i) + ',' + (o.y + j), o); }
}

    if (!openTile(x + i, y + j)) return false;
    const o = OCC.get((x + i) + ',' + (y + j)); if (o && o !== ignore) return false;
  }

}

    if (!canPlace(w, h, x, y)) continue;
    const d = Math.hypot(x - nearX, y - nearY); if (d < bd) { bd = d; best = [x, y]; }

}

/* ---------- buildings ---------- */

/* ---------- speed ups ---------- */
function speedCost(ms) { return Math.max(1, Math.ceil(ms / 1000 / 300)); }
function timerLeft(target) { // ms left on the thing this would speed up
  const t = NOW();
  if (target.node) return (S.nodes[target.node.id] || 0) - t;
  const o = target.o;
  if (o.k === 'plot') return o.crop ? o.t1 - t : 0;
  if (o.k === 'pen') return o.t1 ? o.t1 - t : 0;
  if (o.k === 'bld') { const j = queueOf(o).find(j => j.e > t); return j ? j.e - t : 0; }
  return 0;
}
function speedUp(target) {
  const left = timerLeft(target); if (left <= 0) return false;
  const g = speedCost(left); if (S.gems < g) { EV('nogems', {}); return false; }
  S.gems -= g; const t = NOW();
  if (target.node) S.nodes[target.node.id] = t;
  else {
    const o = target.o;
    if (o.k === 'plot' || o.k === 'pen') o.t1 = t;
    else if (o.k === 'bld') { const q = queueOf(o), j = q.find(j => j.e > t), d = j.e - t; for (const k of q) if (k.e > t) k.e -= d; }

/* ---------- order board ---------- */
function orderPool(maxLvl) {
  return ITEM_LIST.filter(it => it.lvl <= maxLvl && canMake(it.id) && !FEEDS[it.id]);
}
function makeOrder() {
  const pool = orderPool(S.lvl); if (!pool.length) return null;
  const nTypes = S.lvl < 3 ? 1 + (Math.random() < 0.4 ? 1 : 0) : irnd(1, 3), items = [], used = {};
  for (let k = 0; k < nTypes * 4 && items.length < nTypes; k++) {
    // favour newer, harder things as you level, but keep easy ones around
    let tot = 0; const w = pool.map(it => { const v = used[it.id] ? 0 : (1 + 2 * Math.pow(it.lvl / S.lvl, 2) + (it.cat === 'crop' ? 0.6 : 0)) / (1 + it.time / 1800); tot += v; return v; });
    if (tot <= 0) break;
    let r = Math.random() * tot, it = pool[0];
    for (let i = 0; i < pool.length; i++) { if ((r -= w[i]) < 0) { it = pool[i]; break; } }
    used[it.id] = 1;
    const t = it.time * (it.cat === 'craft' ? 1.6 : 1);
    const q = t <= 60 ? irnd(2, 6) : t <= 300 ? irnd(1, 4) : t <= 900 ? irnd(1, 3) : t <= 2000 ? irnd(1, 2) : 1;
    items.push([it.id, q]);
  }
  let c = 0, x = 0; for (const [id, q] of items) { c += ITEMS[id].val * q; x += ITEMS[id].xp * q; }
  const who = pick(VILLAGERS.filter(v => metVillager(v.id)).map(v => v.id).concat(['kid', 'farmer', 'baker', 'grandpa']));
  return { items, c: Math.round(c * 1.5 + 4), x: Math.round(x * 1.3 + 2), who, wait: 0 };
}
function fillOrders() {
  const want = orderSlots(S.lvl), t = NOW();
  while (S.orders.length < want) { const o = makeOrder(); if (!o) break; S.orders.push(o); }
  for (let i = 0; i < S.orders.length; i++) if (S.orders[i].wait && S.orders[i].wait <= t) { const o = makeOrder(); if (o) S.orders[i] = o; }
}
function orderReady(o) { return !o.wait && hasAll(o.items); }
function deliverOrder(i) {
  const o = S.orders[i]; if (!o || !orderReady(o)) return false;
  takeAll(o.items); const c = Math.round(o.c * (1 + charmBonus()));
  addCoins(c); gainXP(o.x); stat('orders');

}
function trashOrder(i) { const o = S.orders[i]; if (!o || o.wait) return false; S.orders[i] = { wait: NOW() + 30000, items: [] }; EV('trash', { i }); return true; }

/* cozy loop: plucked guitar chords, soft flute tune, gentle brush */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const SONG = {
  bpm: 96, root: 62,
  prog: [[0, 4, 7], [5, 9, 12], [7, 11, 14], [0, 4, 7], [-3, 0, 4], [5, 9, 12], [2, 5, 9], [7, 11, 14]],
  mel: [[7, -1, 9, 11, 12, -1, 11, 9, 7, -1, -1, -1, 4, -1, 7, -1], [9, -1, 12, -1, 14, -1, 12, 9, 12, -1, -1, -1, -1, -1, -1, -1],
        [11, -1, 12, 14, 16, -1, 14, 12, 11, -1, 7, -1, 9, -1, 11, -1], [12, -1, -1, -1, 7, -1, 4, -1, 7, -1, -1, -1, -1, -1, -1, -1]]

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06); g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

function awayModal(ms, sum) {

/* ---------- a busy demo kingdom for the title screen ---------- */
function makeDemo() {

let DEMO = null;
/* ---------- title and start ---------- */

/* ---------- main loop ---------- */
let lastT = performance.now(), saveT = 0, logicT = 0, titleA = 0;
