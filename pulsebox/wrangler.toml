name = "pulsebox"
main = "worker.js"
account_id = "5bc70055125c3d8b33c79d12be0f1505"
compatibility_date = "2026-10-01"
routes = [{ pattern = "box.pulseform.org", custom_domain = true }]

# cloud saves (api.js): one Durable Object per signed-in account
[[durable_objects.bindings]]
name = "SAVES"
class_name = "Saves"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Saves"]

# play stats (api.js): one global Durable Object counts plays per game per day
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# multiplayer rooms (api.js): one Durable Object per room code relays messages between players
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Rooms"]

# THE HOLLOW co-op (hollow-rooms.js): one Durable Object runs every room with the game's own engine
[[durable_objects.bindings]]
name = "HOLLOW"
class_name = "HollowRooms"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["HollowRooms"]
