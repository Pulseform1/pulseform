<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Play rated bots, get every move graded by Stockfish 17, review games, drill openings, endgames and puzzles.">
<meta name="theme-color" content="#262421">
<title>Gambit Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: club-app shell — nav rail on the left (top bar on tablets, bottom tab bar on phones),
   board + eval rail in the middle, a full-height coach panel with fixed header and action bar on the right.
   One deliberate look: warm charcoal UI, green-and-cream tournament board, raised green buttons. */
:root{
  color-scheme:dark;
  --bg:#312E2B; --surface:#262421; --surface-2:#3A3733; --surface-3:#45423E; --ink:#F5F4F1; --muted:#A9A7A2; --line:#403D39;
  --accent:#81B64C; --accent-hi:#95C760; --accent-low:#45753C; --accent-ink:#FFFFFF;
  --hl:#F5F682; --sel:#BACA44;
  --sq-l:#EBECD0; --sq-d:#739552;
  --c-brilliant:#26C2A3; --c-great:#749BBF; --c-best:#81B64C; --c-excellent:#96BC4B; --c-good:#96AF8B; --c-book:#A88865;
  --c-inacc:#F7C045; --c-mistake:#FFA459; --c-miss:#FF7769; --c-blunder:#FA412D;
  --evw:#F7F7F5; --evb:#403D39;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow:0 2px 0 rgb(0 0 0 / .25), 0 10px 30px rgb(0 0 0 / .25);
  --rail:216px;
}
:root[data-board="brown"]{--sq-l:#F0D9B5; --sq-d:#B58863; --hl:#CDD26A; --sel:#AAA23A}
:root[data-board="blue"]{--sq-l:#DEE3E6; --sq-d:#8CA2AD; --hl:#C3D887; --sel:#9BC700}
:root[data-board="purple"]{--sq-l:#EFEFEF; --sq-d:#8877B7; --hl:#E6E68A; --sel:#BBCB5E}
:root[data-board="walnut"]{--sq-l:#E3C9A1; --sq-d:#865E3C; --hl:#D6D36A; --sel:#B5B33C}
:root[data-board="slate"]{--sq-l:#D9D9D6; --sq-d:#7B7F86; --hl:#D8D97A; --sel:#B9BC4A}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
h2{margin:0;font:800 20px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font:700 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
svg{flex:none}

/* ---------- Shell & navigation ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;
  padding:18px 12px 16px max(12px, env(safe-area-inset-left, 0px));background:var(--surface);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px;font:800 20px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent) center/80% no-repeat;box-shadow:0 3px 0 var(--accent-low);flex:none}
.tabs{display:grid;gap:4px}
.tabs button,.railbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;text-align:left;width:100%}
.tabs svg,.railbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover,.railbtn:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}
.tabs button[aria-selected="true"] svg{color:var(--accent)}
.rail-foot{margin-top:auto;display:grid;gap:8px}
.engine-st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 12px}
.engine-st i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.engine-st.ok i{background:var(--accent);box-shadow:0 0 0 3px rgb(129 182 76 / .22)}
.engine-st.bad i{background:var(--c-blunder)}

.app{display:grid;grid-template-columns:auto minmax(330px,430px);gap:20px;justify-content:center;align-items:stretch;
  padding-block:20px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  --bs:clamp(280px, min(100vh - 200px, 100vw - var(--rail) - 520px), 760px)}

/* ---------- Stage: players, board, controls ---------- */
.stage{display:grid;gap:10px;min-width:0;justify-self:center;align-content:start}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding-left:26px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.bav{--s:36px;width:var(--s);height:var(--s);border-radius:calc(var(--s) / 4.5);background:var(--bc, var(--surface-3));display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
.bav .pc{width:80%;height:80%;cursor:inherit;z-index:auto}
.bav.as-w{--bc:#5C5A55}.bav.as-b{--bc:#CFCBC3}
.bav.book{--bc:#7A6148}
.wn{display:grid;gap:3px;min-width:0}
.nm{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.nm b{font-size:15px;font-weight:700}
.nm small{color:var(--muted);font:12px var(--f-mono)}
.caps{display:flex;align-items:center;gap:6px;min-height:17px}
.cg{display:flex}
.cg .pc{width:17px;height:17px;margin-right:-8px;cursor:default;z-index:auto}
.cg .pc:last-child{margin-right:0}
.caps em{font:600 12px/1 var(--f-mono);color:var(--muted);font-style:normal}
.thinking{display:inline-flex;gap:3px;margin-left:4px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.clock{font:700 19px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:8px 11px;border-radius:7px;background:var(--surface-2);color:var(--muted);min-width:4.2em;text-align:right;flex:none}
.clock.run{background:var(--ink);color:var(--bg)}
.clock.low.run{background:var(--c-blunder);color:#fff}

.boardrow{display:grid;grid-template-columns:18px var(--bs);gap:8px}
.evalbar{position:relative;border-radius:4px;overflow:hidden;background:var(--evb)}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;background:var(--evw);transition:height .45s cubic-bezier(.2,.8,.2,1)}
.evalbar.flip .w{bottom:auto;top:0}
.evalbar .num{position:absolute;left:0;right:0;font:700 9px/1 var(--f-mono);text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0}
.evalbar .num.bottom{bottom:0}.evalbar .num.top{top:0}
body[data-mode="train"] .evalbar{visibility:hidden}

.board{position:relative;width:var(--bs);height:var(--bs);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:5px;overflow:hidden;box-shadow:var(--shadow);user-select:none;touch-action:none}
.sq{position:relative;display:grid;place-items:center}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last::after,.sq.sel::after{content:"";position:absolute;inset:0;background:var(--hl);opacity:.5}
.sq.sel::after{background:var(--sel);opacity:.75}
.sq.check{background:radial-gradient(circle, #ff3b3b 0%, #e2302f88 40%, transparent 72%), var(--sq-d)}
.sq.l.check{background:radial-gradient(circle, #ff3b3b 0%, #e2302f88 40%, transparent 72%), var(--sq-l)}
.sq .co{position:absolute;font:700 calc(var(--bs) / 46)/1 var(--f-body);z-index:1;pointer-events:none}
.sq .co.r{top:3px;left:4px}.sq .co.f{bottom:3px;right:4px}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.pc{position:relative;z-index:2;display:block;width:100%;height:100%;background:center/100% no-repeat;cursor:grab}
.pc.dragging{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:50;width:calc(var(--bs) / 8 * 1.08);height:calc(var(--bs) / 8 * 1.08);transform:translate(-50%,-50%);cursor:grabbing}
.dot{position:absolute;z-index:3;width:32%;height:32%;border-radius:50%;background:rgb(0 0 0 / .16);pointer-events:none}
.dot.cap{width:100%;height:100%;border-radius:50%;background:none;box-shadow:inset 0 0 0 calc(var(--bs) / 110) rgb(0 0 0 / .16)}
.badge{position:absolute;z-index:4;top:-5px;right:-5px;width:calc(var(--bs) / 22);height:calc(var(--bs) / 22);filter:drop-shadow(0 2px 2px rgb(0 0 0 / .35));animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
.badge .ci{display:block}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.arrows{position:absolute;inset:0;z-index:5;pointer-events:none}
.promo{position:absolute;inset:0;z-index:20;background:rgb(0 0 0 / .55);display:grid;place-items:center}
.promo div{display:flex;gap:8px;background:var(--surface);padding:10px;border-radius:12px;box-shadow:var(--shadow)}
.promo button{width:calc(var(--bs) / 8);height:calc(var(--bs) / 8);border:0;border-radius:8px;background-color:var(--surface-2);cursor:pointer}
.promo button:hover{background-color:var(--surface-3)}
.flash{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:5px;animation:flash .6s ease-out forwards}
.flash.ok{box-shadow:inset 0 0 0 5px var(--c-best)}.flash.no{box-shadow:inset 0 0 0 5px var(--c-blunder)}
@keyframes flash{from{opacity:1}to{opacity:0}}

.nav{display:flex;align-items:center;gap:8px;padding-left:26px}
.nav .grp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}

/* ---------- Buttons & form controls ---------- */
.ib{border:0;background:var(--surface-2);border-radius:8px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgb(0 0 0 / .28);transition:transform .05s, background .15s;white-space:nowrap}
.ib:hover{background:var(--surface-3)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(0 0 0 / .28)}
.ib:disabled{opacity:.4;cursor:default;transform:none}
.ib.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-low);font-size:16px}
.ib.primary:hover{background:var(--accent-hi)}
.ib.big{height:50px;width:100%;font-size:17px}
.ib.grow{flex:1}
.ib.sm{height:32px;padding:0 10px;font-size:13px;min-width:0}
.ib.icon{width:36px;min-width:36px;height:36px;padding:0;flex:none}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;padding:0}
.link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:999px;padding:7px 12px;background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;cursor:pointer}
.toggle small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.toggle input{width:38px;height:22px;appearance:none;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.toggle input:checked{background:var(--accent)}.toggle input:checked::after{transform:translateX(16px)}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:13px/1.4 var(--f-mono);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px;resize:vertical}
.fld{display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* ---------- Panel frame ---------- */
.panel{position:relative;min-width:0;min-height:520px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pin{position:absolute;inset:0;display:flex;flex-direction:column}
.phead{flex:none;padding:14px 16px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.ph-row{display:flex;align-items:center;gap:10px;padding-bottom:14px;min-width:0}
.ph-t{flex:1;min-width:0}
.ph-t p{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs{display:flex;margin:0 -6px}
.ptabs button{flex:1;border:0;background:none;padding:9px 4px 11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ptabs .busy{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px;animation:blink 1s infinite}
.pbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.pfoot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:12px;min-width:0}
.sec:last-child{border-bottom:0}
b.eco,.eco{font:600 11.5px/1 var(--f-mono);color:var(--ink);background:var(--surface-3);padding:3px 5px;border-radius:4px;margin-right:6px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.tool{display:grid;justify-items:center;gap:3px;border:0;background:var(--surface-2);border-radius:9px;padding:8px 4px 7px;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 3px 0 rgb(0 0 0 / .28);transition:transform .05s}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--surface-3)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(0 0 0 / .28)}
.tool:disabled{opacity:.4;cursor:default;transform:none}

/* ---------- Play ---------- */
.opp{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.opp-t{display:grid;gap:3px;min-width:0}
.opp-n{display:flex;align-items:center;gap:8px}
.opp-n b{font:800 24px/1.1 var(--f-display);letter-spacing:-.01em}
.chip{font:600 12px/1 var(--f-mono);padding:4px 8px;border-radius:999px;background:var(--surface-3)}
.lvl{font-size:12.5px;color:var(--accent);font-weight:700}
.opp-t p{font-size:13.5px;color:var(--muted);line-height:1.45}
.botrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.botpick{display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;border:0;border-radius:10px;background:none;cursor:pointer;min-width:0}
.botpick:hover{background:var(--surface-2)}
.botpick[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent)}
.botpick b{font-size:11.5px;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.botpick small{font:11px/1 var(--f-mono);color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}
.setrow.col{display:grid;gap:8px}
.seg.colors{flex:none}
.seg.colors button{width:50px;height:42px;display:grid;place-items:center;padding:0}
.seg.colors .pc{width:30px;height:30px;cursor:inherit;z-index:auto}
.rnd{width:22px;height:22px;border-radius:50%;background:linear-gradient(90deg,#F4F2EE 50%,#1B1A18 50%);box-shadow:0 0 0 2px var(--surface-3)}

.coach{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:10px;background:var(--surface-2)}
.coach .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.coach .ico.idle{background:var(--surface-3)}
.coach .ico .ci{display:block}
.coach .t{font-weight:700;font-size:15.5px}
.coach .d{color:var(--muted);font-size:14px;line-height:1.45}
.coach .d b{color:var(--ink)}
.coach.c-brilliant{background:color-mix(in srgb, var(--c-brilliant) 16%, var(--surface-2))}
.coach.c-great{background:color-mix(in srgb, var(--c-great) 16%, var(--surface-2))}
.coach.c-best,.coach.c-excellent{background:color-mix(in srgb, var(--c-best) 13%, var(--surface-2))}
.coach.c-inaccuracy{background:color-mix(in srgb, var(--c-inacc) 12%, var(--surface-2))}
.coach.c-mistake{background:color-mix(in srgb, var(--c-mistake) 13%, var(--surface-2))}
.coach.c-miss,.coach.c-blunder{background:color-mix(in srgb, var(--c-blunder) 14%, var(--surface-2))}
.evchip{display:inline-block;margin-top:7px;font:600 12px/1 var(--f-mono);padding:4px 8px;border-radius:999px;background:rgb(0 0 0 / .22);color:var(--muted)}
.coach .acts{margin-top:10px}
.explain{margin:8px 0 0;padding:10px 12px;border-radius:8px;background:rgb(0 0 0 / .2);font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.result{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.result>div{display:grid;gap:2px}
.result b{font:800 18px/1.2 var(--f-display)}
.result.big b{font-size:21px}
.result.won{background:color-mix(in srgb, var(--accent) 18%, var(--surface-2))}
.result.lost{background:color-mix(in srgb, var(--c-blunder) 14%, var(--surface-2))}
.result .ci{flex:none}

.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.accbox{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.accbox>span{grid-row:span 2;width:10px;height:10px;border-radius:3px}
.dot-w{background:#F4F2EE}.dot-b{background:#151413;box-shadow:inset 0 0 0 1px var(--surface-3)}
.accbox small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accbox b{font:600 18px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}

.moves{max-height:270px;overflow:auto;border-radius:8px;background:var(--bg);font:14px/1 var(--f-mono)}
.mrow{display:grid;grid-template-columns:3.2em 1fr 1fr;align-items:center}
.mrow:nth-child(even){background:rgb(255 255 255 / .03)}
.mrow .n{padding-left:10px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.mv{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;margin:2px;font:inherit;cursor:pointer;text-align:left;border-radius:5px;min-width:0}
.mv:hover{background:var(--surface-2)}
.mv.cur{background:var(--surface-3)}
.mv.none{cursor:default;color:var(--muted)}
.s{display:inline-flex;flex:none}.s .ci{display:block}
.moves .empty{padding:14px;color:var(--muted);font:14px/1.45 var(--f-body)}

.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-radius:9px;background:var(--surface-2);padding:8px 10px;cursor:pointer}
.hrow:hover{background:var(--surface-3)}
.hmain{display:grid;min-width:0}.hmain small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hres{display:grid;justify-items:end;gap:4px}
.res{font:800 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:4px;background:var(--surface-3)}
.res.win{background:var(--accent);color:#fff}.res.loss{background:var(--c-blunder);color:#fff}
.hacc{font:600 12px/1 var(--f-mono);color:var(--muted)}
.tag{font:600 10px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-3);padding:2px 5px;border-radius:4px;vertical-align:2px}

/* ---------- Analyse ---------- */
.enginecard{display:grid;gap:10px;padding:12px;border-radius:10px;background:var(--bg)}
.openlabel{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lines{display:grid;gap:7px}
.line{display:grid;grid-template-columns:4.2em 1fr;gap:8px;font:13px/1.45 var(--f-mono);align-items:start}
.line .e{font-weight:700;text-align:center;border-radius:5px;padding:2px 4px;background:var(--evw);color:#262421}
.line .e.neg{background:#151413;color:var(--ink)}
.line .pv{color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.line .pv b{color:var(--ink);font-weight:600}
.loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.graph{width:100%;height:96px;display:block;cursor:pointer;border-radius:8px;background:var(--evb)}
.moments{display:grid;gap:6px}
.moment{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:9px;background:var(--surface-2);padding:8px 10px;cursor:pointer}
.moment:hover{background:var(--surface-3)}
.moment span{display:grid;flex:1;min-width:0}.moment small{color:var(--muted);font:12px/1.3 var(--f-mono)}
.moment>svg:last-child{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tally{width:100%;border-collapse:collapse;font-size:13.5px}
.tally td{padding:5px 2px;border-bottom:1px solid var(--line)}
.tally td:nth-child(n+2){text-align:center;font-family:var(--f-mono);width:4.5em;font-variant-numeric:tabular-nums}
.tally .lab{display:flex;align-items:center;gap:8px}
.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted);display:grid;gap:4px;line-height:1.5}
.steps a,.status a{color:var(--accent)}
.err{color:var(--c-blunder);font-size:13px}
.prog{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.note{border-left:3px solid var(--accent);padding:8px 10px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.note.threat{border-color:var(--c-blunder)}
.status{font-size:13px;color:var(--muted)}
.empty-state{display:grid;justify-items:center;text-align:center;gap:10px;padding:18px 8px;color:var(--muted);font-size:14px;line-height:1.5}

/* ---------- Openings ---------- */
.olist{display:grid;gap:8px}
.ocard{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center;text-align:left;border:0;border-radius:10px;background:var(--surface-2);padding:8px;cursor:pointer}
.ocard:hover{background:var(--surface-3)}
.mb{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:78px;height:78px;border-radius:5px;overflow:hidden;box-shadow:0 2px 0 rgb(0 0 0 / .3)}
.mb i{display:block;position:relative}
.mb i.l{background:var(--sq-l)}.mb i.d{background:var(--sq-d)}
.mb .pc{cursor:inherit;z-index:auto}
.ot{display:grid;gap:2px;min-width:0}
.ot b{font-size:15px}
.ot small{color:var(--muted);font-size:12.5px}
.ometa{display:flex;gap:6px;align-items:center}
.ometa .eco{margin:0;background:var(--bg)}
.side{font:800 10px/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;padding:3px 6px;border-radius:4px}
.side-w{background:#E9E6DF;color:#262421}.side-b{background:#151413;color:#E9E6DF;box-shadow:inset 0 0 0 1px var(--surface-3)}
.ostat{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.ostat.ok{color:var(--accent);font-weight:700}
.plan{font-size:14.5px;line-height:1.55}
.linepreview{font:13px/1.8 var(--f-mono);color:var(--muted)}
.linepreview .no{color:var(--muted);margin-right:3px}
.linepreview .done{color:var(--ink);font-weight:600}
.linepreview .todo{color:var(--surface-3)}
.linepreview .next{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 5px}
details.strat{border-radius:9px;background:var(--surface-2)}
details.strat summary{cursor:pointer;padding:11px 12px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.strat summary::-webkit-details-marker{display:none}
details.strat summary::after{content:"+";color:var(--muted);font:600 16px/1 var(--f-mono)}
details.strat[open] summary::after{content:"\2212"}
details.strat .body{padding:0 12px 12px;display:grid;gap:8px}
.strat ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.5}
.strat ul.watch li::marker{color:var(--c-mistake)}
.structure{font-size:14px;line-height:1.55;color:var(--muted)}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.goals li{display:flex;align-items:center;gap:10px;font-size:14px}
.goals .box{width:18px;height:18px;border-radius:5px;background:var(--bg);display:grid;place-items:center;flex:none;font:800 12px/1 var(--f-body);color:#fff}
.goals li.met .box{background:var(--accent)}
.goals li.met span{color:var(--muted);text-decoration:line-through}
.planhead{display:flex;align-items:center;gap:8px}
.planhead .eco{background:var(--bg)}

/* ---------- Train ---------- */
.hero-tile{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;padding:16px;border-radius:12px;background:var(--surface-2)}
.hero-tile:hover{background:var(--surface-3)}
.ht-l{display:grid;gap:2px}
.ht-l small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.ht-l b{font:800 46px/1 var(--f-display);letter-spacing:-.02em}
.ht-l .muted{font-size:12.5px}
.ht-r{font-size:12.5px;line-height:1.4}
.ht-r .spark{height:58px}
.ht-cta{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--accent-low);margin-top:10px}
.ht-cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:grid;gap:7px;align-content:start;text-align:left;border:0;border-radius:11px;background:var(--surface-2);padding:12px;cursor:pointer;min-width:0}
.tile:hover{background:var(--surface-3)}
.tile-top{display:flex;align-items:center;gap:9px}
.tile-top b{font-size:15px}
.tile-stat{font:600 13px/1 var(--f-mono);color:var(--accent)}
.tile-d{font-size:12.5px;color:var(--muted);line-height:1.4}
.meter{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.slim-tile{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;margin-top:8px;text-align:left;border:0;border-radius:11px;background:var(--surface-2);padding:10px 12px;cursor:pointer}
.slim-tile:hover{background:var(--surface-3)}
.slim-tile>span{display:grid;min-width:0}.slim-tile small{color:var(--muted);font-size:12.5px}
.list{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-radius:10px;background:var(--surface-2);padding:10px 12px;cursor:pointer}
.lrow:hover{background:var(--surface-3)}
.lt{display:grid;min-width:0}.lt small{color:var(--muted);font-size:12.5px}
.pill{font:800 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:5px 7px;border-radius:5px;min-width:3.4em;text-align:center}
.pill.win{background:color-mix(in srgb, var(--accent) 24%, var(--surface-2));color:var(--accent-hi)}
.pill.def{background:color-mix(in srgb, var(--c-great) 26%, var(--surface-2));color:#B9D1E8}
.chev svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ok .ci{display:block}
.turnline{display:flex;align-items:center;gap:10px;font-size:16px;padding:12px;border-radius:10px;background:var(--surface-2)}
.turnline.good{background:color-mix(in srgb, var(--accent) 20%, var(--surface-2))}
.turnline.bad{background:color-mix(in srgb, var(--c-blunder) 16%, var(--surface-2))}
.turn{width:18px;height:18px;border-radius:4px;flex:none}
.turn.w{background:#F4F2EE}.turn.b{background:#151413;box-shadow:inset 0 0 0 1px var(--surface-3)}
.delta{font:700 14px/1 var(--f-mono)}.delta.up{color:var(--accent)}.delta.down{color:var(--c-blunder)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:1fr 1fr}
.stats>div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats small .ci{vertical-align:-2px;margin-right:2px}
.stats b{font:600 19px/1.25 var(--f-mono);font-variant-numeric:tabular-nums}
.goaltext{font:700 14px/1.3 var(--f-body)!important}
.spark{width:100%;height:36px;display:block}
.spark-wrap{display:grid;gap:4px}
.cobig{display:grid;place-items:center;padding:8px 0}
.cobig .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em}
.cobig b{font:800 72px/1 var(--f-display);letter-spacing:-.02em}
.strikes{display:flex;gap:3px}
.strike{opacity:.35}.strike.on{opacity:1}
.strike .ci{display:block}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:6.5em 1fr 3em;gap:10px;align-items:center;font-size:14px}
.bar .bt{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.weak .bt i{background:var(--c-mistake)}
.bar.weak .bl{color:var(--c-mistake);font-weight:700}
.bar b{font:600 14px/1 var(--f-mono);text-align:right}
.recs{display:grid;gap:8px}
.rec{display:grid;gap:8px;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:14px;line-height:1.5;justify-items:start}

/* ---------- Board & pieces sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;background:rgb(0 0 0 / .55);display:grid;place-items:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:12px;box-sizing:border-box}
.sheet-card h3{margin-top:4px}
.boardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.boardgrid button,.setgrid button{border:2px solid transparent;border-radius:10px;background:var(--surface-2);cursor:pointer;padding:8px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:700}
.boardgrid button[aria-pressed="true"],.setgrid button[aria-pressed="true"]{border-color:var(--accent)}
.boardgrid .mini{display:grid;grid-template:1fr 1fr/1fr 1fr;width:44px;height:44px;border-radius:5px;overflow:hidden}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.setgrid .pv{width:72px;height:40px;background-size:36px 36px,36px 36px;background-position:left center,right center;background-repeat:no-repeat;background-color:var(--sq-d);border-radius:6px;box-shadow:inset 36px 0 0 var(--sq-l)}
.opts{display:grid;gap:10px}

/* ---------- Responsive ---------- */
@media (max-width: 1099px){
  .shell{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:31;background:var(--surface)}
  .rail{top:env(safe-area-inset-top, 0px);height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0;font-size:18px}
  .brand .mark{width:30px;height:30px}
  .tabs{display:flex;gap:2px;margin-left:auto}
  .tabs button{width:auto;padding:8px 12px;gap:8px;font-size:14px}
  .tabs svg{width:20px;height:20px}
  .rail-foot{margin:0}
  .railbtn{width:auto;padding:8px}
  .railbtn span,.engine-st{display:none}
  .app{grid-template-columns:auto minmax(300px,380px);--bs:clamp(280px, min(100vh - 260px, 100vw - 470px), 620px)}
}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr);--bs:min(calc(100vw - 32px - 26px), 600px)}
  .panel{min-height:0;overflow:visible}
  .pin{position:static}
  .phead{border-radius:12px 12px 0 0}
  .pbody{overflow:visible}
  .pfoot{position:sticky;bottom:0;z-index:5;border-radius:0 0 12px 12px}
  .moves{max-height:220px}
}
@media (max-width: 640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);margin:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  .tabs button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;align-items:center;text-align:center}
  .tabs svg{width:22px;height:22px}
  .rail{justify-content:space-between}
  .app{padding-block:12px calc(84px + env(safe-area-inset-bottom, 0px));gap:14px}
  .pfoot{bottom:calc(62px + env(safe-area-inset-bottom, 0px))}
  .botrow{grid-template-columns:repeat(3,1fr)}
  .hero-tile{grid-template-columns:1fr}
  .ht-r{display:none}
  .clock{font-size:17px;padding:7px 9px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
