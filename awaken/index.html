<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awaken</title>
<meta name="description" content="A workout system that levels you up: daily quests, penalty zones, gates and stats for real-world training.">
<meta name="theme-color" content="#03060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Awaken">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  /* Layout: one narrow column (max 520px) of stacked glass "System" windows over a dark mana field,
     a fixed bottom tab bar, and full-screen takeovers for runs, gates, the tap counter and settings. */
  --void:#03060d;      /* page ground */
  --deep:#06142a;      /* window fill */
  --line:#45b0ff;      /* system window border */
  --glow:#9be3ff;      /* highlight and glow */
  --ink:#e7f4ff;       /* primary text */
  --dim:#86a2c3;       /* secondary text */
  --red:#ff3e5a; --red-glow:#ff9aa8;
  --gold:#ffc94a; --ok:#62f5c4; --ok-glow:#c2ffe9; --violet:#a684ff;
  --on-accent:#02101f; --scrim:rgba(1,4,10,.74);
  --rank-e:#a8b8cc; --rank-d:#62f5c4; --rank-c:#45b0ff; --rank-b:#a684ff; --rank-a:#ff8a4c; --rank-s:#ffc94a;
  --f-disp:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-skin=shadow]{--line:#9a6bff;--glow:#d6c6ff}
:root[data-skin=ruler]{--line:#f0b429;--glow:#ffe6a3}
.tone-red{--line:var(--red);--glow:var(--red-glow)}
.tone-ok{--line:var(--ok);--glow:var(--ok-glow)}
/* derived tints are re-declared wherever --line can change, so they follow the local tone */
:root,.tone-red,.tone-ok{--line-a:color-mix(in srgb,var(--line) 72%,transparent);--line-b:color-mix(in srgb,var(--line) 30%,transparent);--line-c:color-mix(in srgb,var(--line) 12%,transparent)}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.i{width:20px;height:20px;flex:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(130% 60% at 50% -8%,var(--line-b),transparent 62%),radial-gradient(90% 50% at 50% 115%,var(--line-c),transparent 70%),var(--void)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 14px;background:linear-gradient(var(--void) 72%,transparent)}
.lv{flex:none;width:48px;height:48px;display:grid;place-items:center;align-content:center;gap:1px;background:var(--line-c);border:1px solid var(--line-a);border-radius:3px;box-shadow:0 0 14px var(--line-b),inset 0 0 10px var(--line-c)}
.lv small{font:600 9px/1 var(--f-disp);letter-spacing:.2em;color:var(--dim)}
.lv b{font:700 20px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0;display:grid;gap:7px}
.who-n{display:flex;align-items:center;gap:8px;min-width:0}
.nm{font:600 17px/1.1 var(--f-disp);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar,.bar{height:5px;background:var(--line-c);border-radius:1px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-c)}
.xpbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 10px var(--line)}
.coin{display:flex;align-items:center;gap:5px;color:var(--gold);font:600 15px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.coin .i{width:16px;height:16px}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid var(--line-b);border-radius:3px;color:var(--ink)}
.icon-btn:active{background:var(--line-c)}
.rk{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border:1px solid currentColor;border-radius:2px;font:700 12px/1 var(--f-disp);letter-spacing:.04em;flex:none}
.rk-E{color:var(--rank-e)}.rk-D{color:var(--rank-d)}.rk-C{color:var(--rank-c)}.rk-B{color:var(--rank-b)}.rk-A{color:var(--rank-a)}.rk-S{color:var(--rank-s)}
.tag{display:inline-block;padding:2px 6px;border:1px solid currentColor;border-radius:2px;font:600 10px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.tag.red{color:var(--red)}.tag.gold{color:var(--gold)}.tag.ok{color:var(--ok)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--void) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line-b);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{position:relative;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 5px;color:var(--dim);font:600 10px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--glow);text-shadow:0 0 10px var(--line)}
.tab.on .i{filter:drop-shadow(0 0 6px var(--line))}
.tab.on::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--line)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}

/* ---------- system window ---------- */
.view{display:grid;gap:18px;padding-top:2px}
.win{position:relative;padding:18px 16px 16px;border:1px solid var(--line-a);border-radius:3px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 90%,transparent),color-mix(in srgb,var(--void) 84%,transparent));
  box-shadow:0 0 0 1px var(--line-c),0 0 24px var(--line-b),inset 0 0 32px var(--line-c);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px var(--line))}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win-head{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 16px}
.win-ico,.win-ttl{border:1.5px solid var(--ink);border-radius:3px;box-shadow:0 0 10px var(--line-b),inset 0 0 8px var(--line-b)}
.win-ico{width:30px;height:30px;display:grid;place-items:center;font:700 18px/1 var(--f-disp)}
.win-ttl{margin:0;padding:7px 16px 6px;font:600 14px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;text-shadow:0 0 10px var(--line)}
.sys{margin:0 0 14px;text-align:center;font:500 15.5px/1.4 var(--f-disp);letter-spacing:.02em;text-wrap:balance}
.note,.hint{margin:10px 0 0;font-size:13.5px;color:var(--dim)}
.eyebrow{margin:0 0 2px;font:600 11px/1.2 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--glow)}
.empty{margin:4px 0;text-align:center;color:var(--dim)}

/* daily quest */
.goal-h{margin:0 0 4px;text-align:center;font:600 13px/1 var(--f-disp);letter-spacing:.34em;color:var(--glow)}
.goals{list-style:none;margin:0;padding:0;display:grid}
.goal{position:relative;width:100%;display:grid;grid-template-columns:1fr auto 24px;align-items:center;gap:12px;padding:13px 4px 13px;background:none;border:0;border-bottom:1px solid var(--line-b);text-align:left}
.goal:active{background:var(--line-c)}
.g-name{font:500 17px/1.2 var(--f-body)}
.g-val{font:600 16px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap}
.chk{width:22px;height:22px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:2px}
.chk .i{width:16px;height:16px}
.goal.done .chk{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 50%,transparent)}
.goal.done .g-val{color:var(--ok)}
.g-bar{position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--p)*100%);background:var(--glow);box-shadow:0 0 8px var(--line)}
.goal.done .g-bar{background:var(--ok)}
.warn{margin:16px 0 0;text-align:center;font-size:14px;color:var(--dim);text-wrap:balance}
.warn b{color:var(--red);letter-spacing:.08em;font-family:var(--f-disp)}
.warn u{color:var(--red);text-decoration:none;border-bottom:1px solid currentColor}
.clock{margin-top:14px;display:flex;justify-content:center;align-items:baseline;gap:8px;font:600 24px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.clock .i{width:20px;height:20px;color:var(--glow);align-self:center}
.clock small{font:500 12px var(--f-body);color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.stamp{margin:16px auto 0;width:max-content;padding:8px 18px 7px;border:2px solid var(--ok);color:var(--ok);font:700 19px/1 var(--f-disp);letter-spacing:.32em;transform:rotate(-2deg);box-shadow:0 0 18px color-mix(in srgb,var(--ok) 35%,transparent),inset 0 0 12px color-mix(in srgb,var(--ok) 25%,transparent)}
.rw-line{margin:12px 0 0;text-align:center;color:var(--dim);font-size:14px}
.side{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side-q{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:11px 2px;background:none;border:0;border-bottom:1px solid var(--line-c);text-align:left}
.side-q .box{width:20px;height:20px;border:1.5px solid var(--line-a);border-radius:2px;display:grid;place-items:center}
.side-q .box .i{width:14px;height:14px}
.side-q.done .box{border-color:var(--ok);color:var(--ok)}
.side-q.done .side-n{color:var(--dim);text-decoration:line-through}
.side-r{font:600 12px/1 var(--f-disp);letter-spacing:.06em;color:var(--glow);white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--on-accent);font:700 11px/1 var(--f-disp)}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border:1px solid var(--line-a);border-radius:3px;background:var(--line-c);color:var(--ink);
  font:600 14px/1.1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;text-align:center;transition:background .15s,box-shadow .15s,transform .05s}
.btn:active{background:var(--line-b);box-shadow:0 0 18px var(--line-b);transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--glow),var(--line));border-color:var(--glow);color:var(--on-accent);box-shadow:0 0 18px var(--line-b)}
.btn.pri:active{box-shadow:0 0 26px var(--line-a)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:12px}
.btn.xl{min-height:58px;font-size:16px}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:var(--line-b)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.danger-ghost{background:none;border-color:color-mix(in srgb,var(--red) 60%,transparent);color:var(--red)}
.btn.sq{width:56px;min-height:56px;padding:0;font-size:26px;letter-spacing:0}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .i{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>:only-child{grid-column:1/-1}
.link{background:none;border:0;padding:0;color:var(--glow);text-align:left;border-bottom:1px dashed var(--line-a);font:inherit}

/* status */
.st-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.st-lv{display:grid;justify-items:center;padding:10px 14px;border:1px solid var(--line-a);box-shadow:inset 0 0 18px var(--line-c)}
.st-lv b{font:700 46px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--line)}
.st-lv span{font:600 11px/1 var(--f-disp);letter-spacing:.3em;color:var(--dim);margin-top:4px}
.st-id{margin:0;display:grid;gap:6px;min-width:0}
.st-id div{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:baseline;min-width:0}
.st-id dt{font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.st-id dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.xp{margin:16px 0 0;display:grid;gap:6px}
.xp small{text-align:right;color:var(--dim);font:500 12.5px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.vitals{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.meter{display:grid;gap:5px}
.meter-l{display:flex;justify-content:space-between;font:600 12.5px/1 var(--f-disp);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.meter .bar{height:7px}
.meter.hp .bar i{background:linear-gradient(90deg,#d32b47,var(--red));box-shadow:0 0 10px var(--red)}
.meter.mp .bar i{background:linear-gradient(90deg,var(--line),var(--glow))}
.fat{grid-column:1/-1;display:flex;justify-content:space-between;font:600 12.5px/1 var(--f-disp);letter-spacing:.08em;color:var(--dim)}
.fat b{color:var(--ink)}
.stats{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-b);display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.stat{position:relative;display:grid;grid-template-columns:1fr auto 32px;align-items:center;gap:8px;padding:8px 0 10px}
.st-name{background:none;border:0;padding:0;text-align:left;font:600 15px/1 var(--f-disp);letter-spacing:.12em;color:var(--ink)}
.stat b{font:700 22px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.plus{width:30px;height:30px;padding:0;display:grid;place-items:center;border:1px solid var(--glow);border-radius:2px;background:var(--line-b);color:var(--ink);font:700 18px/1 var(--f-disp);box-shadow:0 0 10px var(--line-b)}
.plus:active{background:var(--line)}
.st-x{position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--line-c)}
.st-x i{display:block;height:100%;background:var(--line-a)}
.pts{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font:600 12px/1.2 var(--f-disp);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.pts b{font-size:22px;color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 50%,transparent)}
.debuff{margin:12px 0 0;padding:8px 10px;border:1px solid color-mix(in srgb,var(--red) 60%,transparent);color:var(--red);font:600 13px/1.3 var(--f-disp);letter-spacing:.06em;text-align:center}
.effects{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.effects li{padding:5px 8px;border:1px solid var(--line-b);font:500 12.5px/1 var(--f-disp);letter-spacing:.04em;color:var(--glow)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-c)}
.li h4{margin:0;font:600 15px/1.2 var(--f-disp);letter-spacing:.04em}
.li p{margin:0;grid-column:1/-1;font-size:13.5px;color:var(--dim)}
.li.locked h4{color:var(--dim)}
.li .tag{justify-self:end}

/* gates */
.gates{display:grid;gap:12px}
.gate{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px 12px;border:1px solid var(--line-b);background:var(--line-c);border-radius:3px}
.gate.red{border-color:color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.gate.trial{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.portal{width:58px;height:74px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font:700 24px/1 var(--f-disp);
  background:radial-gradient(closest-side,color-mix(in srgb,currentColor 55%,transparent),color-mix(in srgb,currentColor 12%,transparent) 70%,transparent);box-shadow:0 0 18px color-mix(in srgb,currentColor 45%,transparent),inset 0 0 14px color-mix(in srgb,currentColor 40%,transparent)}
.portal span{color:var(--ink);text-shadow:0 0 10px currentColor}
.portal.red{color:var(--red)}
.portal.big{width:70px;height:90px;font-size:30px}
.g-info{min-width:0;display:grid;gap:4px;align-content:start}
.g-info h3{margin:0;font:600 17px/1.2 var(--f-disp);letter-spacing:.02em}
.g-meta,.g-ex,.g-rw{margin:0;font-size:13.5px;color:var(--dim)}
.g-rw{color:var(--gold);font:600 13px/1.3 var(--f-disp);letter-spacing:.04em}
.g-info .btn{justify-self:start;margin-top:6px}
.mp-row{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font:500 13px/1.2 var(--f-disp);letter-spacing:.04em;color:var(--dim)}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ladder li{display:grid;justify-items:center;gap:6px;padding:10px 0 8px;border:1px solid var(--line-c);font:500 11px/1 var(--f-disp);color:var(--dim);letter-spacing:.04em}
.ladder li.on{border-color:var(--line-a);background:var(--line-c);color:var(--ink);box-shadow:0 0 14px var(--line-b)}
.ladder li.past{opacity:.6}
.gi-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.gi-top h3{margin:0 0 4px;font:600 19px/1.2 var(--f-disp)}
.waves{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.waves h4{margin:0 0 4px;font:600 12px/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--glow)}
.waves ul{list-style:none;margin:0;padding:0}
.waves ul li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-c);font-size:15px}
.waves b{font:600 15px/1 var(--f-disp);font-variant-numeric:tabular-nums}

/* items */
.gold-big{display:flex;align-items:center;justify-content:center;gap:8px;margin:-2px 0 12px;color:var(--gold);font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.gold-big .i{width:22px;height:22px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-c)}
.it-ico{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-a);background:var(--line-c);color:var(--glow);box-shadow:inset 0 0 12px var(--line-c)}
.it-ico .i{width:24px;height:24px}
.it-b{min-width:0}
.it-b h4{margin:0 0 2px;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.it-b h4 span{color:var(--glow);margin-left:4px}
.it-b p{margin:0;font-size:13.5px;color:var(--dim)}
.price{display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
.price .i{width:13px;height:13px}
.swatch{width:44px;height:44px;border:1px solid var(--ink);background:linear-gradient(135deg,var(--sw1),var(--sw2))}

/* records */
.streak{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}

.streak-n span{font:600 10px/1 var(--f-disp);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.kv{margin:0;display:grid;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-c);padding-bottom:6px}
.kv dt{color:var(--dim);font-size:14.5px}
.kv dd{margin:0;font:600 15px/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.cal-wrap{display:grid;grid-template-columns:auto 1fr;gap:6px}
.cal-d{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font:500 10px/1 var(--f-disp);color:var(--dim)}

.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.c{display:block;aspect-ratio:1;max-width:100%;border-radius:1px;background:var(--line-c)}
.c.clear{background:var(--line);box-shadow:0 0 6px var(--line-b)}
.c.fail{background:var(--red)}
.c.rest{background:color-mix(in srgb,var(--dim) 45%,transparent)}
.c.ward{background:var(--gold)}
.c.today{outline:1.5px solid var(--glow);outline-offset:-1.5px}
.c.fut{background:none}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .c{width:11px;height:11px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-c);font-size:14px}
.log time{font:500 12px/1.5 var(--f-disp);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.log b{font-family:var(--f-disp);font-weight:600;letter-spacing:.04em}

/* sheets */
.layer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;border-bottom:0;border-radius:3px 3px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .26s cubic-bezier(.2,.9,.3,1)}
.sheet>*+*{margin-top:14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h3{margin:0;font:600 22px/1.15 var(--f-disp);letter-spacing:.03em}
.prog-line{display:flex;align-items:baseline;gap:6px;font:600 18px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.prog-line b{font-size:30px}
.prog-line span{margin-left:auto;font:500 13px/1 var(--f-disp);letter-spacing:.06em;color:var(--dim)}
.lbl{margin:0;text-align:center;font:600 12px/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.stepper output,.stepper input{text-align:center;font:700 52px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 16px var(--line)}
.stepper input{width:100%;min-width:0;background:none;border:0;border-bottom:1px solid var(--line-a);padding:4px 0;font-size:36px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper.sm .btn.sq{width:46px;min-height:46px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:8px 13px;border:1px solid var(--line-b);border-radius:3px;background:none;font:600 13px/1 var(--f-disp);letter-spacing:.06em}
.chip.on{border-color:var(--glow);background:var(--line-b);box-shadow:0 0 12px var(--line-b)}
.days .chip{min-width:42px}
.cue{margin:0;font-size:14px;color:var(--dim);text-align:center;text-wrap:balance}

/* full screens */
.screen{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(120% 60% at 50% -10%,var(--line-b),transparent 60%),var(--void);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.screen-in{max-width:520px;margin:0 auto;display:grid;gap:16px;align-content:start}
.scr-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scr-head h2{margin:0;font:600 24px/1.15 var(--f-disp);letter-spacing:.03em;overflow-wrap:anywhere}
.boss{padding-bottom:14px}
.boss-top{display:flex;justify-content:space-between;font:600 12px/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.boss-top span:last-child{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.boss-n{margin:8px 0 10px;font:700 22px/1.15 var(--f-disp);letter-spacing:.04em;color:var(--ink)}
.hpbar{position:relative;height:14px;border:1px solid color-mix(in srgb,var(--red) 70%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#9e1530,var(--red));box-shadow:0 0 14px var(--red);transition:width .5s cubic-bezier(.2,.9,.3,1)}

.dmg{position:absolute;right:16px;top:46px;font:700 26px/1 var(--f-disp);color:var(--red);text-shadow:0 0 12px var(--red);animation:dmg 1.1s ease-out forwards;pointer-events:none}
.phase{display:grid;gap:12px;text-align:center}
.ph-l{margin:0;font:600 12px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--glow)}
.ex-n{margin:0;font:700 30px/1.1 var(--f-disp);letter-spacing:.02em}
.ph-n{margin:0;color:var(--dim);font-size:15px}
.ph-n b{color:var(--ink)}
.timer{font:700 72px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 24px var(--line)}
.rest .timer{color:var(--glow)}
.sets{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sets li{width:12px;height:12px;border:1px solid var(--line-a);transform:rotate(45deg)}

.sets li.now{border-color:var(--glow);background:var(--line-b);box-shadow:0 0 10px var(--glow)}
.sets li.boss{border-color:var(--red)}
.confirm{padding:14px;border:1px solid color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent);display:grid;gap:12px}
.confirm p{margin:0;text-align:center}
.run-d{display:flex;align-items:baseline;justify-content:center;gap:8px}
.run-d b{font:700 76px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--line)}
.run-d span{font:600 18px/1 var(--f-disp);letter-spacing:.1em;color:var(--dim)}
.run-stats{margin:14px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.run-stats small{display:block;font:600 10.5px/1 var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.run-stats b{font:600 17px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
#run-map{display:block;width:100%;max-width:100%;aspect-ratio:2/1;border:1px solid var(--line-c);background:var(--line-c)}
.seg{display:flex;border:1px solid var(--line-a);border-radius:3px;overflow:hidden}
.seg-b{flex:1;min-height:42px;padding:8px 6px;border:0;border-left:1px solid var(--line-b);background:none;font:600 12.5px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.seg-b:first-child{border-left:0}
.seg-b.on{background:var(--line-b);color:var(--ink);text-shadow:0 0 10px var(--line)}
.field{display:grid;gap:8px;margin:0 0 16px}
.field>span{font:600 12px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-a);border-radius:3px;background:color-mix(in srgb,var(--void) 70%,transparent);color:var(--ink)}
.field textarea{resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.field .hint{margin:0}
.tog{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;margin:0;background:none;border:0;border-top:1px solid var(--line-c);text-align:left}
.tog-l b{display:block;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.tog-l small{color:var(--dim);font-size:13px}
.tog-s{width:46px;height:26px;border:1px solid var(--line-a);border-radius:13px;position:relative;background:var(--line-c);transition:background .2s}
.tog-s::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.tog[aria-checked=true] .tog-s{background:var(--line-b)}
.tog[aria-checked=true] .tog-s::after{transform:translateX(20px);background:var(--glow);box-shadow:0 0 10px var(--line)}
.win p{text-wrap:pretty}
.about p{margin:0 0 10px;color:var(--dim);font-size:14.5px}

/* onboarding */
.aw{min-height:100%;display:grid;align-content:center;gap:16px;max-width:460px;margin:0 auto;padding-block:20px}
.aw .win{padding:22px 18px 18px}
.aw h3{margin:0 0 4px;font:600 15px/1.3 var(--f-disp);letter-spacing:.04em}
.assess{display:grid;gap:18px}
.diffs{display:grid;gap:8px}
.diff{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line-b);border-radius:3px;background:none;text-align:left}
.diff b{font:600 15px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.diff small{color:var(--dim);font-size:13.5px}
.diff.on{border-color:var(--glow);background:var(--line-c);box-shadow:0 0 14px var(--line-b)}
.preview{margin:14px 0 0;padding:10px 12px;border:1px dashed var(--line-a);font:500 14px/1.5 var(--f-disp);letter-spacing:.02em;text-align:center}
.brand{text-align:center;font:700 13px/1 var(--f-disp);letter-spacing:.6em;color:var(--dim);text-indent:.6em}

/* notifications */
.ntf-layer{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;animation:fade .2s;
  padding:24px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
.ntf{width:100%;max-width:420px;max-height:calc(100vh - 48px);overflow-y:auto;animation:unfold .5s cubic-bezier(.2,.9,.25,1) both}
.lines p{margin:0 0 8px;text-align:center;font:500 16px/1.45 var(--f-disp);letter-spacing:.01em}
.lines .ghost{visibility:hidden}
.big{margin:0 0 14px;text-align:center;font:700 40px/1 var(--f-disp);letter-spacing:.06em;text-shadow:0 0 20px var(--line)}
.rewards{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line-b);display:grid;gap:8px}
.rewards li{display:flex;justify-content:space-between;gap:12px;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.rewards li span{color:var(--dim);font-weight:500}
.ntf-foot{margin:12px 0 0;text-align:center;font-size:13.5px;color:var(--dim)}
.ntf .btn.block{margin-top:16px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line-a);border-radius:3px;background:var(--line-c);text-align:left}
.choice b{font:600 16px/1.2 var(--f-disp);letter-spacing:.06em}
.choice small{color:var(--dim);font-size:13.5px}
.choice .tag{justify-self:start;margin-top:4px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 74px);left:0;right:0;z-index:70;display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{max-width:100%;padding:8px 14px;border:1px solid var(--line-a);background:color-mix(in srgb,var(--deep) 94%,transparent);font:600 14px/1.2 var(--f-disp);letter-spacing:.05em;box-shadow:0 0 16px var(--line-b);animation:toast 2.3s ease forwards;text-align:center}
.toast.stat{border-color:var(--gold);color:var(--gold)}
.toast.bad{border-color:var(--red);color:var(--red)}

/* tap counter */
.tap-scr{min-height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;max-width:520px;margin:0 auto;user-select:none;-webkit-user-select:none}
.pad{justify-self:center;align-self:center;width:min(80vw,56vh);max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;gap:8px;
  border:2px solid var(--glow);background:radial-gradient(closest-side,var(--line-b),var(--line-c) 70%,transparent);box-shadow:0 0 40px var(--line-b),inset 0 0 40px var(--line-b);touch-action:manipulation}
.pad b{font:700 min(26vw,18vh)/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--line)}
.pad small{font:600 12px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.pad.hit{animation:hit .18s ease-out}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes unfold{0%{transform:scale(.6,.012);opacity:0}35%{transform:scale(1,.012);opacity:1}100%{transform:none;opacity:1}}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

.joints{list-style:none;margin:0;padding:0;display:grid}
.joint{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-c)}

.joint small{grid-column:1/-1;color:var(--dim);font-size:13px}

.tri{display:flex;border:1px solid var(--line-b);border-radius:3px;overflow:hidden}

.rec h3{margin:0;font:600 16px/1.2 var(--f-disp);letter-spacing:.03em}
.rec p{margin:0;grid-column:1/-1;color:var(--dim);font-size:13.5px}
.rec .btn{grid-row:1/3;grid-column:2}

details.help summary{cursor:pointer;font:600 13px/1.4 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
details.help ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:14px;display:grid;gap:4px}
.moves{list-style:none;margin:0;padding:0;display:grid}
.moves li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line-c)}
.moves li b{font:600 15px/1.2 var(--f-disp)}
.moves li span{font:600 14px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--glow);white-space:nowrap}

.recbar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 12px var(--line);transition:width .5s cubic-bezier(.2,.9,.3,1)}

/* ---------- joint recovery ----------
   Content was drafted from current physiotherapy guidance and reviewed for safety (see README).
   regions: moves, session order, habits and red flags per joint; stress: which joints each exercise loads;

const RECOVERY={"regions":[{"id":"knee","name":"Knees","overview":"Overdone knees usually ache at the front, around or below the kneecap, after squats, jumps, stairs or running. That ache tends to flare after a sudden jump in training. Recovery means cutting back for a while, not stopping completely: keep moving, calm the knee with gentle holds, then build thigh and hip strength again.","moves":[{"id":"heelslide","name":"Heel slides","type":"reps","target":12,"perSide":true,"sets":2,"cue":"Lie on your back with your legs straight. Slowly slide one heel toward your bottom, then slide it back out.","avoidIf":"Stop if you feel a sharp pinch or the knee locks or catches.","easier":"Only bend as far as feels comfortable, or put a towel under your heel so it slides more easily."},{"id":"quadset","name":"Quad sets","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Sit with your legs straight and a rolled towel under your knees. Push the backs of your knees into the towel, tighten your thighs and hold for 5 seconds.","avoidIf":"Skip if pushing down causes sharp pain behind the knee.","easier":"Do one leg at a time and press more gently."},{"id":"kneeexthold","name":"Seated knee straightening hold","type":"time","target":30,"perSide":true,"sets":2,"cue":"Sit tall on a chair. Straighten one knee until the leg is level, or as close as is comfortable, and hold it still. Breathe normally.","avoidIf":"Stop if the pain goes above 3/10 or gets sharp.","easier":"Hold the leg a little lower or for 20 seconds, with the heel just off the floor."},{"id":"slr","name":"Straight leg raise","type":"reps","target":10,"perSide":true,"sets":2,"cue":"Lie down with one knee bent. Tighten the thigh of the straight leg, lift it to the height of the other knee, then lower it slowly.","avoidIf":"Skip if it strains your lower back or causes sharp knee pain.","easier":"Lift only a few centimetres, or prop yourself on your elbows."},{"id":"sitstand","name":"Chair sit-to-stand","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Sit near the front of a chair with your feet hip-width apart. Stand up without using your hands, then sit back down slowly. Keep your knees in line with your toes.","avoidIf":"Stop if the knee gives way or the pain goes above 3/10.","easier":"Use a higher seat, a cushion, or push off your thighs with your hands."},{"id":"stepup","name":"Low step-up","type":"reps","target":10,"perSide":true,"sets":2,"cue":"Place one foot on a low step and stand up onto it, keeping the knee over your middle toes. Step down slowly with the same leg leading.","avoidIf":"Skip if stairs are clearly painful today or your balance feels shaky.","easier":"Use the lowest step and hold a wall or rail."},{"id":"quadstretch","name":"Standing thigh stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Hold a chair or wall. Bend one knee and hold your ankle behind you, keeping your knees together, until you feel a gentle stretch at the front of the thigh.","avoidIf":"Skip if bending the knee deeply pinches or hurts at the front of the knee.","easier":"Loop a towel around your ankle, or lie face down and use the towel to pull your heel toward you."},{"id":"hamstretch","name":"Seated hamstring stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Sit on the edge of a chair with one leg straight and the heel on the floor. Sit tall and lean forward from the hips until you feel a gentle stretch behind the thigh.","avoidIf":"Stop if you feel tingling or pulling down the back of the leg.","easier":"Bend the straight knee a little and lean forward less."}],"sessionOrder":["heelslide","quadset","kneeexthold","sitstand","stepup","quadstretch"],"habits":[{"id":"kneepaincheck","text":"Keep knee pain at 3/10 or less during training","why":"Mild discomfort that has settled by next morning is fine; sharp or rising pain means do less."},{"id":"kneemorning","text":"Check your knee each morning before you train","why":"If it feels worse than yesterday, the previous day's load was too much, so ease off."},{"id":"kneetrim","text":"Swap jumps and deep squats for low-impact moves today","why":"Cutting back on the activity that flares the knee lets it settle while you stay active."},{"id":"kneewalk","text":"Take a 10-minute easy walk on flat ground","why":"Gentle movement keeps the joint and muscles working and usually eases stiffness."},{"id":"kneehip","text":"Do one hip-strength move as well as your knee work","why":"Guidelines find hip plus knee strengthening works better for front-of-knee pain than knee work alone."},{"id":"kneeramp","text":"Raise training volume by no more than about 10% a week","why":"Building up slowly gives the knee time to adapt and lowers the chance of another flare."}],"redFlags":["Rapid or major swelling, or a knee that is hot and red, especially if you have a fever","The knee locks, catches or gives way","You cannot put weight on the leg or walk normally","Pain started with a pop, a twist or a fall","Numbness, tingling, or a cold or pale foot","Pain at night or at rest that does not ease","Unexplained weight loss or feeling generally unwell","No improvement after about 2 weeks of easing off, or pain that keeps getting worse"]},{"id":"shoulder","name":"Shoulders","overview":"Too many push-ups, pike push-ups or pull-ups too soon often leaves a dull ache at the front or top of the shoulder, worse with overhead reaching. Keep the shoulder moving, use gentle isometric holds to calm it, then rebuild with light strength work. Discomfort up to about 3/10 that settles by next morning is fine.","moves":[{"id":"shpendulum","name":"Pendulum swings","type":"time","target":30,"perSide":true,"sets":2,"cue":"Lean on a chair with your good hand and let the sore arm hang loose. Rock your body so the arm swings in small circles. Don't use the shoulder muscles to lift it.","avoidIf":"Skip if the swinging causes sharp pain or makes you dizzy when you bend forward.","easier":"Make the circles tiny, or just let the arm hang and relax for the full time."},{"id":"shsqueeze","name":"Shoulder blade squeeze","type":"reps","target":12,"perSide":false,"sets":2,"cue":"Sit or stand tall, arms by your sides. Gently draw your shoulder blades back and down, hold 3 seconds, relax.","avoidIf":"Stop if it brings on neck pain or tingling into the arm.","easier":"Squeeze at half strength and hold for only 1 second."},{"id":"shwallext","name":"Wall press: outward","type":"time","target":30,"perSide":true,"sets":2,"cue":"Stand side-on to a wall, elbow bent 90 degrees and tucked at your side. Press the back of your wrist into the wall at about half effort and hold still. Keep your shoulder down.","avoidIf":"Stop if pain goes above 3/10 during the hold or feels sharp.","easier":"Press more softly, or hold for 15 seconds and repeat twice."},{"id":"shwallint","name":"Wall press: inward","type":"time","target":30,"perSide":true,"sets":2,"cue":"Stand in a doorway, elbow bent 90 degrees at your side. Press your palm into the door frame at about half effort and hold still.","avoidIf":"Stop if pain goes above 3/10 or you feel a catch in the front of the shoulder.","easier":"Use a lighter push or a shorter 15-second hold."},{"id":"shwallslide","name":"Wall slides","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Face a wall with your forearms on it. Slowly slide your arms up as far as feels comfortable, then slide back down.","avoidIf":"Stop at the point where pain starts. Skip it on days when lifting the arm hurts more than 3/10.","easier":"Slide only to shoulder height, or slide one arm at a time."},{"id":"shsideer","name":"Side-lying outward turn","type":"reps","target":12,"perSide":true,"sets":2,"cue":"Lie on your good side with a rolled towel under the top elbow, elbow bent 90 degrees. Slowly rotate the forearm up toward the ceiling, then lower over 3 seconds.","avoidIf":"Stop if you feel sharp pain or a clunk in the shoulder.","easier":"Do it with an empty hand before adding a small water bottle, and use a smaller range."},{"id":"shcross","name":"Cross-body stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Bring one arm across your chest at shoulder height. Use the other hand to gently hug it closer until you feel a mild stretch behind the shoulder.","avoidIf":"Skip if you feel a pinch at the front or top of the shoulder rather than a stretch.","easier":"Keep the arm lower, below shoulder height, and pull more lightly."},{"id":"shdoorway","name":"Low doorway chest stretch","type":"time","target":30,"perSide":false,"sets":2,"cue":"Stand in a doorway with forearms on the frame, elbows below shoulder height. Step one foot through until you feel a gentle stretch across the chest.","avoidIf":"Stop if it causes pain in the front of the shoulder or tingling down the arm.","easier":"Do one arm at a time and take a smaller step."}],"sessionOrder":["shpendulum","shsqueeze","shwallext","shwallslide","shsideer","shcross","shdoorway"],"habits":[{"id":"shh1","text":"Cut push-up and pull-up volume by half until the ache settles","why":"Lowering the load lets the tendon calm down without losing the habit of training."},{"id":"shh2","text":"Do the wall press holds once today, even on rest days","why":"Gentle isometric holds can ease tendon pain and keep the shoulder strong."},{"id":"shh3","text":"Rate shoulder pain 0-10 the morning after training","why":"If it's back to normal by morning, the load was OK; if worse, ease off."},{"id":"shh4","text":"Keep reaching and daily tasks going instead of resting the arm","why":"Movement within comfort helps recovery more than keeping the arm still."},{"id":"shh5","text":"Avoid sleeping on the sore shoulder; hug a pillow instead","why":"Lying on it compresses the sore area and can disturb sleep."},{"id":"shh6","text":"Stand up and roll your shoulders every hour you sit","why":"Breaking long slouched periods eases stiffness around the shoulder."}],"redFlags":["Pain started after a fall, a pop or a sudden jerk","You can't lift your arm at all, or it looks out of place","Big swelling, bruising, or a hot, red shoulder","Fever or feeling unwell with the shoulder pain","Numbness, tingling or weakness spreading down the arm","Pain that wakes you at night and won't ease with changing position","Chest pain, shortness of breath or left arm pain: call emergency services","Pain getting worse each day, or no better after about 2 weeks"]},{"id":"back","name":"Lower back","overview":"After overexertion, the lower back usually feels stiff, achy or tight, often after lots of sit-ups, jumps or lifting with a rounded back. Recovery means staying gently active rather than resting in bed: easy mobility and low-load core work, with discomfort kept at about 3/10 or less and settled by the next morning.","moves":[{"id":"pelvictilt","name":"Pelvic tilt","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Lie on your back, knees bent. Gently flatten your low back into the floor, then let it arch a little. Move slowly.","avoidIf":"Pain gets sharp, spreads into your leg, or goes above 3/10.","easier":"Do smaller rocks, or do it sitting on a chair."},{"id":"kneeroll","name":"Knee rolls","type":"reps","target":8,"perSide":true,"sets":2,"cue":"Lie on your back, knees bent and together. Let them roll slowly to one side, then the other, keeping your shoulders down.","avoidIf":"Twisting causes sharp pain or pain down your leg.","easier":"Roll only a short way, or keep your feet wider apart."},{"id":"catcamel","name":"Cat-camel","type":"reps","target":10,"perSide":false,"sets":2,"cue":"On hands and knees, slowly round your back up, then let it gently dip. Stay in a comfortable range.","avoidIf":"Your wrists or knees hurt, or back pain gets sharp.","easier":"Do it sitting on a chair, hands on your knees."},{"id":"kneehug","name":"Single knee hug","type":"time","target":30,"perSide":true,"sets":1,"cue":"Lie on your back. Hug one knee gently toward your chest and breathe slowly.","avoidIf":"It causes sharp pain, or pain or tingling down the leg.","easier":"Hold behind your thigh instead of over the knee, and pull less."},{"id":"birddog","name":"Bird dog","type":"reps","target":8,"perSide":true,"sets":2,"cue":"On hands and knees, reach one arm forward and the opposite leg back. Hold 3 seconds with your back level, then swap.","avoidIf":"You can't keep your back still, or pain rises above 3/10.","easier":"Move only the leg, or only the arm, at a time."},{"id":"deadbug","name":"Dead bug heel taps","type":"reps","target":8,"perSide":true,"sets":2,"cue":"Lie on your back with your hips and knees bent at 90 degrees. Keep your low back quiet and slowly tap one heel to the floor, then the other.","avoidIf":"Your back arches off the floor or pain gets worse.","easier":"Keep your feet on the floor and slide one heel out at a time."},{"id":"proneprop","name":"Lying prop on elbows","type":"time","target":30,"perSide":false,"sets":2,"cue":"Lie face down and prop up on your forearms. Let your belly and hips relax into the floor.","avoidIf":"Arching makes the pain sharper or sends pain into your leg.","easier":"Lie flat face down with a pillow under your belly."},{"id":"childpose","name":"Child's pose","type":"time","target":40,"perSide":false,"sets":1,"cue":"Kneel, sit back toward your heels and reach your arms forward. Breathe slowly into your back.","avoidIf":"Your knees hurt or bending forward makes your back pain worse.","easier":"Put a pillow between your heels and bottom or under your chest."}],"sessionOrder":["pelvictilt","kneeroll","catcamel","kneehug","birddog","deadbug","proneprop","childpose"],"habits":[{"id":"back-walk","text":"Take an easy 10-20 minute walk","why":"Gentle movement helps a sore back recover faster than bed rest."},{"id":"back-sitbreak","text":"Stand up and move every 30-45 minutes of sitting","why":"Long stretches of sitting usually make a sore back stiffer."},{"id":"back-hinge","text":"Bend at your hips and knees when you pick things up","why":"Keeping the load close and the spine relaxed spreads the effort."},{"id":"back-swap","text":"Swap sit-ups and burpees for dead bugs until it settles","why":"This keeps your core training without repeatedly bending a sore back."},{"id":"back-sleep","text":"Sleep with a pillow under or between your knees","why":"A supported position lets your back muscles relax overnight."},{"id":"back-rate","text":"Rate your back pain 0-10 each morning","why":"Pain that is the same or lower the next day means your load is about right."}],"redFlags":["Numbness around the groin, buttocks or inner thighs (saddle area): get emergency care now","New trouble peeing, leaking, or loss of bladder or bowel control: get emergency care now","Numbness, tingling or weakness in one or both legs, or pain spreading below the knee","Back pain that started after a fall, accident or a sudden pop","Fever, feeling generally unwell, or unexplained weight loss along with back pain","Constant pain at night that no position eases","Severe pain that keeps getting worse, or you can't walk normally","New back pain with a history of cancer, osteoporosis or long-term steroid use","Pain not clearly improving after about 2 weeks"]},{"id":"hip","name":"Hips","overview":"Overdone hips usually feel tight or achy at the front of the groin, or sore on the outer hip when lying on that side, climbing stairs or standing on one leg. Recovery means calming things down: keep moving gently, avoid positions that squash the outer hip, and steadily rebuild hip and glute strength.","moves":[{"id":"hiprock","name":"Lying knee rocks","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Lie on your back with your knees bent and feet flat. Slowly let both knees sway to one side, then the other, only as far as is comfortable.","avoidIf":"Keep the range small if it pinches in the groin or outer hip.","easier":"Make the sway smaller and slower."},{"id":"kneetochest","name":"Knee to chest","type":"time","target":30,"perSide":true,"sets":2,"cue":"Lie on your back. Gently pull one knee toward your chest with both hands and keep the other leg relaxed.","avoidIf":"Ease off if you feel a sharp pinch deep in the groin.","easier":"Hold behind the thigh instead of the shin, and pull less far."},{"id":"clamshell","name":"Clamshells","type":"reps","target":12,"perSide":true,"sets":2,"cue":"Lie on your pain-free side with your knees bent and a pillow between them. Keep your feet together and lift the top knee a little, then lower it slowly. Keep your hips stacked.","avoidIf":"Skip if lying on your side hurts, or if your outer hip pain rises above 3/10.","easier":"Make the lift smaller, or do the same move lying on your back by pressing your knees outward."},{"id":"hipabdhold","name":"Standing outer-hip wall press","type":"time","target":30,"perSide":true,"sets":2,"cue":"Stand side-on to a wall with a folded pillow at knee height. Bend the knee closest to the wall and press the outside of it gently into the pillow. Stand tall and hold.","avoidIf":"Stop if the pain gets sharp or goes above 3/10.","easier":"Press more softly, or hold for 20 seconds."},{"id":"bridgehold","name":"Bridge hold","type":"time","target":30,"perSide":false,"sets":2,"cue":"Lie on your back with your knees bent. Squeeze your glutes and lift your hips into a straight line from knees to shoulders, then hold still and keep breathing.","avoidIf":"Lower down if you feel cramping at the back of the thigh or pain in your lower back.","easier":"Lift your hips only halfway, or hold for 15 to 20 seconds."},{"id":"hipflexstretch","name":"Kneeling hip flexor stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Kneel on one knee on a pillow with the other foot in front of you. Tuck your tailbone under and shift forward slightly until you feel a stretch at the front of the back hip.","avoidIf":"Skip if kneeling hurts your knee or the stretch pinches at the front of the hip.","easier":"Do it standing: hold a chair and take a long step back with the leg you want to stretch."},{"id":"hiphinge","name":"Standing hip hinge","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Stand with your feet hip-width apart and your hands on your hips. Push your hips back with a flat back and soft knees, then squeeze your glutes to stand tall.","avoidIf":"Skip if bending forward sends pain into your back or down your leg.","easier":"Make the hinge shallower, or keep your bottom touching a wall behind you as a guide."}],"sessionOrder":["hiprock","kneetochest","clamshell","hipabdhold","bridgehold","hipflexstretch"],"habits":[{"id":"hippaincheck","text":"Keep hip pain at 3/10 or less during training","why":"Mild discomfort that has settled by next morning is fine; sharp or rising pain means do less."},{"id":"hipnocross","text":"Sit and stand without crossing your legs","why":"Crossing the legs or hanging on one hip squeezes the outer-hip tendons and can keep them sore."},{"id":"hippillow","text":"Sleep with a pillow between your knees","why":"It stops the top leg dropping across your body, which takes pressure off the hip overnight."},{"id":"hipmovebreak","text":"Get up and move for 2 minutes every hour you sit","why":"Long spells sitting stiffen the hips, and short walks ease that."},{"id":"hipeasycardio","text":"Swap hills and long runs for flat walks for a few days","why":"Reducing the load that flared the hip lets it calm down while you stay active."}],"redFlags":["Severe hip pain after a fall or injury, or you cannot walk or put weight on the leg","A hot, swollen or red hip, or hip pain with a fever or feeling unwell","Sudden severe pain that started without any injury","Numbness, tingling or weakness spreading down the leg","Pain at night or at rest that does not ease","Groin pain that keeps getting worse with each run or hop","Unexplained weight loss","No improvement after about 2 weeks of easing off, or pain that keeps coming back"]},{"id":"ankle","name":"Ankles & feet","overview":"Overdone ankles and feet usually show up as an achy Achilles at the back of the heel, sharp heel pain with the first steps in the morning, or sore shins after too much running or jumping. Recovery means cutting back the pounding for a while, keeping the foot moving, and steadily rebuilding calf and foot strength, plus stretching for heel pain.","moves":[{"id":"ankleabc","name":"Ankle circles","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Sit with one foot off the floor. Slowly draw big circles with your toes, 10 one way and 10 the other.","avoidIf":"Make the circles smaller if any direction causes sharp pain.","easier":"Point your foot up and down instead of drawing circles."},{"id":"calfhold","name":"Heel-raise hold","type":"time","target":30,"perSide":false,"sets":2,"cue":"Stand holding a wall. Rise up onto the balls of both feet, about halfway up, and hold still with your knees slightly bent.","avoidIf":"Stop if Achilles or heel pain goes above 3/10 or gets sharp.","easier":"Do it sitting: press the balls of your feet down to lift your heels while you lean on your knees."},{"id":"calfraise","name":"Slow calf raises","type":"reps","target":12,"perSide":false,"sets":2,"cue":"Hold a wall. Rise onto your toes for 3 seconds, pause, then lower for 3 seconds. Do it on flat ground.","avoidIf":"Skip on days when walking is clearly painful, or if the pain is still worse the next morning.","easier":"Do it seated, or lift your heels only partway."},{"id":"toeraise","name":"Toe raises","type":"reps","target":12,"perSide":false,"sets":2,"cue":"Stand with your back against a wall and your heels a foot from it. Lift your toes and the front of your feet, then lower them slowly.","avoidIf":"Stop if your shin gets a sharp or pinpoint pain.","easier":"Do it sitting in a chair."},{"id":"onelegbal","name":"Single-leg balance","type":"time","target":30,"perSide":true,"sets":2,"cue":"Stand on one foot next to a wall or chair, with the knee soft and your eyes looking ahead. Touch the support only if you need to.","avoidIf":"Skip if standing on that foot is painful, or if you feel dizzy.","easier":"Keep a fingertip on the wall, or rest the other toes lightly on the floor."},{"id":"calfstretch","name":"Wall calf stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Face a wall with your hands on it and step one foot back. Keep that leg straight, the heel down and the toes forward, and lean in until the calf stretches.","avoidIf":"Skip if your pain is right where the Achilles meets the heel bone, since stretching can squeeze that spot.","easier":"Take a shorter step back and lean less."},{"id":"soleusstretch","name":"Bent-knee calf stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Do the same stance as the wall calf stretch, but bend both knees and sink down, keeping the back heel on the floor. Feel the stretch low in the calf.","avoidIf":"Skip if it causes pain at the back of the heel bone.","easier":"Take a smaller step back and bend the knees less."},{"id":"footroll","name":"Foot roll","type":"time","target":30,"perSide":true,"sets":2,"cue":"Sit and roll the arch of one foot slowly back and forth over a water bottle, using gentle pressure.","avoidIf":"Skip if you have numbness in your feet or an open cut on the sole.","easier":"Press more lightly, or roll a rolled-up towel instead."}],"sessionOrder":["ankleabc","calfhold","calfraise","toeraise","onelegbal","calfstretch"],"habits":[{"id":"anklepaincheck","text":"Keep foot and ankle pain at 3/10 or less during training","why":"Mild discomfort that has settled by next morning is fine; sharp or rising pain means do less."},{"id":"anklefirststeps","text":"Circle your ankles before your first steps out of bed","why":"Heel and Achilles pain is often worst in the first steps after rest, and moving first eases it."},{"id":"anklesupportshoes","text":"Wear supportive shoes on hard floors instead of going barefoot","why":"Cushioning and support take some of the load off a sore heel or Achilles."},{"id":"ankleimpact","text":"Swap running or jumping for a walk or low-impact moves today","why":"Cutting back the pounding gives an overworked tendon or shin time to settle while you stay active."},{"id":"ankleramp","text":"Raise running time by no more than about 10% a week","why":"Sudden jumps in mileage are a common cause of Achilles, heel and shin overload."}],"redFlags":["You cannot take 4 steps or put weight on the foot","A pop or a feeling of being kicked in the back of the heel, or you cannot rise onto your toes","Major swelling or bruising, or the ankle looks misshapen","Pain right on a bone that is tender to press, especially after a fall or twist","Numbness, tingling, or a cold or pale foot","A hot, red, swollen calf, or calf pain with shortness of breath (get urgent help)","Pinpoint shin pain that hurts at rest or at night","No improvement after about 2 weeks of easing off, or pain that keeps getting worse"]},{"id":"wrist","name":"Wrists & elbows","overview":"Lots of push-ups, planks and burpees can overload the wrists, and pull-ups or gripping can leave the outer or inner elbow sore. Keep the joint moving, use gentle holds to calm the tendons, then rebuild slowly with light loading. Discomfort up to about 3/10 that settles by next morning is fine.","moves":[{"id":"wrmobility","name":"Wrist bends and circles","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Rest your forearms on a table, hands off the edge. Slowly bend your wrists up and down, then make slow circles each way.","avoidIf":"Stop if a movement clicks painfully or gives sharp pain.","easier":"Move only through the pain-free range, or do one hand at a time."},{"id":"wrglide","name":"Finger tendon glides","type":"reps","target":8,"perSide":false,"sets":2,"cue":"Start with fingers straight. Bend the top knuckles into a hook, then make a full fist, then a flat fist with fingers straight from the knuckles. Open up between each.","avoidIf":"Stop if fingers go numb or tingle, or if any shape causes sharp pain.","easier":"Do just the hook and the open hand until it feels easy."},{"id":"wrextiso","name":"Wrist-back hold","type":"time","target":30,"perSide":true,"sets":2,"cue":"Rest your forearm on a table, palm down. Place your other hand on the back of it and press up into it, not letting the wrist move. Use about half effort.","avoidIf":"Stop if pain at the elbow or wrist goes above 3/10 during the hold.","easier":"Press more softly, or hold for 20 seconds."},{"id":"wrflexiso","name":"Wrist-forward hold","type":"time","target":30,"perSide":true,"sets":2,"cue":"Rest your forearm on a table, palm up. Place your other hand on your palm and press up into it, keeping the wrist still. Use about half effort.","avoidIf":"Stop if pain at the inner elbow or wrist goes above 3/10.","easier":"Press more softly, or hold for 20 seconds."},{"id":"wrrotate","name":"Forearm turns","type":"reps","target":12,"perSide":true,"sets":2,"cue":"Sit with your elbow bent at your side, holding a water bottle by one end. Slowly turn your palm up, then down.","avoidIf":"Stop if turning causes sharp pain at the elbow or wrist.","easier":"Do it with an empty hand, or hold the bottle near the middle."},{"id":"wrecc","name":"Slow wrist lowers","type":"reps","target":10,"perSide":true,"sets":2,"cue":"Rest your forearm on a table, palm down, holding a small water bottle. Use your other hand to lift the wrist up, then lower it slowly on its own over 3 seconds.","avoidIf":"Skip it on days when the elbow or wrist is above 3/10 at rest.","easier":"Use an empty hand or a half-full bottle."},{"id":"wrprayer","name":"Prayer stretch","type":"time","target":30,"perSide":false,"sets":2,"cue":"Press your palms together in front of your chest. Slowly lower your hands, keeping palms together, until you feel a gentle stretch in the wrists.","avoidIf":"Stop if you feel tingling in the fingers or sharp wrist pain.","easier":"Lower your hands only a little, or press more lightly."},{"id":"wrextstretch","name":"Forearm back stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Hold one arm out in front, palm down. Use the other hand to gently bend the wrist down until you feel a mild stretch along the top of the forearm.","avoidIf":"Skip if it causes sharp pain at the outer elbow.","easier":"Keep the elbow slightly bent and stretch more gently."}],"sessionOrder":["wrmobility","wrglide","wrextiso","wrrotate","wrecc","wrprayer","wrextstretch"],"habits":[{"id":"wrh1","text":"Do push-ups on fists or a raised surface if wrists ache","why":"Less wrist bend takes strain off a sore wrist while you keep training."},{"id":"wrh2","text":"Do the wrist holds once today, even on rest days","why":"Gentle holds can ease tendon pain and keep the forearm strong."},{"id":"wrh3","text":"Rate wrist or elbow pain 0-10 the morning after training","why":"If it's back to normal by morning, the load was OK; if worse, ease off."},{"id":"wrh4","text":"Loosen your grip on phone, mouse and bags today","why":"Tight gripping all day keeps loading sore forearm tendons."},{"id":"wrh5","text":"Take a 1-minute hand break every 30 minutes of typing","why":"Short breaks stop the same tendons working nonstop."},{"id":"wrh6","text":"Add training volume back by about 10% per week","why":"Small steps let tendons adapt instead of flaring up again."}],"redFlags":["Pain started after a fall onto your hand or a pop","Major swelling, bruising or a visible bump or change in shape","You can't grip, or you can't bend or straighten the elbow fully","Numbness, tingling or pins and needles in the fingers","Weakness, or dropping things more often","Hot, red, swollen joint, or fever","Pain at night or at rest that keeps getting worse","No improvement after about 2 weeks of easing off"]},{"id":"neck","name":"Neck","overview":"Neck soreness from training usually comes from straining during sit-ups, crunches or leg raises, or from long slouched sitting after. Gentle movement and light strength work help more than keeping the neck still. Discomfort up to about 3/10 that settles by next morning is fine.","moves":[{"id":"nkchintuck","name":"Chin tucks","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Sit tall and look ahead. Gently slide your chin straight back, like making a double chin. Hold 3 seconds, then relax.","avoidIf":"Stop if it causes dizziness, or tingling in your arms.","easier":"Do it lying on your back with your head on a pillow."},{"id":"nkturn","name":"Gentle head turns","type":"reps","target":8,"perSide":true,"sets":2,"cue":"Sit tall. Slowly turn your head to look over one shoulder as far as is comfortable, then back to centre.","avoidIf":"Stop if you feel dizzy, sick or see blurred vision. Don't roll your head in full circles.","easier":"Turn only halfway, or do fewer reps."},{"id":"nkrolls","name":"Shoulder rolls","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Let your arms hang. Slowly roll your shoulders up, back and down in big circles.","avoidIf":"Stop if it brings on sharp neck pain.","easier":"Make the circles smaller and slower."},{"id":"nknod","name":"Lying head nod","type":"time","target":20,"perSide":false,"sets":3,"cue":"Lie on your back with your head on a thin pillow. Make a tiny nod as if saying yes, and hold. Keep your head resting on the pillow.","avoidIf":"Stop if the front of your neck shakes hard or the pain goes above 3/10.","easier":"Hold for 10 seconds and repeat more times."},{"id":"nkiso","name":"Side press hold","type":"time","target":20,"perSide":true,"sets":2,"cue":"Sit tall. Place your palm on the side of your head and press your head into it lightly, about a quarter effort. Don't let your head move.","avoidIf":"Stop if pain spreads into the arm or goes above 3/10.","easier":"Press even more lightly, or hold for 10 seconds."},{"id":"nkchairext","name":"Chair back arch","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Sit in a chair with your hands behind your head. Gently lean your upper back over the top of the backrest, then return to upright.","avoidIf":"Skip if leaning back gives you dizziness or sharp pain.","easier":"Cross your arms over your chest and make the movement smaller."},{"id":"nktrap","name":"Side neck stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Sit tall and hold the chair seat with one hand. Gently tip your ear toward the other shoulder until you feel a mild stretch.","avoidIf":"Stop if you feel tingling into the arm or a sharp pain.","easier":"Let go of the chair and tilt less."},{"id":"nklevator","name":"Look-down stretch","type":"time","target":30,"perSide":true,"sets":2,"cue":"Turn your head slightly to one side, then look down toward your armpit. Rest a hand lightly on your head for a gentle stretch.","avoidIf":"Stop if you feel dizzy or have tingling in the arm.","easier":"Skip the hand and just let your head drop gently."}],"sessionOrder":["nkchintuck","nkturn","nkrolls","nknod","nkiso","nkchairext","nktrap"],"habits":[{"id":"nkh1","text":"During sit-ups, rest fingers lightly at your temples, don't pull","why":"Pulling on the head strains the neck instead of training the core."},{"id":"nkh2","text":"Raise your phone to eye level instead of looking down","why":"Long periods of looking down load the neck muscles."},{"id":"nkh3","text":"Get up and move for 1 minute every 30-45 minutes sitting","why":"Changing position often eases neck stiffness more than one perfect posture."},{"id":"nkh4","text":"Do 10 chin tucks at some point today","why":"Little-and-often movement keeps the neck from stiffening up."},{"id":"nkh5","text":"Use one pillow that keeps your head level with your body","why":"A level head position at night reduces morning neck stiffness."},{"id":"nkh6","text":"Rate neck pain 0-10 the morning after training","why":"If it's back to normal by morning, the load was OK; if worse, ease off."}],"redFlags":["Neck pain after a fall, a crash or a hit to the head","Numbness, tingling or weakness in the arms or legs","Trouble walking, clumsy hands, or problems with bladder or bowels","Dizziness, double vision, trouble speaking or swallowing, or fainting","Severe headache with a stiff neck, fever or rash: get help urgently","Pain at night that doesn't ease with changing position","Unexplained weight loss or feeling generally unwell with the pain","Pain getting worse, or no better after about 2 weeks"]},{"id":"general","name":"Full body","overview":"After a hard training block, overexertion often shows up as widespread muscle soreness that peaks 1-3 days later, heavy legs, stiff joints, poor sleep and low drive to train. Recovery means an easy active-recovery day: light movement, gentle stretching, good sleep, food and water, then building back up gradually.","moves":[{"id":"easymarch","name":"Easy march in place","type":"time","target":45,"perSide":false,"sets":2,"cue":"March in place at an easy pace, swinging your arms. You should be able to chat comfortably.","avoidIf":"You feel dizzy, short of breath or have chest discomfort.","easier":"March while sitting on a chair, or hold a wall for balance."},{"id":"armcircle","name":"Arm circles","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Arms out to the sides, make slow, easy circles. First set forward, second set backward.","avoidIf":"Your shoulders pinch or hurt above 3/10.","easier":"Make small circles, or do one arm at a time."},{"id":"openbook","name":"Open book rotation","type":"reps","target":8,"perSide":true,"sets":1,"cue":"Lie on your side, knees bent, arms out in front. Open your top arm across to the other side, following it with your eyes, then return.","avoidIf":"Your back or shoulder pain gets sharp.","easier":"Open only halfway, or put a pillow under your head and knees."},{"id":"kneelhipflex","name":"Half-kneeling hip flexor stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Kneel on one knee on a pillow, other foot forward. Tuck your tailbone and shift forward until you feel a stretch at /* ---------- state ---------- */
