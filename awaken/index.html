/* ---------- cloud save & reminders (optional; they use the Awaken server) ---------- */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const PLUG=n=>NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins[n]:null;
// the Android app's pages are bundled inside it, so it talks to the public server
const API=NATIVE?'https://awaken.philip-realivasquez.workers.dev':'';
const CLOUD_KEY='awaken.cloud.v1',PUSH_KEY='awaken.push.v1';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json'},cache:'no-store'});
  let body={};try{body=await r.json()}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const hashS=()=>String(seed(exportText()));

// The cloud save code is the only key: the server stores the save encrypted with it and can't read it.
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newCode(){
  const b=crypto.getRandomValues(new Uint8Array(15));let bits=0,v=0,out='';
  for(const x of b){v=(v<<8)|x;bits+=8;while(bits>=5){out+=B32[(v>>>(bits-5))&31];bits-=5}v&=(1<<bits)-1}
  return out.match(/.{4}/g).join('-');
}
function normCode(s){
  const c=String(s||'').toUpperCase().replace(/[IL]/g,'1').replace(/O/g,'0').replace(/[^0-9A-Z]/g,'');
  return c.length===24&&[...c].every(ch=>B32.includes(ch))?c.match(/.{4}/g).join('-'):null;
}
async function codeKeys(code){
  const h=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
  const id=[...await h('awaken-id:'+code)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return {id,key:await crypto.subtle.importKey('raw',await h('awaken-key:'+code),'AES-GCM',false,['encrypt','decrypt'])};
}
async function gz(u,pack){
  if(!('CompressionStream' in window)) return null;
  const t=pack?new CompressionStream('gzip'):new DecompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(t)).arrayBuffer());
}
async function sealText(key,text){
  const raw=new TextEncoder().encode(text),z=await gz(raw,true),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,z||raw));
  return JSON.stringify({v:1,z:!!z,iv:b64(iv),ct:b64(ct)});
}
async function openText(key,data){
  const o=JSON.parse(data);
  let pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)));
  if(o.z) pt=await gz(pt,false);
  return new TextDecoder().decode(pt);
}
const Cloud={cfg:lsGet(CLOUD_KEY),keys:null,busy:false,timer:0,err:false};
const cloudStore=()=>lsSet(CLOUD_KEY,Cloud.cfg);
async function cloudKeys(){if(!Cloud.keys||Cloud.keys.code!==Cloud.cfg.code) Cloud.keys={code:Cloud.cfg.code,...await codeKeys(Cloud.cfg.code)};return Cloud.keys}
function cloudSoon(){if(!Cloud.cfg||!S.awakened) return;clearTimeout(Cloud.timer);Cloud.timer=setTimeout(()=>cloudSync(),15000)}
const busyNow=()=>!!(S.session||(S.run&&S.run.seg)||(UI.screen&&['tap','awaken'].includes(UI.screen.kind)));
function cloudUnlinked(msg){Cloud.cfg=null;Cloud.keys=null;cloudStore();notify({kind:'info',head:'Cloud Save',lines:[msg,'Your progress on this device is unchanged.']});refresh()}
async function cloudApply(rec,key,msg){
  const text=await openText(key,rec.data);
  importText(text,true);
  Object.assign(Cloud.cfg,{rev:rec.rev,hash:hashS(),at:rec.updated});cloudStore();
  toast(msg);
}
// uploads changes from this device, loads newer saves from other devices, and asks when both changed
async function cloudSync(manual){
  const c=Cloud.cfg;if(!c||Cloud.busy||!S.awakened) return;
  Cloud.busy=true;clearTimeout(Cloud.timer);if(manual) refresh();
  try{
    const {id,key}=await cloudKeys();
    if(hashS()!==c.hash){
      const r=await api('/api/sync/'+id,{method:'PUT',body:JSON.stringify({data:await sealText(key,exportText()),base:c.rev})});
      if(r.ok){Object.assign(c,{rev:r.body.rev,hash:hashS(),at:r.body.updated});cloudStore();if(manual) toast('Cloud save updated')}
      else if(r.status===409){
        if(!r.body.rev) cloudUnlinked('[The cloud save was deleted on another device.]');
        else await cloudConflict(id,key);
      }
      else throw new Error(r.status);
    } else {
      const r=await api('/api/sync/'+id);
      if(r.status===404){if(c.rev>0) cloudUnlinked('[The cloud save was deleted on another device.]')}
      else if(!r.ok) throw new Error(r.status);
      else if(r.body.rev>c.rev){if(!busyNow()) await cloudApply(r.body,key,'Progress loaded from your cloud save')}
      else if(manual) toast('Cloud save is up to date');
    }
    Cloud.err=false;
  }catch(e){Cloud.err=true;if(manual) toast('Could not reach the cloud save. Your progress is safe on this device.','bad')}
  Cloud.busy=false;
  if(UI.screen&&UI.screen.kind==='settings') refresh();
}
async function cloudConflict(id,key){
  const r=await api('/api/sync/'+id);if(!r.ok) throw new Error(r.status);
  let other;try{other=JSON.parse(await openText(key,r.body.data))}catch(e){throw new Error('decrypt')}
  const op=other.player||{};
  notify({kind:'info',head:'Cloud Save',lines:['[Two versions of your progress were found.]','Both this device and another one changed since they last synced. Choose which to keep.'],prio:3,
    choices:[{id:'cloud',name:'Use the cloud save',desc:`${esc(op.name||'Player')} · Lv ${+op.level||1} · saved ${clockTime(r.body.updated)}`},{id:'local',name:'Keep this device',desc:`${esc(S.player.name)} · Lv ${S.player.level} · replaces the cloud save`}],
    onChoose:x=>{
      if(x==='cloud'){if(busyNow()){toast('Finish your workout first, then sync again.','bad');return}cloudApply(r.body,key,'Progress loaded from your cloud save').catch(()=>toast('Could not load the cloud save.','bad'))}
      else{Cloud.cfg.rev=r.body.rev;Cloud.cfg.hash='';cloudStore();cloudSync(true)}
    }});
}
async function cloudCreate(){
  Cloud.cfg={code:newCode(),rev:0,hash:'',at:0};cloudStore();UI.showCode=true;
  await cloudSync(true);
  if(Cloud.err){Cloud.cfg=null;cloudStore()}
  refresh();
}
async function cloudLink(raw){
  const code=normCode(raw);if(!code){toast('That code doesn\'t look right. It has 24 letters and numbers.','bad');return}
  try{
    const {id,key}=await codeKeys(code),r=await api('/api/sync/'+id);
    if(r.status===404){toast('No cloud save uses that code.','bad');return}
    if(!r.ok) throw new Error(r.status);
    let other;try{other=JSON.parse(await openText(key,r.body.data))}catch(e){toast('That code doesn\'t open this cloud save.','bad');return}
    const op=other.player||{};
    notify({kind:'info',head:'Cloud Save',lines:['[Cloud save found.]',`${esc(op.name||'Player')} · Lv ${+op.level||1} · saved ${clockTime(r.body.updated)}`,S.awakened?'Linking replaces the progress on this device with the cloud save.':'Linking loads this progress onto this device.'],prio:3,
      choices:[{id:'link',name:'Link and load',desc:'This device then stays in sync.'},{id:'no',name:'Cancel',desc:'Nothing changes.'}],
      onChoose:x=>{if(x!=='link') return;Cloud.cfg={code,rev:0,hash:'',at:0};Cloud.keys=null;cloudApply(r.body,key,'Cloud save linked').then(()=>{UI.linking=false;refresh()}).catch(()=>{Cloud.cfg=null;cloudStore();toast('Could not load the cloud save.','bad')})}});
  }catch(e){toast('Could not reach the cloud save. Check your connection.','bad')}
}
async function cloudDelete(){
  try{const {id}=await cloudKeys(),r=await api('/api/sync/'+id,{method:'DELETE'});if(!r.ok) throw new Error(r.status)}
  catch(e){toast('Could not reach the cloud save. Try again later.','bad');return}
  Cloud.cfg=null;Cloud.keys=null;cloudStore();UI.confirmCloudDel=false;toast('Cloud save deleted');refresh();
}

const Push={cfg:lsGet(PUSH_KEY),last:''};
const pushStore=()=>lsSet(PUSH_KEY,Push.cfg);
const pushSupported=()=>NATIVE?!!PLUG('LocalNotifications'):('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window);
function remindPrefs(){
  const d=S.daily;
  return {tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',reset:S.settings.resetHour,before:Push.cfg?Push.cfg.before:3,rest:S.settings.restDays,
    skip:d&&(d.cleared||d.rest||d.heal)?d.date:null};

async function remindOn(before){
  before=clamp(+before||3,1,12);
  try{
    if(NATIVE){
      const LN=PLUG('LocalNotifications');if(!LN) throw new Error('none');
      const p=await LN.requestPermissions();if(p.display!=='granted'){toast('Notifications are off for Awaken. Turn them on in Android settings.','bad');return}
      Push.cfg={native:true,before};pushStore();Push.last='';remindSync();toast('Reminders on');refresh();return;
    }
    if(!pushSupported()){toast('This browser can\'t show reminders. On iPhone, add Awaken to your Home Screen first.','bad');return}
    if(await Notification.requestPermission()!=='granted'){toast('Notifications are blocked. Allow them for this site in your browser settings.','bad');return}
    const k=await api('/api/push/key');if(!k.ok) throw new Error('key');
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64(k.body.key)});
    Push.cfg={endpoint:sub.endpoint,before};
    const r=await api('/api/push/subscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint,...remindPrefs()})});
    if(!r.ok) throw new Error(r.status);
    pushStore();Push.last=JSON.stringify(remindPrefs());toast('Reminders on');
  }catch(e){Push.cfg=null;pushStore();toast('Could not turn on reminders. Try again later.','bad')}
  refresh();
}
async function remindOff(){
  const c=Push.cfg;Push.cfg=null;pushStore();refresh();
  try{
    if(c&&c.native){const LN=PLUG('LocalNotifications');if(LN) await LN.cancel({notifications:Array.from({length:8},(_,i)=>({id:100+i}))});return}
    if(c&&c.endpoint) await api('/api/push/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:c.endpoint})});
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub) await sub.unsubscribe();
  }catch(e){}
}
// keep the reminder in step with the reset time, rest days and whether today is already done
function remindSync(){
  if(!Push.cfg||!S.awakened||!S.daily) return;
  const p=JSON.stringify(remindPrefs());if(p===Push.last) return;Push.last=p;
  if(Push.cfg.native){nativeSchedule();return}
  api('/api/push/state',{method:'POST',body:JSON.stringify({endpoint:Push.cfg.endpoint,...remindPrefs()})})
    .then(r=>{if(r.status===404){Push.cfg=null;pushStore()}else if(!r.ok) Push.last=''}).catch(()=>{Push.last=''});
}
async function nativeSchedule(){
  const LN=PLUG('LocalNotifications');if(!LN) return;
  const ids=Array.from({length:8},(_,i)=>({id:100+i}));
  try{await LN.cancel({notifications:ids})}catch(e){}
  const d=S.daily,list=[],h=Push.cfg.before;
  for(let i=0;i<8;i++){
    const k=addDays(d.date,i);
    if(i===0&&(d.cleared||d.rest||d.heal)) continue;
    if(i>0&&isRest(k)) continue;
    const at=keyDate(k);at.setHours(S.settings.resetHour+24-h,0,0,0);
    if(at.getTime()<=Date.now()) continue;
    list.push({id:100+i,title:'Daily Quest',body:`[The Daily Quest resets in ${h} hour${h>1?'s':''}.] Clear it to avoid the penalty.`,schedule:{at,allowWhileIdle:true},extra:{go:'quest'}});
  }
  try{if(list.length) await LN.schedule({notifications:list})}catch(e){}
}
async function remindTest(){
  const c=Push.cfg;if(!c) return;
  if(c.native){const LN=PLUG('LocalNotifications');try{await LN.schedule({notifications:[{id:99,title:'Daily Quest',body:'[Reminders are working.]',schedule:{at:new Date(Date.now()+3000)}}]});toast('A test reminder arrives in a few seconds')}catch(e){toast('Could not send a test reminder.','bad')}return}
  try{const r=await api('/api/push/test',{method:'POST',body:JSON.stringify({endpoint:c.endpoint})});if(!r.ok||!r.body.ok) throw 0;toast('Test reminder sent')}
  catch(e){toast('Could not send a test reminder.','bad')}
}

// Android app: a tapped reminder opens the quest; the back button closes sheets and screens first
function nativeBoot(){
  const LN=PLUG('LocalNotifications'),App=PLUG('App');
  if(LN) LN.addListener('localNotificationActionPerformed',e=>{const go=e&&e.notification&&e.notification.extra&&e.notification.extra.go;applyGo(go||'quest');refresh()});
  if(App) App.addListener('backButton',()=>{
    if(curN&&!curN.choices) closeNotify();
    else if(UI.sheet) ACT.sheetClose();
    else if(UI.screen&&['settings','run'].includes(UI.screen.kind)) UI.screen.kind==='run'?ACT.runClose():ACT.scrClose();
    else if(UI.tab!=='quest') ACT.tab('quest');
    else App.minimizeApp();
  });
}
/* ---------- boot ---------- */
(function boot(){
  FX.start();applySkin();
  if(S.run&&S.run.seg){S.run.el+=Math.max(0,(S.run.ts||S.run.seg)-S.run.seg);S.run.seg=null;S.run.last=null}
  if(!S.awakened) startAwakening();
  else{
    migrate();
    rollover();
    // saves from before the recovery update have no recovery habits for the current day
    if(S.daily&&!Array.isArray(S.daily.rh)){S.daily.recDone=S.daily.recDone||[];syncRecHabits()}
    if(S.session) UI.screen={kind:'gate'};
    deepLink();
    announce();
    if(S.run) setTimeout(()=>toast(`Your run is paused at ${trim(toUser(S.run.dist))} ${unit()}. Open Run to resume.`),900);
  }
  saveNow();refresh();
  if(Cloud.cfg) cloudSync();
  setInterval(tick,250);
  if(NATIVE) nativeBoot();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // the Windows widget's buttons focus an open window and send it where to go
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='awaken:nav'){try{applyGo(new URL(e.data.url).searchParams.get('go'))}catch(err){}refresh()}
    });
    // installed Chromium apps: refresh the widget and badge after the daily reset even if the app stays closed
    navigator.serviceWorker.ready.then(reg=>reg.periodicSync&&reg.periodicSync.register('awaken-refresh',{minInterval:6*3600000})).catch(()=>{});
  }
})();
</script>
