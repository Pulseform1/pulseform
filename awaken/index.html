<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awaken</title>
<meta name="description" content="A workout system that levels you up: daily quests, penalty zones, gates and stats for real-world training.">
<meta name="theme-color" content="#03060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Awaken">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  /* Layout: one narrow column (max 520px) of stacked glass "System" windows over a dark mana field,
     a fixed bottom tab bar, and full-screen takeovers for runs, gates, the tap counter and settings. */
  --void:#03060d;      /* page ground */
  --deep:#06142a;      /* window fill */
  --line:#45b0ff;      /* system window border */
  --glow:#9be3ff;      /* highlight and glow */
  --ink:#e7f4ff;       /* primary text */
  --dim:#86a2c3;       /* secondary text */
  --red:#ff3e5a; --red-glow:#ff9aa8;
  --gold:#ffc94a; --ok:#62f5c4; --ok-glow:#c2ffe9; --violet:#a684ff;
  --on-accent:#02101f; --scrim:rgba(1,4,10,.74);
  --rank-e:#a8b8cc; --rank-d:#62f5c4; --rank-c:#45b0ff; --rank-b:#a684ff; --rank-a:#ff8a4c; --rank-s:#ffc94a;
  --f-disp:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-skin=shadow]{--line:#9a6bff;--glow:#d6c6ff}
:root[data-skin=ruler]{--line:#f0b429;--glow:#ffe6a3}
:root[data-skin=crimson]{--line:#ff4d6a;--glow:#ffb3c0}
:root[data-skin=frost]{--line:#7fe7ff;--glow:#e0fbff}
:root[data-skin=verdant]{--line:#3ddc97;--glow:#c6ffe6}
.tone-red{--line:var(--red);--glow:var(--red-glow)}
.tone-ok{--line:var(--ok);--glow:var(--ok-glow)}
/* derived tints are re-declared wherever --line can change, so they follow the local tone */
:root,.tone-red,.tone-ok{--line-a:color-mix(in srgb,var(--line) 72%,transparent);--line-b:color-mix(in srgb,var(--line) 30%,transparent);--line-c:color-mix(in srgb,var(--line) 12%,transparent)}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.i{width:20px;height:20px;flex:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(130% 60% at 50% -8%,var(--line-b),transparent 62%),radial-gradient(90% 50% at 50% 115%,var(--line-c),transparent 70%),var(--void)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 14px;background:linear-gradient(var(--void) 72%,transparent)}
.lv{flex:none;width:48px;height:48px;display:grid;place-items:center;align-content:center;gap:1px;background:var(--line-c);border:1px solid var(--line-a);border-radius:3px;box-shadow:0 0 14px var(--line-b),inset 0 0 10px var(--line-c)}
.lv small{font:600 9px/1 var(--f-disp);letter-spacing:.2em;color:var(--dim)}
.lv b{font:700 20px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0;display:grid;gap:7px}
.who-n{display:flex;align-items:center;gap:8px;min-width:0}
.nm{font:600 17px/1.1 var(--f-disp);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar,.bar{height:5px;background:var(--line-c);border-radius:1px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-c)}
.xpbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 10px var(--line)}
.coin{display:flex;align-items:center;gap:5px;color:var(--gold);font:600 15px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.coin .i{width:16px;height:16px}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid var(--line-b);border-radius:3px;color:var(--ink)}
.icon-btn:active{background:var(--line-c)}
.rk{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border:1px solid currentColor;border-radius:2px;font:700 12px/1 var(--f-disp);letter-spacing:.04em;flex:none}
.rk-E{color:var(--rank-e)}.rk-D{color:var(--rank-d)}.rk-C{color:var(--rank-c)}.rk-B{color:var(--rank-b)}.rk-A{color:var(--rank-a)}.rk-S{color:var(--rank-s)}
.tag{display:inline-block;padding:2px 6px;border:1px solid currentColor;border-radius:2px;font:600 10px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.tag.red{color:var(--red)}.tag.gold{color:var(--gold)}.tag.ok{color:var(--ok)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--void) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line-b);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{position:relative;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 5px;color:var(--dim);font:600 10px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--glow);text-shadow:0 0 10px var(--line)}
.tab.on .i{filter:drop-shadow(0 0 6px var(--line))}
.tab.on::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--line)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}

/* ---------- system window ---------- */
.view{display:grid;gap:18px;padding-top:2px}
.win{position:relative;padding:18px 16px 16px;border:1px solid var(--line-a);border-radius:3px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 90%,transparent),color-mix(in srgb,var(--void) 84%,transparent));
  box-shadow:0 0 0 1px var(--line-c),0 0 24px var(--line-b),inset 0 0 32px var(--line-c);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px var(--line))}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win-head{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 16px}
.win-ico,.win-ttl{border:1.5px solid var(--ink);border-radius:3px;box-shadow:0 0 10px var(--line-b),inset 0 0 8px var(--line-b)}
.win-ico{width:30px;height:30px;display:grid;place-items:center;font:700 18px/1 var(--f-disp)}
.win-ttl{margin:0;padding:7px 16px 6px;font:600 14px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;text-shadow:0 0 10px var(--line)}
.sys{margin:0 0 14px;text-align:center;font:500 15.5px/1.4 var(--f-disp);letter-spacing:.02em;text-wrap:balance}
.note,.hint{margin:10px 0 0;font-size:13.5px;color:var(--dim)}
.eyebrow{margin:0 0 2px;font:600 11px/1.2 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--glow)}
.empty{margin:4px 0;text-align:center;color:var(--dim)}

/* daily quest */
.goal-h{margin:0 0 4px;text-align:center;font:600 13px/1 var(--f-disp);letter-spacing:.34em;color:var(--glow)}
.goals{list-style:none;margin:0;padding:0;display:grid}
.goal{position:relative;width:100%;display:grid;grid-template-columns:1fr auto 24px;align-items:center;gap:12px;padding:13px 4px 13px;background:none;border:0;border-bottom:1px solid var(--line-b);text-align:left}
.goal:active{background:var(--line-c)}
.g-name{font:500 17px/1.2 var(--f-body)}
.g-val{font:600 16px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap}
.chk{width:22px;height:22px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:2px}
.chk .i{width:16px;height:16px}
.goal.done .chk{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 50%,transparent)}
.goal.done .g-val{color:var(--ok)}
.g-bar{position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--p)*100%);background:var(--glow);box-shadow:0 0 8px var(--line)}
.goal.done .g-bar{background:var(--ok)}
.warn{margin:16px 0 0;text-align:center;font-size:14px;color:var(--dim);text-wrap:balance}
.warn b{color:var(--red);letter-spacing:.08em;font-family:var(--f-disp)}
.warn u{color:var(--red);text-decoration:none;border-bottom:1px solid currentColor}
.clock{margin-top:14px;display:flex;justify-content:center;align-items:baseline;gap:8px;font:600 24px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.clock .i{width:20px;height:20px;color:var(--glow);align-self:center}
.clock small{font:500 12px var(--f-body);color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.stamp{margin:16px auto 0;width:max-content;padding:8px 18px 7px;border:2px solid var(--ok);color:var(--ok);font:700 19px/1 var(--f-disp);letter-spacing:.32em;transform:rotate(-2deg);box-shadow:0 0 18px color-mix(in srgb,var(--ok) 35%,transparent),inset 0 0 12px color-mix(in srgb,var(--ok) 25%,transparent)}
.rw-line{margin:12px 0 0;text-align:center;color:var(--dim);font-size:14px}
.side{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side-q{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:11px 2px;background:none;border:0;border-bottom:1px solid var(--line-c);text-align:left}
.side-q .box{width:20px;height:20px;border:1.5px solid var(--line-a);border-radius:2px;display:grid;place-items:center}
.side-q .box .i{width:14px;height:14px}
.side-q.done .box{border-color:var(--ok);color:var(--ok)}
.side-q.done .side-n{color:var(--dim);text-decoration:line-through}
.side-r{font:600 12px/1 var(--f-disp);letter-spacing:.06em;color:var(--glow);white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--on-accent);font:700 11px/1 var(--f-disp)}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border:1px solid var(--line-a);border-radius:3px;background:var(--line-c);color:var(--ink);
  font:600 14px/1.1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;text-align:center;transition:background .15s,box-shadow .15s,transform .05s}
.btn:active{background:var(--line-b);box-shadow:0 0 18px var(--line-b);transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--glow),var(--line));border-color:var(--glow);color:var(--on-accent);box-shadow:0 0 18px var(--line-b)}
.btn.pri:active{box-shadow:0 0 26px var(--line-a)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:12px}
.btn.xl{min-height:58px;font-size:16px}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:var(--line-b)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.danger-ghost{background:none;border-color:color-mix(in srgb,var(--red) 60%,transparent);color:var(--red)}
.btn.sq{width:56px;min-height:56px;padding:0;font-size:26px;letter-spacing:0}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .i{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>:only-child{grid-column:1/-1}
.link{background:none;border:0;padding:0;color:var(--glow);text-align:left;border-bottom:1px dashed var(--line-a);font:inherit}

/* status */
.st-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.st-lv{display:grid;justify-items:center;padding:10px 14px;border:1px solid var(--line-a);box-shadow:inset 0 0 18px var(--line-c)}
.st-lv b{font:700 46px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--line)}
.st-lv span{font:600 11px/1 var(--f-disp);letter-spacing:.3em;color:var(--dim);margin-top:4px}
.st-id{margin:0;display:grid;gap:6px;min-width:0}
.st-id div{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:baseline;min-width:0}
.st-id dt{font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.st-id dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.xp{margin:16px 0 0;display:grid;gap:6px}
.xp small{text-align:right;color:var(--dim);font:500 12.5px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.vitals{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.meter{display:grid;gap:5px}
.meter-l{display:flex;justify-content:space-between;font:600 12.5px/1 var(--f-disp);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.meter .bar{height:7px}
.meter.hp .bar i{background:linear-gradient(90deg,#d32b47,var(--red));box-shadow:0 0 10px var(--red)}
.meter.mp .bar i{background:linear-gradient(90deg,var(--line),var(--glow))}
.fat{grid-column:1/-1;display:flex;justify-content:space-between;font:600 12.5px/1 var(--f-disp);letter-spacing:.08em;color:var(--dim)}
.fat b{color:var(--ink)}
.stats{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-b);display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.stat{position:relative;display:grid;grid-template-columns:1fr auto 32px;align-items:center;gap:8px;padding:8px 0 10px}
.st-name{background:none;border:0;padding:0;text-align:left;font:600 15px/1 var(--f-disp);letter-spacing:.12em;color:var(--ink)}
.stat b{font:700 22px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.plus{width:30px;height:30px;padding:0;display:grid;place-items:center;border:1px solid var(--glow);border-radius:2px;background:var(--line-b);color:var(--ink);font:700 18px/1 var(--f-disp);box-shadow:0 0 10px var(--line-b)}
.plus:active{background:var(--line)}
.st-x{position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--line-c)}
.st-x i{display:block;height:100%;background:var(--line-a)}
.pts{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font:600 12px/1.2 var(--f-disp);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.pts b{font-size:22px;color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 50%,transparent)}
.debuff{margin:12px 0 0;padding:8px 10px;border:1px solid color-mix(in srgb,var(--red) 60%,transparent);color:var(--red);font:600 13px/1.3 var(--f-disp);letter-spacing:.06em;text-align:center}
.effects{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.effects li{padding:5px 8px;border:1px solid var(--line-b);font:500 12.5px/1 var(--f-disp);letter-spacing:.04em;color:var(--glow)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-c)}
.li h4{margin:0;font:600 15px/1.2 var(--f-disp);letter-spacing:.04em}
.li p{margin:0;grid-column:1/-1;font-size:13.5px;color:var(--dim)}
.li.locked h4{color:var(--dim)}
.li .tag{justify-self:end}

/* gates */
.gates{display:grid;gap:12px}
.gate{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px 12px;border:1px solid var(--line-b);background:var(--line-c);border-radius:3px}
.gate.red{border-color:color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.gate.trial{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.portal{width:58px;height:74px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font:700 24px/1 var(--f-disp);
  background:radial-gradient(closest-side,color-mix(in srgb,currentColor 55%,transparent),color-mix(in srgb,currentColor 12%,transparent) 70%,transparent);box-shadow:0 0 18px color-mix(in srgb,currentColor 45%,transparent),inset 0 0 14px color-mix(in srgb,currentColor 40%,transparent)}
.portal span{color:var(--ink);text-shadow:0 0 10px currentColor}
.portal.red{color:var(--red)}
.portal.big{width:70px;height:90px;font-size:30px}
.g-info{min-width:0;display:grid;gap:4px;align-content:start}
.g-info h3{margin:0;font:600 17px/1.2 var(--f-disp);letter-spacing:.02em}
.g-meta,.g-ex,.g-rw{margin:0;font-size:13.5px;color:var(--dim)}
.g-rw{color:var(--gold);font:600 13px/1.3 var(--f-disp);letter-spacing:.04em}
.g-info .btn{justify-self:start;margin-top:6px}
.mp-row{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font:500 13px/1.2 var(--f-disp);letter-spacing:.04em;color:var(--dim)}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ladder li{display:grid;justify-items:center;gap:6px;padding:10px 0 8px;border:1px solid var(--line-c);font:500 11px/1 var(--f-disp);color:var(--dim);letter-spacing:.04em}
.ladder li.on{border-color:var(--line-a);background:var(--line-c);color:var(--ink);box-shadow:0 0 14px var(--line-b)}
.ladder li.past{opacity:.6}
.gi-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.gi-top h3{margin:0 0 4px;font:600 19px/1.2 var(--f-disp)}
.waves{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.waves h4{margin:0 0 4px;font:600 12px/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--glow)}
.waves ul{list-style:none;margin:0;padding:0}
.waves ul li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-c);font-size:15px}
.waves b{font:600 15px/1 var(--f-disp);font-variant-numeric:tabular-nums}

/* items */
.gold-big{display:flex;align-items:center;justify-content:center;gap:8px;margin:-2px 0 12px;color:var(--gold);font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.gold-big .i{width:22px;height:22px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-c)}
.it-ico{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-a);background:var(--line-c);color:var(--glow);box-shadow:inset 0 0 12px var(--line-c)}
.it-ico .i{width:24px;height:24px}
.it-b{min-width:0}
.it-b h4{margin:0 0 2px;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.it-b h4 span{color:var(--glow);margin-left:4px}
.it-b p{margin:0;font-size:13.5px;color:var(--dim)}
.price{display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
.price .i{width:13px;height:13px}

/* records */

.code-box{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line-a);border-radius:3px;background:color-mix(in srgb,var(--line) 6%,transparent)}
.code-box code{flex:1;min-width:0;font:600 13px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--ink);overflow-wrap:anywhere}

.event{display:flex;flex-direction:column;gap:2px;margin:0 0 14px;padding:10px 14px;border:1px solid var(--line-a);border-left:3px solid var(--glow);background:color-mix(in srgb,var(--line) 8%,transparent);border-radius:3px}
.event b{font:700 12.5px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--glow)}

.pqs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pq{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding-bottom:8px}

.chart{display:block;width:100%;height:auto;overflow:visible}

.chart .ch-b{cursor:pointer}.chart .ch-b path{fill:var(--line);opacity:.75}.chart .ch-b:last-child path{opacity:1}

.c.today{outline:1.5px solid var(--glow);outline-offset:-1.5px}
.c.fut{background:none}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-c);font-size:14px}

/* sheets */
.layer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;border-bottom:0;border-radius:3px 3px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .26s cubic-bezier(.2,.9,.3,1)}

.lbl{margin:0;text-align:center;font:600 12px/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:8px 13px;border:1px solid var(--line-b);border-radius:3px;background:none;font:600 13px/1 var(--f-disp);letter-spacing:.06em}

.days .chip{min-width:42px}
.cue{margin:0;font-size:14px;color:var(--dim);text-align:center;text-wrap:balance}

/* full screens */
.screen{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(120% 60% at 50% -10%,var(--line-b),transparent 60%),var(--void);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.screen-in{max-width:520px;margin:0 auto;display:grid;gap:16px;align-content:start}
.scr-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scr-head h2{margin:0;font:600 24px/1.15 var(--f-disp);letter-spacing:.03em;overflow-wrap:anywhere}
.boss{padding-bottom:14px}

.boss-n{margin:8px 0 10px;font:700 22px/1.15 var(--f-disp);letter-spacing:.04em;color:var(--ink)}
.hpbar{position:relative;height:14px;border:1px solid color-mix(in srgb,var(--red) 70%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#9e1530,var(--red));box-shadow:0 0 14px var(--red);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.hp-n{margin:6px 0 0;text-align:right;font:600 13px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--dim)}
.dmg{position:absolute;right:16px;top:46px;font:700 26px/1 var(--f-disp);color:var(--red);text-shadow:0 0 12px var(--red);animation:dmg 1.1s ease-out forwards;pointer-events:none}
.phase{display:grid;gap:12px;text-align:center}
.ph-l{margin:0;font:600 12px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--glow)}
.ex-n{margin:0;font:700 30px/1.1 var(--f-disp);letter-spacing:.02em}
.ph-n{margin:0;color:var(--dim);font-size:15px}
.ph-n b{color:var(--ink)}
.timer{font:700 72px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 24px var(--line)}
.rest .timer{color:var(--glow)}
.sets{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sets li{width:12px;height:12px;border:1px solid var(--line-a);transform:rotate(45deg)}
.sets li.done{background:var(--line);box-shadow:0 0 8px var(--line)}
.sets li.now{border-color:var(--glow);background:var(--line-b);box-shadow:0 0 10px var(--glow)}
.sets li.boss{border-color:var(--red)}
.confirm{padding:14px;border:1px solid color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent);display:grid;gap:12px}
.confirm p{margin:0;text-align:center}
.run-d{display:flex;align-items:baseline;justify-content:center;gap:8px}
.run-d b{font:700 76px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--line)}
.run-d span{font:600 18px/1 var(--f-disp);letter-spacing:.1em;color:var(--dim)}
.run-stats{margin:14px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.run-stats small{display:block;font:600 10.5px/1 var(--f-disp);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.run-stats b{font:600 17px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
#run-map{display:block;width:100%;max-width:100%;aspect-ratio:2/1;border:1px solid var(--line-c);background:var(--line-c)}
.seg{display:flex;border:1px solid var(--line-a);border-radius:3px;overflow:hidden}
.seg-b{flex:1;min-height:42px;padding:8px 6px;border:0;border-left:1px solid var(--line-b);background:none;font:600 12.5px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.seg-b:first-child{border-left:0}
.seg-b.on{background:var(--line-b);color:var(--ink);text-shadow:0 0 10px var(--line)}
.field{display:grid;gap:8px;margin:0 0 16px}
.field>span{font:600 12px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-a);border-radius:3px;background:color-mix(in srgb,var(--void) 70%,transparent);color:var(--ink)}
.field textarea{resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.field .hint{margin:0}
.tog{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;margin:0;background:none;border:0;border-top:1px solid var(--line-c);text-align:left}
.tog-l b{display:block;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.tog-l small{color:var(--dim);font-size:13px}
.tog-s{width:46px;height:26px;border:1px solid var(--line-a);border-radius:13px;position:relative;background:var(--line-c);transition:background .2s}
.tog-s::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.tog[aria-checked=true] .tog-s{background:var(--line-b)}

.win p{text-wrap:pretty}
.about p{margin:0 0 10px;color:var(--dim);font-size:14.5px}

/* onboarding */
.aw{min-height:100%;display:grid;align-content:center;gap:16px;max-width:460px;margin:0 auto;padding-block:20px}

.assess{display:grid;gap:18px}
.diffs{display:grid;gap:8px}
.diff{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line-b);border-radius:3px;background:none;text-align:left}
.diff b{font:600 15px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.diff small{color:var(--dim);font-size:13.5px}
.diff.on{border-color:var(--glow);background:var(--line-c);box-shadow:0 0 14px var(--line-b)}
.preview{margin:14px 0 0;padding:10px 12px;border:1px dashed var(--line-a);font:500 14px/1.5 var(--f-disp);letter-spacing:.02em;text-align:center}
.brand{text-align:center;font:700 13px/1 var(--f-disp);letter-spacing:.6em;color:var(--dim);text-indent:.6em}

.tone-violet{--line:var(--violet);--glow:#d9ccff}
:root,.tone-red,.tone-ok,.tone-violet{--line-a:color-mix(in srgb,var(--line) 72%,transparent);--line-b:color-mix(in srgb,var(--line) 30%,transparent);--line-c:color-mix(in srgb,var(--line) 12%,transparent)}
.army{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.sh{display:grid;justify-items:center;gap:3px;padding:10px 6px;border:1px solid var(--line-c);text-align:center;min-width:0;opacity:.45}
.sh.got{opacity:1;border-color:var(--line-a);background:var(--line-c);box-shadow:0 0 12px var(--line-b)}
.sh-ico{width:40px;height:40px;display:grid;place-items:center;color:var(--glow)}
.sh-ico .i{width:30px;height:30px;filter:drop-shadow(0 0 6px var(--line))}
.sh b{font:600 12.5px/1.2 var(--f-disp);overflow-wrap:anywhere}
.sh small{font-size:11px;color:var(--dim);line-height:1.3}
.seg+.gold-big,.seg+.win{margin-top:0}
/* contract */
.contract .ct-name{margin:0 0 10px;text-align:center;font:500 15px/1.3 var(--f-disp);color:var(--dim)}
.contract .ct-name b{color:var(--ink);letter-spacing:.06em}
.terms{margin:0 0 14px;padding-left:22px;display:grid;gap:8px;font-size:14.5px;line-height:1.4}
.terms li::marker{color:var(--glow);font-family:var(--f-disp)}
.sigbox{position:relative;margin-top:8px;border:1px dashed var(--line-a);background:color-mix(in srgb,var(--void) 60%,transparent);border-radius:3px}
#sig{display:block;width:100%;max-width:100%;aspect-ratio:3/1;touch-action:none;cursor:crosshair}
.sigline{position:absolute;left:12px;right:12px;bottom:22%;border-bottom:1px solid var(--line-b);color:var(--dim);font:600 16px/1 var(--f-disp);pointer-events:none;padding-bottom:4px}
.seal{position:absolute;right:6%;top:50%;width:96px;height:96px;margin-top:-48px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;
  border:3px double var(--gold);color:var(--gold);background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 26%,transparent),transparent);
  box-shadow:0 0 26px color-mix(in srgb,var(--gold) 45%,transparent);transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.seal span{font:700 34px/1 var(--f-disp)}
.seal small{font:700 10px/1 var(--f-disp);letter-spacing:.24em}
.contract.sealed{animation:shake .35s .12s}
.contract.burn{animation:burn 1s ease-in forwards}
.sig-img{display:block;max-width:150px;height:auto;margin-top:4px;opacity:.9}
@keyframes stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-12deg)}}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes burn{0%{filter:none;opacity:1}40%{filter:brightness(1.8) blur(1px)}100%{filter:brightness(3) blur(10px);opacity:0;transform:translateY(-24px) scale(.96)}}

/* notifications */
.ntf-layer{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;animation:fade .2s;
  padding:24px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
.ntf{width:100%;max-width:420px;max-height:calc(100vh - 48px);overflow-y:auto;animation:unfold .5s cubic-bezier(.2,.9,.25,1) both}
.lines p{margin:0 0 8px;text-align:center;font:500 16px/1.45 var(--f-disp);letter-spacing:.01em}
.lines .ghost{visibility:hidden}
.big{margin:0 0 14px;text-align:center;font:700 40px/1 var(--f-disp);letter-spacing:.06em;text-shadow:0 0 20px var(--line)}
.rewards{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line-b);display:grid;gap:8px}
.rewards li{display:flex;justify-content:space-between;gap:12px;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.rewards li span{color:var(--dim);font-weight:500}
.ntf-foot{margin:12px 0 0;text-align:center;font-size:13.5px;color:var(--dim)}
.ntf .btn.block{margin-top:16px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line-a);border-radius:3px;background:var(--line-c);text-align:left}
.choice b{font:600 16px/1.2 var(--f-disp);letter-spacing:.06em}
.choice small{color:var(--dim);font-size:13.5px}
.choice .tag{justify-self:start;margin-top:4px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 74px);left:0;right:0;z-index:70;display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{max-width:100%;padding:8px 14px;border:1px solid var(--line-a);background:color-mix(in srgb,var(--deep) 94%,transparent);font:600 14px/1.2 var(--f-disp);letter-spacing:.05em;box-shadow:0 0 16px var(--line-b);animation:toast 2.3s ease forwards;text-align:center}
.toast.stat{border-color:var(--gold);color:var(--gold)}
.toast.bad{border-color:var(--red);color:var(--red)}

/* tap counter */
.tap-scr{min-height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;max-width:520px;margin:0 auto;user-select:none;-webkit-user-select:none}
.pad{justify-self:center;align-self:center;width:min(80vw,56vh);max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;gap:8px;
  border:2px solid var(--glow);background:radial-gradient(closest-side,var(--line-b),var(--line-c) 70%,transparent);box-shadow:0 0 40px var(--line-b),inset 0 0 40px var(--line-b);touch-action:manipulation}
.pad b{font:700 min(26vw,18vh)/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--line)}
.pad small{font:600 12px/1 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.pad.hit{animation:hit .18s ease-out}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes unfold{0%{transform:scale(.6,.012);opacity:0}35%{transform:scale(1,.012);opacity:1}100%{transform:none;opacity:1}}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes dmg{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes hit{50%{transform:scale(.95);box-shadow:0 0 70px var(--line-a),inset 0 0 60px var(--line-a)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* recovery */
.joints{list-style:none;margin:0;padding:0;display:grid}
.joint{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-c)}
.joint h4{margin:0;font:600 15px/1.2 var(--f-disp);letter-spacing:.03em}
.joint small{grid-column:1/-1;color:var(--dim);font-size:13px}
.joint small.warn-old{color:var(--gold)}
.tri{display:flex;border:1px solid var(--line-b);border-radius:3px;overflow:hidden}
.tri button{min-width:52px;min-height:36px;padding:6px 8px;border:0;border-left:1px solid var(--line-b);background:none;color:var(--dim);font:600 11.5px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.tri button:first-child{border-left:0}
.tri button[aria-pressed=true]{color:var(--on-accent);background:var(--ok)}
.tri button.l1[aria-pressed=true]{background:var(--gold)}
.tri button.l2[aria-pressed=true]{background:var(--red)}
.adapt{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line-b);display:grid;gap:6px;font-size:14px}
.adapt li{display:flex;justify-content:space-between;gap:12px}
.adapt li span{color:var(--dim)}
.adapt li b{font:600 14px/1.3 var(--f-disp);letter-spacing:.02em;text-align:right}
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px;border:1px solid var(--line-b);border-radius:3px;background:var(--line-c)}
.rec.hot{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.rec h3{margin:0;font:600 16px/1.2 var(--f-disp);letter-spacing:.03em}
.rec p{margin:0;grid-column:1/-1;color:var(--dim);font-size:13.5px}
.rec .btn{grid-row:1/3;grid-column:2}
.ail{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.flag-list{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
details.help{border-top:1px solid var(--line-b);padding-top:10px;margin-top:12px}
details.help summary{cursor:pointer;font:600 13px/1.4 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
details.help ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:14px;display:grid;gap:4px}
.moves{list-style:none;margin:0;padding:0;display:grid}
.moves li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line-c)}
.moves li b{font:600 15px/1.2 var(--f-disp)}
.moves li span{font:600 14px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--glow);white-space:nowrap}
.moves li small{grid-column:1/-1;color:var(--dim);font-size:13px}
.recbar{height:10px;border:1px solid var(--line-a);background:var(--line-c);overflow:hidden}
.recbar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 12px var(--line);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.tag.teal{color:var(--ok)}

@media (max-width:360px){.vitals{grid-template-columns:1fr}.stats{gap:4px 12px}.timer{font-size:60px}.run-d b{font-size:62px}.tab{font-size:9px;letter-spacing:.03em}.tri button{min-width:44px;padding:6px 5px}}

/* ---------- joint recovery ----------
   Content was drafted from current physiotherapy guidance and reviewed for safety (see README).

const RECOVERY={"regions":[{"id":"knee","name":"Knees","overview":"Overdone knees usually ache at the front, around or below the kneecap, after squats, jumps, stairs or running, often after a sudden jump in training. Ease off rather than stop: keep moving, calm the knee with gentle holds, then rebuild thigh and hip strength.","moves":[{"id":"heelslide","name":"Heel slides","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Lie on your back, legs straight. Slowly slide one heel toward your bottom, then back out. Switch sides.","avoidIf":"Stop if you feel a sharp pinch, or the knee locks or catches.","easier":"Bend only as far as is comfortable, with a towel under your heel so it slides."},{"id":"quadset","name":"Thigh squeeze","type":"reps","target":8,"perSide":false,"sets":2,"cue":"Sit with legs straight, a rolled towel under your knees. Press both knees down into it, tighten your thighs, hold 5 seconds.","avoidIf":"Skip if pressing down gives sharp pain behind the knee.","easier":"Squeeze one leg at a time, and press more gently."},{"id":"kneeexthold","name":"Bent-knee leg hold","type":"time","target":30,"perSide":true,"sets":1,"cue":"Sit tall on a chair. Lift one foot forward a little, keeping the knee well bent, and hold it still. Switch sides.","avoidIf":"Stop if pain goes above 3/10 or gets sharp. Don't straighten the knee all the way.","easier":"Lift the foot only just off the floor, or hold for 20 seconds."},{"id":"slr","name":"Straight leg raise","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Lie down, one knee bent. Tighten the other thigh, lift that straight leg to knee height, lower slowly. Switch sides.","avoidIf":"Skip if it strains your lower back or gives sharp knee pain.","easier":"Lift only a little, or prop yourself up on your elbows."},{"id":"sitstand","name":"Chair sit-to-stand","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Sit near the front of a chair. Stand up without using your hands, knees over toes, then sit down slowly.","avoidIf":"Stop if the knee gives way or pain goes above 3/10.","easier":"Use a higher seat or a cushion, or push off your thighs with your hands."},{"id":"stepup","name":"Low step-up","type":"reps","target":8,"perSide":true,"sets":1,"cue":"Step onto a low step with one foot, bring the other up, then step down one foot at a time. Switch lead leg.","avoidIf":"Skip if stairs clearly hurt today, or your balance feels shaky.","easier":"Use the lowest step and hold a wall or rail."},{"id":"sidelegraise","name":"Side-lying leg lift","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Lie on your side, bottom knee bent. Lift the top leg a little, toes forward, then lower slowly. Switch sides.","avoidIf":"Skip if lying on your side hurts your hip, or your lower back arches.","easier":"Make the lift smaller, or do it standing while holding a chair."},{"id":"hamstretch","name":"Seated back-of-thigh stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Sit on a chair's edge, one leg straight, heel down. Sit tall and lean forward from your hips. Switch sides.","avoidIf":"Stop if you feel tingling or pulling down the back of the leg.","easier":"Bend the straight knee a little and lean forward less."}],"sessionOrder":["heelslide","quadset","kneeexthold","sitstand","stepup","sidelegraise","hamstretch"],"habits":[{"id":"kneeswap","text":"Swap jumps and deep squats for low-impact moves today","why":"Cutting back on what flares the knee lets it settle while you stay active."},{"id":"kneebridges","text":"Do 10 glute bridges at some point today","why":"Hip and thigh strength together helps front-of-knee pain more than knee work alone."},{"id":"kneestairs","text":"On stairs today, lead up with the good leg, down with the sore","why":"It keeps the hardest part of each step on the knee that isn't sore."},{"id":"kneesitbreak","text":"Straighten your legs out every 30 minutes you sit","why":"Long spells sitting with bent knees often make front-of-knee pain worse."},{"id":"kneebuild","text":"Do no more squats or jumps today than on your last good day","why":"Big sudden jumps in training set knees off; build back slowly, roughly 10% more a week."}],"redFlags":["Rapid or major swelling, or a hot, red knee, especially with a fever: get checked the same day","The knee locks, catches or gives way","You can't put weight on the leg or walk normally","Pain started with a pop, a twist or a fall","Numbness, tingling, or a cold or pale foot","Pain at night or at rest that doesn't ease","Under 18 with hip, thigh or knee pain and a limp, or pain that stops you running: see a doctor","Pain getting worse, or no better after about 2 weeks of easing off"]},{"id":"shoulder","name":"Shoulders","overview":"Too many push-ups, pike push-ups or pull-ups too soon often leaves a dull ache at the front or top of the shoulder, worse reaching overhead. Keep it moving, use gentle still holds to keep it working, then rebuild with light strength work.","moves":[{"id":"shpendulum","name":"Pendulum swings","type":"time","target":30,"perSide":false,"sets":2,"cue":"Lean on a chair with your good hand and let the sore arm hang. Rock your body so the arm swings in small circles.","avoidIf":"Skip if swinging gives sharp pain, or bending forward makes you dizzy.","easier":"Make the circles tiny, or just let the arm hang loose."},{"id":"shsqueeze","name":"Shoulder blade squeeze","type":"reps","target":10,"perSide":false,"sets":1,"cue":"Sit or stand tall, arms by your sides. Draw your shoulder blades gently back and down, hold 3 seconds, relax.","avoidIf":"Stop if it brings on neck pain or tingling in the arm.","easier":"Squeeze at half strength and hold for 1 second."},{"id":"shwallext","name":"Wall press: outward","type":"time","target":30,"perSide":true,"sets":1,"cue":"Stand side-on to a wall, elbow bent at your side. Press the back of that wrist into the wall at half effort. Switch sides.","avoidIf":"Stop if pain goes above 3/10 or feels sharp.","easier":"Press more softly, or hold for 15 seconds."},{"id":"shwallint","name":"Door frame press: inward","type":"time","target":30,"perSide":true,"sets":1,"cue":"Stand in a doorway, elbow bent at your side. Press that palm into the frame at half effort and hold. Switch sides.","avoidIf":"Stop if pain goes above 3/10 or you feel a catch at the front of the shoulder.","easier":"Press more softly, or hold for 15 seconds."},{"id":"shwallslide","name":"Wall slides","type":"reps","target":8,"perSide":false,"sets":2,"cue":"Face a wall with your forearms on it. Slide your arms up as far as is comfortable, then slowly back down.","avoidIf":"Stop where pain starts. Skip it if lifting the arm hurts more than 3/10 today.","easier":"Slide only to shoulder height, or one arm at a time."},{"id":"shsideer","name":"Side-lying outward turn","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Lie on your good side, a towel between top elbow and ribs. Turn the forearm up, lower over 3 seconds. Hold a bottle if easy.","avoidIf":"Stop if you feel sharp pain or a clunk in the shoulder.","easier":"Use an empty hand and a smaller range."},{"id":"shcross","name":"Cross-body stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Bring one arm across your chest, below shoulder height. Hug it gently closer with the other hand. Switch sides.","avoidIf":"Skip if you feel a pinch at the front or top of the shoulder rather than a stretch.","easier":"Rest the hand on the opposite shoulder and pull more lightly. Go to shoulder height only if there's no pinch."},{"id":"shdoorway","name":"Low doorway chest stretch","type":"time","target":30,"perSide":false,"sets":1,"cue":"Forearms on a door frame, elbows below shoulder height. Step one foot through until the chest gently stretches.","avoidIf":"Stop if it hurts the front of the shoulder or you feel tingling down the arm.","easier":"Do one arm at a time and take a smaller step."}],"sessionOrder":["shpendulum","shsqueeze","shwallext","shwallint","shwallslide","shsideer","shcross"],"habits":[{"id":"shoulderhalf","text":"Keep push-up and pull-up sets to half your usual today","why":"Less load lets the tendon calm down without losing the training habit."},{"id":"shoulderholds","text":"Do both wall press holds once today","why":"Still holds keep the shoulder working without much movement; some people find they ease pain for a while."},{"id":"shoulderreach","text":"Keep using the arm for everyday reaching today","why":"Moving within comfort helps recovery more than keeping the arm still."},{"id":"shouldersleep","text":"Tonight, sleep off the sore shoulder and hug a pillow","why":"Lying on it squashes the sore area and can disturb your sleep."},{"id":"shoulderrolls","text":"Roll your shoulders back 10 times each hour you sit","why":"Breaking up long slouched spells eases stiffness around the shoulder."}],"redFlags":["Pain started after a fall, a pop or a sudden jerk","You can't lift your arm at all, or it looks out of place","Big swelling or bruising, or a hot, red shoulder","Fever or feeling unwell with the shoulder pain","Numbness, tingling or weakness spreading down the arm","Pain that wakes you at night and won't ease when you change position","Chest pain, shortness of breath or left arm pain: call emergency services","Pain getting worse each day, or no better after about 2 weeks"]},{"id":"back","name":"Lower back","overview":"After overexertion the lower back usually feels stiff, achy or tight, often after more sit-ups, jumps or lifting than you're used to. Stay gently active rather than resting in bed: easy mobility and low-load core work help it settle.","moves":[{"id":"pelvictilt","name":"Pelvic tilt","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Lie on your back, knees bent. Gently flatten your low back into the floor, then let it arch a little.","avoidIf":"Stop if pain gets sharp, spreads into your leg, or goes above 3/10.","easier":"Make the rocks smaller, or do it sitting on a chair."},{"id":"kneeroll","name":"Knee rolls","type":"reps","target":8,"perSide":true,"sets":1,"cue":"Lie on your back, knees bent and together. Let them roll slowly to one side and back, then the other side.","avoidIf":"Stop if twisting gives sharp pain or pain down your leg.","easier":"Roll only a short way, or keep your feet wider apart."},{"id":"catcamel","name":"Cat-camel","type":"reps","target":10,"perSide":false,"sets":2,"cue":"On hands and knees, slowly round your back up, then let it gently dip. Stay in a comfortable range.","avoidIf":"Skip if your wrists or knees hurt. Stop if back pain gets sharp.","easier":"Do it sitting on a chair with your hands on your knees."},{"id":"kneehug","name":"Single knee hug","type":"time","target":30,"perSide":true,"sets":1,"cue":"Lie on your back. Hug one knee gently toward your chest and breathe slowly. Switch sides.","avoidIf":"Stop if it gives sharp pain, or pain or tingling down the leg.","easier":"Hold behind your thigh instead of the knee, and pull less."},{"id":"birddog","name":"Bird dog","type":"reps","target":6,"perSide":true,"sets":2,"cue":"On hands and knees, reach one arm forward and the opposite leg back. Hold 3 seconds, back level. Switch sides.","avoidIf":"Stop if you can't keep your back still, or pain goes above 3/10.","easier":"Move only the leg, or only the arm."},{"id":"deadbugheel","name":"Dead bug heel taps","type":"reps","target":8,"perSide":true,"sets":1,"cue":"On your back, hips and knees bent to 90 degrees. Keep your back still and slowly tap one heel down, then the other.","avoidIf":"Stop if your back arches off the floor or the pain gets worse.","easier":"Keep your feet on the floor and slide one heel out at a time."},{"id":"proneprop","name":"Prop on elbows","type":"time","target":30,"perSide":false,"sets":2,"cue":"Lie face down and prop up on your forearms. Let your belly and hips relax into the floor.","avoidIf":"Stop if arching makes the pain sharper or sends pain into your leg.","easier":"Lie flat face down with a pillow under your belly."},{"id":"childpose","name":"Child's pose","type":"time","target":30,"perSide":false,"sets":1,"cue":"Kneel, sit back toward your heels and reach your arms forward. Breathe slowly into your back.","avoidIf":"Skip if your knees hurt or bending forward makes your back pain worse.","easier":"Put a pillow between your heels and bottom, or under your chest."}],"sessionOrder":["pelvictilt","kneeroll","catcamel","kneehug","birddog","deadbugheel","proneprop","childpose"],"habits":[{"id":"backtilts","text":"Do 10 pelvic tilts before you get out of bed","why":"A sore back is often stiffest first thing, and gentle movement eases it."},{"id":"backlift","text":"Lift any way that's comfortable, keeping loads close to you","why":"Your back is strong and bending is safe; this just keeps the effort lower while it settles."},{"id":"backheat","text":"Use a warm shower or heat pack on your back for 15 minutes","why":"Warmth can ease tight muscles and make moving more comfortable."},{"id":"backsleep","text":"Tonight, try a pillow under your knees when lying on your back","why":"A supported position lets your back muscles relax overnight."},{"id":"backbedrest","text":"Stay out of bed during the day today","why":"Staying up and gently active helps a sore back recover faster than bed rest."}],"redFlags":["Numbness around the groin, buttocks or inner thighs (saddle area): get emergency care now","New trouble peeing, leaking, or loss of bladder or bowel control: get emergency care now","Numbness, tingling or weakness in one or both legs, or pain spreading below the knee","Back pain that started after a fall, an accident or a sudden pop","Fever, feeling generally unwell, or unexplained weight loss with back pain","Constant pain at night that no position eases","Severe pain that keeps getting worse, or you can't walk normally","New back pain with a history of cancer, osteoporosis or long-term steroid use","Pain not clearly improving after about 2 weeks"]},{"id":"hip","name":"Hips","overview":"Overdone hips usually feel tight or achy at the front of the groin, or sore on the outer hip when lying on that side, climbing stairs or standing on one leg. Keep moving gently, avoid positions that squash the outer hip, and steadily rebuild hip and glute strength.","moves":[{"id":"hipswing","name":"Easy leg swings","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Hold a chair and stand tall. Swing one leg gently forward and back, small and relaxed. Switch sides.","avoidIf":"Keep the swing small if it pinches in the groin. Skip if standing on one leg hurts.","easier":"Make the swing smaller and slower."},{"id":"hipsqueeze","name":"Pillow squeeze","type":"reps","target":8,"perSide":false,"sets":2,"cue":"Lie on your back, knees bent, a pillow between your knees. Squeeze it gently for 5 seconds, then relax.","avoidIf":"Stop if it gives sharp groin pain or pain goes above 3/10.","easier":"Squeeze at half strength, or for 3 seconds."},{"id":"clamshell","name":"Clamshells","type":"reps","target":12,"perSide":false,"sets":2,"cue":"Lie on your good side, knees bent, a pillow between them. Keep your feet together and lift the top knee a little.","avoidIf":"Skip if lying on your side hurts, or outer-hip pain goes above 3/10.","easier":"Lie on your back, knees bent, and press them gently out against your hands."},{"id":"hipabdhold","name":"Outer-hip wall press","type":"time","target":30,"perSide":false,"sets":2,"cue":"Stand side-on to a wall, sore hip nearest it. Lift that knee and press its outside into a pillow on the wall. Hold.","avoidIf":"Stop if pain gets sharp or goes above 3/10.","easier":"Press more softly or hold for 20 seconds. If standing on the sore leg is fine, also try facing the other way."},{"id":"bridgehold","name":"Bridge hold","type":"time","target":30,"perSide":false,"sets":2,"cue":"Lie on your back, knees bent. Squeeze your glutes and lift your hips in line with knees and shoulders. Hold.","avoidIf":"Lower down if the back of your thigh cramps or your lower back hurts.","easier":"Lift your hips only halfway, or hold for 15 to 20 seconds."},{"id":"hipflexstretch","name":"Front-of-hip stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Kneel on one knee on a pillow, other foot forward. Tuck your tailbone under and shift forward a little. Switch sides.","avoidIf":"Skip if kneeling hurts your knee, or the stretch pinches at the front of the hip.","easier":"Do it standing: hold a chair and take a long step back with that leg."},{"id":"hiphinge","name":"Standing hip hinge","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Stand with hands on hips. Push your hips back with a flat back and soft knees, then squeeze your glutes to stand tall.","avoidIf":"Skip if bending forward sends pain into your back or down your leg.","easier":"Make the hinge shallower, or keep your bottom touching a wall behind you."}],"sessionOrder":["hipswing","hipsqueeze","clamshell","hipabdhold","bridgehold","hipflexstretch","hiphinge"],"habits":[{"id":"hipnocross","text":"Sit and stand today without crossing your legs","why":"Crossing your legs or leaning your weight onto one hip squeezes the outer-hip tendons."},{"id":"hippillow","text":"Tonight, sleep with a pillow between your knees","why":"It stops the top leg dropping across you, which takes pressure off the hip overnight."},{"id":"hipflat","text":"Walk on flat ground instead of hills or a long run today","why":"Easing the load that flared the hip lets it calm down while you stay active."},{"id":"hipseat","text":"Sit on firm seats where your hips stay above your knees","why":"Low, soft seats bend the hip deeply and often irritate a sore groin or outer hip."}],"redFlags":["Severe hip pain after a fall or injury, or you can't walk or put weight on the leg","A hot, swollen or red hip, or hip pain with a fever or feeling unwell","Sudden severe pain that started without any injury","Numbness, tingling or weakness spreading down the leg","Groin or hip pain that builds with each run, hurts to hop on, or aches at night: stop running and see a doctor promptly, it can be a stress fracture","Under 18 with hip, thigh or knee pain and a limp, or pain that stops you running: see a doctor","Unexplained weight loss","No improvement after about 2 weeks of easing off, or pain that keeps coming back"]},{"id":"ankle","name":"Ankles & feet","overview":"Overdone ankles and feet usually show up as an achy Achilles, sharp heel pain with the first steps of the morning, or sore shins after too much running or jumping. Cut back the pounding for a while, keep the foot moving, and rebuild calf and foot strength.","moves":[{"id":"anklecircle","name":"Ankle circles","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Sit with one foot off the floor. Slowly circle it 5 times each way. Switch sides.","avoidIf":"Make the circles smaller if any direction gives sharp pain.","easier":"Point your foot up and down instead of circling."},{"id":"calfhold","name":"Heel-raise hold","type":"time","target":30,"perSide":false,"sets":2,"cue":"Hold a wall and rise halfway onto the balls of both feet. Hold still, knees slightly bent.","avoidIf":"Stop if Achilles or heel pain goes above 3/10 or gets sharp.","easier":"Do it sitting: press the balls of your feet down to lift your heels."},{"id":"calfraise","name":"Slow calf raises","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Hold a wall, on flat ground. Rise onto your toes over 3 seconds, then lower over 3 seconds.","avoidIf":"Skip if walking clearly hurts today, or yesterday's raises left it worse this morning.","easier":"Do it seated, or lift your heels only partway."},{"id":"toeraise","name":"Toe raises","type":"reps","target":12,"perSide":false,"sets":2,"cue":"Stand with your back to a wall, heels a short step from it. Lift your toes and the front of your feet, then lower.","avoidIf":"Stop if your shin gets a sharp or pinpoint pain.","easier":"Do it sitting on a chair."},{"id":"onelegbal","name":"Single-leg balance","type":"time","target":30,"perSide":true,"sets":1,"cue":"Stand on one foot by a wall, knee soft, eyes ahead. Touch the wall only if you need to. Switch sides.","avoidIf":"Skip if standing on that foot hurts, or you feel dizzy.","easier":"Keep a fingertip on the wall, or rest the other toes on the floor."},{"id":"calfstretch","name":"Wall calf stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Hands on a wall, one foot back, heel down, toes forward. Keep that leg straight and lean in. Switch sides.","avoidIf":"Skip if your pain is right where the Achilles meets the heel bone; stretching can squeeze that spot.","easier":"Take a shorter step back and lean less."},{"id":"soleusstretch","name":"Bent-knee calf stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Hands on a wall, one foot back. Bend both knees and sink, back heel down, to stretch low in the calf. Switch sides.","avoidIf":"Skip if it gives pain at the back of the heel bone.","easier":"Take a smaller step back and bend the knees less."},{"id":"footroll","name":"Foot roll","type":"time","target":30,"perSide":true,"sets":1,"cue":"Sit and slowly roll the arch of one foot over a water bottle with gentle pressure. Switch sides.","avoidIf":"Skip if your feet are numb or the sole has an open cut.","easier":"Press more lightly, or roll a rolled-up towel instead."}],"sessionOrder":["anklecircle","calfhold","calfraise","toeraise","onelegbal","calfstretch","soleusstretch"],"habits":[{"id":"anklefirststeps","text":"Circle your ankles before your first steps out of bed","why":"Heel and Achilles pain is often worst in the first steps after rest, and moving first eases it."},{"id":"ankleshoes","text":"Wear supportive shoes on hard floors today, not bare feet","why":"Cushioning and support take some of the load off a sore heel or Achilles."},{"id":"ankleimpact","text":"Swap running or jumping for a walk or low-impact moves today","why":"Cutting back the pounding gives an overworked tendon or shin time to settle."},{"id":"anklerun","text":"Keep today's run no longer than your longest this past week","why":"Big sudden jumps in running cause most Achilles, heel and shin flares; build back roughly 10% a week."}],"redFlags":["You can't take 4 steps or put weight on the foot","A pop or a feeling of being kicked in the back of the heel, or you can't rise onto your toes: get checked the same day","Major swelling or bruising, or the ankle looks misshapen","Pain right on a bone that's tender to press, especially after a fall or twist","Numbness, tingling, or a cold or pale foot","A hot, red, swollen calf, or calf pain with shortness of breath: get urgent help","Pinpoint shin pain that hurts at rest or at night","No improvement after about 2 weeks of easing off, or pain that keeps getting worse"]},{"id":"wrist","name":"Wrists & elbows","overview":"Lots of push-ups, planks and burpees can overload the wrists, and pull-ups or gripping can leave the outer or inner elbow sore. Keep the joint moving, use gentle still holds to keep the tendons working, then rebuild slowly with light loading.","moves":[{"id":"wrbend","name":"Wrist bends","type":"reps","target":10,"perSide":false,"sets":1,"cue":"Rest your forearms on your thighs, hands past your knees. Slowly bend both wrists up, then down.","avoidIf":"Stop if a movement clicks painfully or gives sharp pain.","easier":"Move only through the pain-free range, or one hand at a time."},{"id":"wrcircle","name":"Wrist circles","type":"reps","target":10,"perSide":false,"sets":1,"cue":"Hands loose in front of you. Slowly circle both wrists, 5 times one way and 5 the other.","avoidIf":"Stop if any part of the circle gives sharp pain.","easier":"Make the circles smaller, or one hand at a time."},{"id":"wrglide","name":"Finger shapes","type":"reps","target":6,"perSide":false,"sets":2,"cue":"Fingers straight, then bend the top knuckles into a hook, then a full fist, then a flat fist. Open up between each.","avoidIf":"Stop if your fingers go numb or tingle, or a shape gives sharp pain.","easier":"Do just the hook and the open hand."},{"id":"wrextiso","name":"Wrist-back hold","type":"time","target":30,"perSide":true,"sets":1,"cue":"Forearm on your thigh, palm down. Push the back of that hand up into your other hand at half effort. Switch sides.","avoidIf":"Stop if elbow or wrist pain goes above 3/10 during the hold.","easier":"Press more softly, or hold for 20 seconds."},{"id":"wrflexiso","name":"Wrist-forward hold","type":"time","target":30,"perSide":true,"sets":1,"cue":"Forearm on your thigh, palm up. Push that palm up into your other hand at half effort, wrist still. Switch sides.","avoidIf":"Stop if inner elbow or wrist pain goes above 3/10.","easier":"Press more softly, or hold for 20 seconds."},{"id":"wrrotate","name":"Forearm turns","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Elbow bent at your side, hold a water bottle by one end. Slowly turn your palm up, then down. Switch sides.","avoidIf":"Stop if turning gives sharp pain at the elbow or wrist.","easier":"Use an empty hand, or hold the bottle near the middle."},{"id":"wrecc","name":"Slow wrist lowers","type":"reps","target":10,"perSide":true,"sets":1,"cue":"Forearm on your thigh, palm down, holding a small bottle. Lift the wrist with your other hand, lower it alone over 3 s.","avoidIf":"Skip it if the elbow or wrist is above 3/10 at rest today.","easier":"Use an empty hand or a half-full bottle."},{"id":"wrextstretch","name":"Forearm back stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Hold one arm out, palm down. Use the other hand to gently bend that wrist down until the forearm stretches. Switch sides.","avoidIf":"Skip if it gives sharp pain at the outer elbow.","easier":"Keep the elbow slightly bent and stretch more gently."}],"sessionOrder":["wrbend","wrcircle","wrglide","wrextiso","wrflexiso","wrrotate","wrecc","wrextstretch"],"habits":[{"id":"wristfists","text":"Use fists or a raised surface for any push-ups today","why":"Fists keep the wrist straight, and a raised surface puts less of your weight through it."},{"id":"wristholds","text":"Do the two wrist holds once today","why":"Still holds keep the tendons working; some people find they ease pain for a while."},{"id":"wristgrip","text":"Loosen your grip on phone, mouse and bags today","why":"Tight gripping all day keeps loading sore forearm tendons."},{"id":"wristbreaks","text":"Take a 1-minute hand break every 30 minutes of typing","why":"Short breaks stop the same tendons working nonstop."},{"id":"wristhang","text":"Keep pull-ups and hanging to half your usual today","why":"Gripping a bar is a big load on sore elbow tendons; less lets them settle."}],"redFlags":["Pain started after a fall onto your hand, or a pop","Major swelling or bruising, or a visible bump or change in shape","You can't grip, or you can't fully bend or straighten the elbow","Numbness, tingling or pins and needles in the fingers","Weakness, or dropping things more often","A hot, red, swollen joint, or fever","Pain at night or at rest that keeps getting worse","No improvement after about 2 weeks of easing off"]},{"id":"neck","name":"Neck","overview":"Neck soreness from training usually comes from straining during sit-ups, crunches or leg raises, or from long slouched sitting afterwards. Gentle movement and light strength work help more than keeping the neck still.","moves":[{"id":"nkchintuck","name":"Chin tucks","type":"reps","target":8,"perSide":false,"sets":2,"cue":"Sit tall and look ahead. Gently slide your chin straight back, like making a double chin. Hold 3 seconds, relax.","avoidIf":"Stop if it makes you dizzy or gives tingling in your arms.","easier":"Do it lying on your back with your head on a pillow."},{"id":"nkturn","name":"Gentle head turns","type":"reps","target":6,"perSide":true,"sets":1,"cue":"Sit tall. Slowly turn your head to look over one shoulder, as far as is comfortable, then back. Switch sides.","avoidIf":"Stop if you feel dizzy or sick, or your vision blurs. Don't roll your head in full circles.","easier":"Turn only halfway."},{"id":"nkrolls","name":"Shoulder rolls","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Let your arms hang. Slowly roll your shoulders up, back and down in big circles.","avoidIf":"Stop if it brings on sharp neck pain.","easier":"Make the circles smaller and slower."},{"id":"nknod","name":"Lying head nod","type":"time","target":20,"perSide":false,"sets":3,"cue":"Lie on your back, head on a thin pillow. Make a tiny nod, as if saying yes, and hold. Keep your head on the pillow.","avoidIf":"Stop if the front of your neck shakes hard or pain goes above 3/10.","easier":"Hold for 10 seconds, 5 times."},{"id":"nkiso","name":"Side press hold","type":"time","target":20,"perSide":true,"sets":1,"cue":"Sit tall, palm on the side of your head. Press your head into it at quarter effort, without moving. Switch sides.","avoidIf":"Stop if pain spreads into the arm or goes above 3/10.","easier":"Press even more lightly, or hold for 10 seconds."},{"id":"nkchairext","name":"Chair back arch","type":"reps","target":10,"perSide":false,"sets":1,"cue":"Sit in a chair, hands behind your head. Gently lean your upper back over the backrest, then sit up again.","avoidIf":"Skip if leaning back makes you dizzy or gives sharp pain.","easier":"Cross your arms over your chest and make the movement smaller."},{"id":"nktrap","name":"Side neck stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Sit tall, holding the chair seat with one hand. Gently tip your ear toward the other shoulder. Switch sides.","avoidIf":"Stop if you feel tingling into the arm or a sharp pain.","easier":"Let go of the chair and tilt less."},{"id":"nklevator","name":"Look-down stretch","type":"time","target":30,"perSide":true,"sets":1,"cue":"Turn your head slightly to one side, then look down toward that armpit. Rest a hand lightly on your head. Switch sides.","avoidIf":"Stop if you feel dizzy or have tingling in the arm.","easier":"Skip the hand and just let your head drop gently."}],"sessionOrder":["nkchintuck","nkturn","nkrolls","nknod","nkiso","nkchairext","nktrap","nklevator"],"habits":[{"id":"neckhands","text":"If you do sit-ups or crunches today, keep hands off your head","why":"Pulling on your head strains the neck instead of training your core."},{"id":"neckphone","text":"Hold your phone up at eye level instead of looking down","why":"Long spells looking down load the neck muscles."},{"id":"necktucks","text":"Do 10 chin tucks at some point today","why":"Little-and-often movement keeps the neck from stiffening up."},{"id":"neckpillow","text":"Tonight, sleep on one pillow that keeps your head level","why":"A level head at night reduces morning neck stiffness."}],"redFlags":["Neck pain after a fall, a crash or a hit to the head","Numbness, tingling or weakness in the arms or legs","Trouble walking, clumsy hands, or problems with bladder or bowels: get urgent medical care","Dizziness, double vision, trouble speaking or swallowing, or fainting, especially with a new severe headache or neck pain: call emergency services","Severe headache with a stiff neck, fever or rash: get help urgently","Pain at night that doesn't ease when you change position","Unexplained weight loss or feeling generally unwell with the pain","Pain getting worse, or no better after about 2 weeks"]},{"id":"general","name":"Full body","overview":"After a hard block of training, overexertion often shows up as soreness all over that peaks 1-3 days later, heavy legs, stiff joints, poor sleep and low drive. Take an easy active-recovery day: light movement, gentle stretching, good sleep and food, then build back up gradually.","moves":[{"id":"easymarch","name":"Easy march in place","type":"time","target":60,"perSide":false,"sets":2,"cue":"March in place at an easy pace, swinging your arms. You should be able to chat comfortably.","avoidIf":"Stop if you feel dizzy, short of breath, or have chest discomfort.","easier":"March sitting on a chair, or hold a wall for balance."},{"id":"armcircle","name":"Arm circles","type":"reps","target":10,"perSide":false,"sets":2,"cue":"Arms out to the sides, make slow, easy circles. First set forward, second set backward.","avoidIf":"Stop if your shoulders pinch or hurt above 3/10.","easier":"Make small circles, or one arm at a time."},{"id":"sidereach","name":"Standing side reach","type":"reps","target":6,"perSide":true,"sets":1,"cue":"Stand tall, feet hip-width. Reach one arm up and over your head, leaning gently to the side. Switch sides.","avoidIf":"Stop if it gives sharp pain in your back or shoulder.","easier":"Keep your hand on your hip and lean less."},{"id":"hipcircle","name":"Hip circles","type":"reps","target":10,"perSide":false,"sets":1,"cue":"Hands on hips, knees soft. Slowly circle your hips, 5 times one way and 5 the other.","avoidIf":"Make the circles smaller if your back or hips pinch.","easier":"Hold a chair and make smaller circles."},{"id":"openbook","name":"Open book rotation","type":"reps","target":6,"perSide":true,"sets":1,"cue":"Lie on your side, knees bent, arms out in front. Open your top arm across to the other side, eyes following it. Switch sides.","avoidIf":"Stop if your back or shoulder pain gets sharp.","easier":"Open only halfway, with a pillow under your head and knees."},{"id":"rolldown","name":"Standing roll-down","type":"reps","target":5,"perSide":false,"sets":1,"cue":"Stand tall, knees soft. Slowly roll down through your spine toward the floor, then roll back up.","avoidIf":"Skip if bending forward sends pain down your leg or makes you dizzy.","easier":"Roll down only to your knees, with your back against a wall."},{"id":"bellybreath","name":"Belly breathing, legs up","type":"time","target":90,"perSide":false,"sets":1,"cue":"Lie on your back, calves resting on a chair. Breathe in through your nose into your belly, out slowly for 6 seconds.","avoidIf":"If you feel lightheaded, breathe normally for a while.","easier":"Lie with your knees bent and feet flat, and breathe at your own pace."}],"sessionOrder":["easymarch","armcircle","sidereach","hipcircle","openbook","rolldown","bellybreath"],"habits":[{"id":"genwalk","text":"Take an easy 15-minute walk","why":"Light movement eases stiffness better than sitting still all day."},{"id":"genbedtime","text":"Go to bed 30 minutes earlier tonight","why":"Most of your repair and recovery happens while you sleep."},{"id":"genrate","text":"Rate how sore you feel, 0-10, this morning","why":"Pain that is the same or lower than yesterday means your training load is about right."},{"id":"gennomax","text":"Skip max-effort sets today","why":"Training all-out on very sore muscles raises the risk of a real injury."},{"id":"genpaincap","text":"Keep pain at 3/10 or less in today's training","why":"Mild discomfort that settles by next morning is fine; sharp or rising pain means do less."},{"id":"gensitbreak","text":"Stand up and move for 2 minutes each hour you sit","why":"Long spells sitting stiffen sore joints, and short breaks ease that."}],"redFlags":["Dark, cola- or tea-coloured pee, or peeing much less than usual after hard exercise: get urgent medical care","Muscles that are very swollen, tight and hard, far more painful than expected, or too weak to move: get urgent medical care","Chest pain, fainting, severe breathlessness or a racing, irregular heartbeat during or after exercise: stop and call emergency services","Soreness far worse than usual, or still getting worse after 3 days instead of easing","Fever, confusion or feeling generally unwell along with muscle aches","A single joint that is hot, red and swollen","Numbness or tingling anywhere that doesn't go away","Tiredness, poor sleep, low mood or dropping performance lasting more than about 2 weeks despite easing off"]}],"stress":[{"exercise":"pushup","joints":["shoulder","wrist"]},{"exercise":"diamond","joints":["shoulder","wrist"]},{"exercise":"pike","joints":["shoulder","wrist","neck"]},{"exercise":"pullup","joints":["shoulder","wrist"]},{"exercise":"squat","joints":["knee","hip"]},{"exercise":"jumpsquat","joints":["knee","hip","ankle"]},{"exercise":"lunge","joints":["knee","hip","ankle"]},{"exercise":"glute","joints":[]},{"exercise":"wallsit","joints":["knee"]},{"exercise":"situp","joints":["back","neck","hip"]},{"exercise":"crunch","joints":["neck","back"]},{"exercise":"legraise","joints":["back","hip"]},{"exercise":"plank","joints":["shoulder"]},{"exercise":"hollow","joints":["back","neck","hip"]},{"exercise":"superman","joints":["back","neck"]},{"exercise":"burpee","joints":["knee","hip","ankle","shoulder","wrist","back"]},{"exercise":"jack","joints":["knee","ankle","shoulder","hip"]},{"exercise":"climber","joints":["shoulder","wrist","hip"]},{"exercise":"highknees","joints":["knee","ankle","hip"]},{"exercise":"stepjack","joints":["ankle","shoulder"]},{"exercise":"run","joints":["knee","ankle","hip"]},{"exercise":"wallpush","joints":[]},{"exercise":"deadbug","joints":[]},{"exercise":"walk","joints":[]}],"dailySubs":[{"task":"pushup","joints":["shoulder","wrist"],"altId":"wallpush","altName":"Wall push-ups","altCue":"Hands on a wall at chest height, body straight. Bend your elbows to bring your chest in, press back. Sore wrists: use fists.","countsAs":"same reps"},{"task":"situp","joints":["back","neck","hip"],"altId":"deadbug","altName":"Dead bugs","altCue":"On your back, knees bent, feet down, arms up. Slide one heel out as the opposite arm reaches back, then return. Alternate.","countsAs":"same reps, each side counts as one"},{"task":"squat","joints":["knee","hip"],"altId":"glute","altName":"Glute bridges","altCue":"On your back, knees bent. Drive through your heels and squeeze at the top.","countsAs":"same reps"},{"task":"run","joints":["knee","ankle","hip"],"altId":"walk","altName":"Brisk walk","altCue":"Walk briskly on flat ground at a pace you could talk at. Short steps, no hills, stairs or slopes.","countsAs":"10 minutes of walking per km of run target, up to 30 minutes"}],"painRule":"Rate pain from 0 to 10: 0 is none, 3 is noticeable but easy to ignore, 10 is the worst ever. Up to 3/10 while you move is fine if it has settled by the next morning; if it gets sharp, keeps rising, or is worse the next morning, do less next time.","generalRedFlags":["Chest pain, fainting, severe breathlessness or a racing, irregular heartbeat: stop and call emergency services","Dark, cola- or tea-coloured pee after hard exercise: get urgent medical care","Numbness around the groin or buttocks, or new trouble controlling your bladder or bowels: get emergency care","Sudden dizziness, double vision, or trouble speaking or swallowing: call emergency services","A hot, red, swollen calf, or calf pain with breathlessness: get urgent help","Pain that started with a fall, a pop or a twist, or you can't put weight on it or use it","A hot, red, swollen joint, or pain with a fever","Numbness, tingling or weakness spreading into an arm or leg","Pain at night or at rest that doesn't ease","Under 18 with hip, thigh or knee pain and a limp","No better after about 2 weeks of easing off"],"disclaimer":"General tips for everyday aches from training, not a diagnosis or treatment. If you've had recent surgery or an injury from a fall or twist, are pregnant, or are under 16 with pain and a limp, check with a doctor or physio first."};
const JOINT_IDS=['knee','shoulder','back','hip','ankle','wrist','neck'];
const REC_BY=Object.fromEntries(RECOVERY.regions.map(r=>[r.id,r]));
const STRESS=Object.fromEntries(RECOVERY.stress.map(s=>[s.exercise,s.joints]));
const AILMENT=j=>`Overworked ${REC_BY[j].name.toLowerCase()}`;
for(const r of RECOVERY.regions) for(const m of r.moves) if(!EX[m.id]){
  const hold=m.type==='time';
  EX[m.id]={name:m.name,type:m.type,f:1,xp:hold?.12:.3,stat:hold?{vit:.04,per:.04}:{vit:.12,per:.12},kind:'rec',cue:m.cue,avoidIf:m.avoidIf,easier:m.easier,perSide:m.perSide};
}
for(const s of RECOVERY.dailySubs) if(!EX[s.altId]){
  const base=EX[DAILY_BY[s.task].ex];
  // the walk replaces the run by time (10 minutes per km of the run goal), and gives a little less than running
  EX[s.altId]=s.task==='run'?{name:s.altName,type:'min',xp:2,stat:{agi:.8,vit:.8},kind:'run',cue:s.altCue}
    :{name:s.altName,type:'reps',f:1,xp:.5,stat:Object.fromEntries(Object.entries(base.stat).map(([k,v])=>[k,v*.6])),kind:base.kind,cue:s.altCue};
}

    settings:{diff:'normal',units:'km',resetHour:0,restDays:[0],sound:true,haptics:true,badge:true,lowImpact:false,bar:false,skin:'blue',tasks:{pushup:true,situp:true,squat:true,run:true}},
    baseline:{pushup:10,situp:15,squat:20,run:1},
    daily:null,history:{},streak:{cur:0,best:0,freeze:0},penalty:null,joints:{},
    periods:{w:null,m:null},login:{last:null,n:0},days:{},pb:{},tests:[],
