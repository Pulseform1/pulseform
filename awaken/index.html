}
function merge(base,src){
  if(!src||typeof src!=='object') return base;
  for(const k of Object.keys(src)){
    const v=src[k],b=base[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&b&&typeof b==='object'&&!Array.isArray(b)) base[k]=merge(b,v);
    else base[k]=v;
  }
  return base;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw) return merge(freshState(),JSON.parse(raw))}catch(e){}return freshState()}
let S=load(),saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}
function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncOutside()}
const UI={tab:'quest',sheet:null,screen:null,aw:null,runMode:'gps',hit:0,confirmReset:false,confirmDiscard:false,geoErr:''};

/* ---------- time ---------- */
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKey=(t=Date.now())=>keyOf(new Date(t-S.settings.resetHour*3600000));
function keyDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(k,n){const d=keyDate(k);d.setDate(d.getDate()+n);return keyOf(d)}
function nextReset(){const now=new Date(),d=new Date(now);d.setHours(S.settings.resetHour,0,0,0);if(d<=now) d.setDate(d.getDate()+1);return d.getTime()}
const isRest=k=>S.settings.restDays.includes(keyDate(k).getDay());
function hms(ms){const s=Math.max(0,Math.floor(ms/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
function mmss(sec){sec=Math.max(0,Math.ceil(sec));return `${Math.floor(sec/60)}:${pad(sec%60)}`}
function clockTime(t){const d=new Date(t);return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

/* ---------- units ---------- */
const unit=()=>S.settings.units==='mi'?'mi':'km';
const toUser=km=>S.settings.units==='mi'?km*0.621371:km;
const fromUser=v=>S.settings.units==='mi'?v/0.621371:v;
function fmtTask(id,v){return id==='run'?trim(Math.floor(toUser(v)*100)/100):fmt(v)}
function paceStr(sec,km){if(km<0.02||!sec) return '--';const p=sec/toUser(km);return `${Math.floor(p/60)}'${pad(Math.round(p%60))}"`}

/* ---------- derived numbers ---------- */
const stat=k=>10+S.stats[k].t+S.stats[k].a;
function bonus(key){
  let b=0;
  for(const id of S.skills){const d=SKILL_BY[id];if(d&&d.b[key]) b+=d.b[key]}
  const t=TITLE_BY[S.player.title];if(t&&t.b[key]) b+=t.b[key];
  const j=JOBS[S.player.job];if(j&&j.b[key]) b+=j.b[key];
  return b;
}
function statBonus(kind){const k={str:'str',run:'agi',side:'int',gold:'per'}[kind];return k?clamp((stat(k)-10)*.005,0,.5):0}
const maxHP=()=>Math.round((100+stat('vit')*10)*(1+bonus('hp')));
const maxMP=()=>Math.round((50+stat('int')*5)*(1+bonus('mp')));
const weakened=()=>!!S.penalty;
function xpMult(kind){let m=1+bonus('all')+(kind?bonus(kind)+statBonus(kind):0);if(weakened()) m*=.5;return m}
const goldMult=()=>1+bonus('gold')+statBonus('gold');
const xpNeed=l=>Math.round(60*Math.pow(l,1.4)+40);
const rankOf=()=>RANKS[S.player.rank];
function fatigue(){const p=S.player,rate=bonus('regen')?8:4;return Math.max(0,Math.round(p.fatigue-(Date.now()-p.fatigueTs)/3600000*rate))}
function addFatigue(v){const p=S.player;p.fatigue=clamp(fatigue()+v,0,100);p.fatigueTs=Date.now()}
function bonusText(b){return Object.entries(b).map(([k,v])=>k==='guard'?`Penalty damage −${Math.round(v*100)}%`:k==='regen'?'Fatigue fades twice as fast':`+${Math.round(v*100)}% ${BONUS_LABEL[k]}`).join(' · ')||'No bonus'}

/* ---------- joint check-in ---------- */
const soreLv=j=>(S.joints[j]&&S.joints[j].lv)||0;
const soreJoints=()=>JOINT_IDS.filter(j=>soreLv(j)>0);
const maxSore=()=>Math.max(0,...JOINT_IDS.map(soreLv));
const stressLv=id=>Math.max(0,...(STRESS[id]||[]).map(soreLv));
// the joint-friendly swap for a Daily Quest task, if a joint it covers is sore
function subFor(task){
  for(const s of RECOVERY.dailySubs) if(s.task===task){const lv=Math.max(0,...s.joints.map(soreLv));if(lv) return {id:s.altId,lv}}
  return null;
}
function todaysSubs(){const o={};for(const t of DAILY){const s=subFor(t.id);if(s) o[t.id]=s.id}return o}
const taskEx=id=>(S.daily&&S.daily.subs&&S.daily.subs[id])||DAILY_BY[id].ex;
const taskName=id=>EX[taskEx(id)].name;

/* ---------- daily targets ---------- */
function targetsWith(b,diff,level){
  const D=DIFF[diff];
  if(D.fixed) return {pushup:100,situp:100,squat:100,run:10};
  const m=D.mul,p=clamp((level-1)/(D.ramp-1),0,1);
  const st={pushup:clamp(r5(b.pushup*2*m),10,100),situp:clamp(r5(b.situp*2*m),10,100),squat:clamp(r5(b.squat*2*m),15,100),run:clamp(rHalf(b.run*.5*m),.5,10)};
  return {pushup:r5(st.pushup+(100-st.pushup)*p),situp:r5(st.situp+(100-st.situp)*p),squat:r5(st.squat+(100-st.squat)*p),run:rHalf(st.run+(10-st.run)*p)};
}
function todaysTargets(){
  const all=targetsWith(S.baseline,S.settings.diff,S.player.level),tg={};
  for(const t of DAILY) if(S.settings.tasks[t.id]){
    let v=all[t.id];
    // a joint that hurts halves the goals that load it
    const sub=subFor(t.id);
    if(sub&&sub.lv>=2) v=t.id==='run'?Math.max(.5,rHalf(v/2)):Math.max(5,r5(v/2));
    tg[t.id]=v;
  }
  return tg;
}
function retarget(){
  const d=S.daily;if(!d||d.cleared) return;
  d.targets=todaysTargets();d.subs=todaysSubs();d.heal=maxSore()>=2;
  for(const id in d.targets) if(d.prog[id]==null) d.prog[id]=0;
  checkDaily();
}

/* ---------- gains ---------- */
function gainXP(base,kind){
  const p=S.player,amt=Math.max(0,Math.round(base*xpMult(kind)));
  if(!amt) return 0;
  p.xp+=amt;
  let ups=0;
  while(p.xp>=xpNeed(p.level)){p.xp-=xpNeed(p.level);p.level++;ups++;p.points+=3}
  if(ups) onLevelUp(ups);
  return amt;
}
function onLevelUp(n){
  recover();
  const p=S.player,lines=[`You have reached Level ${p.level}.`,'HP and MP fully restored.'];
  const nx=RANKS[p.rank+1];
  if(nx&&p.level>=nx.min&&p.level-n<nx.min) lines.push(`[A ${nx.id}-Rank Reassessment Trial is now available.]`);
  notify({kind:'level',head:'Level Up',big:`LV. ${p.level}`,lines,rewards:[['Ability points',`+${3*n}`]],prio:2});
  checkUnlocks();
}
function gainGold(base){const g=Math.round(base*goldMult());S.player.gold+=g;return g}
function gainStats(map){
  const ups={};
  for(const k in map){const s=S.stats[k];s.x+=map[k];while(s.x>=100){s.x-=100;s.t++;ups[k]=(ups[k]||0)+1}}
  const msg=Object.entries(ups).map(([k,n])=>`${STAT_INFO[k].short} +${n}`).join('   ');
  if(msg) toast(msg,'stat');
}
function recover(){const p=S.player;p.hp=maxHP();p.mp=maxMP();p.fatigue=0;p.fatigueTs=Date.now()}
function doReps(id,n){
  const e=EX[id];n=+n||0;
  if(n<=0) return {xp:0,st:{}};
  const xp=gainXP(e.xp*n,e.kind),st={};
  for(const k in e.stat) st[k]=e.stat[k]*n;
  gainStats(st);
  S.totals.ex[id]=r2((S.totals.ex[id]||0)+n);
  if(e.kind!=='rec') addFatigue(e.type==='km'?n*4:e.type==='time'?n*.04:n*.08*e.xp);
  return {xp,st};
}
function flag(k){S.flags[k]=true}
function checkUnlocks(){
  for(const t of TITLES) if(!S.titles.includes(t.id)&&t.ok()){
    S.titles.push(t.id);
    notify({kind:'info',head:'Title Acquired',big:t.name,lines:[`[You have acquired the title "${t.name}".]`],rewards:[['Effect when equipped',bonusText(t.b)]],foot:'Equip titles from the Status window.',prio:3});
  }
  for(const s of SKILLS) if(!S.skills.includes(s.id)&&s.ok()){
    S.skills.push(s.id);
    notify({kind:'info',head:'Skill Acquired',big:s.name,lines:[`[You have learned the passive skill "${s.name}".]`],rewards:[['Effect',bonusText(s.b)]],prio:3});
  }
}

/* ---------- day cycle ---------- */
function pickSide(k){return shuffle(rng('side'+k+S.created),SIDE).slice(0,3).map(s=>({id:s.id,done:false,xp:0}))}
function newDay(k,first){
  const tg=todaysTargets(),prog={};
  for(const id in tg) prog[id]=0;
  // the awakening day is always a real quest, but missing it carries no penalty.
  // heal: a joint hurts, so the day is penalty-free.
  S.daily={date:k,targets:tg,prog,sets:[],rest:!first&&isRest(k),grace:!!first,heal:maxSore()>=2,subs:todaysSubs(),cleared:false,side:pickSide(k),rh:[],recDone:[],announced:false};
  syncRecHabits();
  S.player.mp=maxMP();
  S.player.hp=Math.min(maxHP(),S.player.hp+Math.round(maxHP()*.2));
  genGates(k);
}
// recovery habits for the day: two per sore joint (one each when many are sore), topped up with general ones
function recHabitPool(){
  const js=soreJoints(),r=rng('rh'+S.daily.date+S.created),out=[];
  for(const j of js) shuffle(r,REC_BY[j].habits).slice(0,js.length>2?1:2).forEach(h=>out.push({r:j,id:h.id}));
  if(out.length<4) shuffle(r,REC_BY.general.habits).slice(0,4-out.length).forEach(h=>out.push({r:'general',id:h.id}));
  return out.slice(0,4);
}
function syncRecHabits(){
  const d=S.daily;if(!d) return;
  const old=d.rh||[],same=(a,b)=>a.r===b.r&&a.id===b.id;
  d.rh=recHabitPool().map(h=>old.find(o=>same(o,h))||{...h,done:false,xp:0});
  // habits already ticked today stay, even if their joint has recovered
  for(const o of old) if(o.done&&!d.rh.some(h=>same(h,o))) d.rh.push(o);
}
const recHabit=q=>(REC_BY[q.r]&&REC_BY[q.r].habits.find(h=>h.id===q.id))||{text:'',why:''};
function rollover(){
  const today=dayKey();
  // same day, or the clock moved backwards (time zone travel, clock change): keep the current quest
  if(S.daily&&S.daily.date>=today) return false;
  if(S.daily){
    const d=S.daily,missed=[];
    if(!d.cleared) missed.push({k:d.date,rest:d.rest||d.grace||d.heal});
    for(let k=addDays(d.date,1),n=0;k<today&&n<400;k=addDays(k,1),n++) missed.push({k,rest:isRest(k)||maxSore()>=2});
    const need=missed.filter(m=>!m.rest);
    missed.filter(m=>m.rest).forEach(m=>S.history[m.k]={s:'rest'});
    if(need.length){
      if(S.inv.ward>=need.length){
        S.inv.ward-=need.length;
        need.forEach(m=>S.history[m.k]={s:'ward'});
        notify({kind:'info',head:'Notification',lines:['[A Penalty Ward has shattered.]',need.length>1?`It protected you through ${need.length} missed Daily Quests.`:'It protected you from the penalty for a missed Daily Quest.','Your streak is safe.']});
      } else {
        need.forEach(m=>S.history[m.k]={s:'fail'});
        S.streak.cur=0;
        const dmg=Math.round(maxHP()*.3*(1-Math.min(.75,bonus('guard'))));
        S.player.hp=Math.max(1,S.player.hp-dmg);
        if(!S.penalty) S.penalty=makePenalty();
        notify({kind:'penalty',head:'Warning',lines:[need.length>1?`[You missed ${need.length} Daily Quests.]`:'[You did not complete the Daily Quest.]','You have been sent to the Penalty Zone.','Debuff applied: Weakened. All XP is halved until you survive the Penalty Quest.'],rewards:[['HP',`−${fmt(dmg)}`],['Streak','Reset to 0']]});
      }
    }
  }
  newDay(today);
  return true;
}
function announce(){
  const d=S.daily;if(!d||d.announced) return;
  d.announced=true;
  const goals=Object.keys(d.targets).map(id=>[taskName(id),`${fmtTask(id,d.targets[id])}${id==='run'?' '+unit():''}`]);
  const lines=d.rest?['[Today is a rest day.]','The Daily Quest is optional. Clearing it still counts toward your streak.']
    :d.heal?['[Recovery day.]','A joint hurts, so the System has eased today\'s quest. There is no penalty today.']
    :['[Daily Quest: Strength Training has arrived.]','Complete every goal before the day resets.'];
  if(soreJoints().length) lines.push(`Status ailments: ${soreJoints().map(AILMENT).join(', ')}. Still sore? Update your check-in in Recover.`);
  notify({kind:'quest',head:'Quest Info',lines,rewards:goals,foot:d.rest||d.heal?'':d.grace?'First day: no penalty yet. From tomorrow, failure will result in an appropriate penalty.':'Failure to complete the Daily Quest will result in an appropriate penalty.',btn:'Accept'});
  save();
}

/* ---------- daily quest ---------- */
function logDaily(task,n,quiet){
  const d=S.daily;n=task==='run'?r2(n):Math.round(n);
  if(!d||n<=0) return 0;
  const exId=taskEx(task),rec=doReps(exId,n);
  if(d.targets[task]!=null){
    d.prog[task]=r2(d.prog[task]+n);
    d.sets.push({task,ex:exId,n,xp:rec.xp,st:rec.st});
    // the titles are for the real thing, not the joint-friendly swap
    if(task==='pushup'&&exId==='pushup'&&d.prog.pushup>=100) flag('centurion');
    if(task==='run'&&exId==='run'&&d.prog.run>=10) flag('windrunner');
  }
  if(!quiet) toast(`${EX[exId].name} +${task==='run'?trim(toUser(n))+' '+unit():n}  ·  +${rec.xp} XP`);
  checkDaily();checkUnlocks();save();refresh();
  return rec.xp;
}
function undoDaily(task){
  const d=S.daily;if(!d||d.cleared) return;
  let i=-1;for(let j=d.sets.length-1;j>=0;j--) if(d.sets[j].task===task){i=j;break}
  if(i<0) return;
  const s=d.sets.splice(i,1)[0],exId=s.ex||DAILY_BY[task].ex;
  d.prog[task]=Math.max(0,r2(d.prog[task]-s.n));
  S.player.xp=Math.max(0,S.player.xp-s.xp);
  for(const k in s.st){const st=S.stats[k];st.x-=s.st[k];while(st.x<0&&st.t>0){st.x+=100;st.t--}if(st.x<0) st.x=0}
  S.totals.ex[exId]=Math.max(0,r2((S.totals.ex[exId]||0)-s.n));
  toast(`Removed the last set (${task==='run'?trim(toUser(s.n))+' '+unit():s.n})`);
  save();refresh();
}
function checkDaily(){
  const d=S.daily;if(!d||d.cleared) return;
  const ids=Object.keys(d.targets);
  if(ids.length&&ids.every(id=>d.prog[id]>=d.targets[id]-1e-6)) clearDaily();
}
function clearDaily(){
  const d=S.daily,p=S.player;
  d.cleared=true;d.clearedAt=Date.now();
  S.history[d.date]={s:'clear'};
  S.streak.cur++;S.streak.best=Math.max(S.streak.best,S.streak.cur);
  S.totals.clears++;
  if(S.settings.diff==='hunter') flag('limitless');
  if(new Date().getHours()<8) flag('earlybird');
  const base=40+8*p.level,xpPreview=Math.round(base*xpMult()),gold=gainGold(30+3*p.level);
  p.points+=3;S.inv.box++;
  recover();
  notify({kind:'quest',head:'Quest Complete',lines:['[You have completed the Daily Quest: Strength Training.]','Rewards have been distributed.'],
    rewards:[['Status Recovery','HP · MP · Fatigue'],['Ability points','+3'],['Random Box','×1'],['XP',`+${fmt(xpPreview)}`],['Gold',`+${fmt(gold)}`]],
    foot:`Streak: ${S.streak.cur} day${S.streak.cur===1?'':'s'}`});
  gainXP(base);
  checkUnlocks();
}
function toggleSide(i){

  const s=SIDE_BY[q.id];
  if(!q.done){
    q.done=true;q.xp=gainXP(SIDE_XP,'side');

/* ---------- recovery ---------- */
// what the System has changed because of sore joints, as [label, value] rows
function adaptLines(){
  const d=S.daily,rows=[];
  if(!d) return rows;
  for(const id of Object.keys(d.subs||{})) if(d.targets[id]!=null){
    const sub=subFor(id);
    rows.push([DAILY_BY[id].name,`${EX[d.subs[id]].name}${sub&&sub.lv>=2?' · half target':''}`]);
  }
  const out=Object.values(POOL).flat().filter(id=>stressLv(id)).length;
  if(out) rows.push(['Gates',`${out} exercise${out===1?'':'s'} left out`]);
  if(S.penalty&&S.penalty.tasks.some(t=>t.done<t.target)) rows.push(['Penalty Quest',S.penalty.tasks.map(t=>EX[t.ex].name).join(' + ')]);
  if(d.heal&&!d.cleared) rows.push(['Today','Recovery day · no penalty']);
  return rows;
}
function setJoint(j,lv){
  const prev=soreLv(j);if(prev===lv||!REC_BY[j]) return;
  if(lv) S.joints[j]={lv,since:prev?S.joints[j].since:S.daily.date}; else delete S.joints[j];
  retarget();syncRecHabits();regenGates();adaptPenalty();
  if(lv>prev){
    const rows=adaptLines(),lines=[`[Status ailment detected: ${AILMENT(j)}.]`,lv>=2?'The System has eased your training and made today penalty-free.':'The System has adjusted your training.'];
    if(S.daily.cleared) lines.push('Today\'s Daily Quest is already complete. Goal swaps apply from tomorrow.');
    notify({kind:'info',head:'Status Ailment',lines,rewards:rows.length?rows:null,foot:RECOVERY.painRule});
  } else toast(lv?`${REC_BY[j].name}: sore`:`${REC_BY[j].name}: feeling OK. Ailment removed.`);
  save();refresh();
}
function toggleRecHabit(i){
  const d=S.daily,q=d&&d.rh&&d.rh[i];if(!q) return;
  if(!q.done){
    q.done=true;q.xp=gainXP(10,'side');gainStats({vit:15});S.totals.recHabits++;

/* ---------- penalty ---------- */
// penalty exercises in order of preference, with their base targets; sore joints and low-impact mode skip ahead
const PEN_REPS={burpee:25,squat:50,glute:50,crunch:50};
const PEN_HOLD={plank:120,wallsit:90,hollow:60};
const penScale=()=>({beginner:.6,normal:1,hard:1.4,hunter:1.6}[S.settings.diff]||1);
function penaltyPick(list){
  const ids=Object.keys(list),ok=id=>!(S.settings.lowImpact&&(EX[id].tags||[]).includes('jump'));
  return ids.find(id=>ok(id)&&!stressLv(id))||ids.find(id=>ok(id)&&stressLv(id)<2)||ids[ids.length-1];
}
const penTarget=(list,id)=>EX[id].type==='time'?Math.round(list[id]*penScale()/10)*10:r5(list[id]*penScale());
function makePenalty(){
  const reps=penaltyPick(PEN_REPS),hold=penaltyPick(PEN_HOLD);
  return {tasks:[{ex:reps,target:penTarget(PEN_REPS,reps),done:0},{ex:hold,target:penTarget(PEN_HOLD,hold),done:0}]};
}
// when a joint becomes sore, swap unfinished penalty tasks that load it, keeping the share already done
function adaptPenalty(){
  const p=S.penalty;if(!p) return;
  for(const t of p.tasks){
    if(t.done>=t.target||!stressLv(t.ex)) continue;
    const list=EX[t.ex].type==='time'?PEN_HOLD:PEN_REPS,id=penaltyPick(list);
    if(id===t.ex) continue;
    const target=penTarget(list,id);
    t.done=Math.min(target-1,Math.round(t.done/t.target*target));t.ex=id;t.target=target;
  }
}
function logPenalty(i,n){
  const p=S.penalty,t=p&&p.tasks[i];n=Math.round(n);
  if(!t||n<=0) return;
  const rec=doReps(t.ex,n);
  t.done+=n;
  toast(`${EX[t.ex].name} +${n}${EX[t.ex].type==='time'?' s':''}  ·  +${rec.xp} XP`);
  if(p.tasks.every(x=>x.done>=x.target)){
    S.penalty=null;S.totals.penalties++;UI.sheet=null;
    notify({kind:'quest',head:'Quest Complete',lines:['[You have survived the Penalty Quest.]','Debuff removed: Weakened.','You have returned from the Penalty Zone.']});
    checkUnlocks();
  }
  save();refresh();
}

/* ---------- gates ---------- */
function allowed(id){const t=EX[id].tags||[];return !(t.includes('jump')&&S.settings.lowImpact)&&!(t.includes('bar')&&!S.settings.bar)&&!stressLv(id)}
// returns null when sore joints rule out every exercise
function makeGate(r,rk,o={}){
  const red=o.red??r()<(rk?.14:.08);
  const nEx=[3,3,4,4,5,5][rk],rounds=[2,3,3,4,4,5][rk];
  const baseR=[8,10,12,14,16,20][rk],baseT=[20,30,35,40,45,50][rk],rest=[45,40,35,30,30,25][rk];
  const cats=['push','legs','core','cardio','any'].slice(0,nEx),used=new Set(),exs=[];
  const everything=Object.values(POOL).flat();
  for(const c of cats){
    let opts=(c==='any'?everything:POOL[c]).filter(id=>allowed(id)&&!used.has(id));
    if(!opts.length) opts=everything.filter(id=>allowed(id)&&!used.has(id));
    if(!opts.length) continue;
    const id=pick(r,opts);used.add(id);exs.push(id);
  }
  if(!exs.length) return null;
  const dm=DIFF[S.settings.diff].gate*(red?1.15:1)*(o.trial?1.1:1),sets=[];
  for(let ro=0;ro<rounds;ro++) for(const id of exs){
    const e=EX[id];
    const target=e.type==='time'?Math.max(10,Math.round(baseT*dm*e.f/5)*5):Math.max(3,Math.round(baseR*e.f*dm));
    sets.push({ex:id,target,round:ro,hp:Math.round(target*e.xp*10*(rk+1))});
  }
  const secs=sets.reduce((a,s)=>a+(EX[s.ex].type==='time'?s.target:s.target*2.5),0)+rest*(sets.length-1)+20*(rounds-1);
  const mul=(red?1.5:1)*(o.trial?1.5:1);
  return {rank:rk,red,trial:!!o.trial,name:pick(r,PLACES),boss:pick(r,BOSSES[rk]),rounds,exs,sets,rest,
    est:Math.max(5,Math.round(secs/60)),xp:Math.round([60,120,200,320,500,800][rk]*mul),gold:Math.round([40,80,140,220,350,600][rk]*mul)};
}
// today's three gates; ones already cleared today stay cleared when the list is rebuilt
function genGates(k){
  const r=rng('gates'+k+S.created),base=S.player.rank,done=S.gates&&S.gates.date===k?(S.gates.done||[]):[];
  const ranks=[base,base,Math.min(5,base+1)];
  if(base>0&&r()<.3) ranks[0]=base-1;
  const list=ranks.map((rk,i)=>{const g=makeGate(r,rk);return g&&{...g,id:k+'-'+i}}).filter(g=>g&&!done.includes(g.id));
  S.gates={date:k,list,done};
}
// rebuild today's gates around sore joints (bought key gates keep their id and rank)
function regenGates(){
  if(!S.daily) return;
  const keys=S.gates.list.filter(g=>g.id[0]==='k');
  genGates(S.daily.date);
  for(const k of keys){const g=makeGate(rng(k.id+'|'+soreJoints().join()),k.rank,{red:k.red});if(g) S.gates.list.push({...g,id:k.id})}
  S.trial=null;
}
function addKeyGate(){
  const r=rng('key'+Date.now()+Math.random()),rk=Math.min(5,S.player.rank+(r()<.35?1:0)),g=makeGate(r,rk);
  if(!g) return false;
  S.gates.list.push({...g,id:'k'+Date.now()});
  return true;
}
function trialGate(){
  const p=S.player;if(p.rank>=5) return null;
  const nx=p.rank+1;if(p.level<RANKS[nx].min) return null;
  if(!S.trial||S.trial.rank!==nx){
    const g=makeGate(rng('trial'+nx+S.created),nx,{red:false,trial:true});
    if(!g) return null;
    S.trial={...g,id:'trial',name:`${RANKS[nx].id}-Rank Reassessment`,boss:TRIAL_BOSS[nx]};
  }
  return S.trial;
}
const findGate=id=>id==='trial'?trialGate():S.gates.list.find(g=>g.id===id);
const tgtLabel=s=>EX[s.ex].type==='time'?`${s.target} s`:`× ${s.target}`;
function enterGate(id){
  const g=findGate(id);if(!g) return;
  if(!g.trial){
    if(S.player.mp<10){notify({kind:'info',head:'Notification',lines:['[Not enough MP.]','Entering a gate costs 10 MP. MP refills at the daily reset, on level up, or with a Recovery Potion.']});return}
    S.player.mp-=10;
  }
  startSession(g);
  toast(g.trial?'The trial has begun.':'You have entered the gate.');
}
function startSession(g){
  const first=g.sets[0];
  S.session={gid:g.id,g:JSON.parse(JSON.stringify(g)),i:0,phase:'work',adj:first.target,left:first.target,run:false,prep:0,end:0,dealt:0,xp:0,t0:Date.now(),beep:0,confirm:false};
  UI.sheet=null;UI.screen={kind:'gate'};UI.hit=0;
  wake();Sfx.go();buzz(80);
  save();refresh();
}
// a recovery session is a gentle "gate": the region's moves in order, timed holds split per side, short rests
function recPlan(region){
  const R=REC_BY[region],sets=[];
  for(const id of R.sessionOrder){
    const m=R.moves.find(x=>x.id===id);if(!m) continue;
    for(let n=0;n<Math.max(1,m.sets||1);n++){
      if(m.perSide&&m.type==='time') for(const side of ['Left side','Right side']) sets.push({ex:id,target:m.target,round:0,hp:1,side});
      else sets.push({ex:id,target:m.target,round:0,hp:1,side:m.perSide?'Each side':''});
    }
  }
  const rest=12,secs=sets.reduce((a,s)=>a+(EX[s.ex].type==='time'?s.target:s.target*3*(s.side==='Each side'?2:1)),0)+rest*(sets.length-1);
  return {id:'rec-'+region,mode:'rec',region,rank:0,red:false,trial:false,name:R.name,boss:'',rounds:1,
    exs:[...new Set(sets.map(s=>s.ex))],sets,rest,est:Math.max(3,Math.round(secs/60)),xp:30,gold:0};
}
function enterRecovery(region){
  if(!REC_BY[region]) return;
  startSession(recPlan(region));
  toast('Recovery session started. Move gently.');
}
function sessSet(){const s=S.session;return s.g.sets[s.i]}
function completeSet(actual){
  const s=S.session,g=s.g,set=sessSet();
  actual=Math.max(0,Math.round(actual));
  const rec=doReps(set.ex,actual);
  s.xp+=rec.xp;
  if(g.mode==='rec'){UI.hit=0;Sfx.beep();buzz(30)}
  else{const dmg=Math.round(set.hp*Math.min(1.2,actual/set.target));s.dealt+=dmg;UI.hit=dmg;Sfx.hit();buzz([30,40,30])}
  if(s.i>=g.sets.length-1){g.mode==='rec'?finishRecovery():finishGate();return}
  const roundEnd=g.sets[s.i+1].round!==set.round;
  s.phase='rest';s.end=Date.now()+(g.rest+(roundEnd?20:0))*1000;s.beep=0;s.run=false;s.prep=0;
  save();refresh();
}
function nextSet(){
  const s=S.session;s.i++;
  const set=sessSet();
  Object.assign(s,{phase:'work',adj:set.target,left:set.target,run:false,prep:0,beep:0});
  UI.hit=0;Sfx.go();buzz(80);save();refresh();
}
function finishGate(){
  const s=S.session,g=s.g,p=S.player;
  const xpPreview=Math.round(g.xp*xpMult('gate')),gold=gainGold(g.gold);
  gainStats({per:12*(g.rank+1)});
  const loot=[],luck=clamp((stat('per')-10)*.004,0,.25);
  if(g.red){S.inv.box++;loot.push(['Random Box','×1'])}
  if(Math.random()<.25+luck){S.inv.box++;loot.push(['Random Box','×1'])}
  if(Math.random()<.08+luck/2){S.inv.key++;loot.push(['Instant Dungeon Key','×1'])}
  if(Math.random()<.12){S.inv.potion++;loot.push(['Recovery Potion','×1'])}
  S.totals.gates++;if(g.red) S.totals.red++;
  S.totals.maxGate=Math.max(S.totals.maxGate,g.rank);
  if(new Date().getHours()>=22) flag('nighthunter');
  if(g.trial) S.trial=null; else{S.gates.list=S.gates.list.filter(x=>x.id!==g.id);S.gates.done.push(g.id)}
  S.session=null;UI.screen=null;UI.hit=0;unwake();
  notify({kind:'quest',head:g.trial?'Trial Cleared':'Dungeon Cleared',lines:[`[${g.boss} has been defeated.]`,`Clear time ${mmss((Date.now()-s.t0)/1000)}`],
    rewards:[['XP from sets',`+${fmt(s.xp)}`],['Clear bonus',`+${fmt(xpPreview)} XP`],['Gold',`+${fmt(gold)}`],...loot]});
  gainXP(g.xp,'gate');
  if(g.trial){
    p.rank=Math.min(5,p.rank+1);
    const R=rankOf();
    notify({kind:'level',head:'Reassessment',big:`${R.id}-RANK`,lines:['[Your rank has been reassessed.]',`You are now a ${R.id}-Rank Hunter.`,`${R.id}-Rank gates will appear from the next reset.`]});
    if(p.rank===1&&!p.job) offerJob();
  }
  checkUnlocks();save();refresh();
}
function finishRecovery(){
  const s=S.session,g=s.g,p=S.player,d=S.daily;
  // the full bonus once per region per day; repeats still help but give less
  const first=!(d.recDone||[]).includes(g.region),base=first?g.xp:Math.round(g.xp/3);
  const xpPreview=Math.round(base*xpMult()),heal=Math.max(0,Math.min(maxHP()-p.hp,Math.round(maxHP()*.25)));
  p.hp+=heal;p.fatigue=Math.max(0,fatigue()-30);p.fatigueTs=Date.now();
  gainStats({vit:10,per:10});
  S.totals.rec++;d.recDone=[...(d.recDone||[]),g.region];
  S.session=null;UI.screen=null;UI.hit=0;unwake();
  notify({kind:'quest',head:'Recovery Complete',lines:[`[${g.name}: recovery session complete.]`,soreLv(g.region)?'Update your check-in in Recover when it feels better.':'Recovery done. Train smart tomorrow.'],
    rewards:[['XP from moves',`+${fmt(s.xp)}`],['Recovery bonus',`+${fmt(xpPreview)} XP`],['HP',`+${fmt(heal)}`],['Fatigue','−30']],foot:RECOVERY.painRule});
  gainXP(base);
  checkUnlocks();save();refresh();
}
function retreat(){
  const s=S.session;if(!s) return;
  if(s.g.mode==='rec'){
    S.session=null;UI.screen=null;unwake();
    toast('Session ended. Finished moves still count.');
    save();refresh();return;
  }
  let dmg=0;
  if(s.g.red){dmg=Math.round(maxHP()*.2);S.player.hp=Math.max(1,S.player.hp-dmg)}
  S.session=null;UI.screen=null;unwake();
  notify({kind:s.g.red?'penalty':'info',head:'Notification',lines:['[You have retreated from the gate.]','XP from finished sets is kept. The gate is still open.'],rewards:dmg?[['HP',`−${fmt(dmg)}`]]:null});
  save();refresh();
}
function offerJob(){
  const top=Object.entries(JOBS).sort((a,b)=>S.stats[b[1].stat].t-S.stats[a[1].stat].t)[0][0];
  notify({kind:'level',head:'Job Change',lines:['[You have qualified for a Job.]','Choose the path that matches your training. Your choice is permanent.'],
    choices:Object.entries(JOBS).map(([id,j])=>({id,name:j.name,desc:j.desc,rec:id===top})),onChoose:id=>{S.player.job=id;toast(`Job acquired: ${JOBS[id].name}`);save();refresh()}});
}

/* ---------- items ---------- */
function openBox(){
  const luck=clamp((stat('per')-10)*.004,0,.25),r=Math.random()*(1-luck);
  let got;
  if(r<.02){S.inv.elixir++;got=['Elixir of Growth','×1']}
  else if(r<.07){const k=pick(Math.random,STAT_KEYS);S.stats[k].t++;got=[`${STAT_INFO[k].name} crystal`,`${STAT_INFO[k].short} +1`]}
  else if(r<.15){S.inv.ward++;got=['Penalty Ward','×1']}
  else if(r<.26){S.inv.key++;got=['Instant Dungeon Key','×1']}
  else if(r<.42){S.inv.potion++;got=['Recovery Potion','×1']}
  else{const g=gainGold((60+Math.random()*180)*(1+S.player.rank*.5));got=['Gold',`+${fmt(g)}`]}
  notify({kind:'info',head:'Random Box',lines:['[You opened a Random Box.]','You have acquired:'],rewards:[got]});
}
function useItem(id){
  if(!S.inv[id]) return;
  S.inv[id]--;
  if(id==='box') openBox();
  else if(id==='potion'){recover();toast('HP and MP fully restored')}
  else if(id==='key'){
    if(addKeyGate()){UI.tab='gates';toast('A new gate has opened')}
    else{S.inv.key++;toast('Your sore joints rule out every gate exercise right now. The key is kept.','bad')}
  }
  else if(id==='elixir'){S.player.points++;toast('Ability point +1','stat')}
  save();refresh();
}
function buy(id){
  const it=ITEMS[id];if(!it||!it.price) return;
  if(S.player.gold<it.price){toast(`You need ${fmt(it.price-S.player.gold)} more gold`,'bad');return}
  S.player.gold-=it.price;S.inv[id]++;toast(`Purchased: ${it.name}`);save();refresh();
}
function skinAct(id){
  const sk=SKINS[id];if(!sk) return;
  if(!S.skins.includes(id)){
    if(S.player.gold<sk.price){toast(`You need ${fmt(sk.price-S.player.gold)} more gold`,'bad');return}
    S.player.gold-=sk.price;S.skins.push(id);
  }
  S.settings.skin=id;applySkin();save();refresh();
}
function applySkin(){
  const k=S.settings.skin;
  if(k&&k!=='blue') document.documentElement.dataset.skin=k; else delete document.documentElement.dataset.skin;
  FX.color();
}

/* ---------- run tracking ---------- */
let geoWatch=null;
function hav(a,b){const R=6371000,t=Math.PI/180,dLa=(b.la-a.la)*t,dLo=(b.lo-a.lo)*t;const s=Math.sin(dLa/2)**2+Math.cos(a.la*t)*Math.cos(b.la*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const runElapsed=()=>{const r=S.run;return r?r.el+(r.seg?Date.now()-r.seg:0):0};
function runStart(){
  if(!S.run) S.run={dist:0,el:0,seg:null,last:null,path:[],acc:null,started:Date.now(),ts:Date.now()};
  S.run.seg=Date.now();S.run.last=null;UI.confirmDiscard=false;
  startGeo();wake();Sfx.go();buzz(80);save();refresh();
}
function runPause(){
  const r=S.run;if(!r||!r.seg) return;
  r.el+=Date.now()-r.seg;r.seg=null;r.last=null;
  stopGeo();save();refresh();
}
function startGeo(){
  UI.geoErr='';
  if(!('geolocation' in navigator)){UI.geoErr='GPS is not available here. Use manual entry.';return}
  if(geoWatch!=null) return;
  geoWatch=navigator.geolocation.watchPosition(onPos,err=>{
    UI.geoErr=err.code===1?'Location permission denied. Allow it in your browser settings, or log the run manually.':'Waiting for a GPS signal…';
    runLive();
  },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function stopGeo(){if(geoWatch!=null&&navigator.geolocation) navigator.geolocation.clearWatch(geoWatch);geoWatch=null}
function onPos(pos){
  const r=S.run;if(!r) return;
  const {latitude:la,longitude:lo,accuracy:acc}=pos.coords;
  r.acc=Math.round(acc);UI.geoErr='';
  if(r.seg&&acc<=40){
    const pt={la,lo,t:pos.timestamp};
    if(!r.last){r.last=pt;r.path.push([la,lo])}
    else{
      const d=hav(r.last,pt),dt=(pt.t-r.last.t)/1000;
      if(!(dt>0&&d/dt>12)&&d>=Math.max(4,acc*.5)){
        r.dist+=d/1000;r.last=pt;r.path.push([la,lo]);
        if(r.path.length>3000) r.path=r.path.filter((_,i)=>i%2===0);
        r.ts=Date.now();save();
      }
    }
  }
  runLive();drawPath();
}
function runFinish(){
  const r=S.run;if(!r) return;
  const km=r2(r.dist),sec=runElapsed()/1000;
  if(km<0.01){toast('No distance recorded yet. Keep moving, or discard the run.','bad');return}
  stopGeo();unwake();S.run=null;UI.screen=null;
  logRun(km,sec);
}
function logRun(km,sec){
  const d=S.daily;
  if(km>=10&&taskEx('run')==='run') flag('windrunner');
  const xp=d&&d.targets.run!=null?logDaily('run',km,true):(()=>{const x=doReps('run',km).xp;checkUnlocks();return x})();
  notify({kind:'quest',head:'Run Complete',big:`${trim(toUser(km))} ${unit()}`,lines:sec?[`Time ${hms(sec*1000)}  ·  Pace ${paceStr(sec,km)} per ${unit()}`]:['Distance logged.'],rewards:[['XP',`+${fmt(xp)}`],['Training','AGI · VIT']]});
  save();refresh();
}

/* ---------- audio & haptics ---------- */
const Sfx={ctx:null,
  unlock(){if(this.ctx) {if(this.ctx.state==='suspended') this.ctx.resume();return}try{const C=window.AudioContext||window.webkitAudioContext;if(C) this.ctx=new C()}catch(e){}},
  t(f,d=.15,type='sine',v=.12,w=0,f2){
    if(!S.settings.sound) return;this.unlock();const c=this.ctx;if(!c) return;
    const t=c.currentTime+w,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
  },
  notify(){this.t(1318,.35,'sine',.08);this.t(1760,.55,'sine',.06,.09)},
  tick(){this.t(1200,.04,'square',.03)},
  beep(){this.t(1046,.12,'sine',.1)},
  go(){this.t(1568,.28,'sine',.11)},
  level(){[523,659,784,1046,1318].forEach((f,i)=>this.t(f,.32,'triangle',.08,i*.08))},
  clear(){[784,988,1175,1568].forEach((f,i)=>this.t(f,.6,'sine',.06,i*.06))},
  alarm(){for(let i=0;i<3;i++) this.t(240,.26,'sawtooth',.05,i*.32,170)},
  hit(){this.t(190,.18,'square',.06,0,60)},
};
function buzz(p){if(S.settings.haptics&&navigator.vibrate) try{navigator.vibrate(p)}catch(e){}}
let wakeLock=null;
async function wake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function unwake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}

/* ---------- notifications & toasts ---------- */
const NQ=[];let curN=null,nSeq=0,twTimer=0;
function notify(n){NQ.push({prio:1,...n,seq:nSeq++});if(!curN&&NQ.length===1) setTimeout(nextNotify,40)}
function nextNotify(){
  if(curN) return;
  NQ.sort((a,b)=>a.prio-b.prio||a.seq-b.seq);
  const n=NQ.shift();
  if(!n){$('#ntf').innerHTML='';return}
  curN=n;
  S.log.unshift({t:Date.now(),h:n.head,l:n.big&&n.kind!=='quest'?n.big:(n.lines||[])[0]||''});
  S.log.length=Math.min(S.log.length,60);save();
  const tone=n.kind==='penalty'?' tone-red':'';
  $('#ntf').innerHTML=`<div class="ntf-layer" data-a="ntfSkip"><div class="win ntf${tone}" role="alertdialog" aria-modal="true" aria-labelledby="ntf-t">
    <div class="win-head"><span class="win-ico">!</span><h2 class="win-ttl" id="ntf-t">${esc(n.head||'Notification')}</h2></div>
    ${n.big?`<div class="big">${esc(n.big)}</div>`:''}
    <div class="lines">${(n.lines||[]).map(l=>`<p data-tw="${esc(l)}"><span></span><span class="ghost">${esc(l)}</span></p>`).join('')}</div>
    ${n.rewards&&n.rewards.length?`<ul class="rewards">${n.rewards.map(([a,b])=>`<li><span>${esc(a)}</span><b>${esc(b)}</b></li>`).join('')}</ul>`:''}
    ${n.foot?`<p class="ntf-foot">${esc(n.foot)}</p>`:''}
    ${n.choices?`<div class="choices">${n.choices.map(c=>`<button class="choice" data-a="ntfChoose" data-x="${c.id}"><b>${esc(c.name)}</b><small>${esc(c.desc)}</small>${c.rec?'<span class="tag gold">Fits your training</span>':''}</button>`).join('')}</div>`
      :`<button class="btn pri block" data-a="ntfOk">${esc(n.btn||'Confirm')}</button>`}
  </div></div>`;
  typewrite($('#ntf'));
  Sfx[{penalty:'alarm',level:'level',quest:'clear'}[n.kind]||'notify']();
  buzz(n.kind==='penalty'?[120,80,120,80,200]:[40,40,40]);
  setTimeout(()=>{const b=$('#ntf .btn, #ntf .choice');b&&b.focus({preventScroll:true})},60);
}
function closeNotify(){const n=curN;curN=null;$('#ntf').innerHTML='';n&&n.onClose&&n.onClose();setTimeout(nextNotify,120)}
function typewrite(root){
  clearInterval(twTimer);
  const ps=$$('[data-tw]',root);
  const set=(p,c)=>{const full=p.dataset.tw;p.firstChild.textContent=full.slice(0,c);p.lastChild.textContent=full.slice(c)};
  if(reduceMotion){ps.forEach(p=>set(p,p.dataset.tw.length));return}
  let i=0,c=0;
  twTimer=setInterval(()=>{const p=ps[i];if(!p){clearInterval(twTimer);return}c+=2;set(p,c);if(c>=p.dataset.tw.length){i++;c=0}},16);
}
function twFinish(root){clearInterval(twTimer);$$('[data-tw]',root).forEach(p=>{p.firstChild.textContent=p.dataset.tw;p.lastChild.textContent=''})}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),2400)}

/* ---------- rendering ---------- */
const winHead=(t,i)=>`<div class="win-head">${i?`<span class="win-ico">${i}</span>`:''}<h2 class="win-ttl">${t}</h2></div>`;
function refresh(){
  const on=S.awakened;
  $('#app').hidden=!on;$('#tabs').hidden=!on;
  if(on){renderTop();$('#view').innerHTML=VIEWS[UI.tab]();renderTabs()}
  renderSheet();renderScreen();
  document.body.classList.toggle('locked',!!(UI.screen||UI.sheet));
}
function renderTop(){
  const p=S.player,R=rankOf(),need=xpNeed(p.level);
  $('#top').innerHTML=`<button class="lv" data-a="tab" data-x="status" aria-label="Level ${p.level}. Open status"><small>LV</small><b>${p.level}</b></button>
    <div class="who"><div class="who-n"><span class="rk rk-${R.id}" title="${R.id}-Rank">${R.id}</span><span class="nm">${esc(p.name)}</span>${weakened()?'<span class="tag red">Weakened</span>':soreJoints().length?'<span class="tag gold">Recovering</span>':''}</div>

function renderTabs(){
  const d=S.daily,dots={quest:(d&&!d.cleared&&!d.rest&&!d.heal)||weakened(),status:S.player.points>0,gates:!!trialGate(),
    recover:soreJoints().length>0&&!(d&&d.recDone&&d.recDone.length),items:S.inv.box>0,records:false};
  const tabs=[['quest','Quest'],['status','Status'],['gates','Gates'],['recover','Recover'],['items','Items'],['records','Records']];
  $('#tabs').innerHTML=`<div class="tabs-in">${tabs.map(([id,l])=>`<button class="tab${UI.tab===id?' on':''}" data-a="tab" data-x="${id}" ${UI.tab===id?'aria-current="page"':''}>${ico(id)}${l}${dots[id]?'<span class="dot" aria-label="needs attention"></span>':''}</button>`).join('')}</div>`;
}
function goalRow(act,x,name,val,tg,label,done){
  const p=tg?Math.min(1,val/tg):0;
  return `<li><button class="goal${done?' done':''}" data-a="${act}" data-x="${x}"><span class="g-name">${name}</span><span class="g-val">[${label}]</span><span class="chk">${done?ico('check'):''}</span><span class="g-bar" style="--p:${p}"></span></button></li>`;
}

/* quest tab */
function vQuest(){
  const d=S.daily;let h='';
  if(S.penalty) h+=penaltyWin();
  const ids=Object.keys(d.targets);
  const rows=ids.map(id=>{const v=d.prog[id],tg=d.targets[id],swapped=d.subs&&d.subs[id];
    return goalRow('task',id,`${taskName(id)}${swapped?' <span class="tag teal">Adapted</span>':''}`,v,tg,`${fmtTask(id,v)}/${fmtTask(id,tg)}${id==='run'?' '+unit():''}`,v>=tg-1e-6)}).join('');
  const sore=soreJoints();
  h+=`<section class="win">${winHead('Quest Info','!')}
    <p class="sys">${d.rest?'[Rest Day] The Daily Quest is optional today.':d.heal&&!d.cleared?'[Recovery Day] The System has eased today\'s quest.':'[Daily Quest: Strength Training has arrived.]'}</p>
    ${sore.length?`<p class="note" style="text-align:center;margin:-6px 0 12px">Status ailment: ${sore.map(AILMENT).join(', ')}. <button class="link" data-a="tab" data-x="recover">Recovery</button></p>`:''}

    ${d.cleared?`<div class="stamp">COMPLETE</div><p class="rw-line">Rewards received: Status Recovery · Ability points +3 · Random Box</p>`
      :`<p class="warn">${d.rest?'Clearing it anyway still adds to your streak.':d.heal?'No penalty today. Go easy, and do a recovery session for the joint that hurts.':d.grace?'<b>FIRST DAY:</b> No penalty yet. From tomorrow, failure will result in an appropriate <u>penalty</u>.':'<b>WARNING:</b> Failure to complete the daily quest will result in an appropriate <u>penalty</u>.'}</p>`}
    <div class="clock">${ico('clock')}<span data-live="reset">${hms(nextReset()-Date.now())}</span><small>until reset</small></div>
  </section>`;
  h+=`<section class="win">${winHead('Optional Quests')}<ul class="side">${d.side.map((q,i)=>{const s=SIDE_BY[q.id];return `<li><button class="side-q${q.done?' done':''}" data-a="side" data-x="${i}" aria-pressed="${q.done}"><span class="box">${q.done?ico('check'):''}</span><span class="side-n">${s.name}</span><span class="side-r">+${SIDE_XP} XP · ${STAT_INFO[s.stat].short}</span></button></li>`}).join('')}</ul>
    <p class="note">Tick these off yourself. Three new ones arrive at every reset.</p></section>`;

  h+=`<div class="quick"><button class="btn" data-a="runOpen" data-x="gps">${ico('run')}${S.run?`Run · ${trim(toUser(S.run.dist))} ${unit()}`:'Start a run'}</button>
    <button class="btn" data-a="tab" data-x="gates">${ico('gate')}Gates${open?` <span class="pill">${open}</span>`:''}</button></div>`;
  return h;
}

/* records tab */
function calendar(){
  const today=S.daily.date,start=addDays(today,-(11*7+keyDate(today).getDay()));
  let cells='';
  for(let i=0,k=start;i<84;i++,k=addDays(k,1)){

/* ---------- run canvas ---------- */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawPath(){
  const c=$('#run-map');if(!c) return;
  const x=c.getContext('2d'),W=c.width,H=c.height,pts=(S.run&&S.run.path)||[];
  x.clearRect(0,0,W,H);
  x.globalAlpha=.18;x.strokeStyle=cssVar('--line');x.lineWidth=1;
  for(let i=40;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let i=40;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
  x.globalAlpha=1;
  if(pts.length<2){x.fillStyle=cssVar('--dim');x.font='500 24px '+cssVar('--f-body');x.textAlign='center';x.fillText(pts.length?'Keep moving to draw your route':'Your route will appear here',W/2,H/2+8);return}
  const k=Math.cos(pts[0][0]*Math.PI/180),xs=pts.map(p=>p[1]*k),ys=pts.map(p=>-p[0]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-60)/(x1-x0||1e-9),(H-60)/(y1-y0||1e-9)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const P=i=>[ox+(xs[i]-x0)*sc,oy+(ys[i]-y0)*sc];
  x.strokeStyle=cssVar('--glow');x.lineWidth=5;x.lineJoin='round';x.lineCap='round';x.shadowColor=cssVar('--line');x.shadowBlur=14;
  x.beginPath();pts.forEach((_,i)=>{const[a,b]=P(i);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
  x.shadowBlur=0;const[ea,eb]=P(pts.length-1);x.fillStyle=cssVar('--ink');x.beginPath();x.arc(ea,eb,8,0,7);x.fill();
}
function runLive(){
  const r=S.run;if(!r||!UI.screen||UI.screen.kind!=='run') return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&e.textContent!==v) e.textContent=v};
  set('run-d',trim(Math.floor(toUser(r.dist)*100)/100));set('run-t',hms(runElapsed()));set('run-p',paceStr(runElapsed()/1000,r.dist));
  set('run-acc',UI.geoErr||(r.seg?(r.acc!=null?`±${r.acc} m`:'Searching…'):'Paused'));
}

/* ---------- background mana field ---------- */
const FX=(()=>{
  const c=$('#fx'),x=c.getContext('2d');let w=0,h=0,dpr=1,col='#9be3ff',last=0;
  const parts=Array.from({length:44},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,s:Math.random()*.00003+.00001,a:Math.random()*.5+.2,ph:Math.random()*6.28}));
  function size(){dpr=Math.min(2,devicePixelRatio||1);w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr}
  function draw(t){
    x.clearRect(0,0,w,h);x.fillStyle=col;
    for(const p of parts){
      x.globalAlpha=p.a*(.55+.45*Math.sin(t/1100+p.ph));
      x.beginPath();x.arc(p.x*w,p.y*h,p.r*dpr,0,7);x.fill();
      x.globalAlpha*=.15;x.beginPath();x.arc(p.x*w,p.y*h,p.r*dpr*5,0,7);x.fill();
    }
    x.globalAlpha=1;
  }
  function frame(t){
    if(!document.hidden&&t-last>40){const dt=Math.min(100,t-last);last=t;for(const p of parts){p.y-=p.s*dt;if(p.y<-.02){p.y=1.02;p.x=Math.random()}}draw(t)}
    requestAnimationFrame(frame);
  }
  return {start(){size();addEventListener('resize',()=>{size();draw(performance.now())});if(reduceMotion) draw(0); else requestAnimationFrame(frame)},color(){col=cssVar('--glow')||col;if(reduceMotion&&w) draw(0)}};
})();

  else{const t=S.penalty.tasks[x],left=Math.max(0,t.target-t.done);UI.sheet={kind:'counter',ctx,i:+x,n:left?Math.min(10,left):10,tone:true}}
}
function exportText(){return JSON.stringify(S)}
function importText(txt){
  let obj;
  try{obj=JSON.parse(txt)}catch(e){toast('That backup could not be read. Paste the full text, starting with {.','bad');return}
  if(!obj||typeof obj!=='object'||!obj.player||!obj.stats){toast('That text is not an Awaken backup.','bad');return}
  stopGeo();S=merge(freshState(),obj);S.session=null;S.run=null;
  // repair anything the rest of the app looks up by key
  const st=S.settings,valid=(id,arr)=>Array.isArray(arr)?arr.filter(x=>x in id):[];
  if(!DIFF[st.diff]) st.diff='normal';
  if(!['km','mi'].includes(st.units)) st.units='km';
  if(!SKINS[st.skin]) st.skin='blue';
  st.resetHour=clamp(Math.round(+st.resetHour)||0,0,6);
  st.restDays=Array.isArray(st.restDays)?st.restDays.map(Number).filter(n=>n>=0&&n<=6):[];
  S.titles=valid(TITLE_BY,S.titles);S.skills=valid(SKILL_BY,S.skills);S.skins=valid(SKINS,S.skins);
  if(!TITLE_BY[S.player.title]) S.player.title='awakened';
  if(S.player.job&&!JOBS[S.player.job]) S.player.job=null;
  S.player.rank=clamp(Math.round(+S.player.rank)||0,0,5);
  const okGate=g=>g&&Array.isArray(g.exs)&&Array.isArray(g.sets)&&g.exs.every(id=>EX[id])&&g.sets.every(x=>EX[x.ex])&&BOSSES[g.rank];
  S.gates.list=Array.isArray(S.gates.list)?S.gates.list.filter(okGate):[];
  if(S.trial&&!okGate(S.trial)) S.trial=null;
  if(S.penalty&&!(Array.isArray(S.penalty.tasks)&&S.penalty.tasks.every(t=>EX[t.ex]))) S.penalty=makePenalty();
  if(S.daily&&!(S.daily.targets&&S.daily.prog&&Array.isArray(S.daily.side)&&S.daily.side.every(q=>SIDE_BY[q.id]))) S.daily=null;
  const joints={};
  for(const j of JOINT_IDS){const v=S.joints&&S.joints[j];if(v&&(v.lv===1||v.lv===2)&&/^\d{4}-\d\d-\d\d$/.test(v.since)) joints[j]={lv:v.lv,since:v.since}}
  S.joints=joints;
  if(S.daily){
    const d=S.daily;
    d.subs=Object.fromEntries(Object.entries(d.subs||{}).filter(([t,id])=>DAILY_BY[t]&&EX[id]));
    d.rh=Array.isArray(d.rh)?d.rh.filter(q=>q&&REC_BY[q.r]&&REC_BY[q.r].habits.some(h=>h.id===q.id)):[];
    d.recDone=Array.isArray(d.recDone)?d.recDone.filter(id=>REC_BY[id]):[];
  }
  if(!Array.isArray(S.gates.done)) S.gates.done=[];
  UI.screen=null;UI.sheet=null;UI.tab='quest';
  applySkin();saveNow();
  if(S.awakened){rollover();announce()} else startAwakening();
  toast('Backup restored');refresh();
}

  retreatYes(){retreat()},
  runOpen(x){UI.runMode=x==='manual'?'manual':'gps';UI.sheet=null;UI.screen={kind:'run'};UI.confirmDiscard=false;if(S.run&&S.run.seg){startGeo();wake()}refresh()},
  runClose(){UI.screen=null;if(!(S.run&&S.run.seg)) unwake();refresh()},
  runMode(x){UI.runMode=x;refresh()},
  runStart(){runStart()},
  runPause(){runPause()},
  runFinish(){runFinish()},
  runDiscard(){UI.confirmDiscard=true;refresh()},
  runDiscardNo(){UI.confirmDiscard=false;refresh()},
  runDiscardYes(){stopGeo();unwake();S.run=null;UI.confirmDiscard=false;save();refresh()},
  runManual(){
    const v=parseFloat($('#man-d').value),mins=parseFloat($('#man-t').value)||0,km=r2(fromUser(v));
    if(!(km>0&&km<=100)){toast(`Enter a distance between 0.01 and ${S.settings.units==='mi'?62:100} ${unit()}.`,'bad');return}
    UI.screen=null;logRun(km,mins*60);
  },
  use(x){useItem(x)},
  buy(x){buy(x)},
  skin(x){skinAct(x)},
  ntfOk(){closeNotify()},
  ntfSkip(){twFinish($('#ntf'))},
  ntfChoose(x){const n=curN;n&&n.onChoose&&n.onChoose(x);closeNotify()},
  awAccept(){UI.aw.step=1;Sfx.notify();refresh();setTimeout(()=>{const i=$('#aw-name');i&&i.focus()},50)},
  awDecline(){UI.aw.declined=true;Sfx.alarm();buzz([100,60,100]);refresh()},
  awName(){const v=($('#aw-name').value||'').trim().slice(0,16);if(!v){toast('Enter a name to continue.','bad');return}UI.aw.name=v;UI.aw.step=2;refresh()},
  awStep(x){readAssess();const[k,d]=x.split(':');UI.aw.base[k]=clamp(UI.aw.base[k]+(+d),0,300);refresh()},
  awRun(x){readAssess();UI.aw.base.run=+x;refresh()},
  awUnits(x){readAssess();S.settings.units=x;refresh()},
  awAssess(){readAssess();UI.aw.step=3;refresh()},
  awCancel(){UI.screen={kind:'settings'};refresh()},
  awBack(){UI.aw.step=2;refresh()},
  awDiff(x){UI.aw.diff=x;refresh()},
  awRest(x){const a=UI.aw,i=+x;a.rest=a.rest.includes(i)?a.rest.filter(v=>v!==i):[...a.rest,i];if(a.rest.length>3){a.rest.shift();toast('Up to 3 rest days a week.')}refresh()},
  awBegin(){
    const a=UI.aw;
    S.baseline={...a.base};S.settings.diff=a.diff;S.settings.restDays=a.rest.slice().sort();
    if(a.recal){retarget();UI.screen={kind:'settings'};toast('Assessment saved. Today\'s goals updated.');save();refresh();return}
    S.player.name=a.name;S.awakened=true;S.created=Date.now();
    recover();newDay(dayKey(),true);
    UI.screen=null;UI.tab='quest';
    notify({kind:'info',head:'Notification',lines:['[Registration complete.]',`Welcome, Player ${a.name}.`,'The System will now assign your first Daily Quest.'],btn:'Continue'});
    announce();save();refresh();
  },
  setDiff(x){S.settings.diff=x;retarget();save();refresh()},
  setTask(x){const t=S.settings.tasks;if(t[x]&&Object.values(t).filter(Boolean).length===1){toast('Keep at least one goal in the Daily Quest.','bad');return}t[x]=!t[x];retarget();save();refresh()},
  setRest(x){const i=+x,r=S.settings.restDays;if(r.includes(i)) S.settings.restDays=r.filter(v=>v!==i); else{if(r.length>=3){toast('Up to 3 rest days a week.','bad');return}r.push(i);r.sort()}save();refresh()},
  setUnits(x){S.settings.units=x;save();refresh()},
  setTog(x){
    S.settings[x]=!S.settings[x];
    if(x==='sound'&&S.settings.sound) Sfx.notify();
    if(x==='badge'){
      lastSnap='';
      // iPhone and iPad only show web app badges after notification permission is granted
      if(S.settings.badge&&'Notification' in window&&Notification.permission==='default') try{Notification.requestPermission().then(()=>{lastSnap='';saveNow()},()=>{})}catch(e){}
    }
    save();refresh();
  },
  recal(){startAwakening(true);refresh()},
  install(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;refresh()})}},
  exportDl(){
    try{const b=new Blob([exportText()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`awaken-backup-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}
    catch(e){toast('Download is not available here. Use Copy text instead.','bad')}
  },
  exportCopy(){
    const txt=exportText();
    const fallback=()=>{const t=$('#imp-text');if(t){t.value=txt;t.focus();t.select()}toast('Copy the selected text from the box below.')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it somewhere safe.'),fallback)}catch(e){fallback()}
  },
  importPaste(){const v=($('#imp-text').value||'').trim();if(!v){toast('Paste a backup into the box first.','bad');return}importText(v)},
  resetAsk(){UI.confirmReset=true;refresh()},
  resetNo(){UI.confirmReset=false;refresh()},
  resetYes(){stopGeo();unwake();try{localStorage.removeItem(KEY)}catch(e){}S=freshState();UI.confirmReset=false;UI.sheet=null;UI.tab='quest';applySkin();startAwakening();refresh()},
};
const CHANGE={
  name(el){const v=el.value.trim().slice(0,16);if(v){S.player.name=v;save();renderTop()}else el.value=S.player.name},
  reset(el){
    S.settings.resetHour=+el.value;
    // moving the start of the day forward carries today's quest over instead of failing it
    const k=dayKey(),d=S.daily;
    if(d&&d.date<k){if(d.cleared){delete S.history[d.date];S.history[k]={s:'clear'}}d.date=k;S.gates.date=k}
    toast('New day start time saved');save();refresh();
  },
  importFile(el){const f=el.files&&el.files[0];if(!f) return;const rd=new FileReader();rd.onload=()=>importText(String(rd.result||''));rd.readAsText(f);el.value=''},
};
function padUpdate(){const t=UI.screen;const n=$('#pad-n'),b=$('#tap-log');if(n) n.textContent=t.n;if(b) b.textContent=`Log ${t.n}`}
function padHit(){
  const t=UI.screen;if(!t||t.kind!=='tap') return;
  t.n++;padUpdate();Sfx.tick();buzz(12);
  const p=$('#pad');if(p){p.classList.remove('hit');void p.offsetWidth;p.classList.add('hit')}
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a) return;
  const stop=e.target.closest('[data-stop]');if(stop&&!stop.contains(a)) return;
  if(a.id==='pad') return;
  const fn=ACT[a.dataset.a];if(fn) fn(a.dataset.x,a,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CHANGE[el.dataset.c]) CHANGE[el.dataset.c](el)});
document.addEventListener('pointerdown',e=>{Sfx.unlock();if(e.target.closest('#pad')){e.preventDefault();padHit()}},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(curN&&!curN.choices) closeNotify(); else if(UI.sheet) ACT.sheetClose(); else if(UI.screen&&['settings','run'].includes(UI.screen.kind)){UI.screen.kind==='run'?ACT.runClose():ACT.scrClose()}}
  if(UI.screen&&UI.screen.kind==='tap'&&(e.key===' '||e.key==='Enter')&&!e.repeat&&document.activeElement===$('#pad')){e.preventDefault();padHit()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saveNow();return}
  if(S.awakened&&rollover()){announce();save()}
  if(S.session||(S.run&&S.run.seg)||(UI.screen&&UI.screen.kind==='tap')) wake();
  refresh();
});
addEventListener('pagehide',saveNow);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.screen&&UI.screen.kind==='settings') refresh()});

/* ---------- clock ---------- */
function sessTick(){
  const s=S.session;if(!s) return;
  const now=Date.now(),view=UI.screen&&UI.screen.kind==='gate',set=t=>{if(!view) return;const e=$('#sess-t');if(e) e.textContent=t};
  const beep3=left=>{const c=Math.ceil(left);if(c<=3&&c>0&&c!==s.beep){s.beep=c;Sfx.beep();buzz(20)}};
  if(s.phase==='rest'){const left=(s.end-now)/1000;if(left<=0){nextSet();return}beep3(left);set(mmss(left))}
  else if(s.prep){const left=(s.prep-now)/1000;if(left<=0){s.prep=0;s.run=true;s.end=now+s.left*1000;s.beep=0;Sfx.go();buzz(60);save();refresh();return}beep3(left);set(String(Math.ceil(left)))}
  else if(s.run){const left=(s.end-now)/1000;if(left<=0){s.run=false;completeSet(sessSet().target);return}beep3(left);set(mmss(left))}
  if(view){const e=$('#sess-el');if(e) e.textContent=mmss((now-s.t0)/1000)}
}
function tick(){
  if(!S.awakened) return;
  if(rollover()){announce();save();refresh()}
  const t=hms(nextReset()-Date.now());
  $$('[data-live=reset]').forEach(e=>{if(e.textContent!==t) e.textContent=t});
  if(S.session) sessTick();
  if(S.run) runLive();
  if(UI.sheet&&UI.sheet.kind==='hold'){
    const secs=Math.floor(holdSecs()),e=$('#hold-t'),b=$('#hold-log');
    if(e) e.textContent=mmss(secs);
    if(b){b.textContent=`Log ${secs} s`;b.disabled=secs<1}
  }
}

/* ---------- outside the app: icon badge and widget data ---------- */
// The installed app's shortcuts and the Windows widget open ./?go=<tab> (or ?go=run)
function applyGo(go){
  if(!go||!S.awakened) return;
  if(VIEWS[go]){UI.tab=go;if(UI.screen&&UI.screen.kind!=='gate'&&UI.screen.kind!=='awaken') UI.screen=null;UI.sheet=null}
  if(go==='run'&&!S.session){UI.runMode='gps';UI.sheet=null;UI.screen={kind:'run'}}
}
function deepLink(){
  let go=null;
  try{go=new URLSearchParams(location.search).get('go');if(go) history.replaceState(null,'',location.pathname)}catch(e){}
  applyGo(go);
}
// Shared with the service worker, which can't read localStorage: a small snapshot in Cache Storage
const WIDGET_CACHE='awaken-widget',WIDGET_DATA='widgets/quest-data.json';
let lastSnap='';
function snapshot(){
  const d=S.daily,p=S.player,ids=Object.keys(d.targets);
  const goals=ids.map(id=>{const done=d.prog[id]>=d.targets[id]-1e-6,u=id==='run'?' '+unit():'';
    return {name:taskName(id),progress:`${fmtTask(id,Math.min(d.prog[id],d.targets[id]))} / ${fmtTask(id,d.targets[id])}${u}`,target:`0 / ${fmtTask(id,d.targets[id])}${u}`,done,mark:done?'✓':'○'}});
  const left=d.cleared?0:goals.filter(g=>!g.done).length,optional=!!(d.rest||d.heal);
  const status=S.penalty?'Penalty Quest active':d.cleared?'Daily Quest complete':d.heal?'Recovery day · no penalty':d.rest?'Rest day · optional':`${left} goal${left===1?'':'s'} left`;
  const h=S.settings.resetHour;
  return {name:p.name,level:p.level,rank:rankOf().id,streak:S.streak.cur,cleared:d.cleared,optional,penalty:!!S.penalty,left,status,goals,
    ailments:soreJoints().map(AILMENT).join(', '),resets:h?`Resets at ${h}:00 AM`:'Resets at midnight',date:d.date,resetHour:h,badge:!!S.settings.badge};
}
function syncOutside(){
  if(!S.awakened||!S.daily) return;
  const snap=snapshot(),json=JSON.stringify(snap);
  if(json===lastSnap) return;
  lastSnap=json;
  // icon badge: goals left on days the quest is required
  try{
    if(S.settings.badge&&'setAppBadge' in navigator&&snap.left&&!snap.optional) navigator.setAppBadge(snap.left).catch(()=>{});
    else if('clearAppBadge' in navigator) navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
  if(!('caches' in window)) return;
  caches.open(WIDGET_CACHE)
    .then(c=>c.put(new URL(WIDGET_DATA,location.href).href,new Response(json,{headers:{'content-type':'application/json'}})))
    .then(()=>{const sw=navigator.serviceWorker&&navigator.serviceWorker.controller;if(sw) sw.postMessage({type:'widgets-refresh'})})
    .catch(()=>{});
}

/* ---------- boot ---------- */
(function boot(){
  FX.start();applySkin();
  if(S.run&&S.run.seg){S.run.el+=Math.max(0,(S.run.ts||S.run.seg)-S.run.seg);S.run.seg=null;S.run.last=null}
  if(!S.awakened) startAwakening();
  else{
    rollover();
    // saves from before the recovery update have no recovery habits for the current day
    if(S.daily&&!Array.isArray(S.daily.rh)){S.daily.recDone=S.daily.recDone||[];syncRecHabits()}
    if(S.session) UI.screen={kind:'gate'};
    deepLink();
    announce();
    if(S.run) setTimeout(()=>toast(`Your run is paused at ${trim(toUser(S.run.dist))} ${unit()}. Open Run to resume.`),900);
  }
  saveNow();refresh();
  setInterval(tick,250);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // the Windows widget's buttons focus an open window and send it where to go
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='awaken:nav'){try{applyGo(new URL(e.data.url).searchParams.get('go'))}catch(err){}refresh()}
    });
    // installed Chromium apps: refresh the widget and badge after the daily reset even if the app stays closed
    navigator.serviceWorker.ready.then(reg=>reg.periodicSync&&reg.periodicSync.register('awaken-refresh',{minInterval:6*3600000})).catch(()=>{});
  }
})();
</script>
