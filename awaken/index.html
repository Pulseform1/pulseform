}
function merge(base,src){
  if(!src||typeof src!=='object') return base;
  for(const k of Object.keys(src)){
    const v=src[k],b=base[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&b&&typeof b==='object'&&!Array.isArray(b)) base[k]=merge(b,v);
    else base[k]=v;
  }
  return base;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw) return merge(freshState(),JSON.parse(raw))}catch(e){}return freshState()}
let S=load(),saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}
function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncOutside();remindSync();cloudSoon()}
const UI={tab:'quest',sheet:null,screen:null,aw:null,runMode:'gps',hit:0,confirmReset:false,confirmDiscard:false,geoErr:''};

/* ---------- time ---------- */
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKey=(t=Date.now())=>keyOf(new Date(t-S.settings.resetHour*3600000));
function keyDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(k,n){const d=keyDate(k);d.setDate(d.getDate()+n);return keyOf(d)}
function nextReset(){const now=new Date(),d=new Date(now);d.setHours(S.settings.resetHour,0,0,0);if(d<=now) d.setDate(d.getDate()+1);return d.getTime()}
const isRest=k=>S.settings.restDays.includes(keyDate(k).getDay());
function hms(ms){const s=Math.max(0,Math.floor(ms/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
function mmss(sec){sec=Math.max(0,Math.ceil(sec));return `${Math.floor(sec/60)}:${pad(sec%60)}`}
function clockTime(t){const d=new Date(t);return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

/* ---------- units ---------- */
const unit=()=>S.settings.units==='mi'?'mi':'km';
const toUser=km=>S.settings.units==='mi'?km*0.621371:km;
const fromUser=v=>S.settings.units==='mi'?v/0.621371:v;
// The run goal is a distance, unless a sore joint has swapped it for a walk measured in minutes
const walking=()=>!!(S.daily&&S.daily.targets.run!=null&&EX[taskEx('run')].type==='min');
function fmtTask(id,v){return id!=='run'?fmt(v):walking()?String(Math.floor(v)):trim(Math.floor(toUser(v)*100)/100)}
const taskSfx=id=>id!=='run'?'':walking()?' min':' '+unit();
const fmtAmt=(id,v)=>id!=='run'?String(v):walking()?`${Math.round(v)} min`:`${trim(toUser(v))} ${unit()}`;
function paceStr(sec,km){if(km<0.02||!sec) return '--';const p=sec/toUser(km);return `${Math.floor(p/60)}'${pad(Math.round(p%60))}"`}

/* ---------- derived numbers ---------- */
const stat=k=>10+S.stats[k].t+S.stats[k].a;
function bonus(key){
  let b=0;
  for(const id of S.skills){const d=SKILL_BY[id];if(d&&d.b[key]) b+=d.b[key]}
  const t=TITLE_BY[S.player.title];if(t&&t.b[key]) b+=t.b[key];
  const j=JOBS[S.player.job];if(j&&j.b[key]) b+=j.b[key];
  for(const id of Object.values(S.gear.eq)){const g=GEAR[id];if(g&&g.b[key]) b+=g.b[key]}
  return b+armyBonus(key);
}
function armyBonus(key){
  let b=0;
  for(const [id,v] of Object.entries(S.shadows)){const sh=SHADOWS[id];if(sh&&sh.key===key) b+=sh.v*(1+.5*((v.lv||1)-1))}
  return Math.min(ARMY_CAP,b);
}
function statBonus(kind){const k={str:'str',run:'agi',side:'int',gold:'per'}[kind];return k?clamp((stat(k)-10)*.005,0,.5):0}
const maxHP=()=>Math.round((100+stat('vit')*10)*(1+bonus('hp')));
const maxMP=()=>Math.round((50+stat('int')*5)*(1+bonus('mp')));
const weakened=()=>!!S.penalty&&!penaltyPaused();
function xpMult(kind){let m=(1+bonus('all')+(kind?bonus(kind)+statBonus(kind):0))*(kind==='gate'&&isEvent('dxp')?2:1);if(weakened()) m*=.5;return m}
const goldMult=()=>1+bonus('gold')+statBonus('gold');
const xpNeed=l=>Math.round(60*Math.pow(l,1.4)+40);
const rankOf=()=>RANKS[S.player.rank];
function fatigue(){const p=S.player,rate=bonus('regen')?8:4;return Math.max(0,Math.round(p.fatigue-(Date.now()-p.fatigueTs)/3600000*rate))}
function addFatigue(v){const p=S.player;p.fatigue=clamp(fatigue()+v,0,100);p.fatigueTs=Date.now()}
function bonusText(b){return Object.entries(b).map(([k,v])=>k==='guard'?`Penalty damage −${Math.round(v*100)}%`:k==='regen'?'Fatigue fades twice as fast':`+${Math.round(v*100)}% ${BONUS_LABEL[k]}`).join(' · ')||'No bonus'}

/* ---------- joint check-in ---------- */
const soreLv=j=>(S.joints[j]&&S.joints[j].lv)||0;
const soreJoints=()=>JOINT_IDS.filter(j=>soreLv(j)>0);
const maxSore=()=>Math.max(0,...JOINT_IDS.map(soreLv));
const stressLv=id=>Math.max(0,...(STRESS[id]||[]).map(soreLv));
// The Daily Quest only changes for joints the player allowed to adapt it. Gates and penalties always avoid sore joints.
const adaptLv=j=>S.joints[j]&&S.joints[j].adapt?soreLv(j):0;
const maxAdapt=()=>Math.max(0,...JOINT_IDS.map(adaptLv));
// the joint-friendly swap for a Daily Quest task, if a joint it covers is sore and allowed to adapt the quest
function subFor(task){
  for(const s of RECOVERY.dailySubs) if(s.task===task){const lv=Math.max(0,...s.joints.map(adaptLv));if(lv) return {id:s.altId,lv}}
  return null;
}
function todaysSubs(){const o={};for(const t of DAILY){const s=subFor(t.id);if(s) o[t.id]=s.id}return o}
const taskEx=id=>(S.daily&&S.daily.subs&&S.daily.subs[id])||DAILY_BY[id].ex;
const taskName=id=>EX[taskEx(id)].name;

/* ---------- daily targets ---------- */
function targetsWith(b,diff,level){
  const D=DIFF[diff];
  if(D.fixed) return {pushup:100,situp:100,squat:100,run:10};
  const m=D.mul,p=clamp((level-1)/(D.ramp-1),0,1);
  const st={pushup:clamp(r5(b.pushup*2*m),10,100),situp:clamp(r5(b.situp*2*m),10,100),squat:clamp(r5(b.squat*2*m),15,100),run:clamp(rHalf(b.run*.5*m),.5,10)};
  return {pushup:r5(st.pushup+(100-st.pushup)*p),situp:r5(st.situp+(100-st.situp)*p),squat:r5(st.squat+(100-st.squat)*p),run:rHalf(st.run+(10-st.run)*p)};
}
function todaysTargets(){
  const all=targetsWith(S.baseline,S.settings.diff,S.player.level),tg={};
  for(const t of DAILY) if(S.settings.tasks[t.id]){
    let v=all[t.id];
    const sub=subFor(t.id);
    // a walk replaces the run by time: 10 min per km of the run goal, up to 30 (an easy 10-20 min when the joint hurts)
    if(sub&&EX[sub.id].type==='min') v=sub.lv>=2?clamp(Math.round(v*5),10,20):clamp(Math.round(v*10),5,30);
    // a joint that hurts halves the other goals that load it (they are optional that day)
    else if(sub&&sub.lv>=2) v=t.id==='run'?Math.max(.5,rHalf(v/2)):Math.max(5,r5(v/2));
    tg[t.id]=v;
  }
  return tg;
}
const runUnit=()=>{const s=subFor('run');return s&&EX[s.id].type==='min'?'min':'km'};
function retarget(){
  const d=S.daily;if(!d||d.cleared) return;
  d.targets=todaysTargets();d.subs=todaysSubs();d.heal=maxAdapt()>=2;
  for(const id in d.targets) if(d.prog[id]==null) d.prog[id]=0;
  // switching between running and walking mid-day: carry progress over at 10 minutes per km
  // saves from before the walk swap have no unit recorded; their run progress is always km
  const u=runUnit(),was=d.runUnit||'km';
  if(was!==u){
    const f=u==='min'?10:.1;
    d.prog.run=r2((d.prog.run||0)*f);
    for(const s of d.sets) if(s.task==='run') s.pn=r2((s.pn??s.n)*f);
  }
  d.runUnit=u;
  checkDaily();
}

/* ---------- gains ---------- */
function gainXP(base,kind){
  const p=S.player,amt=Math.max(0,Math.round(base*xpMult(kind)));
  if(!amt) return 0;
  p.xp+=amt;
  let ups=0;
  while(p.xp>=xpNeed(p.level)){p.xp-=xpNeed(p.level);p.level++;ups++;p.points+=3}
  if(ups) onLevelUp(ups);
  return amt;
}
function onLevelUp(n){
  recover();
  const p=S.player,lines=[`You have reached Level ${p.level}.`,'HP and MP fully restored.'];
  const nx=RANKS[p.rank+1];
  if(nx&&p.level>=nx.min&&p.level-n<nx.min) lines.push(`[A ${nx.id}-Rank Reassessment Trial is now available.]`);
  notify({kind:'level',head:'Level Up',big:`LV. ${p.level}`,lines,rewards:[['Ability points',`+${3*n}`]],prio:2});
  checkUnlocks();
}
function gainGold(base){const g=Math.round(base*goldMult());S.player.gold+=g;return g}
function gainStats(map){
  const ups={};
  for(const k in map){const s=S.stats[k];s.x+=map[k];while(s.x>=100){s.x-=100;s.t++;ups[k]=(ups[k]||0)+1}}
  const msg=Object.entries(ups).map(([k,n])=>`${STAT_INFO[k].short} +${n}`).join('   ');
  if(msg) toast(msg,'stat');
}
function recover(){const p=S.player;p.hp=maxHP();p.mp=maxMP();p.fatigue=0;p.fatigueTs=Date.now()}
function doReps(id,n){
  const e=EX[id];n=+n||0;
  if(n<=0) return {xp:0,st:{}};
  const xp=gainXP(e.xp*n,e.kind),st={};
  for(const k in e.stat) st[k]=e.stat[k]*n;
  gainStats(st);
  S.totals.ex[id]=r2((S.totals.ex[id]||0)+n);
  if(track(id,n)&&e.kind!=='rec') setTimeout(()=>toast(`New personal best: ${e.name} ${pbFmt(id,n)}`,'stat'),700);
  if(e.kind!=='rec') addFatigue(e.type==='km'?n*4:e.type==='time'?n*.04:n*.08*e.xp);
  return {xp,st};
}
function flag(k){S.flags[k]=true}
function checkUnlocks(){
  for(const t of TITLES) if(!S.titles.includes(t.id)&&t.ok()){
    S.titles.push(t.id);
    notify({kind:'info',head:'Title Acquired',big:t.name,lines:[`[You have acquired the title "${t.name}".]`],rewards:[['Effect when equipped',bonusText(t.b)]],foot:'Equip titles from the Status window.',prio:3});
  }
  for(const s of SKILLS) if(!S.skills.includes(s.id)&&s.ok()){
    S.skills.push(s.id);
    notify({kind:'info',head:'Skill Acquired',big:s.name,lines:[`[You have learned the passive skill "${s.name}".]`],rewards:[['Effect',bonusText(s.b)]],prio:3});
  }
}

/* ---------- day cycle ---------- */
function pickSide(k){return shuffle(rng('side'+k+S.created),SIDE).slice(0,SIDE_PER_DAY).map(s=>({id:s.id,done:false,xp:0}))}
function newDay(k,first){
  const tg=todaysTargets(),prog={};
  for(const id in tg) prog[id]=0;
  // the awakening day is always a real quest, but missing it carries no penalty.
  // heal: a joint hurts, so the day is penalty-free.
  S.daily={date:k,targets:tg,prog,sets:[],rest:!first&&isRest(k),grace:!!first,heal:maxAdapt()>=2,subs:todaysSubs(),runUnit:runUnit(),cleared:false,side:pickSide(k),rh:[],recDone:[],announced:false};
  syncRecHabits();
  S.player.mp=maxMP();
  S.player.hp=Math.min(maxHP(),S.player.hp+Math.round(maxHP()*.2));
  genGates(k);
  ensurePeriods(k);pruneDays(k);
}
// recovery habits for the day: two per sore joint (one each when many are sore), topped up with general ones
function recHabitPool(){
  const js=soreJoints(),r=rng('rh'+S.daily.date+S.created),out=[];
  for(const j of js) shuffle(r,REC_BY[j].habits).slice(0,js.length>2?1:2).forEach(h=>out.push({r:j,id:h.id}));
  if(out.length<4) shuffle(r,REC_BY.general.habits).slice(0,4-out.length).forEach(h=>out.push({r:'general',id:h.id}));
  return out.slice(0,4);
}
function syncRecHabits(){
  const d=S.daily;if(!d) return;
  const old=d.rh||[],same=(a,b)=>a.r===b.r&&a.id===b.id;
  d.rh=recHabitPool().map(h=>old.find(o=>same(o,h))||{...h,done:false,xp:0});
  // habits already ticked today stay, even if their joint has recovered
  for(const o of old) if(o.done&&!d.rh.some(h=>same(h,o))) d.rh.push(o);
}
const recHabit=q=>(REC_BY[q.r]&&REC_BY[q.r].habits.find(h=>h.id===q.id))||{text:'',why:''};
function rollover(){
  const today=dayKey();
  // same day, or the clock moved backwards (time zone travel, clock change): keep the current quest
  if(S.daily&&S.daily.date>=today) return false;
  if(S.daily){
    const d=S.daily,missed=[];
    if(!d.cleared) missed.push({k:d.date,rest:d.rest||d.grace||d.heal});
    for(let k=addDays(d.date,1),n=0;k<today&&n<400;k=addDays(k,1),n++) missed.push({k,rest:isRest(k)||maxAdapt()>=2});
    const need=missed.filter(m=>!m.rest);
    missed.filter(m=>m.rest).forEach(m=>S.history[m.k]={s:'rest'});
    if(need.length){
      const fz=S.streak.freeze||0;
      if(fz+S.inv.ward>=need.length){
        // Streak Freezes are used before Penalty Wards
        const nf=Math.min(fz,need.length),nw=need.length-nf;
        S.streak.freeze=fz-nf;S.inv.ward-=nw;
        need.forEach((m,i)=>S.history[m.k]={s:i<nf?'freeze':'ward'});
        const what=[nf&&(nf>1?`${nf} Streak Freezes`:'A Streak Freeze'),nw&&(nw>1?`${nw} Penalty Wards`:'A Penalty Ward')].filter(Boolean).join(' and ');
        notify({kind:'info',head:'Notification',lines:[`[${what} ${nf+nw>1?'were':'was'} used.]`,need.length>1?`You were protected through ${need.length} missed Daily Quests.`:'You were protected from the penalty for a missed Daily Quest.','Your streak is safe.']});
      } else {
        need.forEach(m=>S.history[m.k]={s:'fail'});
        S.streak.cur=0;
        const dmg=Math.round(maxHP()*.3*(1-Math.min(.75,bonus('guard'))));
        S.player.hp=Math.max(1,S.player.hp-dmg);
        if(!S.penalty) S.penalty=makePenalty();
        notify({kind:'penalty',head:'Warning',lines:[need.length>1?`[You missed ${need.length} Daily Quests.]`:'[You did not complete the Daily Quest.]','You have been sent to the Penalty Zone.','Debuff applied: Weakened. All XP is halved until you survive the Penalty Quest.'],rewards:[['HP',`−${fmt(dmg)}`],['Streak','Reset to 0']]});
      }
    }
  }
  expireJoints(today);
  newDay(today);
  return true;
}
function announce(){
  const d=S.daily;if(!d||d.announced) return;
  d.announced=true;
  const hj=d.heal&&hurting()[0];
  const goals=Object.keys(d.targets).map(id=>[taskName(id),`${fmtTask(id,d.targets[id])}${taskSfx(id)}${hj?' · optional':''}`]);
  if(hj) goals.unshift(['Recovery session',REC_BY[hj].name]);
  const lines=d.rest?['[Today is a rest day.]','The Daily Quest is optional. Clearing it still counts toward your streak.']
    :hj?['[Recovery day.]','Recovery comes first: finish your recovery session to clear the Daily Quest. Everything else is optional, and there is no penalty today.']
    :['[Daily Quest: Strength Training has arrived.]','Complete every goal before the day resets.'];
  if(soreJoints().length) lines.push(`Status ailments: ${soreJoints().map(AILMENT).join(', ')}. Still sore? Update your check-in in Recover.`);
  for(const j of soreJoints()) if(needsCheck(j)) lines.push(`Time to get your ${REC_BY[j].name.toLowerCase()} checked by a physio or doctor.`);
  const ev=eventOn();if(ev) lines.push(`Event: ${ev.name}. ${ev.desc}`);
  if(retestDue()) lines.push('[A Reassessment Test is ready.] Four weeks have passed. Take it from the Quest tab.');
  notify({kind:'quest',head:'Quest Info',lines,rewards:goals,foot:d.rest||d.heal?'':d.grace?'First day: no penalty yet. From tomorrow, failure will result in an appropriate penalty.':'Failure to complete the Daily Quest will result in an appropriate penalty.',btn:'Accept'});
  loginReward();
  save();
}

/* ---------- daily quest ---------- */
function logDaily(task,n,quiet){
  const d=S.daily;n=task==='run'?r2(n):Math.round(n);
  if(!d||n<=0) return 0;
  const exId=taskEx(task),rec=doReps(exId,n);
  if(d.targets[task]!=null){
    d.prog[task]=r2(d.prog[task]+n);
    d.sets.push({task,ex:exId,n,xp:rec.xp,st:rec.st});
    // the titles are for the real thing, not the joint-friendly swap
    if(task==='pushup'&&exId==='pushup'&&d.prog.pushup>=100) flag('centurion');
    if(task==='run'&&exId==='run'&&d.prog.run>=10) flag('windrunner');
  }
  if(!quiet) toast(`${EX[exId].name} +${fmtAmt(task,n)}  ·  +${rec.xp} XP`);
  checkDaily();checkUnlocks();save();refresh();
  return rec.xp;
}
function undoDaily(task){
  const d=S.daily;if(!d||d.cleared) return;
  let i=-1;for(let j=d.sets.length-1;j>=0;j--) if(d.sets[j].task===task){i=j;break}
  if(i<0) return;
  const s=d.sets.splice(i,1)[0],exId=s.ex||DAILY_BY[task].ex;
  d.prog[task]=Math.max(0,r2(d.prog[task]-(s.pn??s.n)));
  S.player.xp=Math.max(0,S.player.xp-s.xp);
  for(const k in s.st){const st=S.stats[k];st.x-=s.st[k];while(st.x<0&&st.t>0){st.x+=100;st.t--}if(st.x<0) st.x=0}
  S.totals.ex[exId]=Math.max(0,r2((S.totals.ex[exId]||0)-s.n));
  untrack(exId,s.n);
  toast(`Removed the last set (${fmtAmt(task,s.pn??s.n)})`);
  save();refresh();
}
function checkDaily(){
  const d=S.daily;if(!d||d.cleared||d.heal) return;
  const ids=Object.keys(d.targets);
  if(ids.length&&ids.every(id=>d.prog[id]>=d.targets[id]-1e-6)) clearDaily();
}
function clearDaily(){
  const d=S.daily,p=S.player;
  d.cleared=true;d.clearedAt=Date.now();
  S.history[d.date]={s:'clear'};
  S.streak.cur++;S.streak.best=Math.max(S.streak.best,S.streak.cur);
  S.totals.clears++;
  if(S.settings.diff==='hunter') flag('limitless');
  if(new Date().getHours()<8) flag('earlybird');
  const base=40+8*p.level,xpPreview=Math.round(base*xpMult()),gold=gainGold(30+3*p.level);
  p.points+=3;S.inv.box++;
  // every 7 days in a row earns a Streak Freeze (hold up to 2)
  const freeze=S.streak.cur%7===0&&(S.streak.freeze||0)<FREEZE_MAX;if(freeze) S.streak.freeze=(S.streak.freeze||0)+1;
  recover();
  notify({kind:'quest',head:'Quest Complete',lines:['[You have completed the Daily Quest: Strength Training.]','Rewards have been distributed.'],
    rewards:[['Status Recovery','HP · MP · Fatigue'],['Ability points','+3'],['Random Box','×1'],['XP',`+${fmt(xpPreview)}`],['Gold',`+${fmt(gold)}`],...(freeze?[['Streak Freeze','×1']]:[])],
    foot:`Streak: ${S.streak.cur} day${S.streak.cur===1?'':'s'}`});
  gainXP(base);
  checkUnlocks();
}
function toggleSide(i){
  const d=S.daily,q=d&&d.side[i];if(!q) return;
  const s=SIDE_BY[q.id];
  if(!q.done){
    q.done=true;q.xp=gainXP(SIDE_XP,'side');
    gainStats({[s.stat]:25});S.totals.side++;
    toast(`+${q.xp} XP  ·  ${STAT_INFO[s.stat].short} training`);
  } else {
    q.done=false;S.player.xp=Math.max(0,S.player.xp-q.xp);
    const st=S.stats[s.stat];st.x-=25;while(st.x<0&&st.t>0){st.x+=100;st.t--}if(st.x<0) st.x=0;
    S.totals.side=Math.max(0,S.totals.side-1);q.xp=0;
  }
  // clearing every optional quest of the day pays a one-time bonus
  if(!d.sideFull&&d.side.length>=SIDE_PER_DAY&&d.side.every(x=>x.done)){
    d.sideFull=true;gainGold(SIDE_FULL.gold);
    notify({kind:'quest',head:'Full Discipline',lines:['[All optional quests cleared.]','Discipline is a stat too.'],rewards:[['XP',`+${fmt(Math.round(SIDE_FULL.xp*xpMult('side')))}`],['Gold',`+${SIDE_FULL.gold}`]]});
    gainXP(SIDE_FULL.xp,'side');
  }
  checkUnlocks();save();refresh();
}
// once a day, swap one unticked optional quest for a new one
function rerollSide(i){
  const d=S.daily,q=d&&d.side[i];if(!q||q.done||d.sideReroll) return;
  const used=new Set(d.side.map(x=>x.id)),opts=SIDE.filter(x=>!used.has(x.id));
  if(!opts.length) return;
  d.side[i]={id:pick(rng('reroll'+d.date+S.created),opts).id,done:false,xp:0};d.sideReroll=true;
  toast('Optional quest swapped');save();refresh();
}

/* ---------- weekly & monthly quests ---------- */
// progress is measured against a snapshot of the totals taken when the period starts
const sumEx=ids=>ids.reduce((a,id)=>a+ex(id),0);
const METRIC={
  clears:()=>S.totals.clears,gates:()=>S.totals.gates,red:()=>S.totals.red,side:()=>S.totals.side,
  rec:()=>S.totals.rec+S.totals.recHabits,
  push:()=>sumEx(['pushup','diamond','pike','wallpush']),core:()=>sumEx(['situp','crunch','legraise','superman','deadbug']),
  legs:()=>sumEx(['squat','glute','lunge','jumpsquat']),dist:()=>ex('run')+ex('walk')/10,
};
const qTarget=id=>(S.daily&&S.daily.targets[id]!=null&&taskEx(id)===DAILY_BY[id].ex?S.daily.targets[id]:null)??targetsWith(S.baseline,S.settings.diff,S.player.level)[id];
const distName=n=>`Run ${trim(toUser(n))} ${unit()} (10 walking minutes count as 1 km)`;
const PQ={
  w:[{id:'clears',t:()=>5,name:n=>`Clear the Daily Quest ${n} times`},
    {id:'gates',t:()=>3,name:n=>`Clear ${n} gates`},
    {id:'side',t:()=>12,name:n=>`Finish ${n} optional quests`},
    {id:'push',task:'pushup',t:()=>r5(qTarget('pushup')*5),name:n=>`Do ${n} push-ups (any kind)`},
    {id:'core',task:'situp',t:()=>r5(qTarget('situp')*5),name:n=>`Do ${n} sit-ups or crunches`},
    {id:'legs',task:'squat',t:()=>r5(qTarget('squat')*5),name:n=>`Do ${n} squats or bridges`},
    {id:'dist',task:'run',t:()=>Math.max(2,Math.round(qTarget('run')*4)),name:distName}],
  m:[{id:'clears',t:()=>20,name:n=>`Clear the Daily Quest ${n} times`},
    {id:'gates',t:()=>12,name:n=>`Clear ${n} gates`},
    {id:'red',t:()=>2,name:n=>`Clear ${n} Red Gates`},
    {id:'side',t:()=>45,name:n=>`Finish ${n} optional quests`},
    {id:'push',task:'pushup',t:()=>r5(qTarget('pushup')*18),name:n=>`Do ${n} push-ups (any kind)`},
    {id:'legs',task:'squat',t:()=>r5(qTarget('squat')*18),name:n=>`Do ${n} squats or bridges`},
    {id:'dist',task:'run',t:()=>Math.max(5,Math.round(qTarget('run')*15)),name:distName},
    {id:'rec',t:()=>8,name:n=>`Do ${n} recovery sessions or habits`}],
};
const PQ_INFO={w:{name:'Weekly Quests',bonus:[['box',2],['key',1]]},m:{name:'Monthly Quests',bonus:[['elixir',1],['ward',1]]}};
const pqReward=kind=>kind==='w'?{xp:120+10*S.player.level,gold:100+10*S.player.level}:{xp:400+30*S.player.level,gold:300+30*S.player.level};
const weekKey=k=>addDays(k,-((keyDate(k).getDay()+6)%7));
const periodKey=(kind,k)=>kind==='w'?weekKey(k):k.slice(0,7)+'-01';
function periodEnd(kind,key){if(kind==='w') return addDays(key,7);const d=keyDate(key);d.setMonth(d.getMonth()+1,1);return keyOf(d)}
function ensurePeriods(k){
  for(const kind of ['w','m']){
    const key=periodKey(kind,k),cur=S.periods[kind];
    if(cur&&cur.key===key) continue;
    // a finished quest left unclaimed when the period ends is paid out, not lost
    if(cur) cur.list.forEach((q,i)=>{if(!q.claimed&&pqProg(q)>=q.target) claimPQ(kind,i,true)});
    const r=rng(kind+key+S.created),pool=PQ[kind].filter(q=>!q.task||S.settings.tasks[q.task]);
    S.periods[kind]={key,bonus:false,list:shuffle(r,pool).slice(0,3).map(q=>({id:q.id,target:q.t(),base:METRIC[q.id](),claimed:false}))};
  }
}
const pqDef=(kind,q)=>PQ[kind].find(x=>x.id===q.id);
const pqProg=q=>Math.max(0,METRIC[q.id]()-q.base);
function claimPQ(kind,i,quiet){
  const P=S.periods[kind],q=P&&P.list[i];if(!q||q.claimed||pqProg(q)<q.target) return;
  q.claimed=true;const rw=pqReward(kind),gold=gainGold(rw.gold),xpPreview=Math.round(rw.xp*xpMult());
  const rewards=[['XP',`+${fmt(xpPreview)}`],['Gold',`+${fmt(gold)}`]];
  if(!P.bonus&&P.list.every(x=>x.claimed)){
    P.bonus=true;flag(kind==='w'?'weekall':'monthall');
    for(const [id,n] of PQ_INFO[kind].bonus){S.inv[id]+=n;rewards.push([ITEMS[id].name,'×'+n])}
  }
  if(!quiet){Sfx.clear();notify({kind:'quest',head:'Quest Complete',lines:[`[${PQ_INFO[kind].name.slice(0,-1)}: ${pqDef(kind,q).name(q.target)}]`,'Rewards have been distributed.'],rewards})}
  gainXP(rw.xp);
  checkUnlocks();save();refresh();
}

/* ---------- login rewards & events ---------- */
const LOGIN=[['gold',50],['potion',1],['gold',100],['box',1],['scroll',1],['gold',200],['key',1]];
const loginName=([id,n])=>id==='gold'?['Gold',`+${n}`]:[ITEMS[id].name,'×'+n];
function loginReward(){
  const k=S.daily&&S.daily.date;if(!k||S.login.last===k) return;
  const i=S.login.n%LOGIN.length,[id,n]=LOGIN[i];
  S.login.last=k;S.login.n++;
  if(id==='gold') S.player.gold+=n; else S.inv[id]+=n;
  notify({kind:'info',head:'Login Reward',big:`DAY ${i+1}`,lines:['[You have logged in today.]',i===LOGIN.length-1?'The cycle is complete. It starts again tomorrow.':'Log in every day to work through the cycle.'],
    rewards:[loginName(LOGIN[i])],foot:`Tomorrow: ${loginName(LOGIN[(i+1)%LOGIN.length]).join(' ')}`,prio:0});
}
// days 1-7 of each month are Red Gate Week; Saturdays and Sundays double gate clear XP
function eventOn(k){
  k=k||(S.daily&&S.daily.date)||dayKey();const d=keyDate(k);
  if(d.getDate()<=7) return {id:'red',name:'Red Gate Week',desc:'One of today\'s gates is a Red Gate, and Red Gates drop an extra Random Box.'};
  if(d.getDay()===0||d.getDay()===6) return {id:'dxp',name:'Double XP Weekend',desc:'Gate clear XP is doubled.'};
  return null;
}
const isEvent=id=>{const e=eventOn();return !!e&&e.id===id};

/* ---------- personal bests, daily volume & re-tests ---------- */
// per-day volume powers the progress chart; a "set" is one logged amount (a gate set, a counter entry, one run)
function track(id,n){
  const k=S.daily?S.daily.date:dayKey(),d=S.days[k]||(S.days[k]={});
  d[id]=r2((d[id]||0)+n);
  const pb=S.pb[id]||(S.pb[id]={set:0,day:0,prev:0}),beat=pb.set>0&&n>pb.set;
  if(n>pb.set){pb.prev=pb.set;pb.set=r2(n)}
  if(d[id]>pb.day) pb.day=d[id];
  return beat;
}
function untrack(id,n){
  const k=S.daily?S.daily.date:dayKey(),d=S.days[k],pb=S.pb[id];
  if(d&&d[id]!=null){const was=d[id];d[id]=Math.max(0,r2(d[id]-n));if(pb&&pb.day===was) pb.day=Math.max(d[id],...Object.entries(S.days).filter(([x])=>x!==k).map(([,v])=>v[id]||0))}
  if(pb&&pb.set===r2(n)){pb.set=pb.prev||0;pb.prev=0}
}
function pruneDays(k){const old=addDays(k,-400);for(const x of Object.keys(S.days)) if(x<old) delete S.days[x]}
const pbFmt=(id,v)=>EX[id].type==='km'?`${trim(toUser(v))} ${unit()}`:EX[id].type==='time'?`${Math.round(v)} s`:EX[id].type==='min'?`${Math.round(v)} min`:`× ${fmt(v)}`;
const TEST_EVERY=28;
const lastTest=()=>S.tests[S.tests.length-1];
const retestDue=()=>!!(S.daily&&lastTest()&&daysBetween(lastTest().date,S.daily.date)>=TEST_EVERY);
function startRetest(){
  const t=lastTest()||S.baseline;
  UI.aw={step:2,declined:false,name:S.player.name,base:{pushup:t.pushup,situp:t.situp,squat:t.squat,run:t.run},diff:S.settings.diff,rest:[...S.settings.restDays],recal:true,retest:true};
  UI.screen={kind:'awaken'};UI.sheet=null;refresh();
}
function finishRetest(){
  const a=UI.aw,prev=lastTest(),first=S.tests[0],cur={date:S.daily.date,...a.base};
  S.tests.push(cur);if(S.tests.length>60) S.tests.splice(1,1);
  S.baseline={...a.base};retarget();
  UI.screen=null;UI.aw=null;
  const unitOf=k=>k==='run'?` ${unit()}`:'',show=(k,v)=>k==='run'?trim(toUser(v)):v;
  const rows=['pushup','situp','squat','run'].map(k=>{const d=r2(cur[k]-prev[k]);return [DAILY_BY[k].name,`${show(k,prev[k])} → ${show(k,cur[k])}${unitOf(k)}${d?` (${d>0?'+':''}${k==='run'?trim(toUser(d)):d})`:''}`]});
  const better=['pushup','situp','squat','run'].some(k=>cur[k]>first[k]);
  if(better) flag('stronger');
  const xp=100+10*S.player.level,gold=gainGold(100);
  notify({kind:'level',head:'Reassessment',big:better?'STRONGER':'MEASURED',lines:['[Test results recorded.]',better?'You are stronger than when you awakened.':'Progress takes time. The System will test you again in four weeks.','Today\'s goals have been updated to match.'],
    rewards:[...rows,['XP',`+${fmt(Math.round(xp*xpMult()))}`],['Gold',`+${fmt(gold)}`]]});
  gainXP(xp);checkUnlocks();save();refresh();
}

/* ---------- shadow summons ---------- */
// one shadow per gate: it strikes the boss and raises that gate's clear rewards
const summonPct=id=>({Normal:10,Elite:15,Knight:20}[SHADOWS[id].grade]||10)+5*((S.shadows[id]||{lv:1}).lv-1);
function summonShadow(id){
  const s=S.session;if(!s||s.g.mode==='rec'||s.summon||!S.shadows[id]||!SHADOWS[id]) return;
  if(S.player.mp<5){toast('Not enough MP to summon (5 MP).','bad');return}
  S.player.mp-=5;
  const total=s.g.sets.reduce((a,b)=>a+b.hp,0),strike=Math.round(total*summonPct(id)/200);
  s.summon={id,pct:summonPct(id)};s.dealt+=strike;UI.hit=strike;UI.sheet=null;
  S.totals.summons=(S.totals.summons||0)+1;
  Sfx.seal();buzz([60,40,120]);toast(`Arise, ${SHADOWS[id].name}.`);
  checkUnlocks();save();refresh();
}

/* ---------- recovery ---------- */
const daysBetween=(a,b)=>Math.round((keyDate(b)-keyDate(a))/864e5);
const hurting=()=>JOINT_IDS.filter(j=>adaptLv(j)>=2);
// a joint flagged for about two weeks, or marked "hurts" on 3 check-ins in a row, should be checked by a professional
function needsCheck(j){const v=S.joints[j];return !!(v&&v.lv&&S.daily&&(daysBetween(v.since,S.daily.date)+1>=14||v.l2>=3))}
// what the System has changed because of sore joints, as [label, value] rows
function adaptLines(){
  const d=S.daily,rows=[];
  if(!d) return rows;
  if(d.heal&&!d.cleared) rows.push(['Main task',`${REC_BY[hurting()[0]].name} recovery session`]);
  for(const id of Object.keys(d.subs||{})) if(d.targets[id]!=null){
    const sub=subFor(id);
    rows.push([DAILY_BY[id].name,`${EX[d.subs[id]].name}${sub&&sub.lv>=2?' · optional':''}`]);
  }
  const out=Object.values(POOL).flat().filter(id=>stressLv(id)).length;
  if(out) rows.push(['Gates',`${out} exercise${out===1?'':'s'} left out`]);
  if(S.penalty) rows.push(['Penalty Quest',penaltyPaused()?'Paused while a joint hurts':S.penalty.tasks.length?S.penalty.tasks.map(t=>EX[t.ex].name).join(' + '):'Clears with a recovery session']);
  if(d.heal&&!d.cleared) rows.push(['Today','No penalty · streak kept']);
  if(soreJoints().some(j=>!S.joints[j].adapt)) rows.push(['Daily Quest',soreJoints().some(j=>S.joints[j].adapt)?'Only adapted for joints you allowed':'Unchanged (your choice)']);
  return rows;
}
// A check-in sets or confirms a joint's level. Flags last 3 days, then the System asks again.
function setJoint(j,lv,adapt){
  if(!REC_BY[j]||!S.daily) return;
  const today=S.daily.date,prev=S.joints[j],prevLv=soreLv(j);
  if(!lv){
    if(!prev) return;
    delete S.joints[j];
  } else {
    // flagged again soon after a flag ended: keep counting from the original "sore since" day
    const cont=prev&&(prev.lv>0||daysBetween(prev.checked,today)<=4);
    const l2=lv===2?(prev&&prev.lastLv===2?(prev.l2||0)+(prev.checked===today?0:1):1):0;
    // a re-check keeps the earlier answer about adapting the Daily Quest
    const keep=prev&&prev.lv>0&&typeof prev.adapt==='boolean'?prev.adapt:!!adapt;
    S.joints[j]={lv,lastLv:lv,since:cont?prev.since:today,checked:today,l2,adapt:adapt===undefined?keep:!!adapt};
  }
  retarget();syncRecHabits();regenGates();adaptPenalty();
  if(lv>prevLv){
    const ad=S.joints[j].adapt,rows=adaptLines(),lines=[`[Status ailment detected: ${AILMENT(j)}.]`,!ad?'Gates and penalties will avoid it. Your Daily Quest stays as it is.':lv>=2?'Recovery comes first today. Finish its recovery session to clear the Daily Quest. Everything else is optional.':'The System has adjusted your training.'];
    if(S.daily.cleared&&ad) lines.push('Today\'s Daily Quest is already complete. Changes to it apply from tomorrow.');
    notify({kind:'info',head:'Status Ailment',lines,rewards:rows.length?rows:null,
      foot:lv>=2?'Ease off, don\'t train through sharp pain. Keep gently moving within comfort.':RECOVERY.painRule});
  } else toast(!lv?`${REC_BY[j].name}: feeling OK. Ailment removed.`:lv===prevLv?`${REC_BY[j].name}: check-in saved.`:`${REC_BY[j].name}: marked as sore.`);
  save();refresh();
}
function toggleAdapt(j){
  const v=S.joints[j];if(!v||!v.lv) return;
  v.adapt=!v.adapt;
  retarget();syncRecHabits();regenGates();adaptPenalty();
  toast(v.adapt?`${REC_BY[j].name}: the Daily Quest now adapts`:`${REC_BY[j].name}: the Daily Quest stays as it is`);
  save();refresh();
}
// at the daily reset: flags older than 3 days end (the System asks again); ended flags are forgotten after a few more days
function expireJoints(today){
  const ended=[];
  for(const j of Object.keys(S.joints)){
    const v=S.joints[j];
    if(v.lv&&daysBetween(v.checked,today)>=3){v.lv=0;ended.push(j)}
    else if(!v.lv&&daysBetween(v.checked,today)>4) delete S.joints[j];
  }
  if(ended.length) notify({kind:'info',head:'Check-in',lines:[`[${ended.map(j=>REC_BY[j].name).join(', ')}: your sore flag has ended after 3 days.]`,'Still sore? Flag it again in Recover and the System will keep adapting your training.'],btn:'OK'});
}
function toggleRecHabit(i){
  const d=S.daily,q=d&&d.rh&&d.rh[i];if(!q) return;
  if(!q.done){
    q.done=true;q.xp=gainXP(10,'side');gainStats({vit:15});S.totals.recHabits++;
    toast(`+${q.xp} XP  ·  VIT training`);
  } else {
    q.done=false;S.player.xp=Math.max(0,S.player.xp-q.xp);
    const st=S.stats.vit;st.x-=15;while(st.x<0&&st.t>0){st.x+=100;st.t--}if(st.x<0) st.x=0;
    S.totals.recHabits=Math.max(0,S.totals.recHabits-1);q.xp=0;
  }
  checkUnlocks();save();refresh();
}

/* ---------- penalty ---------- */
// Penalty exercises in order of preference, with base targets. Nothing that loads a sore joint is ever picked:
// with no safe option the task is dropped, and with every task dropped a recovery session clears the penalty.
const PEN_REPS={burpee:25,squat:50,glute:50,crunch:50};
const PEN_HOLD={plank:120,wallsit:90,hollow:60};
const penScale=()=>({beginner:.6,normal:1,hard:1.4,hunter:1.6}[S.settings.diff]||1);
// while a joint hurts the Penalty Quest is paused: no debuff, nothing to do
const penaltyPaused=()=>!!S.penalty&&maxAdapt()>=2;
function penaltyPick(list){
  const ok=id=>!(S.settings.lowImpact&&(EX[id].tags||[]).includes('jump'))&&!stressLv(id);
  return Object.keys(list).find(ok)||null;
}
const penTarget=(list,id)=>EX[id].type==='time'?Math.round(list[id]*penScale()/10)*10:r5(list[id]*penScale());
function makePenalty(){
  const tasks=[];
  for(const list of [PEN_REPS,PEN_HOLD]){const id=penaltyPick(list);if(id) tasks.push({ex:id,target:penTarget(list,id),done:0})}
  return {tasks};
}
// after a check-in: swap or drop unfinished tasks that load a sore joint, keeping the share already done
function adaptPenalty(){
  const p=S.penalty;if(!p) return;
  if(!p.tasks.length){if(!soreJoints().length) p.tasks=makePenalty().tasks;return}
  p.tasks=p.tasks.flatMap(t=>{
    if(t.done>=t.target||!stressLv(t.ex)) return [t];
    const list=EX[t.ex].type==='time'?PEN_HOLD:PEN_REPS,id=penaltyPick(list);
    if(!id) return [];
    const target=penTarget(list,id);
    return [{ex:id,target,done:Math.min(target-1,Math.round(t.done/t.target*target))}];
  });
  if(p.tasks.length&&p.tasks.every(t=>t.done>=t.target)) clearPenalty();
}
function clearPenalty(how){
  S.penalty=null;S.totals.penalties++;
  if(UI.sheet&&(UI.sheet.kind==='hold'||UI.sheet.ctx==='pen')) UI.sheet=null;
  notify({kind:'quest',head:'Quest Complete',lines:['[You have survived the Penalty Quest.]',how||'Debuff removed: Weakened.','You have returned from the Penalty Zone.']});
  checkUnlocks();
}
function logPenalty(i,n){
  const p=S.penalty,t=p&&p.tasks[i];n=Math.round(n);
  if(!t||n<=0) return;
  if(penaltyPaused()){toast('The Penalty Quest is paused while a joint hurts.','bad');return}
  const rec=doReps(t.ex,n);
  t.done+=n;
  toast(`${EX[t.ex].name} +${n}${EX[t.ex].type==='time'?' s':''}  ·  +${rec.xp} XP`);
  if(p.tasks.every(x=>x.done>=x.target)) clearPenalty();
  save();refresh();
}

/* ---------- gates ---------- */
function allowed(id){const t=EX[id].tags||[];return !(t.includes('jump')&&S.settings.lowImpact)&&!(t.includes('bar')&&!S.settings.bar)&&!stressLv(id)}
// returns null when sore joints rule out every exercise
function makeGate(r,rk,o={}){
  const red=o.red??r()<(rk?.14:.08);
  const nEx=[3,3,4,4,5,5][rk],rounds=[2,3,3,4,4,5][rk];
  const baseR=[8,10,12,14,16,20][rk],baseT=[20,30,35,40,45,50][rk],rest=[45,40,35,30,30,25][rk];
  const cats=['push','legs','core','cardio','any'].slice(0,nEx),used=new Set(),exs=[];
  const everything=Object.values(POOL).flat();
  for(const c of cats){
    let opts=(c==='any'?everything:POOL[c]).filter(id=>allowed(id)&&!used.has(id));
    if(!opts.length&&POOL_SWAP[c]&&!used.has(POOL_SWAP[c])&&allowed(POOL_SWAP[c])) opts=[POOL_SWAP[c]];
    if(!opts.length) opts=everything.filter(id=>allowed(id)&&!used.has(id));
    if(!opts.length) continue;
    const id=pick(r,opts);used.add(id);exs.push(id);
  }
  if(!exs.length) return null;
  const dm=DIFF[S.settings.diff].gate*(red?1.15:1)*(o.trial?1.1:1),sets=[];
  for(let ro=0;ro<rounds;ro++) for(const id of exs){
    const e=EX[id];
    const target=e.type==='time'?Math.max(10,Math.round(baseT*dm*e.f/5)*5):Math.max(3,Math.round(baseR*e.f*dm));
    sets.push({ex:id,target,round:ro,hp:Math.round(target*e.xp*10*(rk+1))});
  }
  const secs=sets.reduce((a,s)=>a+(EX[s.ex].type==='time'?s.target:s.target*2.5),0)+rest*(sets.length-1)+20*(rounds-1);
  const mul=(red?1.5:1)*(o.trial?1.5:1);
  return {rank:rk,red,trial:!!o.trial,name:pick(r,PLACES),boss:pick(r,BOSSES[rk]),rounds,exs,sets,rest,
    est:Math.max(5,Math.round(secs/60)),xp:Math.round([60,120,200,320,500,800][rk]*mul),gold:Math.round([40,80,140,220,350,600][rk]*mul)};
}
// today's three gates; ones already cleared today stay cleared when the list is rebuilt
function genGates(k){
  const same=S.gates&&S.gates.date===k,salt=same?(S.gates.salt||0):0;
  const r=rng('gates'+k+S.created+(salt?'#'+salt:'')),base=S.player.rank,done=same?(S.gates.done||[]):[];
  const ranks=[base,base,Math.min(5,base+1)];
  if(base>0&&r()<.3) ranks[0]=base-1;
  const red=eventOn(k)?.id==='red';
  let list=ranks.map((rk,i)=>{const g=makeGate(r,rk,red&&i===2?{red:true}:{});return g&&{...g,id:k+(salt?'-r'+salt:'')+'-'+i}}).filter(g=>g&&!done.includes(g.id));
  // after a Gate Compass reroll the new ids never match, so gates already cleared today are not handed out again
  if(salt) list=list.slice(0,Math.max(0,3-done.filter(id=>id[0]!=='k').length));
  S.gates={date:k,list,done,salt};
}
// rebuild today's gates around sore joints (bought key gates keep their id and rank)
function regenGates(){
  if(!S.daily) return;
  const keys=S.gates.list.filter(g=>g.id[0]==='k');
  genGates(S.daily.date);
  for(const k of keys){const g=makeGate(rng(k.id+'|'+soreJoints().join()),k.rank,{red:k.red});if(g) S.gates.list.push({...g,id:k.id})}
  S.trial=null;
}
function addKeyGate(){
  const r=rng('key'+Date.now()+Math.random()),rk=Math.min(5,S.player.rank+(r()<.35?1:0)),g=makeGate(r,rk);
  if(!g) return false;
  S.gates.list.push({...g,id:'k'+Date.now()});
  return true;
}
function trialGate(){
  const p=S.player;if(p.rank>=5) return null;
  const nx=p.rank+1;if(p.level<RANKS[nx].min) return null;
  if(!S.trial||S.trial.rank!==nx){
    const g=makeGate(rng('trial'+nx+S.created),nx,{red:false,trial:true});
    if(!g) return null;
    S.trial={...g,id:'trial',name:`${RANKS[nx].id}-Rank Reassessment`,boss:TRIAL_BOSS[nx]};
  }
  return S.trial;
}
const findGate=id=>id==='trial'?trialGate():S.gates.list.find(g=>g.id===id);
const tgtLabel=s=>EX[s.ex].type==='time'?`${s.target} s`:`× ${s.target}`;
function enterGate(id){
  const g=findGate(id);if(!g) return;
  if(!g.trial){
    if(S.player.mp<10){notify({kind:'info',head:'Notification',lines:['[Not enough MP.]','Entering a gate costs 10 MP. MP refills at the daily reset, on level up, or with a Recovery Potion.']});return}
    S.player.mp-=10;
  }
  startSession(g);
  toast(g.trial?'The trial has begun.':'You have entered the gate.');
}
function startSession(g){
  const first=g.sets[0];
  S.session={gid:g.id,g:JSON.parse(JSON.stringify(g)),i:0,phase:'work',adj:first.target,left:first.target,run:false,prep:0,end:0,dealt:0,xp:0,t0:Date.now(),beep:0,confirm:false};
  UI.sheet=null;UI.screen={kind:'gate'};UI.hit=0;
  wake();Sfx.go();buzz(80);
  save();refresh();
}
// a recovery session is a gentle "gate": the region's moves in order, timed holds split per side, short rests
function recPlan(region){
  const R=REC_BY[region],sets=[];
  for(const id of R.sessionOrder){
    const m=R.moves.find(x=>x.id===id);if(!m) continue;
    for(let n=0;n<Math.max(1,m.sets||1);n++){
      if(m.perSide&&m.type==='time') for(const side of ['Left side','Right side']) sets.push({ex:id,target:m.target,round:0,hp:1,side});
      else sets.push({ex:id,target:m.target,round:0,hp:1,side:m.perSide?'Each side':''});
    }
  }
  const rest=12,secs=sets.reduce((a,s)=>a+(EX[s.ex].type==='time'?s.target:s.target*3*(s.side==='Each side'?2:1)),0)+rest*(sets.length-1);
  return {id:'rec-'+region,mode:'rec',region,rank:0,red:false,trial:false,name:R.name,boss:'',rounds:1,
    exs:[...new Set(sets.map(s=>s.ex))],sets,rest,est:Math.max(3,Math.round(secs/60)),xp:30,gold:0};
}
function enterRecovery(region){
  if(!REC_BY[region]) return;
  startSession(recPlan(region));
  toast('Recovery session started. Move gently.');
}
function sessSet(){const s=S.session;return s.g.sets[s.i]}
function completeSet(actual){
  const s=S.session,g=s.g,set=sessSet();
  actual=Math.max(0,Math.round(actual));
  const rec=doReps(set.ex,actual);
  s.xp+=rec.xp;
  if(g.mode==='rec'){UI.hit=0;Sfx.beep();buzz(30)}
  else{const dmg=Math.round(set.hp*Math.min(1.2,actual/set.target));s.dealt+=dmg;UI.hit=dmg;Sfx.hit();buzz([30,40,30])}
  if(s.i>=g.sets.length-1){g.mode==='rec'?finishRecovery():finishGate();return}
  const roundEnd=g.sets[s.i+1].round!==set.round;
  s.phase='rest';s.end=Date.now()+(g.rest+(roundEnd?20:0))*1000;s.beep=0;s.run=false;s.prep=0;
  save();refresh();
}
function nextSet(){
  const s=S.session;s.i++;
  const set=sessSet();
  Object.assign(s,{phase:'work',adj:set.target,left:set.target,run:false,prep:0,beep:0});
  UI.hit=0;Sfx.go();buzz(80);save();refresh();
}
function finishGate(){
  const s=S.session,g=s.g,p=S.player;
  const sm=s.summon&&SHADOWS[s.summon.id]?1+s.summon.pct/100:1;
  const xpPreview=Math.round(g.xp*sm*xpMult('gate')),gold=gainGold(g.gold*sm);
  gainStats({per:12*(g.rank+1)});
  const loot=[],luck=clamp((stat('per')-10)*.004,0,.25);
  if(g.red){S.inv.box++;loot.push(['Random Box','×1'])}
  if(g.red&&isEvent('red')){S.inv.box++;loot.push(['Random Box (Red Gate Week)','×1'])}
  if(sm>1) loot.unshift([`Shadow: ${SHADOWS[s.summon.id].name}`,`+${s.summon.pct}% clear rewards`]);
  if(Math.random()<.25+luck){S.inv.box++;loot.push(['Random Box','×1'])}
  if(Math.random()<.08+luck/2){S.inv.key++;loot.push(['Instant Dungeon Key','×1'])}
  if(Math.random()<.12){S.inv.potion++;loot.push(['Recovery Potion','×1'])}
  const drop=gearDrop(g.rank,.05+.01*g.rank+(g.red?.05:0)+(g.trial?.2:0));if(drop) loot.push([GEAR[drop].name,'Equipment']);
  let scroll=0;if(S.buffs.scroll){S.buffs.scroll=false;scroll=Math.round(g.xp*.5);loot.push(['XP Scroll',`+${fmt(Math.round(scroll*xpMult('gate')))} XP`])}
  S.totals.gates++;if(g.red) S.totals.red++;
  S.totals.maxGate=Math.max(S.totals.maxGate,g.rank);
  if(new Date().getHours()>=22) flag('nighthunter');
  if(g.trial) S.trial=null; else{S.gates.list=S.gates.list.filter(x=>x.id!==g.id);S.gates.done.push(g.id)}
  S.session=null;UI.screen=null;UI.hit=0;unwake();
  notify({kind:'quest',head:g.trial?'Trial Cleared':'Dungeon Cleared',lines:[`[${g.boss} has been defeated.]`,`Clear time ${mmss((Date.now()-s.t0)/1000)}`],
    rewards:[['XP from sets',`+${fmt(s.xp)}`],['Clear bonus',`+${fmt(xpPreview)} XP`],['Gold',`+${fmt(gold)}`],...loot]});
  gainXP(g.xp*sm+scroll,'gate');
  offerExtraction(g);
  if(g.trial){
    p.rank=Math.min(5,p.rank+1);
    const R=rankOf();
    notify({kind:'level',head:'Reassessment',big:`${R.id}-RANK`,lines:['[Your rank has been reassessed.]',`You are now a ${R.id}-Rank Hunter.`,`${R.id}-Rank gates will appear from the next reset.`]});
    if(p.rank===1&&!p.job) offerJob();
  }
  checkUnlocks();save();refresh();
}
function finishRecovery(){
  const s=S.session,g=s.g,p=S.player,d=S.daily;
  // the full bonus once per region per day; repeats still help but give less
  const balm=S.buffs.balm?50:0;S.buffs.balm=false;
  const first=!(d.recDone||[]).includes(g.region),base=(first?g.xp:Math.round(g.xp/3))+balm;
  const xpPreview=Math.round(base*xpMult()),heal=Math.max(0,Math.min(maxHP()-p.hp,Math.round(maxHP()*.25)));
  p.hp+=heal;p.fatigue=Math.max(0,fatigue()-30);p.fatigueTs=Date.now();

// a random unowned piece up to the given rank, with the given chance
function gearDrop(maxRank,chance){
  if(Math.random()>=chance) return null;
  const pool=Object.keys(GEAR).filter(id=>GEAR[id].rank<=maxRank&&!S.gear.owned.includes(id));
  if(!pool.length) return null;
  const id=pick(Math.random,pool);S.gear.owned.push(id);return id;
}
function buyGear(id,price){
  const g=GEAR[id];if(!g||S.gear.owned.includes(id)) return;
  price=price??g.price;
  if(S.player.gold<price){toast(`You need ${fmt(price-S.player.gold)} more gold`,'bad');return false}
  S.player.gold-=price;S.gear.owned.push(id);toast(`Acquired: ${g.name}`);
  if(!S.gear.eq[g.slot]) equipGear(id,true);

function equipGear(id,quiet){

  S.gear.eq[g.slot]=S.gear.eq[g.slot]===id?null:id;
  if(!quiet) toast(S.gear.eq[g.slot]?`Equipped: ${g.name}`:`Unequipped: ${g.name}`);
  S.player.hp=Math.min(S.player.hp,maxHP());

}
// one discounted offer a day, from what the player can use and doesn't own
function dailyDeal(){
  const d=S.daily;if(!d) return null;
  const r=rng('deal'+d.date+S.created),gear=Object.keys(GEAR).filter(id=>GEAR[id].rank<=S.player.rank+1&&!S.gear.owned.includes(id));

/* ---------- run tracking ---------- */
let geoWatch=null;
function hav(a,b){const R=6371000,t=Math.PI/180,dLa=(b.la-a.la)*t,dLo=(b.lo-a.lo)*t;const s=Math.sin(dLa/2)**2+Math.cos(a.la*t)*Math.cos(b.la*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const runElapsed=()=>{const r=S.run;return r?r.el+(r.seg?Date.now()-r.seg:0):0};
function runStart(){
  if(!S.run) S.run={dist:0,el:0,seg:null,last:null,path:[],acc:null,started:Date.now(),ts:Date.now()};
  S.run.seg=Date.now();S.run.last=null;UI.confirmDiscard=false;
  startGeo();wake();Sfx.go();buzz(80);save();refresh();
}
function runPause(){
  const r=S.run;if(!r||!r.seg) return;
  r.el+=Date.now()-r.seg;r.seg=null;r.last=null;
  stopGeo();save();refresh();
}
// In the Android app, GPS keeps running with the screen off (with a notification while a run is tracked)
let bgWatch=null;
function startGeo(){
  UI.geoErr='';
  const BG=PLUG('BackgroundGeolocation');
  if(BG){
    if(bgWatch) return;
    bgWatch=BG.addWatcher({backgroundTitle:'Awaken is tracking your run',backgroundMessage:'Tap to return to your run.',requestPermissions:true,stale:false,distanceFilter:3},(loc,err)=>{
      if(err){UI.geoErr=err.code==='NOT_AUTHORIZED'?'Location permission denied. Allow it in Android settings, or log the run manually.':'Waiting for a GPS signal…';runLive();return}
      if(loc) onPos({coords:{latitude:loc.latitude,longitude:loc.longitude,accuracy:loc.accuracy},timestamp:loc.time||Date.now()});
    });
    return;
  }
  if(!('geolocation' in navigator)){UI.geoErr='GPS is not available here. Use manual entry.';return}
  if(geoWatch!=null) return;
  geoWatch=navigator.geolocation.watchPosition(onPos,err=>{
    UI.geoErr=err.code===1?'Location permission denied. Allow it in your browser settings, or log the run manually.':'Waiting for a GPS signal…';
    runLive();
  },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function stopGeo(){if(bgWatch){const BG=PLUG('BackgroundGeolocation');Promise.resolve(bgWatch).then(id=>BG&&BG.removeWatcher({id})).catch(()=>{});bgWatch=null}if(geoWatch!=null&&navigator.geolocation) navigator.geolocation.clearWatch(geoWatch);geoWatch=null}
function onPos(pos){
  const r=S.run;if(!r) return;
  const {latitude:la,longitude:lo,accuracy:acc}=pos.coords;
  r.acc=Math.round(acc);UI.geoErr='';
  if(r.seg&&acc<=40){
    const pt={la,lo,t:pos.timestamp};
    if(!r.last){r.last=pt;r.path.push([la,lo])}
    else{
      const d=hav(r.last,pt),dt=(pt.t-r.last.t)/1000;
      if(!(dt>0&&d/dt>12)&&d>=Math.max(4,acc*.5)){
        r.dist+=d/1000;r.last=pt;r.path.push([la,lo]);
        if(r.path.length>3000) r.path=r.path.filter((_,i)=>i%2===0);
        r.ts=Date.now();save();
      }
    }
  }
  runLive();drawPath();
}
function runFinish(){
  const r=S.run;if(!r) return;
  const km=r2(r.dist),sec=runElapsed()/1000;
  // a walk counts by time, so it works indoors or without GPS
  if(walking()){
    if(sec<60){toast('Walk for at least a minute, or discard it.','bad');return}
    stopGeo();unwake();S.run=null;UI.screen=null;
    logWalk(sec/60,km);return;
  }
  if(km<0.01){toast('No distance recorded yet. Keep moving, or discard the run.','bad');return}
  stopGeo();unwake();S.run=null;UI.screen=null;
  logRun(km,sec);
}
function logWalk(min,km){
  const xp=logDaily('run',r2(min),true);
  notify({kind:'quest',head:'Walk Complete',big:`${Math.round(min)} min`,lines:[km>=.01?`Distance ${trim(toUser(km))} ${unit()}`:'Time logged.','Easy movement helps sore joints recover.'],rewards:[['XP',`+${fmt(xp)}`],['Training','AGI · VIT']]});
  save();refresh();
}
function logRun(km,sec){
  const d=S.daily;
  if(km>=10&&taskEx('run')==='run') flag('windrunner');
  const xp=d&&d.targets.run!=null?logDaily('run',km,true):(()=>{const x=doReps('run',km).xp;checkUnlocks();return x})();
  notify({kind:'quest',head:'Run Complete',big:`${trim(toUser(km))} ${unit()}`,lines:sec?[`Time ${hms(sec*1000)}  ·  Pace ${paceStr(sec,km)} per ${unit()}`]:['Distance logged.'],rewards:[['XP',`+${fmt(xp)}`],['Training','AGI · VIT']]});
  save();refresh();
}

const Sfx={ctx:null,
  unlock(){if(this.ctx) {if(this.ctx.state==='suspended') this.ctx.resume();return}try{const C=window.AudioContext||window.webkitAudioContext;if(C) this.ctx=new C()}catch(e){}},
  t(f,d=.15,type='sine',v=.12,w=0,f2){
    if(!S.settings.sound) return;this.unlock();const c=this.ctx;if(!c) return;
    const t=c.currentTime+w,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
  },
  notify(){this.t(1318,.35,'sine',.08);this.t(1760,.55,'sine',.06,.09)},
  tick(){this.t(1200,.04,'square',.03)},
  beep(){this.t(1046,.12,'sine',.1)},
  go(){this.t(1568,.28,'sine',.11)},
  level(){[523,659,784,1046,1318].forEach((f,i)=>this.t(f,.32,'triangle',.08,i*.08))},
  clear(){[784,988,1175,1568].forEach((f,i)=>this.t(f,.6,'sine',.06,i*.06))},
  alarm(){for(let i=0;i<3;i++) this.t(240,.26,'sawtooth',.05,i*.32,170)},
  hit(){this.t(190,.18,'square',.06,0,60)},
  seal(){this.t(110,.45,'sine',.22,0,45);this.t(70,.3,'triangle',.12,.02,40);[659,988,1318].forEach((f,i)=>this.t(f,.7,'sine',.05,.25+i*.09))},

function periodWin(kind){

function penaltyWin(){

// weekly volume for one exercise group over the last 8 weeks (Monday to Sunday)
const CHART={push:{name:'Push-ups',ids:['pushup','diamond','pike','wallpush']},core:{name:'Core',ids:['situp','crunch','legraise','superman','deadbug']},
  legs:{name:'Legs',ids:['squat','glute','lunge','jumpsquat']},dist:{name:'Distance',ids:['run','walk']}};
function weekVolume(g,wk){
  let v=0;for(let i=0;i<7;i++){const d=S.days[addDays(wk,i)];if(!d) continue;for(const id of CHART[g].ids) v+=g==='dist'&&id==='walk'?(d[id]||0)/10:(d[id]||0)}
  return v;
}
function progressWin(){
  const g=CHART[UI.chartEx]?UI.chartEx:'push',now=weekKey(S.daily.date),N=8;

  const max=Math.max(1,...vals),nice=(()=>{const m=Math.pow(10,Math.floor(Math.log10(max)));return [1,2,2.5,5,10].map(x=>x*m).find(x=>x>=max)})();
  const W=320,H=150,pl=34,pb=22,pt=16,bw=(W-pl)/N,u=g==='dist'?' '+unit():'';

  const bar=(x,top,w,h)=>{if(h<=0) return '';const r=Math.min(4,h,w/2);return `M${x},${top+h}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${top+h}Z`};
  const sel=UI.chartPick;
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W}" y1="${y(nice*f)}" y2="${y(nice*f)}" class="ch-grid"/><text x="${pl-6}" y="${y(nice*f)+4}" class="ch-ax" text-anchor="end">${trim(nice*f)}</text>`).join('');
  const bars=vals.map((v,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,top=y(v),d=keyDate(weeks[i]);
    return `<g class="ch-b${sel===i?' on':''}" data-a="chartPick" data-x="${i}" role="listitem" aria-label="Week of ${d.getMonth()+1}/${d.getDate()}: ${trim(v)}${u}"><rect x="${pl+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/><path d="${bar(x,top,w,H-pb-top)}"/>
      <text x="${x+w/2}" y="${H-6}" class="ch-ax" text-anchor="middle">${i===N-1?'Now':`${d.getMonth()+1}/${d.getDate()}`}</text>${sel===i||(sel==null&&i===N-1&&v>0)?`<text x="${x+w/2}" y="${top-5}" class="ch-v" text-anchor="middle">${trim(v)}</text>`:''}</g>`}).join('');

      <div class="row2" style="margin-top:16px">${a.declined?'':'<button class="btn" data-a="awDecline">Decline</button>'}<button class="btn pri" data-a="awAccept">Accept</button></div></section>
      <p style="text-align:center;margin-top:18px"><button class="link" data-a="awLink">${a.link?'Close':'Already a Player? Load your cloud save'}</button></p>
      ${a.link?`<section class="win">${winHead('Cloud Save')}<label class="field"><span>Your cloud save code</span><input id="cloud-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></label><button class="btn pri block" data-a="cloudLink">Load my progress</button></section>`:''}</div>`;
    if(a.step===1) return `<div class="aw"><section class="win">${winHead('Registration')}
      <p class="sys">[Enter your name, Player.]</p>
      <label class="field"><span>Player name</span><input id="aw-name" maxlength="16" autocomplete="nickname" value="${esc(a.name)}" placeholder="Your name"></label>
      <button class="btn pri block" data-a="awName">Continue</button></section></div>`;
    if(a.step==='sign'){
      const terms=['I will clear the Daily Quest every day the System assigns one.','I accept the penalty that follows failure.','I will rest when my body asks, and recover before I return.','I will become stronger than I was yesterday.'];
      return `<div class="aw"><section class="win contract${a.sealed?' sealed':''}" id="contract">${winHead('Player Contract','✦')}
        <p class="sys">${['[A contract has been prepared for you.]'].map(l=>`<span data-tw="${esc(l)}"><span></span><span class="ghost">${esc(l)}</span></span>`).join('')}</p>
        <p class="ct-name">Player: <b>${esc(a.name)}</b></p>
        <ol class="terms">${terms.map(t=>`<li>${t}</li>`).join('')}</ol>
        <p class="lbl">${a.sealed?'Contract sealed':'Sign here with your finger'}</p>
        <div class="sigbox"><canvas id="sig" width="600" height="200" aria-label="Signature pad"></canvas><span class="sigline" aria-hidden="true">✕</span>
          ${a.sealed?'<div class="seal" aria-hidden="true"><span>!</span><small>SEALED</small></div>':''}</div>
        ${a.sealed?'':`<div class="row2" style="margin-top:14px"><button class="btn" data-a="sigClear">Clear</button><button class="btn pri" data-a="sigSeal" id="sig-seal" ${a.sigLen>120?'':'disabled'}>Seal the contract</button></div>`}
      </section></div>`;
    }
    if(a.step===2){
      const st=(id,l,h)=>`<div><h3>${l}</h3><p class="hint" style="margin:0 0 8px">${h}</p><div class="stepper sm"><button class="btn sq" data-a="awStep" data-x="${id}:-1" aria-label="Less">−</button><input id="aw-${id}" type="number" inputmode="numeric" min="0" max="300" value="${a.base[id]}" aria-label="${l}"><button class="btn sq" data-a="awStep" data-x="${id}:1" aria-label="More">+</button></div></div>`;
      const runs=S.settings.units==='mi'?['I mostly walk','About 0.5 mi','1–2 mi','3 mi','6 mi or more']:['I mostly walk','About 1 km','2–3 km','5 km','10 km or more'];
      return `<div class="aw"><section class="win">${winHead(a.retest?'Reassessment Test':'Assessment')}
        <p class="sys">${a.retest?'[Show the System how far you have come.]':'[The System will measure your current ability.]'}</p>
        <p class="hint" style="text-align:center;margin:-6px 0 16px">${a.retest?'Warm up, then do one honest set of each with a few minutes of rest between them. Your last results are filled in.':'Test yourself now or give your best guess. You can retake this any time in Settings.'}</p>
        <div class="assess">${st('pushup','Push-ups in one set','Knee push-ups count.')}${st('situp','Sit-ups in one set','Crunches count.')}${st('squat','Squats in one set','Bodyweight squats.')}
          <div><h3>How far can you run without stopping?</h3>
            <div class="seg" style="margin:8px 0 10px"><button class="seg-b${unit()==='km'?' on':''}" data-a="awUnits" data-x="km">km</button><button class="seg-b${unit()==='mi'?' on':''}" data-a="awUnits" data-x="mi">miles</button></div>
            <div class="chips">${[.5,1,2,5,10].map((v,i)=>`<button class="chip${a.base.run===v?' on':''}" data-a="awRun" data-x="${v}">${runs[i]}</button>`).join('')}</div></div></div>
        <div class="row2" style="margin-top:18px">${a.recal?'<button class="btn" data-a="awCancel">Cancel</button>':''}<button class="btn pri" data-a="awAssess">${a.retest?'Submit results':'Continue'}</button></div></section></div>`;
    }
    const tg=targetsWith(a.base,a.diff,a.recal?S.player.level:1);
    return `<div class="aw"><section class="win">${winHead('Difficulty')}
      <p class="sys">[Choose how fast the Daily Quest grows.]</p>
      <div class="diffs">${Object.entries(DIFF).map(([k,d])=>`<button class="diff${a.diff===k?' on':''}" data-a="awDiff" data-x="${k}" aria-pressed="${a.diff===k}"><b>${d.name}</b><small>${d.desc}</small></button>`).join('')}</div>
      <p class="preview">${a.recal?'Today':'Day 1'}: ${tg.pushup} push-ups · ${tg.situp} sit-ups · ${tg.squat} squats · ${trim(toUser(tg.run))} ${unit()} run</p>
      <div class="field" style="margin-top:18px"><span>Rest days (no penalty)</span><div class="chips days">${DOW.map((d,i)=>`<button class="chip${a.rest.includes(i)?' on':''}" data-a="awRest" data-x="${i}" aria-pressed="${a.rest.includes(i)}">${d}</button>`).join('')}</div></div>
      <p class="hint">Train within your limits. Stop if you feel sharp pain, dizziness or chest discomfort, and check with a doctor before starting if you have a health condition.</p>
      <div class="row2" style="margin-top:16px"><button class="btn" data-a="awBack">Back</button><button class="btn pri" data-a="awBegin">${a.recal?'Save':'Begin training'}</button></div></section></div>`;
  },
  gate(){
    const s=S.session,g=s.g,set=sessSet(),e=EX[set.ex],R=RANKS[g.rank],rec=g.mode==='rec';
    const total=g.sets.reduce((a,b)=>a+b.hp,0),left=Math.max(0,total-s.dealt),wave=set.round+1,next=g.sets[s.i+1];
    const side=set.side?` · ${set.side}`:'',nextSide=next&&next.side?` · ${next.side.toLowerCase()}`:'';
    const extra=rec?`${e.easier?`<p class="cue">Easier: ${esc(e.easier)}</p>`:''}${e.avoidIf?`<p class="cue">${esc(e.avoidIf)}</p>`:''}`:'';
    let main;
    if(s.phase==='rest'){
      main=`<div class="phase rest"><p class="ph-l">${rec?'Breathe':'Rest'}</p><div class="timer" id="sess-t">${mmss((s.end-Date.now())/1000)}</div>
        <p class="ph-n">Next: <b>${esc(EX[next.ex].name)}</b> ${tgtLabel(next)}${nextSide}${!rec&&next.round!==set.round?` · ${next.round===g.rounds-1?'Boss wave':`Wave ${next.round+1}`}`:''}</p>
        <div class="row2"><button class="btn" data-a="restAdd">+15 s</button><button class="btn pri" data-a="restSkip">${rec?'Next move':'Skip rest'}</button></div></div>`;
    } else if(e.type==='time'){
      const tl=s.prep?'':mmss(s.run?(s.end-Date.now())/1000:s.left);
      main=`<div class="phase"><p class="ph-l">${rec?'Move':'Set'} ${s.i+1} of ${g.sets.length}${side}</p><h3 class="ex-n">${esc(e.name)}</h3><p class="cue">${esc(e.cue)}</p>${extra}
        <div class="timer" id="sess-t">${s.prep?Math.ceil((s.prep-Date.now())/1000):tl}</div><p class="ph-n">Hold for ${set.target} seconds</p>
        <div class="row2">${s.run||s.prep?'<button class="btn xl" data-a="timePause">Pause</button>':`<button class="btn pri xl" data-a="timeStart">${s.left<set.target?'Resume':'Start'}</button>`}<button class="btn xl" data-a="timeDone">Finish set</button></div></div>`;
    } else {
      main=`<div class="phase"><p class="ph-l">${rec?'Move':'Set'} ${s.i+1} of ${g.sets.length}${side}</p><h3 class="ex-n">${esc(e.name)}</h3><p class="cue">${esc(e.cue)}</p>${extra}
        <div class="stepper"><button class="btn sq" data-a="adj" data-x="-1" aria-label="One less">−</button><output id="adj" aria-live="polite">${s.adj}</output><button class="btn sq" data-a="adj" data-x="1" aria-label="One more">+</button></div>
        <p class="ph-n">Target ${set.target} reps${set.side==='Each side'?' on each side':''}. Adjust if you did fewer or more.</p>
        <button class="btn pri block xl" data-a="setDone">${rec?'Done':'Done · Strike'}</button></div>`;
    }
    const hit=UI.hit;UI.hit=0;
    const doneSets=s.i+(s.phase==='rest'?1:0);
    const top=rec?`<section class="win">
        <div class="boss-top"><span>Recovery</span><span id="sess-el">${mmss((Date.now()-s.t0)/1000)}</span></div>
        <div class="recbar" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="${g.sets.length}" aria-valuenow="${doneSets}" style="margin-top:10px"><i style="width:${doneSets/g.sets.length*100}%"></i></div>
        <p class="hp-n">${doneSets} / ${g.sets.length} done · discomfort up to 3/10 is OK, sharp pain means stop</p>
      </section>`
      :`<section class="win boss">
        <div class="boss-top"><span>${wave===g.rounds?'Boss wave':`Wave ${wave} / ${g.rounds}`}</span><span id="sess-el">${mmss((Date.now()-s.t0)/1000)}</span></div>
        <h3 class="boss-n">${esc(g.boss)}</h3>
        <div class="hpbar" role="progressbar" aria-label="Boss HP" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${left}"><i style="width:${left/total*100}%"></i></div>
        <p class="hp-n">${fmt(left)} / ${fmt(total)}</p>
        ${hit?`<span class="dmg">−${fmt(hit)}</span>`:''}
        ${s.summon&&SHADOWS[s.summon.id]?`<p class="summoned">${ico('shadow')}${esc(SHADOWS[s.summon.id].name)} fights beside you · +${s.summon.pct}% clear rewards</p>`
          :Object.keys(S.shadows).some(id=>SHADOWS[id])?`<button class="btn sm summon-b" data-a="summonOpen">${ico('shadow')}Summon a shadow · 5 MP</button>`:''}
      </section>`;
    const confirm=rec?`<div class="confirm"><p>End the session? Moves you finished still count.</p><div class="row2"><button class="btn" data-a="retreatNo">Keep going</button><button class="btn danger" data-a="retreatYes">End session</button></div></div>`
      :`<div class="confirm"><p>Leave the gate? You keep XP from finished sets but get no clear rewards.${g.red?' Fleeing a Red Gate costs 20% HP.':''}${g.trial?'':' The 10 MP is not refunded.'}</p><div class="row2"><button class="btn" data-a="retreatNo">Keep fighting</button><button class="btn danger" data-a="retreatYes">Retreat</button></div></div>`;
    return `<div class="screen-in${g.red?' tone-red':rec?' tone-ok':''}">
      <div class="scr-head"><div><p class="eyebrow">${rec?'Recovery session':g.trial?'Reassessment Trial':`${R.id}-Rank Gate`}${g.red?' · Red Gate':''}</p><h2>${esc(g.name)}</h2></div><button class="btn sm ghost" data-a="retreat">${rec?'End':'Retreat'}</button></div>
      ${s.confirm?confirm:''}
      ${top}
      <section class="win">${main}</section>
      <ol class="sets" aria-label="Sets">${g.sets.map((x,i)=>`<li class="${i<s.i||(i===s.i&&s.phase==='rest')?'done':i===s.i?'now':''}${!rec&&x.round===g.rounds-1?' boss':''}"></li>`).join('')}</ol>
    </div>`;
  },
  run(){
    const r=S.run,mode=UI.runMode,d=S.daily;
    const status=UI.geoErr||(r&&r.seg?(r.acc!=null?`±${r.acc} m`:'Searching…'):r?'Paused':'Ready');
    const daily=d&&d.targets.run!=null?`<p class="hint" style="text-align:center;margin:0">Daily Quest: ${fmtTask('run',d.prog.run)} / ${fmtTask('run',d.targets.run)}${taskSfx('run')}</p>`:'';
    const gps=`<section class="win"><div class="run-d"><b id="run-d">${r?trim(Math.floor(toUser(r.dist)*100)/100):'0'}</b><span>${unit().toUpperCase()}</span></div>
        <div class="run-stats"><div><small>Time</small><b id="run-t">${hms(runElapsed())}</b></div><div><small>Pace / ${unit()}</small><b id="run-p">${r?paceStr(runElapsed()/1000,r.dist):'--'}</b></div><div><small>GPS</small><b id="run-acc">${esc(status)}</b></div></div>
        <canvas id="run-map" width="640" height="320" role="img" aria-label="Route sketch"></canvas></section>
      <div class="row2">${!r?`<button class="btn pri xl" data-a="runStart">${walking()?'Start walk':'Start run'}</button>`:r.seg?'<button class="btn xl" data-a="runPause">Pause</button><button class="btn pri xl" data-a="runFinish">Finish</button>':'<button class="btn pri xl" data-a="runStart">Resume</button><button class="btn xl" data-a="runFinish">Finish</button>'}</div>
      ${r&&!r.seg?(UI.confirmDiscard?'<div class="confirm"><p>Discard this run? Nothing will be logged.</p><div class="row2"><button class="btn" data-a="runDiscardNo">Keep it</button><button class="btn danger" data-a="runDiscardYes">Discard</button></div></div>':'<button class="btn ghost block" data-a="runDiscard">Discard run</button>'):''}
      <p class="hint" style="margin:0">Keep this screen open while you ${walking()?'walk':'run'}; it stays awake. Your location is used only for distance and never leaves this device.</p>`;
    const walk=walking();
    const manual=walk?`<section class="win"><label class="field"><span>Minutes walked</span><input id="man-t" type="number" inputmode="numeric" min="1" placeholder="15"></label>
        <button class="btn pri block" data-a="runManual">Log walk</button></section><p class="hint" style="margin:0">Walk on flat ground at a pace you could talk at. Stop if pain goes above 3/10.</p>`
      :`<section class="win"><label class="field"><span>Distance (${unit()})</span><input id="man-d" type="number" inputmode="decimal" step="0.01" min="0" placeholder="3.2"></label>
        <label class="field"><span>Time in minutes (optional)</span><input id="man-t" type="number" inputmode="numeric" min="0" placeholder="25"></label>
        <button class="btn pri block" data-a="runManual">Log run</button></section><p class="hint" style="margin:0">Use this for treadmill runs, or if you tracked the run with another app.</p>`;
    return `<div class="screen-in"><div class="scr-head"><div><p class="eyebrow">Daily Quest · ${walk?esc(taskName('run')):'Running'}</p><h2>${walk?'Walk':'Run'}</h2></div><button class="icon-btn" data-a="runClose" aria-label="Close">${ico('close')}</button></div>
      <div class="seg"><button class="seg-b${mode==='gps'?' on':''}" data-a="runMode" data-x="gps">${walk?'Timer + GPS':'GPS tracking'}</button><button class="seg-b${mode==='manual'?' on':''}" data-a="runMode" data-x="manual">Manual entry</button></div>
      ${mode==='gps'?gps:manual}${daily}</div>`;
  },
  tap(){
    const t=UI.screen,name=t.ctx==='pen'?EX[S.penalty.tasks[t.i].ex].name:taskName(t.task);
    return `<div class="tap-scr"><div class="scr-head"><div><p class="eyebrow">Tap counter</p><h2>${name}</h2></div><button class="btn sm ghost" data-a="tapClose">Cancel</button></div>
      <button class="pad" id="pad" aria-label="Add one rep"><b id="pad-n">${t.n}</b><small>Tap per rep</small></button>
      <p class="hint" style="text-align:center;margin:0">For push-ups, put the phone under your chest and touch it with your chin or nose at the bottom of each rep.</p>
      <div class="row2"><button class="btn xl" data-a="tapUndo">−1</button><button class="btn pri xl" data-a="tapDone" id="tap-log">Log ${t.n}</button></div></div>`;
  },
  settings(){
    const st=S.settings;
    const tog=(k,l,h)=>`<button class="tog" data-a="setTog" data-x="${k}" role="switch" aria-checked="${!!st[k]}"><span class="tog-l"><b>${l}</b>${h?`<small>${h}</small>`:''}</span><span class="tog-s" aria-hidden="true"></span></button>`;

      <section class="win">${winHead('Training')}
        <div class="field"><span>Difficulty</span><div class="seg">${Object.entries(DIFF).map(([k,d])=>`<button class="seg-b${st.diff===k?' on':''}" data-a="setDiff" data-x="${k}" aria-pressed="${st.diff===k}">${d.name}</button>`).join('')}</div><p class="hint">${DIFF[st.diff].desc} Changes apply to today's quest unless it is already cleared.</p></div>
        <div class="field"><span>Daily Quest goals</span><div class="chips">${DAILY.map(t=>`<button class="chip${st.tasks[t.id]?' on':''}" data-a="setTask" data-x="${t.id}" aria-pressed="${!!st.tasks[t.id]}">${t.name}</button>`).join('')}</div></div>

        <label class="field"><span>New day starts at</span><select id="set-reset" data-c="reset">${[0,1,2,3,4,5,6].map(h=>`<option value="${h}"${st.resetHour===h?' selected':''}>${h===0?'Midnight':h+':00 AM'}</option>`).join('')}</select></label>

        ${tog('lowImpact','Low-impact gates','No jumping. Kinder to knees and downstairs neighbors.')}

      </section>
      <section class="win">${winHead('App')}
        ${tog('sound','Sound effects')}${tog('haptics','Vibration','On phones that support it.')}
        ${tog('badge','App icon badge','Shows how many Daily Quest goals are left on the installed app icon. On iPhone, allow notifications when asked; Awaken only uses that for the badge.')}
        ${standalone?'':deferredInstall?'<button class="btn pri block" data-a="install" style="margin-top:8px">Install app</button>':`<p class="hint">${ios?'To install: tap the Share button in Safari, then <b>Add to Home Screen</b>.':'To install: open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.'}</p>`}
      </section>
      <section class="win">${winHead('Reminders')}

          <label class="field"><span>Remind me</span><select data-c="remindBefore">${[1,2,3,4,6,8].map(h=>`<option value="${h}"${Push.cfg.before===h?' selected':''}>${h} hour${h>1?'s':''} before the reset</option>`).join('')}</select></label>
          <div class="row2"><button class="btn" data-a="remindTest">Send a test</button><button class="btn" data-a="remindOff">Turn off</button></div>`
        :`<p class="hint" style="margin:0 0 12px">Get a notification a few hours before the reset when the Daily Quest isn't done yet.${!NATIVE&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone?' On iPhone, add Awaken to your Home Screen first, then turn this on from there.':''}</p>
          <button class="btn pri block" data-a="remindOn" ${pushSupported()?'':'disabled'}>Turn on reminders</button>
          ${pushSupported()?'':'<p class="hint">This browser can\'t show reminders.</p>'}`}
      </section>
      <section class="win">${winHead('Cloud Save')}
        ${Cloud.cfg?`<p class="hint" style="margin:0 0 12px">${Cloud.busy?'Syncing…':Cloud.err?'Offline. Your progress is saved on this device and syncs when you are back online.':Cloud.cfg.at?`Synced ${clockTime(Cloud.cfg.at)}.`:'Not synced yet.'} Use your code to link another device or restore on a new phone.</p>
          <div class="code-box"><code>${UI.showCode?esc(Cloud.cfg.code):'••••-••••-••••-••••-••••-••••'}</code><button class="btn sm" data-a="cloudShow">${UI.showCode?'Hide':'Show'}</button><button class="btn sm" data-a="cloudCopy">Copy</button></div>
          <p class="hint">Keep this code private and somewhere safe. Anyone with it can load your progress, and it can't be recovered if lost.</p>
          <div class="row2"><button class="btn" data-a="cloudSync" ${Cloud.busy?'disabled':''}>Sync now</button><button class="btn" data-a="cloudUnlink">Unlink device</button></div>
          ${UI.confirmCloudDel?'<div class="confirm" style="margin-top:12px"><p>Delete the cloud save for every device? Progress on this device stays.</p><div class="row2"><button class="btn" data-a="cloudDelNo">Keep it</button><button class="btn danger" data-a="cloudDelYes">Delete</button></div></div>':'<button class="btn ghost block" data-a="cloudDelAsk" style="margin-top:8px">Delete cloud save</button>'}`
        :`<p class="hint" style="margin:0 0 12px">Optional. Keeps your progress in sync across devices and safe if you lose your phone. No account: you get a private code instead. Your save is encrypted on this device with that code before it is uploaded, so the server can't read it.</p>
          <button class="btn pri block" data-a="cloudCreate">Create a cloud save</button>
          <label class="field" style="margin-top:14px"><span>Already have a code?</span><input id="cloud-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></label>
          <button class="btn block" data-a="cloudLink">Link this device</button>`}
      </section>
      <section class="win">${winHead('Save Data')}
        <p class="hint" style="margin:0 0 12px">Your progress lives on this device${Cloud.cfg?' and in your cloud save':''}. Export a backup now and then, and use it to move to a new phone.</p>
        <div class="row2"><button class="btn" data-a="exportDl">Download</button><button class="btn" data-a="exportCopy">Copy text</button></div>

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawPath(){
  const c=$('#run-map');if(!c) return;
  const x=c.getContext('2d'),W=c.width,H=c.height,pts=(S.run&&S.run.path)||[];
  x.clearRect(0,0,W,H);
  x.globalAlpha=.18;x.strokeStyle=cssVar('--line');x.lineWidth=1;
  for(let i=40;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let i=40;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
  x.globalAlpha=1;
  if(pts.length<2){x.fillStyle=cssVar('--dim');x.font='500 24px '+cssVar('--f-body');x.textAlign='center';x.fillText(pts.length?'Keep moving to draw your route':'Your route will appear here',W/2,H/2+8);return}
  const k=Math.cos(pts[0][0]*Math.PI/180),xs=pts.map(p=>p[1]*k),ys=pts.map(p=>-p[0]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-60)/(x1-x0||1e-9),(H-60)/(y1-y0||1e-9)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const P=i=>[ox+(xs[i]-x0)*sc,oy+(ys[i]-y0)*sc];
  x.strokeStyle=cssVar('--glow');x.lineWidth=5;x.lineJoin='round';x.lineCap='round';x.shadowColor=cssVar('--line');x.shadowBlur=14;
  x.beginPath();pts.forEach((_,i)=>{const[a,b]=P(i);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
  x.shadowBlur=0;const[ea,eb]=P(pts.length-1);x.fillStyle=cssVar('--ink');x.beginPath();x.arc(ea,eb,8,0,7);x.fill();
}

/* ---------- background mana field ---------- */
const FX=(()=>{
  const c=$('#fx'),x=c.getContext('2d');let w=0,h=0,dpr=1,col='#9be3ff',last=0;
  const parts=Array.from({length:44},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,s:Math.random()*.00003+.00001,a:Math.random()*.5+.2,ph:Math.random()*6.28}));
  function size(){dpr=Math.min(2,devicePixelRatio||1);w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr}
  function draw(t){
    x.clearRect(0,0,w,h);x.fillStyle=col;
    for(const p of parts){
      x.globalAlpha=p.a*(.55+.45*Math.sin(t/1100+p.ph));
      x.beginPath();x.arc(p.x*w,p.y*h,p.r*dpr,0,7);x.fill();
      x.globalAlpha*=.15;x.beginPath();x.arc(p.x*w,p.y*h,p.r*dpr*5,0,7);x.fill();
    }
    x.globalAlpha=1;
  }
  function frame(t){
    if(!document.hidden&&t-last>40){const dt=Math.min(100,t-last);last=t;for(const p of parts){p.y-=p.s*dt;if(p.y<-.02){p.y=1.02;p.x=Math.random()}}draw(t)}
    requestAnimationFrame(frame);
  }
  return {start(){size();addEventListener('resize',()=>{size();draw(performance.now())});if(reduceMotion) draw(0); else requestAnimationFrame(frame)},color(){col=cssVar('--glow')||col;if(reduceMotion&&w) draw(0)}};
})();

// strokes are kept in UI.aw so a re-render redraws them; the stored signature is a small PNG
function initSig(){
  const c=$('#sig');if(!c) return;
  const a=UI.aw,x=c.getContext('2d');
  const draw=()=>{x.clearRect(0,0,c.width,c.height);x.lineCap=x.lineJoin='round';x.lineWidth=5;x.strokeStyle=cssVar('--glow');x.shadowColor=cssVar('--line');x.shadowBlur=10;

  draw();
  if(a.sealed) return;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  // one finger at a time: extra touches are ignored so they can't join strokes or inflate the length
  let cur=null,pid=null;
  c.addEventListener('pointerdown',e=>{e.preventDefault();if(cur) return;pid=e.pointerId;c.setPointerCapture(pid);cur=[pos(e)];a.strokes.push(cur);draw()});
  c.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==pid) return;const p=pos(e),l=cur[cur.length-1];a.sigLen+=Math.hypot(p[0]-l[0],p[1]-l[1]);cur.push(p);draw();
    const b=$('#sig-seal');if(b) b.disabled=a.sigLen<=120});
  const end=e=>{if(e.pointerId===pid){cur=null;pid=null}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

/* ---------- clock ---------- */
function sessTick(){
  const s=S.session;if(!s) return;
  const now=Date.now(),view=UI.screen&&UI.screen.kind==='gate',set=t=>{if(!view) return;const e=$('#sess-t');if(e) e.textContent=t};
  const beep3=left=>{const c=Math.ceil(left);if(c<=3&&c>0&&c!==s.beep){s.beep=c;Sfx.beep();buzz(20)}};
  if(s.phase==='rest'){const left=(s.end-now)/1000;if(left<=0){nextSet();return}beep3(left);set(mmss(left))}
  else if(s.prep){const left=(s.prep-now)/1000;if(left<=0){s.prep=0;s.run=true;s.end=now+s.left*1000;s.beep=0;Sfx.go();buzz(60);save();refresh();return}beep3(left);set(String(Math.ceil(left)))}
  else if(s.run){const left=(s.end-now)/1000;if(left<=0){s.run=false;completeSet(sessSet().target);return}beep3(left);set(mmss(left))}
  if(view){const e=$('#sess-el');if(e) e.textContent=mmss((now-s.t0)/1000)}
}
function tick(){
  if(!S.awakened) return;
  if(rollover()){announce();save();refresh()}
  const t=hms(nextReset()-Date.now());
  $$('[data-live=reset]').forEach(e=>{if(e.textContent!==t) e.textContent=t});
  if(S.session) sessTick();
  if(S.run) runLive();
  if(UI.sheet&&UI.sheet.kind==='hold'){
    const secs=Math.floor(holdSecs()),e=$('#hold-t'),b=$('#hold-log');
    if(e) e.textContent=mmss(secs);
    if(b){b.textContent=`Log ${secs} s`;b.disabled=secs<1}
  }
}
